# billet's host lock directory, created at boot by systemd-tmpfiles and by the
# package's postinstall (the Ansible host role renders the same bytes to
# /etc/tmpfiles.d/billet.conf and creates it before any unit starts).
#
# NOT A RuntimeDirectory, deliberately. systemd removes a unit's runtime
# directories when that unit stops, and every lock in here is held by a process
# that outlives a node restart: `billet images verify` holds its probe lock for
# the minutes a boot verification takes. Removing the directory unlinks the
# lock's name under its holder, and the next verifier locks a fresh file at the
# same path and destroys the first one's live probe (#175, measured on systemd
# 255.4, 2026-10-16). Nothing removes a directory created here before a reboot.
#
# NO AGE, so systemd-tmpfiles --clean never ages a lock file away.
d /run/billet 0755 root root -
d /run/billet/locks 0750 root root -
