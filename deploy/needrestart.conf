# Installed by billet. needrestart must never restart billet's services: stopping
# billet-node is a drain with no time limit, which takes the node out of service
# until it ends, and billet schedules its own restarts (a rollout, a converge,
# `billet local down`). A library upgraded under a billet service is picked up at
# billet's next planned restart instead.
$nrconf{override_rc}{qr(^billet-)} = 0;
