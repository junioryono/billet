# sqlc — billet's control-plane query generator.
#
# WHAT IT OWNS IS EXACTLY ONE THING: turning a named SQL statement into a typed
# Go call. Transaction boundaries, contention policy, the durability pragmas, the
# process lock, integrity checks and migrations all stay hand-written in
# internal/state, and the generated queries are bound by internal/state's own
# adapters rather than handed to any caller — a depguard rule keeps the generated
# package importable from internal/state, internal/alloc and internal/rollout and
# nowhere else.
#
# ONE QUERY SET SERVES BOTH ENGINES, AND THAT WAS MEASURED RATHER THAN HOPED FOR.
# billet's ledger runs on SQLite or PostgreSQL, and the obvious shape — a query
# set per dialect — would duplicate 167 of the most invariant-dense statements in
# the repository and need every guard in queries/README.md written twice. It is
# not necessary. With integer casts spelled BIGINT, sqlc's SQLite and PostgreSQL
# engines emit BYTE-IDENTICAL Go from the same query file: the same structs, the
# same field names, the same field types, the same method signatures. The only
# difference anywhere in the output is the placeholder, ?N against $N — and
# modernc.org/sqlite executes $N correctly, binding positionally, honouring a
# repeated $1 the way PostgreSQL does, and resolving $2 that appears textually
# before $1. Both halves are measured in docs/adr-008-state-backends.md.
#
# SO GENERATION RUNS ONCE, WITH THE POSTGRESQL ENGINE. Not because PostgreSQL is
# privileged, but because a $N constant runs on both and a ?N constant does not.
#
# THE SCHEMA IS THE POSTGRESQL MIGRATION HISTORY, NOT A FLATTENED DUMP. sqlc
# reads internal/state/pgmigrations directly, which is the twin of
# internal/state/migrations under three declared substitutions — proved statement
# by statement by TestEveryPostgresMigrationIsItsSQLiteTwinTranslated, so a
# catalogue derived from either types the same Go. A flattened schema.sql would
# have been a second source of truth to regenerate on every migration, and the
# failure mode of forgetting is a catalogue that silently disagrees with the
# database.
#
# WHAT THAT COSTS, AND WHERE IT IS PAID BACK: `sqlc diff` now checks the query
# set against ONE catalogue rather than both. The SQLite side is covered by
# TestEveryGeneratedQueryPreparesAgainstTheMigratedSchema, which prepares every
# generated statement against a real migrated SQLite ledger — a stronger question
# than the catalogue answers, because SQLite's prepare also resolves an
# ON CONFLICT arbiter and sqlc models no indexes at all.
#
# THE CONSEQUENCE IS THAT A MIGRATION IS AN INPUT TO CODE GENERATION. Adding one
# can change generated code, and `sqlc diff` in CI is what says so. Explicit
# column lists are what keep an ordinary ALTER TABLE ADD COLUMN from changing a
# single generated byte — see internal/state/queries/README.md, where that rule
# is enforced rather than merely stated.
#
# schema_migrations_postgres.sql is listed separately because it is deliberately
# NOT a migration: it is the table every migration is recorded in, bootstrapped
# idempotently by the backend from those same bytes.
#
# PINNED at v1.31.1 (Makefile SQLC_VERSION). Generated code is committed, so an
# ordinary build never downloads sqlc; CI installs the pin and runs `sqlc diff`.
version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "internal/state/pgmigrations"
      - "internal/state/schema_migrations_postgres.sql"
    queries: "internal/state/queries"
    gen:
      go:
        package: "ledgerdb"
        out: "internal/state/ledgerdb"

        # No prepared-statement cache: the writer is a single connection and the
        # reader pool is four, so there is nothing here for one to amortise. Note
        # that this does NOT remove PrepareContext from the generated DBTX
        # interface — measured — which is why state.Querier is adapted to DBTX
        # rather than widened to satisfy it. See internal/state/queryset.go.
        emit_prepared_queries: false

        # billet's read/write split is expressed by hand in queryset.go, as two
        # interfaces over the generated method set. A generated Querier carrying
        # every method would be the opposite of that.
        emit_interface: false

        # nil on empty, which is what every one of these adapters returns today.
        emit_empty_slices: false

        # Table structs nothing selects wholesale are noise; every query here
        # names its columns explicitly and gets a Row type.
        omit_unused_structs: true
