name: matrix-cold
# billet's acceptance matrix (#554), the cold case: the first job of each cache on a
# deployment that has never served one. Each job asserts what it can see for itself, and
# `billet acceptance matrix judge` reads what the node observed. The job names are the
# matrix's cache names; cmd/billet/acceptancematrix.go judges them by name.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-cold ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
jobs:
  docker-images:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: The image store holds nothing yet
        run: |
          set -eu
          img=public.ecr.aws/docker/library/busybox:1.36
          if docker image inspect "$img" >/dev/null 2>&1; then
            echo "MATRIX a cold image store already held $img" >&2
            exit 1
          fi
          docker pull "$img"
  sticky-disks:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-sticky-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
      - name: The disk is new, and a marker is written to it
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test "$HIT" != true
          echo "cold-$TAG" | sudo tee /mnt/matrix/marker
  docker-builder:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - id: builder
        uses: junioryono/billet/actions/setup-docker-builder@main
        with:
          cache-key: matrix-${{ inputs.tag }}
          cache-size-gb: "10"
      - name: Build a layer the warm job must find cached
        env:
          TAG: ${{ inputs.tag }}
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -eu
          mkdir -p ctx
          printf 'FROM public.ecr.aws/docker/library/busybox:1.36\nRUN echo %s > /tag && sleep 5\n' "$TAG" > ctx/Dockerfile
          docker buildx build --builder "$BUILDER" --progress=plain ctx 2>&1 | tee build.log
          if grep -q 'CACHED' build.log; then
            echo "MATRIX a cold builder answered from its cache" >&2
            exit 1
          fi
  actions:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - id: restore
        uses: actions/cache/restore@v5
        with:
          path: matrix-payload
          key: matrix-actions-${{ inputs.tag }}
      - name: The key is not there yet
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test "$HIT" != true
          mkdir -p matrix-payload
          echo "cold-$TAG" > matrix-payload/marker
          head -c 8388608 /dev/urandom > matrix-payload/blob
      - uses: actions/cache/save@v5
        with:
          path: matrix-payload
          key: matrix-actions-${{ inputs.tag }}
  git:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Fetch through the node's mirror
        run: git fetch --depth=50 origin
  go:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: Build through GOCACHEPROG
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test -n "${GOCACHEPROG:-}"
          mkdir -p mod && cd mod
          go mod init matrix.example/m
          printf 'package main\n\nconst tag = "%s"\n\nfunc main() { println(tag) }\n' "$TAG" > main.go
          go build -o /dev/null .
  bazel:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: Build one target through the node's remote cache
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test -s /etc/bazel.bazelrc
          mkdir -p ws && cd ws
          echo '7.4.1' > .bazelversion
          : > MODULE.bazel
          printf 'genrule(\n    name = "tag",\n    outs = ["tag.txt"],\n    cmd = "echo %s > $@",\n)\n' "$TAG" > BUILD
          bazel build //:tag
          bazel shutdown
  npm:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Install a package through the node's registry cache
        run: |
          set -eu
          dir=$(mktemp -d)
          cd "$dir"
          npm init -y >/dev/null
          npm install --no-audit --no-fund --cache "$(mktemp -d)" left-pad@1.3.0
