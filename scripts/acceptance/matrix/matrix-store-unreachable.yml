name: matrix-store-unreachable
# billet's acceptance matrix (#554), the site store out of reach: dispatched last, while
# the acceptance host drops every packet to its region's S3 (`matrix-host.sh block-s3`),
# so the node's store hangs rather than refuses, as #531's did. Every key here is one the
# cold and warm runs filled, so a job that finds it warm used a store it cannot reach.
# Each job must SUCCEED and start cold, and the node must say why: `unavailable` for a
# call that waited out the store's deadline, `bypassed` once its breaker stopped asking.
# The job names are the matrix's cache names; cmd/billet/acceptancematrix.go judges them
# by name.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-store-unreachable ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone, under which a failed build piped through tee passes.
defaults:
  run:
    shell: bash
jobs:
  docker-images:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: The image the warm store holds is not here, and is pulled
        run: |
          set -eu
          img=public.ecr.aws/docker/library/busybox:1.36
          if docker image inspect "$img" >/dev/null 2>&1; then
            echo "MATRIX the image store was attached from a store out of reach" >&2
            exit 1
          fi
          docker pull "$img"
  sticky-disks:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-sticky-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
      - name: The cold job's disk is not here, and the job goes on
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" != true
          test ! -e /mnt/matrix/marker
  docker-builder:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - id: builder
        uses: junioryono/billet/actions/setup-docker-builder@main
        with:
          cache-key: matrix-${{ inputs.runs_on }}-${{ inputs.tag }}
          cache-size-gb: "10"
      - name: The cold job's layer is not cached, and the build goes on
        env:
          TAG: ${{ inputs.tag }}
          BUILDER: ${{ steps.builder.outputs.name }}
        run: |
          set -eu
          mkdir -p ctx
          printf 'FROM public.ecr.aws/docker/library/busybox:1.36\nRUN echo %s > /tag && sleep 5\n' "$TAG" > ctx/Dockerfile
          docker buildx build --builder "$BUILDER" --progress=plain ctx 2>&1 | tee build.log
          vertex=$(sed -n 's/^\(#[0-9]*\) \[[0-9]*\/[0-9]*\] RUN .*/\1/p' build.log | head -n 1)
          test -n "$vertex"
          cached=$(grep -cx "$vertex CACHED" build.log || true)
          echo "MATRIX the RUN step is vertex $vertex, cached $cached time(s)"
          test "$cached" = 0
  actions:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - id: restore
        uses: actions/cache/restore@v5
        with:
          path: matrix-payload
          key: matrix-actions-${{ inputs.runs_on }}-${{ inputs.tag }}
      - name: The cold job's archive is not restored, and a save goes on without the store
        env:
          HIT: ${{ steps.restore.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" != true
          test ! -e matrix-payload/marker
          mkdir -p matrix-payload
          echo unreachable > matrix-payload/marker
      - uses: actions/cache/save@v5
        with:
          path: matrix-payload
          key: matrix-actions-unreachable-${{ inputs.runs_on }}-${{ inputs.tag }}
  go:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: Build the cold job's module through GOCACHEPROG
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test -n "${GOCACHEPROG:-}"
          mkdir -p mod && cd mod
          go mod init matrix.example/m
          printf 'package main\n\nconst tag = "%s"\n\nfunc main() { println(tag) }\n' "$TAG" > main.go
          go build -o /dev/null .
  bazel:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 30
    steps:
      - name: Build the cold job's target with no remote cache hit
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test -s /etc/bazel.bazelrc
          mkdir -p ws && cd ws
          echo '7.4.1' > .bazelversion
          : > MODULE.bazel
          printf 'genrule(\n    name = "tag",\n    outs = ["tag.txt"],\n    cmd = "echo %s > $@",\n)\n' "$TAG" > BUILD
          bazel build //:tag 2>&1 | tee build.log
          if grep -Eq '[1-9][0-9]* remote cache hit' build.log; then
            echo "MATRIX bazel hit a remote cache whose store is out of reach" >&2
            exit 1
          fi
          bazel shutdown
