name: matrix-writer-fails
# billet's acceptance matrix (#554), a sticky-disk writer that fails after writing. A
# seed publishes a generation; a writer clones it, writes, and fails; a reader then finds
# the seed's generation and nothing the failed writer wrote. The reader is the matrix's
# cell; cmd/billet/acceptancematrix.go judges it by name. It runs only after the writer
# has proved it cloned the seed and wrote, so a writer that failed earlier (a disk that
# never attached) is no failed writer, and its reader never runs: the cell is not run,
# which a run covering its architecture fails on. A trusted tier's sticky disk is
# published inside the job that wrote it, so each job's completion is its publication's.
#
# The matrix runs on a trusted tier, which the judge checks.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-writer-fails ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone, under which a failed build piped through tee passes.
defaults:
  run:
    shell: bash
jobs:
  seed:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-fails-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
      - env:
          TAG: ${{ inputs.tag }}
        run: echo "seed-$TAG" | sudo tee /mnt/matrix/marker
  failer:
    needs: seed
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    outputs:
      wrote: ${{ steps.write.outputs.wrote }}
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-fails-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
      - id: write
        name: Clone the seed, and write
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = "seed-$TAG"
          echo failed | sudo tee /mnt/matrix/failed-writer
          sync
          echo wrote=true >>"$GITHUB_OUTPUT"
      - name: Fail, having written
        run: exit 1
  reader:
    needs: failer
    if: ${{ always() && needs.failer.result == 'failure' && needs.failer.outputs.wrote == 'true' }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-fails-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
      - name: The seed's generation, and nothing of the failed writer's
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = "seed-$TAG"
          if [ -e /mnt/matrix/failed-writer ]; then
            echo "MATRIX a failed writer's file reached the generation" >&2
            exit 1
          fi
