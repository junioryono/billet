name: matrix-images-cold
# billet's acceptance matrix (#554), the Docker image store cold: the first job on a
# deployment that has never served one pulls an image the warm job must find. It runs
# ALONE ON THE TIER, dispatched before every other matrix workflow and awaited, because
# every EC2 guest attaches the image store at boot and every job publishes a generation
# of it: a job beside this one, having cloned the empty store, could publish after it
# and leave no image for the warm job. The job's name is the matrix's cache name.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-images-cold ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run its own
        required: true
permissions:
  contents: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone.
defaults:
  run:
    shell: bash
jobs:
  docker-images:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: The image store holds nothing yet, and an image is pulled into it
        run: |
          set -eu
          img=public.ecr.aws/docker/library/busybox:1.36
          if docker image inspect "$img" >/dev/null 2>&1; then
            echo "MATRIX a cold image store already held $img" >&2
            exit 1
          fi
          docker pull "$img"
