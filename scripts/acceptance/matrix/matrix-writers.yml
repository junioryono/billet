name: matrix-writers
# billet's acceptance matrix (#554), two writers of one sticky disk at once, under each
# publication policy. A seed publishes a generation; two writers clone it together and
# each write a marker and a payload whose digest the marker names; a reader then finds
# exactly one writer's generation, whole. Under cas the loser's publication is refused
# and under last-write-wins the later one replaces the earlier, but in neither may the
# reader see one writer's marker over the other's payload. The readers are the matrix's
# cells (reader-cas, reader-lww); cmd/billet/acceptancematrix.go judges them by name.
#
# The jobs are written out rather than generated by a strategy, so each job's id is the
# name GitHub reports and the matrix's test reads it here.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-writers ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
jobs:
  seed-cas:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-cas-a:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
  writer-cas-b:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
  reader-cas:
    needs: [writer-cas-a, writer-cas-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the writers' publications land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Exactly one writer's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          case "$who" in a|b) ;; *) echo "MATRIX no writer's generation was published" >&2; exit 1 ;; esac
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
  seed-lww:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-lww-a:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
  writer-lww-b:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
  reader-lww:
    needs: [writer-lww-a, writer-lww-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Let the writers' publications land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Exactly one writer's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          case "$who" in a|b) ;; *) echo "MATRIX no writer's generation was published" >&2; exit 1 ;; esac
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
