name: matrix-writers
# billet's acceptance matrix (#554), two writers of one sticky disk at once, under each
# publication policy. A seed publishes a generation; writers a and b each clone it, which
# each proves by finding the seed's marker, and each write a marker and a payload whose
# digest the marker names. Writer b then waits, through the run's own jobs API, until
# writer a's job has completed: on a trusted tier a sticky disk is published inside the
# job that wrote it (its post step's commit), so a's completion is a's publication, and
# b's commit comes after it. Under cas, b's commit has a stale parent and is refused, so
# the reader finds a's generation; under last-write-wins b's replaces it, so the reader
# finds b's. WRITER A WAITS FOR B TO HAVE CLONED before its own job ends, so a's
# publication always comes after both writers took the seed: a b that only reached a
# runner once a had published would clone a's generation, not the seed, and under cas its
# commit would then not be stale (run 42358345989, 2026-11-07, where it found a's marker).
# AND THE TWO PAIRS RUN ONE AFTER THE OTHER (seed-lww needs reader-cas), so at most two
# writers hold runners at once: with both pairs at once, the two a writers could take
# the only two slots and wait for b writers that never get one. The tier must give two
# jobs at once. Each writer's 35 minutes holds its 15-minute wait and its publication,
# which the sticky disk's commit bounds at 13. The reader needs both jobs, so both commits have settled when it clones, and
# it finds one writer's generation whole, never one writer's marker over the other's
# payload. AND IT READS EACH WRITER'S OWN LOG, where the sticky disk's post step says what
# became of its write: writer a must have published, and writer b must have been
# superseded under cas and have published under last-write-wins, so a reader that finds
# the expected writer for any other reason (a's publication failed, b never reached its
# commit) fails. The keys carry the tier label, so two architectures' writers never
# share one. The readers are the matrix's cells (reader-cas, reader-lww). The matrix runs
# on a trusted tier, which the judge checks.
#
# The jobs are written out rather than generated by a strategy, so each job's id is the
# name GitHub reports and the matrix's test reads it here.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-writers ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
  # Writer b reads its own run's jobs, to wait for writer a's, and the reader reads the
  # writers' logs.
  actions: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone, under which a failed build piped through tee passes.
defaults:
  run:
    shell: bash
jobs:
  seed-cas:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-cas-a:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 35
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Wait until writer b has cloned the seed, so this writer publishes after it
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER: writer-cas-b
          STEP: Clone the seed, and write this writer's generation
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          for _ in $(seq 90); do
            state=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | (.steps // [])[] | select(.name == \"$STEP\") | .status")
            case "$state" in
            in_progress | completed) echo "MATRIX $WRITER has cloned"; exit 0 ;;
            esac
            job=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | .status")
            if [ "$job" = completed ]; then
              echo "MATRIX $WRITER ended before it cloned, so nothing orders this writer after it" >&2
              exit 1
            fi
            sleep 10
          done
          echo "MATRIX $WRITER did not clone in 15 minutes" >&2
          exit 1
  writer-cas-b:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 35
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Wait until writer a's job, and with it its publication, has completed
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER: writer-cas-a
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          for _ in $(seq 90); do
            state=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | \"\(.status) \(.conclusion)\"")
            case "$state" in
            "completed success") echo "MATRIX $WRITER has completed"; exit 0 ;;
            completed*) echo "MATRIX $WRITER ended $state, so nothing orders this writer after it" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "MATRIX $WRITER did not complete in 15 minutes" >&2
          exit 1
  reader-cas:
    needs: [writer-cas-a, writer-cas-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Each writer's own log says what became of its write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          # A COMPLETED JOB'S LOG CAN TAKE A MOMENT TO BE SERVED; one never served fails.
          # CURL, NOT gh api: a job's log is full of terminal escape sequences, which the
          # runner image's gh refuses to write anywhere (run 42358345989, 2026-11-07).
          writer_log() {
            local id
            id=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$1\") | .id")
            test -n "$id"
            for _ in $(seq 12); do
              if curl -fsSL --connect-timeout 10 --max-time 120 \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o "$1.log"; then return 0; fi
              sleep 10
            done
            echo "MATRIX GitHub served no log for $1" >&2
            return 1
          }
          writer_log writer-cas-a
          writer_log writer-cas-b
          grep -q 'billet published this sticky-disk update as generation' writer-cas-a.log
          grep -qF 'billet discarded this sticky-disk update (superseded:' writer-cas-b.log
          echo "MATRIX writer a published; writer b: billet discarded this sticky-disk update (superseded:"
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Writer a's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          test "$who" = a
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
  seed-lww:
    needs: reader-cas
    if: ${{ !cancelled() }}
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-lww-a:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 35
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Wait until writer b has cloned the seed, so this writer publishes after it
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER: writer-lww-b
          STEP: Clone the seed, and write this writer's generation
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          for _ in $(seq 90); do
            state=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | (.steps // [])[] | select(.name == \"$STEP\") | .status")
            case "$state" in
            in_progress | completed) echo "MATRIX $WRITER has cloned"; exit 0 ;;
            esac
            job=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | .status")
            if [ "$job" = completed ]; then
              echo "MATRIX $WRITER ended before it cloned, so nothing orders this writer after it" >&2
              exit 1
            fi
            sleep 10
          done
          echo "MATRIX $WRITER did not clone in 15 minutes" >&2
          exit 1
  writer-lww-b:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 35
    steps:
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Wait until writer a's job, and with it its publication, has completed
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER: writer-lww-a
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          for _ in $(seq 90); do
            state=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$WRITER\") | \"\(.status) \(.conclusion)\"")
            case "$state" in
            "completed success") echo "MATRIX $WRITER has completed"; exit 0 ;;
            completed*) echo "MATRIX $WRITER ended $state, so nothing orders this writer after it" >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "MATRIX $WRITER did not complete in 15 minutes" >&2
          exit 1
  reader-lww:
    needs: [writer-lww-a, writer-lww-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Each writer's own log says what became of its write
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          # A COMPLETED JOB'S LOG CAN TAKE A MOMENT TO BE SERVED; one never served fails.
          # CURL, NOT gh api: a job's log is full of terminal escape sequences, which the
          # runner image's gh refuses to write anywhere (run 42358345989, 2026-11-07).
          writer_log() {
            local id
            id=$(gh api "$jobs" --jq ".jobs[] | select(.name == \"$1\") | .id")
            test -n "$id"
            for _ in $(seq 12); do
              if curl -fsSL --connect-timeout 10 --max-time 120 \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" -o "$1.log"; then return 0; fi
              sleep 10
            done
            echo "MATRIX GitHub served no log for $1" >&2
            return 1
          }
          writer_log writer-lww-a
          writer_log writer-lww-b
          grep -q 'billet published this sticky-disk update as generation' writer-lww-a.log
          grep -qF 'billet published this sticky-disk update as generation' writer-lww-b.log
          echo "MATRIX writer a published; writer b: billet published this sticky-disk update as generation"
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.runs_on }}-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Writer b's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          test "$who" = b
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
