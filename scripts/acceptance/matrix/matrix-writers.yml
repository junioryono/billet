name: matrix-writers
# billet's acceptance matrix (#554), two writers of one sticky disk at once, under each
# publication policy. A seed publishes a generation; writers a and b each clone it, which
# each proves by finding the seed's marker, and each writes a marker and a payload whose
# digest the marker names. Writer a then ends and b holds on, so a publishes first: the
# reader proves that order from the two writers' end times, at least 150 s apart against
# a publication measured landing about 55 s after its job ends (2026-09-03). Under cas,
# b's publication has a stale parent and is refused, so the reader finds a's generation;
# under last-write-wins b's replaces it, so the reader finds b's. Either way the reader
# finds one writer's generation whole, never one writer's marker over the other's payload.
# The readers are the matrix's cells (reader-cas, reader-lww).
#
# The jobs are written out rather than generated by a strategy, so each job's id is the
# name GitHub reports and the matrix's test reads it here.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-writers ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: what makes this run's keys its own
        required: true
permissions:
  contents: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone, under which a failed build piped through tee passes.
defaults:
  run:
    shell: bash
jobs:
  seed-cas:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-cas-a:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    outputs:
      ended: ${{ steps.end.outputs.at }}
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
      - id: end
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"
  writer-cas-b:
    needs: seed-cas
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    outputs:
      ended: ${{ steps.end.outputs.at }}
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Hold on, so writer a publishes first
        run: sleep 240
      - id: end
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"
  reader-cas:
    needs: [writer-cas-a, writer-cas-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Writer a ended long enough before b for its publication to land first
        env:
          A_END: ${{ needs.writer-cas-a.outputs.ended }}
          B_END: ${{ needs.writer-cas-b.outputs.ended }}
        run: |
          set -eu
          echo "MATRIX writer a ended at $A_END, writer b at $B_END"
          test "$((B_END - A_END))" -ge 150
      - name: Let the writers' publications land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-cas-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: cas
      - name: Writer a's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          test "$who" = a
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
  seed-lww:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - run: echo seed | sudo tee /mnt/matrix/marker
  writer-lww-a:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    outputs:
      ended: ${{ steps.end.outputs.at }}
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "a $sum" | sudo tee /mnt/matrix/marker
          sync
      - id: end
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"
  writer-lww-b:
    needs: seed-lww
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    outputs:
      ended: ${{ steps.end.outputs.at }}
    steps:
      - name: Let the seed's publication land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Clone the seed, and write this writer's generation
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          test "$(cat /mnt/matrix/marker)" = seed
          sudo dd if=/dev/urandom of=/mnt/matrix/payload bs=1M count=64 status=none
          sum=$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)
          echo "b $sum" | sudo tee /mnt/matrix/marker
          sync
      - name: Hold on, so writer a publishes first
        run: sleep 240
      - id: end
        run: echo "at=$(date +%s)" >>"$GITHUB_OUTPUT"
  reader-lww:
    needs: [writer-lww-a, writer-lww-b]
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: Writer a ended long enough before b for its publication to land first
        env:
          A_END: ${{ needs.writer-lww-a.outputs.ended }}
          B_END: ${{ needs.writer-lww-b.outputs.ended }}
        run: |
          set -eu
          echo "MATRIX writer a ended at $A_END, writer b at $B_END"
          test "$((B_END - A_END))" -ge 150
      - name: Let the writers' publications land
        run: sleep 120
      - id: disk
        uses: junioryono/billet/actions/stickydisk@main
        with:
          key: ${{ github.repository }}-matrix-writers-last-write-wins-${{ inputs.tag }}
          path: /mnt/matrix
          size-gb: "5"
          publication: last-write-wins
      - name: Writer b's generation, whole
        env:
          HIT: ${{ steps.disk.outputs.cache-hit }}
        run: |
          set -eu
          test "$HIT" = true
          read -r who sum < /mnt/matrix/marker
          echo "MATRIX the generation is writer $who's"
          test "$who" = b
          test "$(sudo sha256sum /mnt/matrix/payload | cut -d' ' -f1)" = "$sum"
