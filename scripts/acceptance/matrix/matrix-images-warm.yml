name: matrix-images-warm
# billet's acceptance matrix (#554), the Docker image store warm: dispatched alone on the
# tier once the cold job has finished and its publication has had time to land, and
# before any other matrix workflow, it must find the image the cold job pulled. The
# job's name is the matrix's cache name.
#
# This file is copied from billet's scripts/acceptance/matrix into the repository the
# acceptance App serves, and the run refuses a copy that differs.
run-name: matrix-images-warm ${{ inputs.runs_on }} ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runs_on:
        description: the acceptance tier's label
        required: true
      tag:
        description: the cold run's tag
        required: true
permissions:
  contents: read
# bash, so every step runs under -eo pipefail: GitHub's default shell on Linux is bash -e
# alone.
defaults:
  run:
    shell: bash
jobs:
  docker-images:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 20
    steps:
      - name: The image store already holds the cold job's image
        run: |
          set -eu
          docker image inspect public.ecr.aws/docker/library/busybox:1.36 >/dev/null
