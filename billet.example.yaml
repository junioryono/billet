# billet configuration — copy to billet.yaml and edit.
#
# THIS FILE DOES NOT RUN AS SHIPPED. It describes the intended deployment, which
# is Firecracker, and the Firecracker provider is not built — `billet node`
# refuses it. Two edits HERE make it start today, and both are needed —
# the README's quickstart lists what else the file needs (the github: block, a
# writable server.state_dir) and the Docker daemon it assumes:
#
#   1. `provider: firecracker` -> `provider: docker`, in the node section and in
#      every tier.
#   2. `image:` -> a Docker image that contains the GitHub runner, for example
#      `ghcr.io/actions/actions-runner:latest`. The image name is passed
#      straight to `docker run`, so `ubuntu-2404-x64` below is a golden-image
#      name for Firecracker and is not pullable.
#
# The first edit alone gets you a config that validates and a server that
# starts, and every job then fails to launch — which is why the second is here.
#
# The Docker provider reads vcpu, memory and shm; it ignores disk and
# warm_pool, and the whole `firecracker:` block is unused. Docker shares the
# host kernel and is for trials rather than for untrusted code.
#
# This example is the single-machine deployment, which is TWO PROCESSES reading
# this one file:
#
#   billet server --config ./billet.yaml     # the control plane
#   billet node   --config ./billet.yaml     # the compute host
#
# They talk over the loopback address below. Nothing is exposed to the network
# and no certificates are involved — a control plane listening only on loopback
# serves plain HTTP, because there is nothing between two processes on one box to
# authenticate. (Setting node.tls against a loopback server is refused for that
# reason.) Add machines by running `billet node` on each with its own copy of
# this file, its server_addr pointing at this one, and a bundle from
# `billet ca issue` — at which point the server has to listen on an address those
# machines can reach, and the wire becomes mTLS.

server:
  # Nodes dial the server; the server never dials out except to GitHub. On a
  # single box this stays on loopback, so billet exposes nothing to the network.
  #
  # ANY OTHER ADDRESS REQUIRES CLIENT CERTIFICATES, and billet mints them itself
  # — there is no CA to run. The wire identifies a node by the name in its
  # certificate, so without one the only identity available is the name a caller
  # types into the URL, which anything on the network can type. Run
  # `billet ca issue <node>` here and copy the bundle to that host.
  listen: 127.0.0.1:7717

  # The names and addresses nodes will DIAL this control plane by. They become
  # the subject names of the certificate it serves.
  #
  # Needed only when `listen` is a wildcard like 0.0.0.0:7717, which says which
  # interfaces to accept on and says nothing about what a node types. A concrete
  # listen address supplies itself.
  #
  # node_tls_hosts:
  #   - billet.example
  #   - 10.0.0.4

  # MUST be local storage. SQLite's WAL is not safe on NFS, and this directory
  # holds the capacity ledger.
  state_dir: /var/lib/billet/server

  # How long a stopping billet waits for the jobs it is ALREADY running before it
  # destroys them. This is what makes `systemctl restart` free rather than a way
  # to fail somebody's CI.
  #
  # Defaults to 6h, which is how long GitHub lets a job run by default — not how
  # long a shutdown ought to take. Raise it if your jobs run longer, as
  # self-hosted runners often are: a drain shorter than your longest job kills
  # exactly the work it exists to protect. Overrunning it is safe — billet stops
  # waiting and destroys what is left, which is what it did before there was a
  # drain at all.
  #
  # A service manager's stop timeout must exceed this PLUS the teardown, or its
  # own expiry arrives first as a SIGKILL, which skips the teardown and strands
  # the containers. The shipped units size TimeoutStopSec from this.
  #
  # drain_timeout: 6h

  # Hard ceiling on what the allocator will hand out across every tier combined.
  # Capacity is escrowed before each scale-set listener advertises to GitHub, so
  # this is what stops concurrent tiers from collectively overcommitting the box.
  #
  # Sizing: leave headroom for the host. On a 64-core/128-thread, 512 GB machine,
  # 120 vCPU and 480GiB reserves 8 threads and 32 GB for the OS, ZFS ARC, and
  # billet itself. Note that 128 SMT threads are not 128 core-equivalents —
  # measure real per-job-class throughput before raising this.
  # See docs/reference-hardware.md for how tier shapes map onto a real topology.
  max_vcpu: 120
  max_memory: 480GiB

  # WHICH MACHINE A JOB GOES TO, once more than one could take it. Only
  # meaningful with a fleet; a single-host deployment can ignore it.
  #
  #   pack   (default) fill a machine before starting on the next
  #   spread             keep machines as even as possible
  #
  # PACK BECAUSE FRAGMENTS CANNOT HOLD A BIG JOB. Spreading leaves every host
  # partly used, and six 4 vCPU jobs spread across two 16 vCPU machines leave
  # four free on each — so an 8 vCPU job fits nowhere while eight vCPU sit idle
  # in the fleet. A job that cannot be placed is worse than a job that shares a
  # disk.
  #
  # The usual reason to spread is contention, and it is weaker here than it
  # looks: billet escrows vCPU and memory and the provider enforces both per
  # container, so two jobs on one host do not take each other's cores or RAM.
  # What they share is disk, page cache and network — so reach for `spread` if
  # your builds are IO-heavy and you would rather fit less work than have them
  # contend.
  #
  # Provider preference always wins over this: `providers: [firecracker, ec2]`
  # means the machine at home before the cloud, whichever policy is set.
  #
  # placement: pack

github:
  org: your-org

  # Populated by `billet github-app create --org your-org`.
  #
  # billet requests exactly two permissions: metadata read, and organization
  # self-hosted runners read+write. It does not request actions:read, which
  # would expose workflow runs, logs, and artifacts.
  #
  # Creating the App does not install it — the CLI walks you through both steps,
  # and installation is where installation_id comes from.
  app_id: 0
  installation_id: 0
  private_key_path: /etc/billet/app-private-key.pem

# Read by `billet node`. On a single machine this sits beside the server section
# above and the two processes share the file.
node:
  # OPTIONAL WITH A CERTIFICATE. The control plane authorises a node by the name
  # in its certificate, so an enrolled host takes its name from there and this
  # key is a second place to write the same fact. Set it on a loopback node,
  # which has no certificate to take one from — and if it is set alongside a
  # certificate, the two must agree.
  name: epyc-1
  server_addr: 127.0.0.1:7717
  provider: firecracker

  # NODE-LOCAL DATA: the generation pointer store, the image cache, and this
  # host's mTLS identity. It is not the server's state_dir and does not need to
  # be — a node with no certificate takes its deployment identity from the
  # `server:` section in this same file, which is what lets the two directories
  # differ on one machine.
  #
  # A node whose file has NO server section (the ordinary multi-machine case)
  # gets its identity from its certificate instead.
  state_dir: /var/lib/billet/node

  # Where this host takes the deployment lock, which stops two processes managing
  # the same containers. It belongs to the node because the node is what runs
  # them; the control plane takes no lock. Leave it unset for the per-user
  # default. (This key used to be `server.lock_dir` too — it is node-only now.)
  #
  # lock_dir: /run/billet/locks

  # WHAT THIS MACHINE CONTRIBUTES, which is not the same as what it has. Unset
  # means "everything I can detect", which is what a dedicated box wants.
  #
  # Declared HERE, on the machine, rather than in the control plane's config,
  # because the person running this host is the one who knows what else it does.
  # Setting them above what the machine has is allowed — overcommitting is a
  # decision you are entitled to make — and warned about at startup.
  #
  # A number here is what the allocator escrows against, so it is also the
  # answer to "why is this host not being given work".
  #
  # max_vcpu: 120
  # max_memory: 480GiB

  # WHERE THIS MACHINE IS, naming one of the control plane's declared sites
  # below. Optional, and only meaningful once a deployment has more than one
  # place. A node claiming a site the control plane does not declare is refused
  # at registration — a typo would otherwise become a place of its own, with a
  # cache of its own that is always empty.
  #
  # site: home

  # The bundle `billet ca issue epyc-1` wrote on the control plane, copied here.
  #
  # REQUIRED TO DIAL ANYTHING BUT LOOPBACK. The name in this certificate is what
  # the control plane authorises, so this host can act as the node it names and
  # as nothing else. The certificate also carries which DEPLOYMENT it belongs to,
  # so a fresh host needs nothing beyond these three files — it does not invent
  # an identity the control plane would refuse.
  #
  # node.key is a private key: 0600, and it never leaves this machine.
  #
  # tls:
  #   cert: /etc/billet/tls/node.crt
  #   key: /etc/billet/tls/node.key
  #   ca: /etc/billet/tls/ca.crt

  # How long billet may hold capacity for compute it cannot account for — a
  # container adopted from a crashed run, or one an ambiguous launch may have
  # left behind — before destroying it and reclaiming the capacity.
  #
  # UNSET MEANS NO BOUND, which is the default. Billet does not limit job
  # duration, and self-hosted runners are routinely configured past GitHub's
  # six-hour default, so a limit billet chose for itself would kill legitimate
  # long jobs. Set this only if you know your longest job; billet warns hourly
  # about held capacity either way, which is the signal that actually helps.
  #
  # max_custody: 24h

  # How long a stopping node waits for the compute it is still holding before it
  # gives up and lets the teardown destroy it. Defaults to 6h.
  #
  # Separate from the control plane's key on purpose: a node and a control plane
  # are restarted for different reasons and need not wait the same amount of time.
  #
  # drain_timeout: 6h

  firecracker:
    # The guest kernel must include everything Docker needs, or service
    # containers fail in ways that are hard to read. Validate with moby's
    # contrib/check-config.sh rather than a hand-written list.
    # Pinned to what the reference host runs: firecracker and jailer v1.16.1,
    # installed as versioned filenames behind stable symlinks. See
    # docs/reference-hardware.md — billet pins to the version the host has,
    # rather than asking a host to match a version billet prefers.
    kernel_image: /var/lib/billet/images/vmlinux
    # Backs golden images, per-job root clones, and cache volumes via CoW.
    #
    # BEING REPLACED BY CEPH RBD (#23). A ZFS snapshot exists only on this
    # machine, so a cache written here belongs to this host and to no other —
    # which is the storage-specific reason billet is a one-machine product —
    # capacity, placement and teardown are the others. Set it today; expect this key
    # to change once the storage layer lands.
    zfs_pool: tank
    bridge: br0

  # THE CLOUD BACKEND, for `provider: ec2`. One instance per job, in one subnet.
  #
  # This is the AVAILABILITY story: a tier that lists `providers: [firecracker,
  # ec2]` may be placed on either, so losing the bare-metal host does not take the
  # `runs-on` label down with it. A job that fails over runs with a COLD cache, and
  # that is correct — keeping it warm would mean shipping cache bytes over a WAN,
  # which is the problem the caching plane exists to remove.
  #
  # An ec2 node is an ORCHESTRATOR: it holds credentials and calls an API, and the
  # compute appears in a region. Nothing runs on the machine billet runs on, so
  # max_vcpu and max_memory above are REQUIRED here rather than detected — they are
  # the spending limit, and billet will not choose one on your account. They are
  # also most of the cost policy: the allocator never buys past them, and the ORDER
  # of a tier's `providers:` list is what makes home fill first.
  #
  # Credentials come from AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / (optionally)
  # AWS_SESSION_TOKEN, and failing that from this instance's own IAM role over
  # IMDSv2. The role is preferred: the alternative is a credential that never
  # expires, in a unit file, on a host that launches machines. Shared-config
  # profiles and SSO are NOT read — project them into the environment.
  #
  # ec2:
  #   region: us-west-2
  #
  #   # Where instances land. Their route to GitHub is yours to arrange: a private
  #   # subnet needs a NAT gateway, a public one needs assign_public_ip. A runner
  #   # that cannot reach GitHub registers and then does nothing.
  #   subnet_id: subnet-0abc123
  #   security_group_ids: [sg-0trusted]
  #   # assign_public_ip: true
  #
  #   # FORK PULL-REQUEST WORK RUNS ONLY IF THIS IS SET, and it should name a group
  #   # that reaches only what a stranger's code should reach. An instance isolates
  #   # the KERNEL, which is why this backend may run untrusted work at all — it
  #   # does not isolate the VPC. Without this key untrusted work is refused rather
  #   # than quietly placed on the trusted group.
  #   # untrusted_security_group_ids: [sg-0fork]
  #
  #   # An IAM role handed to whatever the job runs. Empty is the right answer
  #   # unless a job genuinely needs AWS credentials.
  #   # instance_profile: billet-runner
  #
  #   # THE SHAPES BILLET MAY BUY, each declaring what it holds, because billet
  #   # ships no table of EC2 instance types — a table would be out of date within a
  #   # quarter, and being out of date means launching a machine smaller than the
  #   # lease already escrowed against it. The ORDER is a preference: the first
  #   # shape that fits is bought.
  #   instance_types:
  #     - type: c7i.2xlarge
  #       vcpu: 8
  #       memory: 16GiB
  #     - type: c7i.8xlarge
  #       vcpu: 32
  #       memory: 64GiB
  #
  #   # SPOT DEFAULTS OFF. GitHub does not requeue a job whose runner vanished
  #   # mid-execution, so a reclaimed spot instance is a failed build rather than a
  #   # retry — and defaulting to it would make the failover path the unreliable
  #   # one, which is the opposite of what a failover is for. Turn it on if you
  #   # would rather have a cheap build that sometimes dies.
  #   # spot: true

# Tiers are yours to define — this is not a fixed catalog. The label is what
# users put in `runs-on`.
tiers:
  # RESERVING A FLOOR. Every tier shares one budget, and headroom is whatever is
  # left — so a tier with steady demand can hold all of it. The others then
  # advertise zero capacity, their jobs queue at GitHub indefinitely, and nothing
  # in billet is behaving incorrectly. A tier with small instances wins that race
  # simply by fitting more often.
  #
  #   reserved: 2     # always keep room for 2 of these, however busy the rest is
  #
  # It is a FLOOR, where max_concurrent is a ceiling — the difference between
  # limiting a tier and guaranteeing one. A reservation is deducted from what
  # other tiers may take only while it is UNMET; once the tier holds its floor it
  # competes for the rest on equal terms.
  #
  # THE COST IS REAL AND PERMANENT. Listeners claim escrow eagerly, without
  # consulting demand, so a reserved tier does not leave its floor sitting in
  # reserve — it takes those slots almost immediately and holds them for as long
  # as billet runs, advertising capacity to GitHub that nobody may want. Reserve
  # 2 slots of an 8 vCPU tier that gets no work and the machine is permanently
  # 16 vCPU smaller, with no error and no log line.
  #
  # So reserve for a tier that HAS demand and is being crowded out, never for one
  # that might someday want capacity. `billet check` prints how much of the
  # machine is spoken for; read it before and after.
  #
  # Unset means no guarantee, which is the default: a floor is a promise about a
  # machine that only its operator can make.

  # ONE LABEL, TWO KINDS OF MACHINE. A tier may name several backends in
  # preference order, so losing the box at home does not take the runs-on label
  # down with it — jobs land on EC2 instead.
  #
  # THE ORDER DECIDES. The control plane picks the machine when the job is
  # ADMITTED, walking this list most-preferred-first over the hosts that can
  # serve the tier and have room — so a job goes to the cloud only when home is
  # full, rather than to whichever machine happened to ask first.
  #
  # What is missing is the cloud itself: Docker is the only provider built, so
  # the EC2 half of this cannot be exercised yet (#32).
  #
  # - label: billet-8vcpu-ubuntu-2404
  #   providers: [firecracker, ec2]   # instead of `provider: firecracker`
  #   vcpu: 8
  #   memory: 32GiB
  #   disk: 160GiB
  #   image: ubuntu-2404-x64

  - label: billet-2vcpu-ubuntu-2404
    provider: firecracker
    vcpu: 2
    memory: 8GiB
    disk: 80GiB
    image: ubuntu-2404-x64

  - label: billet-4vcpu-ubuntu-2404
    provider: firecracker
    vcpu: 4
    memory: 16GiB
    disk: 80GiB
    image: ubuntu-2404-x64
    # Serve actions/cache from this machine instead of over the internet.
    # Off by default, and it should stay off for any tier that publishes release
    # artifacts or holds deployment secrets: interception terminates TLS in front
    # of the GitHub service that also carries artifact metadata.
    intercept: true

  - label: billet-8vcpu-ubuntu-2404
    provider: firecracker
    vcpu: 8
    memory: 32GiB
    disk: 160GiB
    image: ubuntu-2404-x64
    # Chromium and Postgres both misbehave on the default /dev/shm.
    shm: 1GiB
    intercept: true
    # Pre-boot idle VMs to hide cold start. Start small: Firecracker boots in
    # ~125 ms, so a large warm pool may be spending memory on a non-problem.
    warm_pool: 2

  # A tier that produces release artifacts. Interception is deliberately absent.
  - label: billet-4vcpu-ubuntu-2404-release
    provider: firecracker
    vcpu: 4
    memory: 16GiB
    disk: 80GiB
    image: ubuntu-2404-x64

# Apple Silicon, once a Mac mini joins the fleet. Such a host CAN serve both
# macOS guests and native Linux arm64 guests, but whether it does is your
# decision — see the nodes section below.
#
# Apple's licence allows at most 2 concurrent macOS guests per physical Mac, and
# that is WHY a macOS tier has to name its host: without the name billet cannot
# tell which Mac to count a guest against, and two macOS tiers on one machine
# would each believe they had 2.
#
# guest_os is what the licence check keys off — not the label — so a macOS tier
# named anything at all is still capped, and a Linux tier with "macos" in its
# name is not.
#
#  - label: billet-6vcpu-macos-26
#    provider: tart
#    guest_os: macos
#    node: mac-mini-1      # required: 2 macOS guests per Mac, counted per host
#    vcpu: 6
#    memory: 24GiB
#    image: macos-26
#    # Defaults to the host's macOS limit, and may not exceed it. Two macOS
#    # tiers on one node must still sum to that limit or less.
#
#  - label: billet-4vcpu-ubuntu-2404-arm
#    provider: tart
#    guest_os: linux
#    node: mac-mini-1
#    vcpu: 4
#    memory: 12GiB
#    image: ubuntu-2404-arm64

# Per-host policy, read by the control plane. Optional: omit a host entirely and
# it is unconstrained, with Apple's standard limit of 2 macOS guests.
#
# Note this is the FLEET description, distinct from the `node:` section above,
# which is how a single host describes ITSELF. Host policy has to live here
# because it is enforced across tiers that an individual host never sees.
#
# Declaring `provider` lets billet tell whether an UNPINNED tier could ever land
# on a host. Without it a macOS-only Mac cannot be distinguished from a host that
# might receive your x64 Linux tiers, so that check stays silent — the allocator
# still enforces the allowlist when a node is actually chosen.
#
# nodes:
#   # The default arrangement: one Mac serving both guest types.
#   - name: mac-mini-1
#     provider: tart
#     guest_os: [macos, linux]
#
#   # Dedicate a Mac to macOS. Linux Tart tiers are now a config error rather
#   # than something that quietly queues forever.
#   - name: mac-mini-2
#     provider: tart
#     guest_os: [macos]
#
#   # Or run one purely as an arm64 Linux builder and never boot macOS on it.
#   # Either form works; they are equivalent.
#   - name: mac-mini-3
#     provider: tart
#     guest_os: [linux]
#   - name: mac-mini-4
#     provider: tart
#     macos_vm_limit: 0
#
#   # Keep one licensed slot free for interactive use. Lowering the limit also
#   # lowers the default max_concurrent of every macOS tier pinned here.
#   - name: mac-mini-5
#     provider: tart
#     macos_vm_limit: 1
#
# macos_vm_limit defaults to 2 because that is what Apple's standard licence
# permits per Apple-branded host. billet does not know what agreement you have,
# so raising it is allowed — but doing so is an assertion about YOUR licence,
# not a tuning knob.

# The places this deployment has compute in. Optional: a single-machine
# deployment never writes one.
#
# A SITE IS WHERE COMPUTE AND ITS STORAGE SHARE A FAST NETWORK, which is the
# answer to "which storage" — a question every cache has to have one of, because
# a cache is fast precisely because it sits next to the machine using it.
#
# Declared here rather than inferred from what nodes claim, because a free
# string cannot tell a typo from a new location: a node that means "home" and
# types "hom" would get a site of its own, an empty cache, and every job placed
# there running cold while the fleet looked healthy.
#
# Today a site carries identity, which is the half placement needs. The storage
# backend that will hang off it — Ceph at a bare-metal site, EBS and S3 in a
# cloud region — arrives with the storage layer (#23, #25).
#
# sites:
#   - name: home
#   - name: aws-us-west-2
#
# A tier may then insist on one, the way it can already pin a node — except a
# site holds several machines, so it constrains WITHOUT giving up the fallback
# that having several of them buys:
#
#   - label: billet-4vcpu-ubuntu-2404-home
#     provider: firecracker
#     site: home
#     vcpu: 4
#     memory: 16GiB
#     image: ubuntu-2404-x64
