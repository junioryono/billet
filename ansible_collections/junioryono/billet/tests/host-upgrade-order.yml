---
- name: Guard the transactional host-upgrade ordering
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_host_main_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/main.yml') | from_yaml }}"
    billet_host_service_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/services.yml') | from_yaml }}"
    billet_host_account_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/account.yml') | from_yaml }}"
    billet_host_dryrun_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/dryrun-policy.yml') | from_yaml }}"
    billet_host_handlers: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/handlers/main.yml') | from_yaml }}"
    billet_host_inspection_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-inspect.yml') | from_yaml }}"
    billet_host_recovery_dispatch_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-recover.yml') | from_yaml }}"
    billet_host_recovery_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-rollback.yml') | from_yaml }}"
    billet_host_finalization_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-finalize.yml') | from_yaml }}"
    billet_host_backup_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/backup.yml') | from_yaml }}"
    billet_host_backup_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/backup.yml') }}"
    billet_host_prepare_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/prepare-exclusion.yml') | from_yaml }}"
    billet_host_prepare_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/prepare-exclusion.yml') }}"
    billet_host_stage_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/stage-candidate.yml') | from_yaml }}"
    billet_host_binary_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/binary.yml') | from_yaml }}"
    billet_host_allocate_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/allocate-recovery.yml') | from_yaml }}"
    billet_host_fallback_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/guard-fallback.yml') | from_yaml }}"
    billet_host_fallback_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/guard-fallback.yml') }}"
    billet_host_answer_tasks: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/guard-answer.yml') | from_yaml }}"
    billet_host_answer_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/guard-answer.yml') }}"
    billet_fallback_module_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../plugins/modules/guard_fallback.py') }}"
    billet_host_services_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/services.yml') }}"
    billet_host_inspection_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-inspect.yml') }}"
    billet_host_finalization_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-finalize.yml') }}"
    billet_host_recovery_dispatch_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/upgrade-recover.yml') }}"
    billet_host_account_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/account.yml') }}"
    billet_server_unit: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/templates/billet-server.service.j2') }}"
    billet_node_unit: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/templates/billet-node.service.j2') }}"
    billet_host_defaults: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/defaults/main.yml') | from_yaml }}"
    billet_service_policy_unit_path_allowlist: "{{ billet_host_defaults.billet_service_policy_unit_path_allowlist }}"
  tasks:
    - name: Locate the upgrade transaction and recovery path
      ansible.builtin.set_fact:
        billet_upgrade_task: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Upgrade billet as one recoverable host transaction') | first }}"
        billet_top_level_names: "{{ billet_host_service_tasks | map(attribute='name') | list }}"
        billet_account_names: "{{ billet_host_account_tasks | map(attribute='name') | list }}"
        billet_inspection_names: "{{ billet_host_inspection_tasks | map(attribute='name') | list }}"
        billet_main_names: "{{ billet_host_main_tasks | map(attribute='name') | list }}"
        billet_dryrun_names: "{{ billet_host_dryrun_tasks | map(attribute='name') | list }}"
        billet_handler_names: "{{ billet_host_handlers | map(attribute='name') | list }}"
        billet_recovery_dispatch_names: "{{ billet_host_recovery_dispatch_tasks | map(attribute='name') | list }}"
        billet_recovery_names: "{{ billet_host_recovery_tasks | map(attribute='name') | list }}"
        billet_finalization_names: "{{ billet_host_finalization_tasks | map(attribute='name') | list }}"

    - name: Record transaction and recovery task details
      ansible.builtin.set_fact:
        billet_upgrade_names: "{{ billet_upgrade_task.block | map(attribute='name') | list }}"
        billet_rollback_names: "{{ billet_upgrade_task.rescue | map(attribute='name') | list }}"
        billet_upgrade_stop_node: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Gracefully stop the billet node before changing its guest contract') | first }}"
        billet_upgrade_stop_server: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Gracefully stop the billet server after compute has drained') | first }}"
        billet_upgrade_backup_ledger: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Preserve the stopped control-plane ledger') | first }}"
        billet_stage_names: "{{ billet_host_stage_tasks | map(attribute='name') | list }}"
        billet_stage_block: "{{ (billet_host_stage_tasks | selectattr('name', 'equalto', \"Resolve and stage this invocation's candidate\") | first).block }}"
        billet_candidate_unit_stage: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Stage candidate systemd units for the upgrade transaction') | first }}"
        billet_ordinary_unit_install: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Install the billet systemd units') | first }}"
        billet_service_policy_reload: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Reload systemd before inspecting installed service policy') | first }}"
        billet_service_policy_pending_probe: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Inspect pending Billet service policy during a dry run') | first }}"
        billet_service_policy_pending_guard: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Refuse a dry run against stale Billet service policy') | first }}"
        billet_service_policy_loaded_probe: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Inspect the loaded identity of Billet units during a dry run') | first }}"
        billet_service_policy_exec_probe: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Inspect the loaded ExecStart of Billet units during a dry run') | first }}"
        billet_service_policy_fragment_read: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Read the on-disk fragment of Billet units during a dry run') | first }}"
        billet_service_policy_unit_path_probe: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', \"Read the running manager's unit lookup paths during a dry run\") | first }}"
        billet_service_policy_unit_path_guard: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Refuse a unit lookup path this dry run does not know') | first }}"
        billet_service_policy_alias_probe: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Resolve on-disk aliases of the Billet units the way the manager would') | first }}"
        billet_service_policy_alias_guard: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Refuse an on-disk alias of a Billet unit during a dry run') | first }}"
        billet_service_policy_dropin_find: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Look for drop-ins on disk in every location the manager searches') | first }}"
        billet_service_policy_dropin_locations_note: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Note every drop-in location the manager searches') | first }}"
        billet_service_policy_dropin_stat: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Stat every drop-in location the manager searches') | first }}"
        billet_service_policy_compare: "{{ billet_host_dryrun_tasks | selectattr('name', 'equalto', 'Compare the on-disk Billet unit policy with what the manager loaded') | first }}"
        billet_service_policy_reload_after_probe: "{{ billet_host_handlers | selectattr('name', 'equalto', 'Inspect whether the manager reports a pending reload after unit-file changes') | first }}"
        billet_service_policy_final_reload: "{{ billet_host_handlers | selectattr('name', 'equalto', \"Reload systemd after the role's own unit-file changes\") | first }}"
        billet_service_policy_final_flush: "{{ billet_host_main_tasks | selectattr('name', 'equalto', \"Apply the reload the role's own unit-file changes left pending\") | first }}"
        billet_steady_unit_install: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Install steady-state units without the quiescent probe') | first }}"
        billet_recovery_stop_proof: "{{ billet_host_recovery_tasks | selectattr('name', 'equalto', 'Refuse recovery without conclusive process and cgroup evidence') | first }}"
        billet_recovery_cgroup_probe: "{{ billet_host_recovery_tasks | selectattr('name', 'equalto', 'Inspect service cgroups before recovering upgrade inputs') | first }}"
        billet_recovery_restore_inputs: "{{ billet_host_recovery_tasks | selectattr('name', 'equalto', 'Restore configuration and units that existed before the upgrade') | first }}"
        billet_recovery_candidate_links: "{{ billet_host_recovery_tasks | selectattr('name', 'equalto', 'Remove candidate persistent and runtime enablement links') | first }}"
        billet_service_dropin_reload: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Reload systemd before inspecting host-upgrade service overlays') | first }}"
        billet_service_dropin_probe: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Inspect billet service drop-ins before the upgrade transaction') | first }}"
        billet_service_dropin_guard: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Refuse service drop-ins the transaction cannot replace or recover') | first }}"
        billet_candidate_dropin_probe: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Inspect candidate service drop-ins before readiness probes') | first }}"
        billet_candidate_dropin_guard: "{{ billet_upgrade_task.block | selectattr('name', 'equalto', 'Refuse candidate service drop-ins before readiness probes') | first }}"
        billet_service_link_guard: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Refuse service link states rollback cannot reproduce exactly') | first }}"
        billet_legacy_transient_guard: "{{ billet_host_recovery_dispatch_tasks | selectattr('name', 'equalto', 'Refuse rollback of a legacy transient service definition') | first }}"

    - name: Render legacy-compatible and transactional units
      ansible.builtin.set_fact:
        billet_legacy_server_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-server.service.j2') }}"
        billet_legacy_node_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-node.service.j2') }}"
        billet_transaction_server_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-server.service.j2', template_vars={'billet_systemd_notify_ready': true, 'billet_systemd_upgrade_probe': true, 'billet_systemd_upgrade_probe_hold': true}) }}"
        billet_transaction_node_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-node.service.j2', template_vars={'billet_systemd_notify_ready': true, 'billet_systemd_upgrade_probe': true, 'billet_systemd_upgrade_probe_hold': true}) }}"
        billet_older_candidate_server_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-server.service.j2', template_vars={'billet_systemd_notify_ready': true, 'billet_systemd_upgrade_probe': true, 'billet_systemd_upgrade_probe_hold': false}) }}"
        billet_older_candidate_node_unit: "{{ lookup('ansible.builtin.template', playbook_dir + '/../roles/host/templates/billet-node.service.j2', template_vars={'billet_systemd_notify_ready': true, 'billet_systemd_upgrade_probe': true, 'billet_systemd_upgrade_probe_hold': false}) }}"
        billet_candidate_probe_ask: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Ask the candidate whether its probe can be told to hold') | first }}"
        billet_stage_inner: "{{ (billet_stage_block | selectattr('name', 'equalto', 'Stage the candidate for the transaction') | first).block }}"
        billet_stage_block_names: "{{ billet_stage_block | map(attribute='name') | list }}"
        billet_stage_inner_names: "{{ (billet_stage_block | selectattr('name', 'equalto', 'Stage the candidate for the transaction') | first).block | map(attribute='name') | list }}"
        billet_candidate_stage: "{{ (billet_stage_block | selectattr('name', 'equalto', 'Stage the candidate for the transaction') | first).block | selectattr('name', 'equalto', 'Stage the immutable candidate binary inside its recovery journal') | first }}"
        billet_prepare_names: "{{ billet_host_prepare_tasks | map(attribute='name') | list }}"
        billet_prepare_block: "{{ (billet_host_prepare_tasks | selectattr('name', 'equalto', 'Prepare the exclusion') | first).block }}"
        billet_protocol_block: "{{ ((billet_host_prepare_tasks | selectattr('name', 'equalto', 'Prepare the exclusion') | first).block | selectattr('name', 'equalto', 'Prepare through the guard') | first).block }}"
        billet_rescue_block: "{{ ((billet_host_prepare_tasks | selectattr('name', 'equalto', 'Prepare the exclusion') | first).block | selectattr('name', 'equalto', 'Prepare through the guard') | first).rescue }}"
        billet_fallback_names: "{{ billet_host_fallback_tasks | map(attribute='name') | list }}"
        billet_unsafe_override_dropin: |
          [Service]
          Type=exec
          ExecStart=
          ExecStart=/usr/bin/billet node --config /etc/billet/billet.yaml
        billet_stale_manager_identity:
          user: billet
          group: billet
        billet_reloaded_disk_identity:
          user: unapproved
          group: unapproved
        billet_changed_identity_unit: |
          [Service]
          User=unapproved
          Group=unapproved
      vars:
        billet_service_user: billet
        billet_service_group: billet
        billet_config: {}
        # The role default (defaults/main.yml) does not apply to a bare template
        # lookup, and the template deliberately has no fallback: a provider-aware
        # unit rendered without knowing the provider would be a guess.
        billet_firecracker_enabled: true
        # The server's state directory is RESOLVED ONCE by the role, in
        # upgrade-inspect.yml, from `identity_dir` when the config names its
        # ledger backend and from `state_dir` otherwise — and the template reads
        # that fact rather than re-deriving, so a PostgreSQL deployment does not
        # get the default sandboxed and mounted underneath it. Stated here for
        # the same reason billet_firecracker_enabled is: no fallback, so a
        # missing value fails the render rather than emitting a guess.
        billet_candidate_server_state_dir: /var/lib/billet/server

    - name: Exercise an effective ExecStart and Type drop-in override
      block:
        - name: Apply the transaction's drop-in acceptance condition
          ansible.builtin.assert:
            that:
              - billet_unsafe_override_dropin | trim | length == 0

        - name: Record an unsafe acceptance
          ansible.builtin.set_fact:
            billet_unsafe_override_accepted: true
      rescue:
        - name: Record the expected refusal
          ansible.builtin.set_fact:
            billet_unsafe_override_refused: true

    - name: Prove the effective override was refused
      ansible.builtin.assert:
        that:
          - billet_unsafe_override_refused | default(false) | bool
          - not billet_unsafe_override_accepted | default(false) | bool

    - name: Exercise a changed main-unit identity hidden by stale manager state
      block:
        - name: Apply the installed identity acceptance condition after reload
          ansible.builtin.assert:
            that:
              - billet_reloaded_disk_identity.user == billet_stale_manager_identity.user
              - billet_reloaded_disk_identity.group == billet_stale_manager_identity.group

        - name: Record an unsafe stale-identity acceptance
          ansible.builtin.set_fact:
            billet_stale_identity_accepted: true
      rescue:
        - name: Record the expected fresh-identity refusal
          ansible.builtin.set_fact:
            billet_stale_identity_refused: true

    - name: Prove the reloaded on-disk identity was refused
      ansible.builtin.assert:
        that:
          - billet_stale_identity_refused | default(false) | bool
          - not billet_stale_identity_accepted | default(false) | bool
          - "'User=unapproved' in billet_changed_identity_unit"
          - "'Group=unapproved' in billet_changed_identity_unit"

    - name: Require durable recovery before any live host mutation
      ansible.builtin.assert:
        that:
          - "'Refuse unsafe billet state directories' in billet_inspection_names"
          - "'Refuse billet state paths with symlinked or noncanonical ancestors' in billet_inspection_names"
          - "'Refuse billet state paths that are symlinks or non-directories' in billet_inspection_names"
          - billet_account_names.index('Reload systemd before inspecting installed service policy') < billet_account_names.index('Inspect the installed billet server unit before account mutation')
          - billet_account_names.index('Reload systemd before inspecting installed service policy') < billet_account_names.index('Inspect the installed billet server identity before account mutation')
          - billet_account_names.index('Inspect the installed billet server identity before account mutation') < billet_account_names.index('Refuse an implicit installed service identity migration')
          - billet_service_policy_reload['ansible.builtin.systemd_service'].daemon_reload | bool
          - billet_service_policy_reload.changed_when == false
          - "'not ansible_check_mode' in (billet_service_policy_reload.when | string)"
          - "'--property=NeedDaemonReload' in billet_service_policy_pending_probe['ansible.builtin.command'].argv"
          - billet_service_policy_pending_probe.changed_when == false
          - billet_service_policy_pending_probe.check_mode == false
          - "'ansible_check_mode' in (billet_service_policy_pending_probe.when | string)"
          - "'item.ok | bool' in billet_service_policy_pending_guard['ansible.builtin.assert'].that"
          - "'ansible_check_mode' in (billet_service_policy_pending_guard.when | string)"
          - "'disagrees with what the manager loaded' in billet_service_policy_pending_guard['ansible.builtin.assert'].fail_msg"
          - billet_account_names[0] == "Compare a dry run's view of Billet service policy with what the manager loaded"
          - billet_host_account_tasks[0]['ansible.builtin.import_tasks'] == 'dryrun-policy.yml'
          - billet_dryrun_names.index('Inspect pending Billet service policy during a dry run') < billet_dryrun_names.index('Inspect the loaded identity of Billet units during a dry run')
          - billet_dryrun_names.index('Inspect the loaded identity of Billet units during a dry run') < billet_dryrun_names.index('Read the on-disk fragment of Billet units during a dry run')
          - billet_dryrun_names.index('Read the running manager\'s unit lookup paths during a dry run') < billet_dryrun_names.index('Refuse a unit lookup path this dry run does not know')
          - billet_dryrun_names.index('Refuse a unit lookup path this dry run does not know') < billet_dryrun_names.index('Resolve on-disk aliases of the Billet units the way the manager would')
          - billet_dryrun_names.index('Resolve on-disk aliases of the Billet units the way the manager would') < billet_dryrun_names.index('Refuse an on-disk alias of a Billet unit during a dry run')
          - billet_dryrun_names.index('Refuse an on-disk alias of a Billet unit during a dry run') < billet_dryrun_names.index('Note every drop-in location the manager searches')
          - billet_dryrun_names.index('Note every drop-in location the manager searches') < billet_dryrun_names.index('Stat every drop-in location the manager searches')
          - billet_dryrun_names.index('Stat every drop-in location the manager searches') < billet_dryrun_names.index('Look for drop-ins on disk in every location the manager searches')
          - billet_dryrun_names.index('Look for drop-ins on disk in every location the manager searches') < billet_dryrun_names.index('Compare the on-disk Billet unit policy with what the manager loaded')
          - billet_dryrun_names.index('Compare the on-disk Billet unit policy with what the manager loaded') < billet_dryrun_names.index('Refuse a dry run against stale Billet service policy')
          - billet_dryrun_names.index('Refuse a dry run against stale Billet service policy') < billet_dryrun_names.index('Report a pending daemon-reload the dry run could compare across')
          - "'--property=FragmentPath' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - "'--property=LoadState' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - billet_dryrun_names.index('Inspect pending Billet service policy during a dry run') < billet_dryrun_names.index('Refuse a reload answer this dry run does not read')
          - billet_dryrun_names.index('Refuse a reload answer this dry run does not read') < billet_dryrun_names.index('Inspect the loaded identity of Billet units during a dry run')
          - "'LoadState' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'skipped_paths' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'winning.path != loaded_fragment' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'not a section header this dry run can read' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'a section this dry run does not know' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'a directive this dry run does not know' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - "'billet_service_policy_known_directives[ns.section]' in (billet_service_policy_compare['ansible.builtin.set_fact'].billet_service_policy_comparison | string)"
          - billet_host_defaults.billet_service_policy_known_directives.keys() | list == ['[Unit]', '[Service]', '[Install]']
          - "'ExecStart' in billet_host_defaults.billet_service_policy_known_directives['[Service]']"
          - "'ExecStartPre' not in billet_host_defaults.billet_service_policy_known_directives['[Service]']"
          - "'--property=DropInPaths' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - "'--property=Names' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - "'--property=User' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - "'--property=Group' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - "'--property=Type' in billet_service_policy_loaded_probe['ansible.builtin.command'].argv"
          - billet_service_policy_loaded_probe.check_mode == false
          - "'busctl' in billet_service_policy_exec_probe['ansible.builtin.command'].argv"
          - "'ExecStart' in billet_service_policy_exec_probe['ansible.builtin.command'].argv"
          - billet_service_policy_exec_probe.check_mode == false
          - "'FragmentPath' in billet_service_policy_fragment_read['ansible.builtin.slurp'].src"
          - "'UnitPath' in billet_service_policy_unit_path_probe['ansible.builtin.command'].argv"
          - "'billet_service_policy_unit_path_allowlist' in (billet_service_policy_unit_path_guard['ansible.builtin.assert'].that | string)"
          - "'/run/systemd/generator.early' in billet_service_policy_unit_path_allowlist"
          - "'/run/systemd/system.control' in billet_service_policy_unit_path_allowlist"
          - "'/run/systemd/transient' in billet_service_policy_unit_path_allowlist"
          - "'/etc/systemd/system.attached' in billet_service_policy_unit_path_allowlist"
          - "'/run/systemd/generator.late' in billet_service_policy_unit_path_allowlist"
          - "'junioryono.billet.unit_names' in billet_service_policy_alias_probe"
          - "'billet_service_policy_manager_unit_paths' in billet_service_policy_alias_probe['junioryono.billet.unit_names'].unit_path"
          - "'billet_service_policy_aliases.aliases | length == 0' in billet_service_policy_alias_guard['ansible.builtin.assert'].that"
