    # THE PREPARE-ONLY HOLD'S WIRING, WHICH NO OTHER TEST CAN SEE. The render
    # test proves the units carry the assertion; it would pass unchanged if every
    # predicate substitution in services.yml were reverted, because rendering a
    # template says nothing about which tasks start a service.
    #
    # THE NODE MATTERS AS MUCH AS THE SERVER, and that is the whole reason this
    # exists. On a host running both roles the NODE mints the deployment identity
    # when the server has not: `billet node` claims the deployment before it
    # reaches --upgrade-probe, and nodeDeploymentID falls through to
    # state.DeploymentID(server.state_dir) — whose comment says "whichever role
    # runs first mints the identity". A first version of this change held only the
    # server, and the invariant was broken by the other unit on the same machine.
    #
    # Stated as a TEXT invariant on purpose: billet_enable_node must not appear in
    # services.yml at all, because every consumer became billet_node_should_run.
    # Reverting any one of them reintroduces the string, which is exactly the
    # regression to catch. The counts alone are only a floor -- the per-task
    # assertions below are what establish the wiring.
    - name: Record how services.yml gates the two services
      ansible.builtin.set_fact:
        billet_services_text: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/services.yml') }}"
        billet_manifest_task: "{{ billet_upgrade_task.block | selectattr('name', 'search', 'manifest') | list }}"

    - name: Every start of either service is gated on its should_run predicate
      ansible.builtin.assert:
        that:
          # NOT ONE occurrence. Every consumer became billet_node_should_run, so
          # any revert puts this string back.
          - billet_services_text | regex_findall('billet_enable_node') | length == 0
          # The server keeps the bare flag ONLY where it means "this host owns the
          # control-plane role" rather than "start it": the three state-file
          # ownership tasks, which a prepared host still needs applied.
          - billet_services_text | regex_findall('billet_enable_server') | length == 3
          # THE COUNTS ARE A FLOOR, NOT THE WIRING. There are nine sites; a
          # `>= 8` assertion let one guard be deleted -- removing it from the
          # node's steady-state start leaves eight, introduces no
          # billet_enable_node, and passed. The per-task assertions below are
          # what actually establish the wiring; these two only catch a wholesale
          # deletion of the predicates.
          - billet_services_text | regex_findall('billet_server_should_run') | length >= 8
          - billet_services_text | regex_findall('billet_node_should_run') | length >= 8
          # THE MANIFEST IS WHAT BOTH FINALIZERS RESOLVE FROM, so a held host that
          # crashed mid-transaction must not be started by its own recovery.
          # THE BRACES ARE WRITTEN \{\{ ON PURPOSE. Ansible templates this string
          # before Jinja evaluates it, so a literal {{ here would be INTERPOLATED
          # and the assertion would compare against the variable's value rather
          # than against the text of the file. Escaped, the two braces are not
          # adjacent, the templater leaves them alone, and the regex reads them as
          # literal braces.
          - billet_services_text | regex_findall('candidate_server_active:\s*"\{\{\s*billet_server_should_run') | length == 1
          - billet_services_text | regex_findall('candidate_node_active:\s*"\{\{\s*billet_node_should_run') | length == 1
          # ...while server_was_active must keep meaning the ACTUAL pre-transaction
          # state, or an uncommitted rollback restores something that never ran.
          - billet_services_text | regex_findall('server_was_active:\s*"\{\{\s*billet_service_state_before_upgrade') | length == 1
        fail_msg: >-
          services.yml must gate every start, restart, durable enablement and
          manifest target of BOTH billet-server and billet-node on the
          should_run predicates. Holding only the server is not a hold: on a
          two-role host a CERTLESS node mints the deployment identity when the
          server has not.

    # NAMED TASK BY NAMED TASK, because a count is not a wiring. Deleting the
    # guard from ONE start left the occurrence count at eight, introduced no
    # billet_enable_node, satisfied both manifest regexes, and passed -- while
    # the role would try to start a held node and fail the converge.
    - name: Record every task that starts or enables a billet service
      ansible.builtin.set_fact:
        billet_gated: >-
          {{
            (billet_host_service_tasks | selectattr('name', 'defined') | list)
            + (billet_upgrade_task.block | selectattr('name', 'defined') | list)
          }}
        # ONE LIST, used by both assertions below, so a task can never be present
        # in the existence check and absent from the guard check.
        billet_gated_expectations:
          - { task: "Start the quiescent upgraded server readiness probe", guard: "billet_server_should_run" }
          - { task: "Start the quiescent upgraded node readiness probe", guard: "billet_node_should_run" }
          - { task: "Restart the billet server after non-binary inputs change", guard: "billet_server_should_run" }
          - { task: "Restart the billet node after non-binary inputs change", guard: "billet_node_should_run" }
          - { task: "Enable and start the billet server", guard: "billet_server_should_run" }
          - { task: "Enable and start the billet node", guard: "billet_node_should_run" }
          - { task: "Stop and disable the billet server unless it may run here", guard: "not billet_server_should_run" }
          - { task: "Stop and disable the billet node unless it may run here", guard: "not billet_node_should_run" }

    # THE NODE RESTARTS WHEN THE ENVIRONMENT IT IMPORTS CHANGES. On a host that is
    # both a controller and a node the node unit imports the server's environment
    # file, and a dispatched updater inherits it; a rotated connection string the
    # node never re-read would be one the updater could not open the ledger with.
    - name: The node restart condition names the server environment file
      ansible.builtin.assert:
        that:
          - >-
            (billet_gated | selectattr('name', 'equalto', 'Restart the billet node after non-binary inputs change')
             | first).when | string is search('billet_server_environment_install.changed')
        fail_msg: >-
          The node restart no longer fires when the server environment file changes,
          so a dispatched updater on a host that is both can inherit a stale
          connection string.

    # THE TASK MUST STILL EXIST, asserted separately. A rename already fails this
    # -- `first` over an empty list errors, so it cannot silently go unasserted --
    # but it fails talking about `first`, which reads as a broken test rather than
    # a missing guard. This says which task went away.
    - name: Every gated task is still present under the name this test knows
      ansible.builtin.assert:
        that:
          - billet_gated | selectattr('name', 'equalto', item.task) | list | length == 1
        fail_msg: >-
          services.yml has no task named "{{ item.task }}". If it was renamed,
          rename it here too; if it was deleted, the service it started is no
          longer gated by anything and a prepare-only host would start it.
      loop: "{{ billet_gated_expectations }}"
      loop_control:
        label: "{{ item.task }}"

    # POLARITY, NOT SUBSTRING. `is search('billet_server_should_run')` also matches
    # `not billet_server_should_run`, so inverting a guard -- starting the service
    # exactly when it must not -- passed every assertion, left the counts
    # unchanged and introduced no billet_enable_server. A positive expectation must
    # therefore ALSO assert the negated form is absent.
    - name: Each start, restart and stop names its own should_run predicate
      ansible.builtin.assert:
        that:
          - >-
            (billet_gated | selectattr('name', 'equalto', item.task) | first).when | string
            is search(item.guard)
          - >-
            item.guard.startswith('not ') or
            not ((billet_gated | selectattr('name', 'equalto', item.task) | first).when | string
                 is search('not ' ~ item.guard))
        fail_msg: >-
          services.yml task "{{ item.task }}" must be gated on {{ item.guard }}.
          A count of predicate occurrences cannot establish that: deleting one
          guard leaves the others in place and the count barely moves.
      loop: "{{ billet_gated_expectations }}"
      loop_control:
        label: "{{ item.task }}"

    # THE BACKUP UNITS, GATED LIKE EVERY OTHER START. The task file is its own,
    # so the services.yml count above stays exact; it may name the should_run
    # predicate and never the bare flag, because a prepared host holds its
    # server and must not be archived before it is commissioned. It comes after
    # the refresh timer and before the services, and it refuses a drop-in the
    # way the two services' guards do: by asking systemd for DropInPaths after a
    # reload, judging the command's status, and asserting an empty answer.
    - name: Record the backup task file's shape
      vars:
        billet_backup_probe_name: "Inspect the deployment backup unit's drop-ins"
      ansible.builtin.set_fact:
        billet_backup_names: "{{ billet_host_backup_tasks | map(attribute='name') | list }}"
        billet_backup_dropin_probe: "{{ billet_host_backup_tasks | selectattr('name', 'equalto', billet_backup_probe_name) | first }}"
        billet_backup_dropin_guard: "{{ billet_host_backup_tasks | selectattr('name', 'equalto', 'Refuse a drop-in on the deployment backup unit') | first }}"
        billet_backup_install: "{{ billet_host_backup_tasks | selectattr('name', 'equalto', 'Install the deployment backup units') | first }}"
        billet_backup_enable: "{{ billet_host_backup_tasks | selectattr('name', 'equalto', 'Enable the deployment backup timer') | first }}"

    - name: The backup units are installed, fenced and refused on the right terms
      vars:
        billet_backup_probe_name: "Inspect the deployment backup unit's drop-ins"
      ansible.builtin.assert:
        that:
          - billet_host_backup_text | regex_findall('billet_enable_server') | length == 0
          - billet_host_backup_text | regex_findall('billet_server_should_run') | length >= 6
          - billet_main_names.index('Configure or remove the guest image refresh timer') < billet_main_names.index('Configure or remove the deployment backup timer')
          - billet_main_names.index('Configure or remove the deployment backup timer') < billet_main_names.index('Configure billet services')
          - billet_backup_names.index('Install the deployment backup units') < billet_backup_names.index('Apply deployment backup unit changes')
          - billet_backup_names.index('Apply deployment backup unit changes') < billet_backup_names.index(billet_backup_probe_name)
          - billet_backup_names.index(billet_backup_probe_name) < billet_backup_names.index('Refuse a drop-in on the deployment backup unit')
          - billet_backup_names.index('Refuse a drop-in on the deployment backup unit') < billet_backup_names.index('Enable the deployment backup timer')
          - "'--property=DropInPaths' in billet_backup_dropin_probe['ansible.builtin.command'].argv"
          - "'billet-backup.service' in billet_backup_dropin_probe['ansible.builtin.command'].argv"
          - billet_backup_dropin_probe.check_mode == false
          - billet_backup_dropin_probe.changed_when == false
          - "'.rc != 0' in (billet_backup_dropin_probe.failed_when | string)"
          - "'billet_backup_dropins.stdout | trim | length == 0' in billet_backup_dropin_guard['ansible.builtin.assert'].that"
          - "'billet_server_should_run' in (billet_backup_install.when | string)"
          - "'not billet_server_should_run' not in (billet_backup_install.when | string)"
          - "'billet_server_should_run' in (billet_backup_enable.when | string)"
          - "'not billet_server_should_run' not in (billet_backup_enable.when | string)"
          - "'billet_backup_timer' in (billet_backup_enable['ansible.builtin.systemd_service'].enabled | string)"
          - billet_backup_enable['ansible.builtin.systemd_service'].name == 'billet-backup.timer'
        fail_msg: >-
          backup.yml must install the backup units and enable the timer only where
          billet_server_should_run, never on the bare flag, between the refresh
          timer and the services, and refuse an effective drop-in by asking systemd
          after a reload and judging the command's status.

    # THE DOWNGRADE IS THE COMMAND'S TO JUDGE (`billet converge-guard prepare
    # --candidate`, through version.Compare, both spellings), so no task of the
    # staging reads a version, and no pattern here to pin.
    # THE EXCLUSION IS PREPARED BEFORE ANYTHING ELSE, AND ITS TRANSACTION RUNS
    # INSIDE THE GUARD. What no scenario can see: that the two calls of the
    # protocol are made in order through one parser, that a dry run reports
    # before any shape dispatch, that the settlement is last and the cleanup
    # release is the rescue's, that every read of `active`'s content is gated by
    # the legacy shapes, that the claim under the guard is a pointer outside
    # the transaction block, and that recovery and finalization prove ownership
    # by shape first.
    - name: Record the preparation's shape
      ansible.builtin.set_fact:
        billet_prepare_holder_refusal: "{{ billet_host_prepare_tasks | selectattr('name', 'equalto', 'Refuse a converge without a holder') | first }}"
        billet_prepare_root_guard: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Refuse an upgrade root that is not what the role makes') | first }}"
        billet_prepare_root_make: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Establish the upgrade root') | first }}"
        billet_prepare_claim_stat: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Inspect the durable claim') | first }}"
        billet_prepare_moved: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Refuse a converge whose exclusion moved') | first }}"
        billet_prepare_dry_ask: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Ask the managed binary to report the claim') | first }}"
        billet_prepare_dry_judge: "{{ billet_prepare_block | selectattr('name', 'equalto', \"Judge the dry run's answer\") | first }}"
        billet_prepare_dry_stage: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Decide the binary change in a dry run') | first }}"
        billet_prepare_legacy: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Classify a legacy pointer') | first }}"
        billet_prepare_protocol: "{{ billet_prepare_block | selectattr('name', 'equalto', 'Prepare through the guard') | first }}"
        billet_prepare_first_managed: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Ask the managed binary to prepare') | first }}"
        billet_prepare_first_fallback: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Ask the recorded executable to prepare') | first }}"
        billet_prepare_first_candidate: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Ask the staged candidate to prepare') | first }}"
        billet_prepare_second: "{{ billet_protocol_block | selectattr('name', 'equalto', \"Declare this converge's intent to the guard\") | first }}"
        billet_prepare_settle: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Settle the guard this converge acquired') | first }}"
        billet_prepare_legacy_reask: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Ask the managed binary again whether it predates the guard') | first }}"
        billet_prepare_unheld_restat: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Inspect the managed binary and the claim again before an unheld converge') | first }}"
        billet_prepare_stage_import: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Decide the binary change and stage its candidate') | first }}"
        billet_prepare_report: "{{ billet_protocol_block | selectattr('name', 'equalto', 'Report the exclusion') | first }}"
        billet_prepare_cleanup: "{{ billet_rescue_block | selectattr('name', 'equalto', 'Release the guard this converge acquired before it changed anything') | first }}"
        billet_prepare_remainder_ask: "{{ billet_rescue_block | selectattr('name', 'equalto', 'Ask what the remainder is') | first }}"
        billet_prepare_block_names: "{{ billet_prepare_block | map(attribute='name') | list }}"
        billet_protocol_names: "{{ billet_protocol_block | map(attribute='name') | list }}"
        billet_rescue_names: "{{ billet_rescue_block | map(attribute='name') | list }}"
        billet_answer_names: "{{ billet_host_answer_tasks | map(attribute='name') | list }}"
        billet_answer_judge: "{{ billet_host_answer_tasks | selectattr('name', 'equalto', \"Judge the preparation's answer\") | first }}"
        billet_answer_facts: "{{ billet_host_answer_tasks | selectattr('name', 'equalto', \"Take the preparation's answer as this run's facts\") | first }}"
        billet_answer_report: "{{ billet_host_answer_tasks | selectattr('name', 'equalto', \"Report the preparation's answer\") | first }}"
        billet_stage_reset: "{{ billet_host_stage_tasks | selectattr('name', 'equalto', 'Reset the transaction facts for this invocation') | first }}"
        billet_allocate_task: "{{ billet_host_allocate_tasks | selectattr('name', 'equalto', 'Allocate a recovery directory exclusively') | first }}"
        billet_previous_binary_copy: "{{ billet_host_account_tasks | selectattr('name', 'equalto', 'Preserve the previous billet binary before live mutation') | first }}"
        billet_fallback_read: "{{ billet_host_fallback_tasks | selectattr('name', 'equalto', \"Read the guard's record\") | first }}"
        billet_fallback_judge_record: "{{ billet_host_fallback_tasks | selectattr('name', 'equalto', \"Judge the guard's record\") | first }}"
        billet_fallback_judge_candidate: "{{ billet_host_fallback_tasks | selectattr('name', 'equalto', 'Judge the recorded executable') | first }}"
        billet_claim_outside: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Refuse a transaction outside the exclusion') | first }}"
        billet_claim_legacy: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Claim the host upgrade without replacing another transaction') | first }}"
        billet_claim_guard: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Claim the host upgrade inside the converge guard') | first }}"
        billet_claim_guard_flush: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Durably publish the transaction pointer inside the guard') | first }}"
        billet_claim_guard_read: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Read back the transaction pointer before live mutation') | first }}"
        billet_claim_legacy_read: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Read back the exclusive host-upgrade claim before live mutation') | first }}"
        billet_claim_prove: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Prove this transaction owns the host before live mutation') | first }}"
        billet_claim_record: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Record that the transaction is claimed inside the guard') | first }}"
        billet_finalize_guard: "{{ billet_host_finalization_tasks | selectattr('name', 'equalto', 'Refuse finalization without a real owned host-upgrade claim') | first }}"
        billet_finalize_slurp: "{{ billet_host_finalization_tasks | selectattr('name', 'equalto', 'Read the host-upgrade claim before finalization') | first }}"
        billet_finalize_readlink: "{{ billet_host_finalization_tasks | selectattr('name', 'equalto', 'Read the transaction pointer before finalization') | first }}"
        billet_finalize_close: "{{ billet_host_finalization_tasks | selectattr('name', 'equalto', 'Close the durable host-upgrade transaction after stable service startup') | first }}"
        billet_finalize_shape: "{{ billet_host_finalization_tasks | selectattr('name', 'equalto', 'Record that the guard holds no transaction after the close') | first }}"
        billet_recover_entry: "{{ billet_host_recovery_dispatch_tasks | selectattr('name', 'equalto', 'Refuse recovery without an owned transaction claim') | first }}"
        billet_recover_slurp: "{{ billet_host_recovery_dispatch_tasks | selectattr('name', 'equalto', 'Read the legacy claim before recovery') | first }}"
        billet_inspect_slurp: "{{ billet_host_inspection_tasks | selectattr('name', 'equalto', 'Read the durable host-upgrade pointer') | first }}"
        billet_inspect_grammar: "{{ billet_host_inspection_tasks | selectattr('name', 'equalto', 'Refuse an unsafe or malformed host-upgrade pointer') | first }}"
        billet_services_slurp: "{{ billet_host_service_tasks | selectattr('name', 'equalto', 'Read back the exclusive host-upgrade claim before live mutation') | first }}"
        # THE COMMANDS OF THE PROTOCOL: every command that speaks to the guard,
        # in the block and in its rescue.
        billet_guard_commands: >-
          {{ (billet_prepare_block + billet_protocol_block + billet_rescue_block)
             | selectattr('name', 'in', ['Ask the managed binary to report the claim', 'Ask the managed binary to prepare',
                                        'Ask the recorded executable to prepare', 'Ask the staged candidate to prepare',
                                        "Declare this converge's intent to the guard", 'Ask the managed binary again whether it predates the guard',
                                        'Settle the guard this converge acquired', 'Release the guard this converge acquired before it changed anything',
                                        'Ask what the remainder is'])
             | list }}
        # THE TASKS THE REWORK REMOVED, absent by name from every file of the preparation.
        billet_removed_task_names:
          - Classify the claim through the guard
          - "Ask the managed binary for the claim's status"
          - "Judge the claim's status"
          - Read the transaction pointer
          - "Classify this holder's guard"
          - Hold this host for the converge
          - Record the hold
          - Inspect the installed billet binary under the guard
          - Refuse a converge whose installed binary moved before the hold
          - Read the installed release under the guard
          - Refuse a converge whose installed release moved before the hold
          - Refuse a converge whose managed binary appeared or vanished before the staging
          - Refuse a same-holder rerun with a different intent
          - Read the installed and candidate releases
          - Refuse a converge that would downgrade this host
          - Ask the candidate whether it can take part in the exclusion
          - "Judge the candidate's capability"
          - Refuse a bootstrap over a root that holds something the role did not write
          - Inspect the upgrade root's entries
          - "Ask the recorded executable for the claim's status"
          - Report a Mac with no billet to hold
          - Record that a Mac with no billet holds nothing

    - name: The status module is gone from the collection
      ansible.builtin.stat:
        path: "{{ item }}"
      register: billet_status_module_files
      loop:
        - "{{ playbook_dir }}/../plugins/modules/guard_status.py"
        - "{{ playbook_dir }}/guard_status_check.py"

    - name: The preparation runs first, calls twice through one parser, settles last and cleans up in its rescue
      ansible.builtin.assert:
        that:
          - billet_main_names[0] == 'Refuse a converge that would destroy the job running it'
          - billet_main_names[1] == 'Prepare the exclusion before anything changes this host'
          - billet_host_main_tasks[1]['ansible.builtin.import_tasks'] == 'prepare-exclusion.yml'
          - billet_prepare_names[0] == 'Refuse a converge that would destroy the job running it'
          - billet_host_prepare_tasks[0]['ansible.builtin.import_tasks'] == 'converge-guard.yml'
          - billet_prepare_names.index('Refuse a converge without a holder') < billet_prepare_names.index('Inspect the managed binary and the upgrade root')
          # THE CLAIM'S FACTS are defined on every path before the block, and a dry run takes its shape from the report.
          - billet_prepare_names.index('Note what the managed binary and the root are') < billet_prepare_names.index("Start the claim's facts at none")
          - billet_prepare_names.index("Start the claim's facts at none") < billet_prepare_names.index('Prepare the exclusion')
          - billet_prepare_block_names.index('Report what a dry run found') < billet_prepare_block_names.index("Take the dry run's shape as this run's facts")
          - billet_prepare_block_names.index("Take the dry run's shape as this run's facts") < billet_prepare_block_names.index('Decide the binary change in a dry run')
          - "'ansible_check_mode' in ((billet_prepare_block | selectattr('name', 'equalto', \"Take the dry run's shape as this run's facts\") | first).when | string)"
          - "'ansible_check_mode or' in (billet_prepare_holder_refusal['ansible.builtin.assert'].that | join(' '))"
          # THE REMOVED TASKS ARE GONE, from every file of the preparation, and so is the status module.
          - >-
            (billet_host_prepare_tasks + billet_prepare_block + billet_protocol_block + billet_rescue_block
             + billet_host_stage_tasks + billet_stage_block + billet_stage_inner + billet_host_fallback_tasks + billet_host_answer_tasks)
            | map(attribute='name') | select('in', billet_removed_task_names) | list | length == 0
          - billet_status_module_files.results | selectattr('stat.exists') | list | length == 0
          - "'guard_status' not in billet_host_prepare_text"
          - "'guard_status' not in billet_host_fallback_text"
          - "'guard_status' not in billet_host_answer_text"
          # THE ROOT: stat'ed without following, created only under ENOENT on Linux, judged by five properties.
          - "'not billet_exclusion_root_stat.exists' in (billet_prepare_root_make.when | string)"
          - "'not billet_exclusion_darwin' in (billet_prepare_root_make.when | string)"
          - billet_prepare_root_make['ansible.builtin.file'].mode == '0700'
          - "'islnk' in (billet_prepare_root_guard['ansible.builtin.assert'].that | join(' '))"
          - "'isdir' in (billet_prepare_root_guard['ansible.builtin.assert'].that | join(' '))"
          - "'item.stat.uid | default(-1) == (billet_exclusion_owner_uid | int)' in (billet_prepare_root_guard['ansible.builtin.assert'].that | join(' '))"
          - "'wgrp' in (billet_prepare_root_guard['ansible.builtin.assert'].that | join(' '))"
          - "'woth' in (billet_prepare_root_guard['ansible.builtin.assert'].that | join(' '))"
          - billet_prepare_block_names.index('Refuse an upgrade root that is not what the role makes') < billet_prepare_block_names.index('Establish the upgrade root')
          - billet_prepare_block_names.index('Establish the upgrade root') < billet_prepare_block_names.index('Inspect the durable claim')
          # THE CHAIN ABOVE THE ROOT is judged before the claim is inspected, through the module's ancestors judgement.
          - billet_prepare_block_names.index('Judge the ancestors of the upgrade root') < billet_prepare_block_names.index('Inspect the durable claim')
          - billet_prepare_block_names.index('Refuse an upgrade root whose ancestors another account can rename') < billet_prepare_block_names.index("Establish the upgrade root's parent")
          - "'billet_exclusion_ancestors.judged' in ((billet_prepare_block | selectattr('name', 'equalto', 'Refuse an upgrade root whose ancestors another account can rename') | first)['ansible.builtin.assert'].that | join(' '))"
          - (billet_prepare_block | selectattr('name', 'equalto', 'Judge the ancestors of the upgrade root') | first)['junioryono.billet.guard_fallback'].judge == 'ancestors'
          - (billet_prepare_block | selectattr('name', 'equalto', "Establish the upgrade root's parent") | first)['ansible.builtin.file'].follow == false
          - billet_prepare_root_make['ansible.builtin.file'].follow == false
          # THE CLAIM: stat'ed without following, never trusted when the stat failed.
          - billet_prepare_claim_stat['ansible.builtin.stat'].follow == false
          - billet_prepare_claim_stat.failed_when == false
          - "'billet_exclusion_active.stat is defined' in (billet_host_prepare_tasks | to_json)"
          # THE DRY RUN FIRST: `prepare --dry-run` before the memory check and the shape dispatch, judged by its own parser, then the read-only staging, all of it before the protocol's block.
          - "'--dry-run' in (billet_prepare_dry_ask['ansible.builtin.command'].argv | string)"
          - "'ansible_check_mode' in (billet_prepare_dry_ask.when | string)"
          - billet_prepare_dry_ask.no_log is not defined
          - billet_prepare_block_names.index('Inspect the durable claim') < billet_prepare_block_names.index('Ask the managed binary to report the claim')
          - billet_prepare_block_names.index('Ask the managed binary to report the claim') < billet_prepare_block_names.index("Judge the dry run's answer")
          - billet_prepare_block_names.index("Judge the dry run's answer") < billet_prepare_block_names.index('Report what a dry run found')
          - billet_prepare_block_names.index('Report what a dry run found') < billet_prepare_block_names.index('Decide the binary change in a dry run')
          - billet_prepare_block_names.index('Decide the binary change in a dry run') < billet_prepare_block_names.index('Refuse a converge whose exclusion moved')
          - billet_prepare_dry_stage['ansible.builtin.import_tasks'] == 'stage-candidate.yml'
          - billet_prepare_dry_stage.when == 'ansible_check_mode'
          - "'ansible_check_mode' in (billet_prepare_dry_judge.when | string)"
          - "'billet_exclusion_dry_wrong' in (billet_prepare_dry_judge['ansible.builtin.assert'].that | join(' '))"
          # THE ROLE'S OWN MEMORY precedes the shape dispatch, and the legacy file is the role's stat's to classify, outside check mode.
          - "'billet_exclusion_held' in (billet_prepare_moved.when | string)"
          - "'not ansible_check_mode' in (billet_prepare_moved.when | string)"
          - billet_prepare_block_names.index('Refuse a converge whose exclusion moved') < billet_prepare_block_names.index('Refuse to converge over a host upgrade billet itself is running')
          - billet_prepare_block_names.index('Refuse to converge over a host upgrade billet itself is running') < billet_prepare_block_names.index('Refuse a claim of a type the role does not know')
          - billet_prepare_block_names.index('Refuse a claim of a type the role does not know') < billet_prepare_block_names.index('Classify a legacy pointer')
          - billet_prepare_block_names.index('Classify a legacy pointer') < billet_prepare_block_names.index('Prepare through the guard')
          - "'isreg' in (billet_prepare_legacy.when | string)"
          - "'not ansible_check_mode' in (billet_prepare_legacy.when | string)"
          - billet_prepare_legacy['ansible.builtin.set_fact'].billet_upgrade_claim_shape == 'legacy-file'
          - "\"!= 'legacy-file'\" in (billet_prepare_protocol.when | string)"
          - "'not ansible_check_mode' in (billet_prepare_protocol.when | string)"
          - billet_prepare_block_names | last == 'Prepare through the guard'
          # THE TWO CALLS, in order, through the one parser, and the staging between them.
          - "'--validate' in (billet_prepare_first_managed['ansible.builtin.command'].argv | string)"
          - "'--expect-id' in (billet_prepare_first_managed['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_binary_present' in (billet_prepare_first_managed.when | string)"
          - "'--validate' in (billet_prepare_first_fallback['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_fallback_executable' in (billet_prepare_first_fallback['ansible.builtin.command'].argv | string)"
          - "\"== 'fallback'\" in (billet_prepare_first_fallback.when | string)"
          - "'--validate' in (billet_prepare_first_candidate['ansible.builtin.command'].argv | string)"
          - "'--candidate' in (billet_prepare_first_candidate['ansible.builtin.command'].argv | string)"
          - "\"'--expect-bootstrap'] if billet_exclusion_route == 'unheld'\" in (billet_prepare_first_candidate['ansible.builtin.command'].argv | string)"
          - "\"in ['pre-r', 'unheld']\" in (billet_prepare_first_candidate.when | string)"
          - "'billet_binary_upgrade' in (billet_prepare_first_candidate.when | string)"
          - "'--recovery' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'--no-change' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'--candidate' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'--allow-downgrade' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'billet_allow_downgrade' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'--validate' not in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_executable' in (billet_prepare_second['ansible.builtin.command'].argv | string)"
          - "\"in ['managed', 'fallback', 'candidate']\" in (billet_prepare_second.when | string)"
          - billet_protocol_names[0] == "Reset this invocation's route"
          - billet_protocol_names.index('Ask the managed binary to prepare') < billet_protocol_names.index("Judge the managed binary's first answer")
          - billet_protocol_names.index("Judge the managed binary's first answer") < billet_protocol_names.index("Note the route the managed binary's answer chose")
          - billet_protocol_names.index("Note the route the managed binary's answer chose") < billet_protocol_names.index('Read the guard\'s record for the executable that can answer')
          - billet_protocol_names.index('Read the guard\'s record for the executable that can answer') < billet_protocol_names.index('Ask the recorded executable to prepare')
          - billet_protocol_names.index('Ask the recorded executable to prepare') < billet_protocol_names.index("Judge the recorded executable's first answer")
          - billet_protocol_names.index("Judge the recorded executable's first answer") < billet_protocol_names.index('Refuse a recorded executable that predates the guard')
          - billet_protocol_names.index('Refuse a recorded executable that predates the guard') < billet_protocol_names.index('Decide the binary change and stage its candidate')
          - billet_protocol_names.index('Decide the binary change and stage its candidate') < billet_protocol_names.index('Ask the staged candidate to prepare')
          - billet_protocol_names.index('Ask the staged candidate to prepare') < billet_protocol_names.index("Judge the staged candidate's first answer")
          - billet_protocol_names.index("Judge the staged candidate's first answer") < billet_protocol_names.index('Refuse a staged candidate that predates the guard')
          - billet_protocol_names.index('Refuse a staged candidate that predates the guard') < billet_protocol_names.index('Note that the candidate answers for this run')
          - billet_protocol_names.index('Note that the candidate answers for this run') < billet_protocol_names.index("Declare this converge's intent to the guard")
          - billet_protocol_names.index("Declare this converge's intent to the guard") < billet_protocol_names.index('Judge the second answer')
          - billet_protocol_names.index('Judge the second answer') < billet_protocol_names.index('Ask the managed binary again whether it predates the guard')
          - billet_protocol_names.index('Ask the managed binary again whether it predates the guard') < billet_protocol_names.index('Refuse a converge whose managed binary moved')
          - billet_protocol_names.index('Refuse a converge whose managed binary moved') < billet_protocol_names.index('Inspect the managed binary and the claim again before an unheld converge')
          - billet_protocol_names.index('Inspect the managed binary and the claim again before an unheld converge') < billet_protocol_names.index('Refuse a converge whose managed binary appeared')
          - billet_protocol_names.index('Refuse a converge whose managed binary appeared') < billet_protocol_names.index('Refuse an unheld converge over a claim that appeared')
          - billet_protocol_names.index('Refuse an unheld converge over a claim that appeared') < billet_protocol_names.index('Record that a release before the guard runs the legacy protocol')
          - billet_protocol_names.index('Record that a release before the guard runs the legacy protocol') < billet_protocol_names.index('Refuse a converge whose exclusion was never established')
          - billet_protocol_names.index('Refuse a converge whose exclusion was never established') < billet_protocol_names.index('Report the exclusion')
          - billet_protocol_names.index('Report the exclusion') < billet_protocol_names.index('Settle the guard this converge acquired')
          - billet_protocol_names.index('Settle the guard this converge acquired') < billet_protocol_names.index('Close the preparation window')
          - billet_protocol_names | last == 'Close the preparation window'
          - billet_prepare_stage_import['ansible.builtin.import_tasks'] == 'stage-candidate.yml'
          # EVERY JUDGEMENT IS THE ONE PARSER, told which call it judges.
          - (billet_protocol_block | selectattr('name', 'equalto', "Judge the managed binary's first answer") | first)['ansible.builtin.include_tasks'] == 'guard-answer.yml'
          - (billet_protocol_block | selectattr('name', 'equalto', "Judge the managed binary's first answer") | first).vars.billet_exclusion_call == 'first'
          - (billet_protocol_block | selectattr('name', 'equalto', "Judge the recorded executable's first answer") | first)['ansible.builtin.include_tasks'] == 'guard-answer.yml'
          - (billet_protocol_block | selectattr('name', 'equalto', "Judge the staged candidate's first answer") | first)['ansible.builtin.include_tasks'] == 'guard-answer.yml'
          - (billet_protocol_block | selectattr('name', 'equalto', 'Judge the second answer') | first)['ansible.builtin.include_tasks'] == 'guard-answer.yml'
          - (billet_protocol_block | selectattr('name', 'equalto', 'Judge the second answer') | first).vars.billet_exclusion_call == 'second'
          - billet_protocol_block | select('contains', 'ansible.builtin.include_tasks') | list | length == 4
          # THE UNHELD PATHS RE-EXAMINE what they rested on, at their end.
          - "'holder' in (billet_prepare_legacy_reask['ansible.builtin.command'].argv | string)"
          - "\"== 'pre-r'\" in (billet_prepare_legacy_reask.when | string)"
          - "\"in ['pre-r', 'unheld']\" in (billet_prepare_unheld_restat.when | string)"
          - billet_prepare_unheld_restat['ansible.builtin.stat'].follow == false
          - "'billet_exclusion_unheld_recheck.results[0].stat is defined' in ((billet_protocol_block | selectattr('name', 'equalto', 'Refuse a converge whose managed binary appeared') | first)['ansible.builtin.assert'].that | join(' '))"
          - "'billet_exclusion_unheld_recheck.results[1].stat is defined' in ((billet_protocol_block | selectattr('name', 'equalto', 'Refuse an unheld converge over a claim that appeared') | first)['ansible.builtin.assert'].that | join(' '))"
          - "'unknown (converge-guard )?command' in ((billet_protocol_block | selectattr('name', 'equalto', 'Refuse a converge whose managed binary moved') | first)['ansible.builtin.assert'].that | join(' '))"
          # THE SETTLEMENT is last, exactly when this inclusion acquired, and the token is cleared after it.
          - "'settle' in (billet_prepare_settle['ansible.builtin.command'].argv | string)"
          - "'--token' in (billet_prepare_settle['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_cleanup_token' in (billet_prepare_settle['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_acquired' in (billet_prepare_settle.when | string)"
          - (billet_protocol_block | selectattr('name', 'equalto', 'Close the preparation window') | first)['ansible.builtin.set_fact'].billet_exclusion_cleanup_token == ''
          # THE CLOSING PREDICATE WHOLE, whitespace folded: a weaker branch
          # that still names the held flag and check mode is not this one.
          - >-
            ((billet_protocol_block | selectattr('name', 'equalto', 'Refuse a converge whose exclusion was never established') | first)['ansible.builtin.assert'].that
             | join(' ') | regex_replace('\\s+', ' ') | trim)
            == "ansible_check_mode or (billet_exclusion_held | default(false) | bool) or (billet_upgrade_claim_shape | default('none') in ['legacy-file', 'legacy']) or (not (billet_exclusion_binary_present | bool) and not (billet_binary_upgrade | default(false) | bool) and billet_upgrade_claim_shape | default('none') == 'none')"
          - "'release --holder' in billet_prepare_report['ansible.builtin.debug'].msg"
          - "'recover --holder' in billet_prepare_report['ansible.builtin.debug'].msg"
          - "'--old-driver-stopped' in billet_prepare_report['ansible.builtin.debug'].msg"
          # THE RESCUE: the cleanup release with the token, never past a pointer, then the remainder examined and the original refusal re-raised, last and unconditionally.
          - billet_rescue_names[0] == 'Release the guard this converge acquired before it changed anything'
          - "'--cleanup' in (billet_prepare_cleanup['ansible.builtin.command'].argv | string)"
          - "'--token' in (billet_prepare_cleanup['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_cleanup_token' in (billet_prepare_cleanup['ansible.builtin.command'].argv | string)"
          - "'billet_exclusion_cleanup_token' in (billet_prepare_cleanup.when | string)"
          - "'not (billet_interrupted_upgrade' in (billet_prepare_cleanup.when | string)"
          - billet_prepare_cleanup.failed_when == false
          - billet_rescue_names.index('Release the guard this converge acquired before it changed anything') < billet_rescue_names.index('Examine what remains after the cleanup')
          - billet_rescue_names.index('Examine what remains after the cleanup') < billet_rescue_names.index('Ask what the remainder is')
          - billet_rescue_names.index('Ask what the remainder is') < billet_rescue_names.index("Read the remainder's answer")
          - billet_rescue_names.index("Read the remainder's answer") < billet_rescue_names.index('Record what the cleanup did')
          # THE REMAINDER'S ANSWER cannot end the rescue: read under ignore_errors, in a task of its own.
          - (billet_rescue_block | selectattr('name', 'equalto', "Read the remainder's answer") | first).ignore_errors == true
          - billet_rescue_names.index('Record what the cleanup did') < billet_rescue_names.index('Close the preparation window after the cleanup')
          - billet_rescue_names | last == 'Fail with the refusal that ended the preparation'
          - (billet_rescue_block | last).when is not defined
          - "'status' in (billet_prepare_remainder_ask['ansible.builtin.command'].argv | string)"
          - (billet_rescue_block | selectattr('name', 'equalto', 'Examine what remains after the cleanup') | first)['ansible.builtin.stat'].follow == false
          - "'durability is not proved' in ((billet_rescue_block | last)['ansible.builtin.fail'].msg)"
          - "'recover --unpublished' in ((billet_rescue_block | last)['ansible.builtin.fail'].msg)"
          # THE LEGACY PROTOCOL only when no capable executable exists.
          - "'billet_exclusion_managed_pre_r' in ((billet_protocol_block | selectattr('name', 'equalto', 'Record that a release before the guard runs the legacy protocol') | first).when | string)"
          - "'not (billet_binary_upgrade' in ((billet_protocol_block | selectattr('name', 'equalto', 'Record that a release before the guard runs the legacy protocol') | first).when | string)"
          # THE CHANNEL'S GET RUNS IN A DRY RUN, or the task after it reads a
          # statement that was never fetched.
          - ((billet_host_binary_tasks | selectattr('name', 'equalto', 'Resolve the release channel') | first).block | selectattr('name', 'equalto', 'Read the signed channel statement') | first).check_mode == false
        fail_msg: >-
          prepare-exclusion.yml must run the guard first, refuse an absent holder
          before any stat, establish the root only under ENOENT, run the dry run's
          report before the memory check and the shape dispatch, classify a
          legacy file by its own stat, make the two calls in order through the one
          parser with the staging between them, re-examine the unheld paths at
          their end, settle last, and clean up only in its rescue.

    # THE PARSER: one file, every member judged by name, the token kept in a
    # fact no report prints, the facts taken from the answer alone.
    - name: The answer's parser judges every member and prints no token
      ansible.builtin.assert:
        that:
          - billet_answer_names[0] == 'Note whether the executable answered "unknown command"'
          - billet_answer_names[1] == 'Note whether the executable predates the guard'
          # PRE-R IS THE FIRST CALL'S OBSERVATION ALONE; "unknown command" on the second call refuses.
          - "\"billet_exclusion_call == 'first'\" in ((billet_host_answer_tasks | selectattr('name', 'equalto', 'Note whether the executable predates the guard') | first)['ansible.builtin.set_fact'].billet_exclusion_pre_r | string)"
          - "'not (billet_exclusion_unknown_command | bool)' in ((billet_host_answer_tasks | selectattr('name', 'equalto', 'Refuse a preparation that did not answer') | first)['ansible.builtin.assert'].that | join(' '))"
          - billet_answer_names.index('Refuse a preparation that did not answer') < billet_answer_names.index("Read the preparation's answer")
          - billet_answer_names.index("Read the preparation's answer") < billet_answer_names.index("Judge the preparation's answer")
          - billet_answer_names.index("Judge the preparation's answer") < billet_answer_names.index("Refuse the preparation's answer")
          - billet_answer_names.index("Refuse the preparation's answer") < billet_answer_names.index("Take the preparation's answer as this run's facts")
          - billet_answer_names.index("Take the preparation's answer as this run's facts") < billet_answer_names.index("Report the preparation's answer")
          - billet_answer_judge.vars.billet_exclusion_checks | map(attribute='name') | list == ['outcome', 'exit', 'reason', 'why', 'id', 'holder', 'preparing', 'token', 'record', 'pointer', 'pointer_target', 'managed', 'downgrade']
          - "'item.ok | bool' in (billet_answer_judge['ansible.builtin.assert'].that | join(' '))"
          - "'(billet_exclusion_raw.rc | default(1)) == 0' in ((billet_answer_judge.vars.billet_exclusion_checks | selectattr('name', 'equalto', 'exit') | first).ok | string)"
          - "'recovery-[0-9]{8}T[0-9]{6}-[0-9a-f]{8}|[0-9]{8}T[0-9]{15}' in billet_host_answer_text"
          - "'billet_exclusion_id' in billet_answer_facts['ansible.builtin.set_fact']"
          - "'billet_exclusion_cleanup_token' in billet_answer_facts['ansible.builtin.set_fact']"
          - "'billet_exclusion_held' in billet_answer_facts['ansible.builtin.set_fact']"
          - "'billet_interrupted_upgrade' in billet_answer_facts['ansible.builtin.set_fact']"
          - "'billet_upgrade_claim_shape' in billet_answer_facts['ansible.builtin.set_fact']"
          - "\"== 'acquired'\" in (billet_answer_facts['ansible.builtin.set_fact'].billet_exclusion_cleanup_token | string)"
          - billet_answer_facts.no_log == true
          - (billet_host_answer_tasks | selectattr('name', 'equalto', "Read the preparation's answer") | first).no_log == true
          - "'token' not in billet_answer_report['ansible.builtin.debug'].msg"
          - "'unknown (converge-guard )?command' in billet_host_answer_text"
        fail_msg: >-
          guard-answer.yml must refuse an answer that did not arrive, judge every
          member of one by name, refuse a refusal in the command's words, take the
          facts from the answer alone with the token kept unprinted, and report
          without it.

    # THE COMMANDS OF THE PROTOCOL: each bounded by platform (`timeout -k 10`
    # on Linux, the task's async bound and no escalation on a Mac; the
    # candidate's first call is Linux's alone), and the calls that carry or
    # could carry the token under no_log.
    - name: Every command of the protocol is bounded by platform
      ansible.builtin.assert:
        that:
          - billet_guard_commands | length == 9
          - "'converge-guard' in (item['ansible.builtin.command'].argv | string)"
          - "'timeout' in (item['ansible.builtin.command'].argv | string)"
          - "item.name == 'Ask the staged candidate to prepare' or 'billet_exclusion_darwin' in (item['ansible.builtin.command'].argv | string)"
          - "item.name == 'Ask the staged candidate to prepare' or 'billet_exclusion_darwin' in (item['async'] | string)"
          - "item.name == 'Ask the staged candidate to prepare' or item.poll is defined"
          - "item.name == 'Ask the staged candidate to prepare' or 'billet_exclusion_become' in (item.become | string)"
          - item.check_mode == false
        fail_msg: >-
          The preparation's command "{{ item.name }}" must run under `timeout -k 10`
          on Linux and the task's async bound on a Mac, escalated by platform, and
          never in check mode's simulation.
      loop: "{{ billet_guard_commands }}"
      loop_control:
        label: "{{ item.name }}"

    - name: The calls that speak the token run under no_log
      ansible.builtin.assert:
        that:
          - item.no_log == true
        fail_msg: >-
          "{{ item.name }}" carries or can carry the acquiring invocation's token
          and must run under no_log.
      loop: >-
        {{ billet_guard_commands
           | selectattr('name', 'in', ['Ask the managed binary to prepare', 'Ask the recorded executable to prepare',
                                      'Ask the staged candidate to prepare', "Declare this converge's intent to the guard",
                                      'Settle the guard this converge acquired',
                                      'Release the guard this converge acquired before it changed anything']) | list }}
      loop_control:
        label: "{{ item.name }}"

    - name: The four calls, the settlement and the cleanup are all present
      ansible.builtin.assert:
        that:
          - billet_guard_commands | map(attribute='name') | select('in', ['Ask the managed binary to prepare', 'Ask the recorded executable to prepare', 'Ask the staged candidate to prepare', "Declare this converge's intent to the guard", 'Settle the guard this converge acquired', 'Release the guard this converge acquired before it changed anything']) | list | length == 6
        fail_msg: the protocol's six commands must all exist under their names.

    - name: Every stat of the preparation follows nothing and reads no content
      ansible.builtin.assert:
        that:
          - item['ansible.builtin.stat'].follow == false
          - item['ansible.builtin.stat'].get_checksum == false
          - item['ansible.builtin.stat'].get_mime == false
        fail_msg: >-
          The preparation's stat "{{ item.name }}" must carry follow false,
          get_checksum false and get_mime false: it judges a path's type and
          metadata before anything reads its content.
      # select('contains', ...) rather than selectattr, whose dotted attribute
      # would look for tasks['ansible']['builtin']['stat'].
      loop: >-
        {{ (billet_host_prepare_tasks + billet_prepare_block + billet_protocol_block + billet_rescue_block + billet_host_fallback_tasks)
           | select('contains', 'ansible.builtin.stat') | list }}
      loop_control:
        label: "{{ item.name }}"

    - name: The fallback reader judges the record before the candidate, admits the protocol's members and runs nothing
      ansible.builtin.assert:
        that:
          - "'junioryono.billet.guard_fallback' in billet_fallback_read"
          - billet_fallback_read.failed_when == false
          - "\"not in ['metadata', 'content']\" in (billet_fallback_judge_record['ansible.builtin.assert'].that | join(' '))"
          - billet_fallback_names.index('Refuse an unpublished guard no executable can recover') < billet_fallback_names.index('Read the guard\'s record')
          - billet_fallback_names.index('Read the guard\'s record') < billet_fallback_names.index('Judge the guard\'s record')
          - billet_fallback_names.index('Judge the guard\'s record') < billet_fallback_names.index('Judge the recorded executable')
          - billet_fallback_names.index('Judge the recorded executable') < billet_fallback_names.index('Note the recorded executable')
          - billet_fallback_names | last == 'Report the fallback'
          - "'ansible.builtin.command' not in billet_host_fallback_text"
          - "'ansible.builtin.shell' not in billet_host_fallback_text"
          # THE RECORD'S SCHEMA: the five members required, the protocol's three admitted and typed.
          - "'OPTIONAL_MEMBERS = {\"id\": \"hex32\", \"token\": \"hex32\", \"preparing\": \"bool\"}' in billet_fallback_module_text"
          - "'RECORD_MEMBERS = (\"holder\", \"claimed_at\", \"hostname\", \"release_executable\", \"release_executable_sha256\")' in billet_fallback_module_text"
        fail_msg: >-
          guard-fallback.yml must read the record through the module with its
          failure kept as an answer, judge the metadata and content phases before
          the candidate's, admit the protocol's three members typed, name the
          executable for the calls, and execute nothing itself.

    - name: The staging resets only the transaction facts and judges nothing about the guard
      ansible.builtin.assert:
        that:
          - "'billet_binary_upgrade' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_candidate_on_target' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_candidate_path' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_candidate_selected' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_candidate_binary' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_candidate_source' in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_upgrade_recovery_dir' not in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_interrupted_upgrade' not in billet_stage_reset['ansible.builtin.set_fact']"
          - "'billet_upgrade_claim_shape' not in billet_stage_reset['ansible.builtin.set_fact']"
          # A MAC STAGES NOTHING: the resolution block and the installed-binary stat are Linux's.
          - "'billet_exclusion_darwin' in ((billet_host_stage_tasks | selectattr('name', 'equalto', \"Resolve and stage this invocation's candidate\") | first).when | string)"
          - "'billet_exclusion_darwin' in ((billet_host_stage_tasks | selectattr('name', 'equalto', 'Inspect the installed billet binary') | first).when | string)"
          - billet_stage_names.index('Inspect the installed billet binary') < billet_stage_names.index("Resolve and stage this invocation's candidate")
          # THE REFUSALS OF AN EXTERNAL LEDGER before any allocation; the guard's judgements are the command's.
          - billet_stage_block_names.index('Decide whether the billet binary needs a transactional upgrade') < billet_stage_block_names.index('Refuse a transactional binary change against an external ledger')
          - billet_stage_block_names.index('Refuse a transactional binary change against an external ledger') < billet_stage_block_names.index('Refuse a PostgreSQL controller whose binary predates the guard')
          - billet_stage_block_names.index('Refuse a PostgreSQL controller whose binary predates the guard') < billet_stage_block_names.index('Stage the candidate for the transaction')
          - billet_stage_block_names | last == 'Stage the candidate for the transaction'
          - billet_stage_inner_names == ["Allocate the transaction's recovery directory", 'Stage the immutable candidate binary inside its recovery journal', 'Inspect the journaled candidate billet binary', 'Bind the host transaction to the inspected candidate digest']
          - "'guard_status' not in (billet_host_stage_tasks | to_json)"
          - "'converge-guard' not in (billet_host_stage_tasks | to_json)"
          - "'billet_upgrade_recovery_dir' in billet_candidate_stage['ansible.builtin.copy'].dest"
          - (billet_stage_inner | selectattr('name', 'equalto', "Allocate the transaction's recovery directory") | first)['ansible.builtin.import_tasks'] == 'allocate-recovery.yml'
          - "'not ansible_check_mode' in ((billet_stage_block | selectattr('name', 'equalto', 'Stage the candidate for the transaction') | first).when | string)"
          # THE PREVIOUS BINARY is copied inside the transaction, after the hold, under exactly four conditions.
          - billet_previous_binary_copy.when | length == 4
          - "'billet_binary_upgrade | default(false)' in billet_previous_binary_copy.when"
          - "'not billet_interrupted_upgrade | bool' in billet_previous_binary_copy.when"
          - "'not ansible_check_mode' in billet_previous_binary_copy.when"
          - "'billet_installed_binary.stat.exists' in billet_previous_binary_copy.when"
          - billet_previous_binary_copy['ansible.builtin.copy'].dest.endswith('billet.previous')
        fail_msg: >-
          stage-candidate.yml must reset the transaction facts and never the
          classification's, refuse the external ledger and the pre-R controller
          before any allocation, stage the candidate into the exclusively
          allocated journal and bind its digest, and judge nothing about the guard
          (the intent, the floor and the downgrade are the command's).

    - name: The allocator is one exclusive mkdir inside a bounded retry
      vars:
        billet_allocate_argv: "{{ billet_allocate_task['ansible.builtin.command'].argv }}"
      ansible.builtin.assert:
        that:
          - billet_allocate_argv | length == 6
          - billet_allocate_argv[0] == '/bin/sh'
          - billet_allocate_argv[1] == '-c'
          - billet_allocate_argv[3] == 'billet-recovery'
          - "'billet_exclusion_root' in billet_allocate_argv[4]"
          - "'billet_recovery_dir_suffix_command' in billet_allocate_argv[5]"
          - "'sh -c \"$2\"' in billet_allocate_argv[2]"
          - "'mkdir -m 0700 \"$d\"' in billet_allocate_argv[2]"
          - "'[ -e \"$d\" ] || [ -L \"$d\" ]' in billet_allocate_argv[2]"
          - "'-lt 5' in billet_allocate_argv[2]"
          - "'[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]' in billet_allocate_argv[2]"
          - "'the suffix generator exited non-zero' in billet_allocate_argv[2]"
          - "'the stamp could not be drawn' in billet_allocate_argv[2]"
          - "'mkdir -p' not in billet_allocate_argv[2]"
          - "'state: directory' not in (billet_host_allocate_tasks | to_json)"
        fail_msg: >-
          allocate-recovery.yml must be one `mkdir -m 0700` without -p inside a
          five-attempt loop that draws its suffix from `sh -c "$2"` on every
          attempt, validates the stamp once and the suffix each time, and reads a
          collision only from the name's presence afterwards.

    - name: The transaction claims by shape outside its block and every reader of the claim is gated by the legacy shapes
      ansible.builtin.assert:
        that:
          - "\"in ['guard', 'legacy']\" in (billet_claim_outside['ansible.builtin.assert'].that | join(' '))"
          - billet_top_level_names.index('Refuse a transaction outside the exclusion') < billet_top_level_names.index("Stage this transaction's atomic host-upgrade claim")
          - "\"== 'legacy'\" in (billet_claim_legacy.when | string)"
          - "\"== 'guard'\" in (billet_claim_guard.when | string)"
          - billet_claim_guard['ansible.builtin.command'].argv[0] == 'ln'
          - billet_claim_guard['ansible.builtin.command'].argv[1] == '-sT'
          - "'/active/recovery' in billet_claim_guard['ansible.builtin.command'].argv[3]"
          - billet_top_level_names.index('Claim the host upgrade inside the converge guard') < billet_top_level_names.index('Durably publish the transaction pointer inside the guard')
          - "'/active' in (billet_claim_guard_flush.loop | string)"
          - billet_top_level_names.index('Durably publish the transaction pointer inside the guard') < billet_top_level_names.index('Read back the transaction pointer before live mutation')
          - "'readlink' in billet_claim_guard_read['ansible.builtin.command'].argv"
          - billet_top_level_names.index('Read back the transaction pointer before live mutation') < billet_top_level_names.index('Prove this transaction owns the host before live mutation')
          - billet_top_level_names.index('Prove this transaction owns the host before live mutation') < billet_top_level_names.index('Record that the transaction is claimed inside the guard')
          - billet_top_level_names.index('Record that the transaction is claimed inside the guard') < billet_top_level_names.index('Upgrade billet as one recoverable host transaction')
          - billet_claim_record['ansible.builtin.set_fact'].billet_upgrade_claim_shape == 'guard-pointer'
          - "'billet_published_upgrade_pointer.stdout | trim == billet_upgrade_recovery_dir' in (billet_claim_prove['ansible.builtin.assert'].that | join(' '))"
          # EVERY slurp OF active IS GATED BY A LEGACY SHAPE, and there are exactly four.
          - "\"== 'legacy'\" in (billet_services_slurp.when | string)"
          - "\"== 'legacy-file'\" in (billet_inspect_slurp.when | string)"
          - "\"in ['legacy', 'legacy-file']\" in (billet_finalize_slurp.when | string)"
          - "\"in ['legacy', 'legacy-file']\" in (billet_recover_slurp.when | string)"
          - >-
            ((billet_host_service_tasks + billet_host_inspection_tasks + billet_host_finalization_tasks
              + billet_host_recovery_dispatch_tasks + billet_host_account_tasks + billet_host_prepare_tasks
              + billet_prepare_block + billet_protocol_block + billet_rescue_block + billet_host_fallback_tasks
              + billet_host_stage_tasks + billet_stage_block + billet_stage_inner) | to_json)
            | regex_findall('"src": "\{\{ billet_exclusion_root \}\}/active"') | length == 4
          - "'/var/lib/billet/upgrades/active' not in billet_host_services_text"
          - "'/var/lib/billet/upgrades/active' not in billet_host_inspection_text"
          - "'/var/lib/billet/upgrades/active' not in billet_host_finalization_text"
          - "'/var/lib/billet/upgrades/active' not in billet_host_recovery_dispatch_text"
          # THE INSPECTION reads both grammars and derives nothing from active's existence.
          - "'recovery-[0-9]{8}T[0-9]{6}-[0-9a-f]{8}|[0-9]{8}T[0-9]{15}' in (billet_inspect_grammar['ansible.builtin.assert'].that | join(' '))"
          - "'billet_active_upgrade_pointer' not in billet_host_inspection_text"
          # RECOVERY'S ENTRY is the owned claim, before the ledger volume is examined or anything is stopped.
          - billet_recovery_dispatch_names.index('Refuse recovery without an owned transaction claim') < billet_recovery_dispatch_names.index("Resolve the ledger volume's stable device path for recovery")
          - billet_recovery_dispatch_names.index('Refuse recovery without an owned transaction claim') < billet_recovery_dispatch_names.index('Inspect whether the durable host transaction already committed')
          - "'nothing to recover' in billet_recover_entry['ansible.builtin.assert'].fail_msg"
          - "\"in ['guard-pointer', 'legacy', 'legacy-file']\" in (billet_recover_entry['ansible.builtin.assert'].that | join(' '))"
          # FINALIZATION proves ownership by shape before the fence opens, removes the pointer alone and sets the shape back.
          - billet_finalization_names.index('Refuse finalization without a real owned host-upgrade claim') < billet_finalization_names.index('Prove this transaction still owns the host before finalization')
          - billet_finalization_names.index('Prove this transaction still owns the host before finalization') < billet_finalization_names.index('Open the committed ledger to operator commands')
          - "\"== 'guard-pointer'\" in (billet_finalize_readlink.when | string)"
          - "'readlink' in billet_finalize_readlink['ansible.builtin.command'].argv"
          - "\"in ['guard-pointer', 'legacy', 'legacy-file']\" in (billet_finalize_guard['ansible.builtin.assert'].that | join(' '))"
          - "'/active/recovery' in (billet_finalize_close['ansible.builtin.file'].path | string)"
          - "\"== 'guard-pointer'\" in (billet_finalize_close['ansible.builtin.file'].path | string)"
          - billet_finalization_names[-1] == 'Record that the guard holds no transaction after the close'
          - billet_finalize_shape['ansible.builtin.set_fact'].billet_upgrade_claim_shape == 'guard'
          # THE INTERRUPTION FLAG SURVIVES THE CLOSE: main.yml requires a fresh converge on it.
          - "'billet_interrupted_upgrade' not in billet_finalize_shape['ansible.builtin.set_fact']"
          - "'billet_interrupted_upgrade' not in (billet_host_finalization_text | regex_findall('billet_interrupted_upgrade:'))"
          - "\"== 'guard-pointer'\" in (billet_finalize_shape.when | string)"
        fail_msg: >-
          The transaction under the guard must claim by `ln -sT` of the pointer
          inside the guard, outside the rescue's block, prove it by readlink,
          record the guard-pointer shape, read the claim's content only under a
          legacy shape, enter recovery only over an owned claim, and finalize by
          proving ownership by shape, removing the pointer alone and setting the
          shape back to guard.

