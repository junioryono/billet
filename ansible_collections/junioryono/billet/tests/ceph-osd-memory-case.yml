---
- name: Write this cluster's dump and an empty call log
  ansible.builtin.copy:
    dest: "{{ billet_gate_tree.path }}/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - {name: dump.json, content: "{{ billet_gate_case.dump | to_json }}"}
    - {name: calls.log, content: ""}
  loop_control:
    label: "{{ item.name }}"

- name: Converge the cluster's OSD memory
  ansible.builtin.include_role:
    name: junioryono.billet.host
    tasks_from: ceph-osd-memory
    # AN INCLUDE'S OWN KEYWORDS STOP AT THE INCLUDE: only `apply` reaches the
    # tasks it runs, which is where the fake ceph must be first on PATH.
    apply:
      environment:
        PATH: "{{ billet_gate_tree.path }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        BILLET_GATE_CEPH_LOG: "{{ billet_gate_tree.path }}/calls.log"
        BILLET_GATE_CEPH_DUMP: "{{ billet_gate_tree.path }}/dump.json"
  vars:
    billet_ceph_osd_memory_target_gib: "{{ billet_gate_case.target_gib }}"

- name: Read what the role asked of ceph
  ansible.builtin.slurp:
    src: "{{ billet_gate_tree.path }}/calls.log"
  register: billet_gate_calls

- name: The role made exactly this cluster's calls, in order
  ansible.builtin.assert:
    that: (billet_gate_calls.content | b64decode).splitlines() == billet_gate_case.calls
    fail_msg: >-
      {{ billet_gate_case.name }}: the role called ceph with
      {{ (billet_gate_calls.content | b64decode).splitlines() }}, not {{ billet_gate_case.calls }}.
