---
- name: Effective configuration preserves ordinary input and projects only admitted retained input
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_node:
      name: reference-node
      provider: docker
      state_dir: /var/lib/billet/reference-node
      server: {github: nested-value, targets: [one, two], backup: null}
    billet_gate_survivors:
      node: "{{ billet_gate_node }}"
      sites: [{name: reference-site, backup: {server: unchanged}}]
      release: {automatic: false}
      extension: {number: 7, empty: '', text: "first\nsecond\n", unicode: 'café', list: [false, null, 0]}
    billet_gate_controller:
      server: {identity_dir: /var/lib/billet/reference-identity, state: {backend: postgres}}
      github: {private_key_path: /etc/billet/reference-key.pem}
      targets: [{name: reference-target, private_key_path: /etc/billet/reference-target.pem}]
      backup: {s3: {bucket: reference-backup}}
  tasks:
    - name: Exercise ordinary and retained configuration routes
      ansible.builtin.include_tasks: effective-inputs-case.yml
      vars:
        billet_config: "{{ billet_gate_survivors | combine(billet_gate_controller if billet_gate_case.controller else {}) }}"
      loop:
        - {name: node-only, retained: false, controller: false, route: ordinary}
        - {name: controller-and-node, retained: false, controller: true, route: ordinary}
        - {name: confirmed-cancellation, retained: false, controller: true, route: cancel}
        - {name: retained-projection, retained: true, controller: true, route: continue}
      loop_control:
        loop_var: billet_gate_case
        label: "{{ billet_gate_case.name }}"

- name: Operative readers use effective input when inventory disagrees
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_role: "{{ playbook_dir }}/../roles/host"
    billet_gate_main: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/main.yml') | from_yaml }}"
    billet_gate_ordinary: "{{ billet_gate_main[-1].block }}"
    billet_gate_account: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/account.yml') | from_yaml }}"
    billet_gate_inspect: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/upgrade-inspect.yml') | from_yaml }}"
    billet_gate_cache: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/cache-tls.yml') | from_yaml }}"
    billet_gate_network: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/network-disable.yml') | from_yaml }}"
    billet_gate_receipt: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/endpoint-receipt.yml') | from_yaml }}"
    billet_gate_defaults: "{{ lookup('ansible.builtin.file', billet_gate_role + '/defaults/main.yml') | from_yaml }}"
    billet_gate_keys: "{{ billet_gate_ordinary | selectattr('name', 'equalto', \"Decide what this host's config asks of the GitHub App key\") | first }}"
    billet_gate_targets: "{{ billet_gate_ordinary | selectattr('name', 'equalto', \"Decide what this host's config asks of each further target's App key\") | first }}"
    billet_gate_provider: "{{ billet_gate_ordinary | selectattr('name', 'equalto', 'Assert the provisioning flags match the configured provider') | first }}"
    billet_gate_candidates: "{{ billet_gate_inspect | selectattr('name', 'equalto', 'Resolve recovery identity and candidate state directories') | first }}"
    billet_gate_effective_config:
      server: {identity_dir: /var/lib/billet/effective-identity, state: {backend: postgres}}
      github: {private_key_path: /etc/billet/effective-key.pem}
      targets: [{name: effective-target, private_key_path: /etc/billet/effective-target.pem}]
      node:
        provider: firecracker
        state_dir: /var/lib/billet/effective-node
        firecracker: {bridge: effective0, image_verify_port: 8729}
        cache: {tls_cert: /etc/billet/effective-cache/cert.pem, tls_key: /etc/billet/effective-cache/key.pem}
    billet_config:
      server: {state_dir: /var/lib/billet/desired-server, state: {backend: sqlite}}
      github: {private_key_path: /etc/billet/desired-key.pem}
      targets: [{name: desired-target, private_key_path: /etc/billet/desired-target.pem}]
      node:
        provider: docker
        state_dir: /var/lib/billet/desired-node
        firecracker: {bridge: desired0, image_verify_port: 9739}
        cache: {tls_cert: /etc/billet/desired-cache/cert.pem, tls_key: /etc/billet/desired-cache/key.pem}
    billet_interrupted_upgrade: false
    billet_service_user: billet
    billet_service_group: billet
    billet_firecracker_enabled: true
    billet_ceph_enabled: false
    billet_exclusion_darwin: false
    billet_endpoint_compat: false
    billet_endpoint_no_billet: false
    billet_endpoint_answerer: /usr/bin/billet
    billet_node_should_run: true
    # THE PORT IS A COPY OF THE ROLE DEFAULT'S EXPRESSION, written here where it is
    # trusted. The firewall template reads billet_image_verify_port, a role default
    # this play does not load, and the default itself cannot be evaluated from the
    # file (it arrives through lookup, which Ansible will not re-template). A
    # literal 8729 would make the port half of the firewall assertion true however
    # the reader was written; this copy resolves from E, and the loop below pins
    # the production default to naming exactly this path with this fallback.
    billet_image_verify_port: "{{ billet_effective_config.node.firecracker.image_verify_port | default(7719, true) }}"
    billet_networks: [{name: effective0, address: 172.31.0.1, prefix: 24}]
    billet_guest_denied_ipv4: [10.0.0.0/8]
    billet_guest_denied_ipv6: ['fc00::/7']
    billet_guest_host_tcp_ports: [53, 7718]
    billet_guest_host_udp_ports: [53, 67]
    billet_disable_network_names: [old0]
    billet_github_target_keys: []
    billet_github_target_key_srcs: {}
  tasks:
    - name: Supply this reader case's effective document
      ansible.builtin.set_fact:
        billet_retirement_node_ordinary: false
        billet_effective_config: "{{ billet_gate_effective_config }}"

    - name: Load the production ordinary aliases
      ansible.builtin.include_vars:
        file: "{{ billet_gate_role }}/vars/main.yml"

    # THE TWO ALIASES ARE EVALUATED, and they are the only readers here that can
    # be: `include_vars` PARSES vars/main.yml, so its values template normally.
    # Giving E an identity directory and a backend that inventory disagrees with
    # is therefore a real measurement of which document the aliases read.
    - name: Require the ordinary aliases to answer from E
      ansible.builtin.assert:
        that:
          - billet_configured_server_state_dir == '/var/lib/billet/effective-identity'
          - billet_configured_state_backend == 'postgres'
        fail_msg: >-
          The ordinary aliases resolved {{ billet_configured_server_state_dir }} and
          {{ billet_configured_state_backend }}; E names /var/lib/billet/effective-identity
          and postgres, and inventory disagrees on both.

    # EVERY OTHER READER IS PINNED AS TEXT, not evaluated, and this is a real
    # limit rather than a preference. Each is read out of a task file through
    # lookup('file'), and Ansible marks file-lookup content unsafe so that a file
    # cannot inject a template — which means the nested expression is never
    # re-templated. Evaluating one yields the literal `{{ ... }}`: it equals no
    # path, satisfies no `| bool`, and equals no list, so an assertion written
    # that way can only ever fail, whichever document the reader names. Asking
    # instead which document the expression NAMES is the question the design
    # actually poses (§3.5: an ordinary operative read from raw inventory is a
    # defect), and it is answerable from the text.
    #
    # THE SECOND CLAUSE IS THE DISCRIMINATING ONE. Naming the effective document
    # is satisfied by an expression that reads both, so what must be absent is a
    # raw `billet_config` — the name followed by nothing that continues it. The
    # lookahead is what makes that exact: `billet_effective_config` does not
    # contain the string at all, while `billet_configured_server_state_dir` and
    # the register `billet_config_install` do, and neither is a read of desired
    # input.
    - name: Require every operative reader to name the effective document
      ansible.builtin.assert:
        that:
          - item.expression is search(item.names)
          - item.expression is not search('billet_config(?![A-Za-z0-9_])')
        fail_msg: >-
          {{ item.reader }} reads `{{ item.expression }}`, which does not answer from
          the effective document.
      loop:
        - reader: the transaction's candidate server directory
          names: billet_configured_server_state_dir
          expression: "{{ billet_gate_candidates['ansible.builtin.set_fact'].billet_candidate_server_state_dir }}"
        - reader: the transaction's candidate node directory
          names: billet_effective_config
          expression: "{{ billet_gate_candidates['ansible.builtin.set_fact'].billet_candidate_node_state_dir }}"
        - reader: the GitHub App key requirement
          names: billet_effective_config
          expression: "{{ billet_gate_keys['ansible.builtin.set_fact'].billet_github_key_required }}"
        - reader: the GitHub App key path
          names: billet_effective_config
          expression: "{{ billet_gate_keys['ansible.builtin.set_fact'].billet_github_key_path }}"
        - reader: the GitHub App key's type test
          names: billet_effective_config
          expression: "{{ billet_gate_keys['ansible.builtin.set_fact'].billet_github_key_path_is_string }}"
        - reader: the further targets' key policy
          names: billet_effective_config
          expression: "{{ billet_gate_targets.loop }}"
        - reader: the cache TLS parent directories
          names: billet_effective_config
          expression: "{{ billet_gate_cache[1].loop | join(' ') }}"
        - reader: the cache TLS certificate destination
          names: billet_effective_config
          expression: "{{ billet_gate_cache[3]['ansible.builtin.copy'].dest }}"
        - reader: the cache TLS key destination
          names: billet_effective_config
          expression: "{{ billet_gate_cache[4]['ansible.builtin.copy'].dest }}"
        - reader: the image-verification port's default
          names: billet_effective_config.node.firecracker.image_verify_port
          expression: "{{ billet_gate_defaults.billet_image_verify_port }}"
        - reader: the implicit-provider-conversion refusal
          names: billet_effective_config.node.provider
          expression: "{{ billet_gate_network[2]['ansible.builtin.fail'].msg }}"
      loop_control:
        label: "{{ item.reader }}"

    # The port keeps its default beside naming E: an absent one makes every host
    # that says nothing render a portless rule.
    - name: Require the image-verification port to keep its default
      ansible.builtin.assert:
        that:
          - "'default(7719, true)' in billet_gate_defaults.billet_image_verify_port"

    # THE REFUSAL NAMES THE PROVIDER IT IS REFUSING, and it builds that phrase at
    # render time from `'a ' + <provider> + ' node'`, so no provider's name is in
    # the source to match: it is pinned above, with the readers, by the document
    # its expression names. What IS in the source is the sentence around it, and
    # a refusal that stopped naming the network it will not tear down implicitly
    # would be a worse diagnostic even while reading the right document.
    - name: Require the provider refusal to keep its diagnostic
      ansible.builtin.assert:
        that:
          - "'still carries a billet guest network' in billet_gate_network[2]['ansible.builtin.fail'].msg"
          - "'has no guest network' in billet_gate_network[2]['ansible.builtin.fail'].msg"
          - "'must not race the transactional upgrade' in billet_gate_network[2]['ansible.builtin.fail'].msg"

    # THE VALIDATIONS AND CONDITIONS ARE PINNED THE SAME WAY, and for a sharper
    # reason than the readers: a production `that:` or `when:` taken out of a task
    # file cannot be evaluated here AT ALL. Ansible refuses it outright —
    # "Encountered untrusted template or expression ... not untrusted sources such
    # as module results" (measured against ansible-core 2.21) — because a template
    # that came from a lookup is not a trusted source. Every task that tried to
    # exercise one in place therefore failed on reaching it, whichever document
    # the condition named. What remains provable, and is what 5d asks, is which
    # document each condition reads.
    - name: Require every ordinary validation and condition to name the effective document
      ansible.builtin.assert:
        that:
          - item.expression is search('billet_effective_config')
          - item.expression is not search('billet_config(?![A-Za-z0-9_])')
        fail_msg: >-
          {{ item.reader }} is written as `{{ item.expression }}`, which does not
          answer from the effective document.
      loop:
        - reader: the host-input validation
          expression: "{{ (billet_gate_ordinary | selectattr('name', 'equalto', 'Validate billet host inputs') | first)['ansible.builtin.assert'].that | join(' ') }}"
        - reader: the targets-list refusal
          expression: "{{ (billet_gate_ordinary | selectattr('name', 'equalto', 'Refuse a targets list billet will not load') | first)['ansible.builtin.assert'].that | join(' ') }}"
        - reader: the targets-list refusal's condition
          expression: "{{ (billet_gate_ordinary | selectattr('name', 'equalto', 'Refuse a targets list billet will not load') | first).when | join(' ') }}"
        - reader: the github-block refusal
          expression: "{{ (billet_gate_ordinary | selectattr('name', 'equalto', 'Refuse a github block billet will not load') | first)['ansible.builtin.assert'].that | join(' ') }}"
        - reader: the contradictory-spelling refusal
          expression: "{{ (billet_gate_inspect | selectattr('name', 'equalto', 'Refuse a config naming both server.state_dir and server.identity_dir') | first)['ansible.builtin.assert'].that | join(' ') }}"
        - reader: the cache TLS import condition
          expression: "{{ (billet_gate_ordinary | selectattr('name', 'equalto', 'Install the EC2 cache TLS material') | first).when | join(' ') }}"
        - reader: the provisioning-flag validation
          expression: "{{ billet_gate_provider['ansible.builtin.assert'].that | join(' ') }}"
        - reader: the endpoint receipt's presence condition
          expression: "{{ billet_gate_receipt[0].when | join(' ') }}"
      loop_control:
        label: "{{ item.reader }}"

    - name: Render the operative node and firewall templates
      ansible.builtin.set_fact:
        billet_gate_node_unit: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/billet-node.service.j2') }}"
        billet_gate_firewall: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/network.nft.j2') }}"

    - name: Require the exact effective sandbox and firewall operands
      ansible.builtin.assert:
        that:
          - "'ReadWritePaths=-/etc/billet/tls -/srv/jailer \"/var/lib/billet/effective-node\"' in billet_gate_node_unit"
          - "'desired-node' not in billet_gate_node_unit"
          - "'iifname \"effective0\" tcp dport 8729 accept' in billet_gate_firewall"
          - "'desired0' not in billet_gate_firewall"
          - "'9739' not in billet_gate_firewall"

    - name: Exercise the selected preparation reader with different desired and effective ledgers
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: prepare-desired-ledger
      vars:
        billet_binary_upgrade: true
        billet_exclusion_managed_pre_r: false

    - name: Require preparation to retain its desired operand
      ansible.builtin.assert:
        that:
          - billet_preparation_state_backend == 'sqlite'
          - billet_configured_state_backend == 'postgres'

    - name: Exercise the explicit serializer independently of both global configurations
      ansible.builtin.set_fact:
        billet_gate_serialized: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/billet.yaml.j2', template_vars={'billet_config_document': billet_gate_document}) }}"
      vars:
        billet_gate_document: {node: {name: command-owned, state_dir: /var/lib/billet/recorded-node}, opaque: "one\ntwo\n"}

    - name: Render the same operand beside different global configurations
      ansible.builtin.set_fact:
        billet_gate_serialized_again: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/billet.yaml.j2', template_vars={'billet_config_document': billet_gate_document, 'billet_config': {'wrong': 'inventory'}, 'billet_effective_config': {'wrong': 'effective'}}) }}"
      vars:
        billet_gate_document: {node: {name: command-owned, state_dir: /var/lib/billet/recorded-node}, opaque: "one\ntwo\n"}

    - name: Require the serializer operand to decide every rendered byte
      ansible.builtin.assert:
        that:
          - billet_gate_serialized == billet_gate_serialized_again
          - (billet_gate_serialized | from_yaml) == billet_gate_document
          - "'effective' not in billet_gate_serialized"
          - "'desired' not in billet_gate_serialized"
      vars:
        billet_gate_document: {node: {name: command-owned, state_dir: /var/lib/billet/recorded-node}, opaque: "one\ntwo\n"}

    - name: Initialize the missing-operand refusal witness
      ansible.builtin.set_fact:
        billet_gate_missing_operand_refused: false

    - name: Exercise the serializer without its explicit operand
      block:
        - name: Render with only the global configurations in scope
          ansible.builtin.set_fact:
            billet_gate_unbound_rendering: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/billet.yaml.j2') }}"
      rescue:
        - name: Require the refusal to name the missing serializer operand
          ansible.builtin.assert:
            that: "'billet_config_document' in ansible_failed_result.msg"
        - name: Record the missing-operand refusal
          ansible.builtin.set_fact:
            billet_gate_missing_operand_refused: true

    - name: Require the serializer to refuse an implicit global operand
      ansible.builtin.assert:
        that: billet_gate_missing_operand_refused

- name: Configuration readers retain their route and operand contracts
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_main_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/main.yml') | from_yaml }}"
    billet_gate_account_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/account.yml') | from_yaml }}"
    billet_gate_retirement_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/retirement.yml') | from_yaml }}"
    billet_gate_request_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/retirement-request.yml') | from_yaml }}"
    billet_gate_collect_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/retirement-collect.yml') }}"
    billet_gate_node_hosts_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/retirement-node-hosts.yml') }}"
    billet_gate_collect_host_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/retirement-collect-host.yml') }}"
    billet_gate_endpoint_source: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/endpoint-decision.yml') }}"
  tasks:
    - name: Exercise the reader call sites and ordinary task ordering
      ansible.builtin.include_tasks: effective-inputs-order.yml

- name: Server and node destinations are split, and the node invariant refuses on its own
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_role: "{{ playbook_dir }}/../roles/host"
    billet_gate_account: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/account.yml') | from_yaml }}"
    billet_gate_dirs: "{{ billet_gate_account | selectattr('name', 'equalto', 'Create billet directories') | first }}"
    billet_gate_previous_server: "{{ billet_gate_account | selectattr('name', 'equalto', 'Resolve the installed server state directory') | first }}"
    billet_gate_previous_node: "{{ billet_gate_account | selectattr('name', 'equalto', 'Resolve the installed node state directory') | first }}"
    billet_gate_node_invariant: "{{ billet_gate_account | selectattr('name', 'equalto', 'Refuse to move installed node state implicitly') | first }}"
    billet_config: {server: {identity_dir: /var/lib/billet/inventory-identity}, node: {state_dir: /var/lib/billet/inventory-node}}
    billet_candidate_server_state_dir: "{{ billet_configured_server_state_dir }}"
    billet_candidate_node_state_dir: /var/lib/billet/effective-node
    # THREE DISTINCT PATHS — installed, inventory and effective — or an installed
    # reader that had been rewritten to read E would answer the same value and
    # nothing here could tell.
    billet_previous_config_file:
      content: "{{ {'server': {'identity_dir': '/var/lib/billet/installed-identity'}, 'node': {'state_dir': '/var/lib/billet/installed-node'}} | to_yaml | b64encode }}"
    billet_service_user: billet
    billet_service_group: billet
    billet_firecracker_stage: /var/cache/billet-provision
    billet_interrupted_upgrade: false
  tasks:
    - name: Supply the serverless effective document
      ansible.builtin.set_fact:
        billet_retirement_node_ordinary: false
        billet_effective_config: {node: {state_dir: /var/lib/billet/effective-node}}

    - name: Load the production path aliases
      ansible.builtin.include_vars:
        file: "{{ billet_gate_role }}/vars/main.yml"

    # A NEVER-CONTROLLER NODE KEEPS THE DEFAULT DIRECTORY. Its transaction's
    # fence writes inside it, even with serverless E. Retained-only emptiness is
    # exercised separately by retained-guards.yml through the same aliases.
    - name: Require the server's destinations to be a separate, admitted list
      ansible.builtin.assert:
        that:
          - billet_configured_server_state_dir == '/var/lib/billet/server'
          - billet_server_directories | map(attribute='path') | list == ['/var/lib/billet/server']
          # The transaction root is appended, because the retained route drops it.
          - billet_node_directories | map(attribute='path') | list == ['/var/lib/billet/effective-node', '/var/lib/billet/health', '/var/cache/billet-provision', '/srv/jailer', '/usr/local/libexec', '/var/lib/billet/upgrades']
          - billet_common_directories | map(attribute='path') | list == ['/etc/billet', '/etc/billet/network', '/var/lib/billet']

    # THE THREE INSTALLED-OBSERVATION EXPRESSIONS ARE PINNED AS EXACT TEXT, then
    # evaluated as copies written here. They cannot be evaluated from the task
    # file: a template read through lookup is never re-templated, so a fact set
    # from one holds the literal `{{ ... }}` and every comparison against a path
    # fails whatever the expression reads. Pinning the text (braces stripped,
    # whitespace collapsed) means a production change fails here rather than
    # leaving the copy below to prove something production no longer does.
    - name: Pin the production installed-observation expressions
      ansible.builtin.assert:
        that:
          - item.source[2:-2].split() | join(' ') == item.expected
        fail_msg: >-
          {{ item.fact }} is now `{{ item.source }}`, which this gate no longer
          exercises; update the copy below with it.
      loop:
        - fact: billet_previous_config
          source: "{{ (billet_gate_account | selectattr('name', 'equalto', 'Keep installed configuration separate from effective input') | first)['ansible.builtin.set_fact'].billet_previous_config }}"
          expected: "(billet_previous_config_file.content | b64decode | from_yaml) if billet_previous_config_file.content is defined else {}"
        - fact: billet_previous_server_state_dir
          source: "{{ billet_gate_previous_server['ansible.builtin.set_fact'].billet_previous_server_state_dir }}"
          expected: "(billet_previous_config.server.get('identity_dir') or billet_previous_config.server.get('state_dir') or '/var/lib/billet/server') if billet_previous_config.get('server') is mapping else ''"
        - fact: billet_previous_node_state_dir
          source: "{{ billet_gate_previous_node['ansible.builtin.set_fact'].billet_previous_node_state_dir }}"
          expected: "billet_previous_config.node.get('state_dir', '/var/lib/billet/node') if billet_previous_config.get('node') is mapping else ''"
      loop_control:
        label: "{{ item.fact }}"

    - name: Read the installed file through a copy of the production expression
      ansible.builtin.set_fact:
        billet_previous_config: "{{ (billet_previous_config_file.content | b64decode | from_yaml) if billet_previous_config_file.content is defined else {} }}"

    # The two installed observations are separate facts, so a refusal names the one
    # directory that moved.
    - name: Derive both installed observations through copies of the production expressions
      ansible.builtin.set_fact:
        billet_previous_server_state_dir: "{{ (billet_previous_config.server.get('identity_dir') or billet_previous_config.server.get('state_dir') or '/var/lib/billet/server') if billet_previous_config.get('server') is mapping else '' }}"
        billet_previous_node_state_dir: "{{ billet_previous_config.node.get('state_dir', '/var/lib/billet/node') if billet_previous_config.get('node') is mapping else '' }}"

    # EACH READS THE INSTALLED FILE, not E and not inventory. All three name a
    # different directory, so answering from the wrong one fails here.
    - name: Require the installed observations to be split and to read installed evidence
      ansible.builtin.assert:
        that:
          - "'billet_previous_node_state_dir' not in billet_gate_previous_server['ansible.builtin.set_fact']"
          - "'billet_previous_server_state_dir' not in billet_gate_previous_node['ansible.builtin.set_fact']"
          - billet_previous_server_state_dir == '/var/lib/billet/installed-identity'
          - billet_previous_node_state_dir == '/var/lib/billet/installed-node'
        fail_msg: >-
          An installed observation answered {{ billet_previous_server_state_dir }} and
          {{ billet_previous_node_state_dir }}; the installed file names
          /var/lib/billet/installed-identity and /var/lib/billet/installed-node, E names
          /var/lib/billet/effective-node and inventory names /var/lib/billet/inventory-node.

    # THE DERIVED OBSERVATION IS WHAT THE REFUSAL JUDGES, never a value this gate
    # hands it: a test that supplies both sides proves the comparison and nothing
    # about the reader underneath it.
    #
    # THE PRODUCTION CONDITION CANNOT BE EVALUATED HERE, because it was read out of
    # a task file and Ansible refuses a template from an untrusted source. It is
    # pinned as text instead, exactly, and the copy exercised below is the same
    # comparison written in this playbook, where it is trusted: a production change
    # fails the pin, and the behaviour is still demonstrated in both directions.
    - name: Pin the production node path invariant
      ansible.builtin.assert:
        that:
          - billet_gate_node_invariant['ansible.builtin.assert'].that == ['billet_previous_node_state_dir == billet_candidate_node_state_dir']
        fail_msg: >-
          The node path invariant is now
          {{ billet_gate_node_invariant['ansible.builtin.assert'].that }}, which this
          gate no longer exercises; update the copy below with it.

    # A candidate equal to the installed path is admitted.
    - name: Exercise the invariant against the derived observation
      ansible.builtin.assert:
        that:
          - billet_previous_node_state_dir == billet_candidate_node_state_dir
      vars:
        billet_candidate_node_state_dir: /var/lib/billet/installed-node

    - name: Initialize the changed-node refusal witness
      ansible.builtin.set_fact:
        billet_gate_node_move_refused: false

    # The play's candidate is E's node path, which the installed file does not
    # name, so the refusal must fire on the derived observation alone.
    - name: Exercise the invariant against a moved candidate
      block:
        - name: Apply the node path comparison
          ansible.builtin.assert:
            that:
              - billet_previous_node_state_dir == billet_candidate_node_state_dir
      rescue:
        - name: Record the changed-node refusal
          ansible.builtin.set_fact:
            billet_gate_node_move_refused: true

    - name: Require the node invariant to refuse a move it derived itself
      ansible.builtin.assert:
        that:
          - billet_gate_node_move_refused
          - billet_gate_node_invariant.when == ["billet_previous_config.get('node') is mapping", "billet_effective_config.get('node') is mapping", 'not billet_interrupted_upgrade | bool']

- name: Effective server masking preserves the original request policy without reading desired configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_config: "{{ billet_gate_undefined_desired }}"
    billet_gate_policy_main: "{{ lookup('ansible.builtin.file', playbook_dir + '/../roles/host/tasks/main.yml') | from_yaml }}"
    billet_gate_requested: "{{ billet_gate_policy_main | selectattr('name', 'equalto', 'Derive whether the billet server may run on this host') | first }}"
  tasks:
    - name: Exercise each policy boundary independently
      ansible.builtin.include_tasks: effective-server-policy-case.yml
      vars:
        billet_enable_server: "{{ billet_gate_policy.enabled }}"
        billet_server_prepare_only: "{{ billet_gate_policy.prepare }}"
      loop:
        - {route: ordinary, enabled: true, prepare: false, verified: false, bypass: false, effective: true, run: true}
        - {route: ordinary, enabled: false, prepare: false, verified: false, bypass: false, effective: false, run: false}
        - {route: ordinary, enabled: true, prepare: true, verified: false, bypass: false, effective: true, run: false}
        - {route: new-request, enabled: true, prepare: false, verified: false, bypass: true, effective: false, run: false}
        - {route: continue, enabled: true, prepare: false, verified: false, bypass: true, effective: false, run: false}
        - {route: ordinary, enabled: true, prepare: false, verified: true, bypass: false, effective: false, run: false}
        - {route: cancel, enabled: true, prepare: false, verified: false, bypass: true, effective: false, run: false}
        - {route: cancel, enabled: true, prepare: false, verified: false, bypass: false, effective: true, run: true}
        - {route: hold, enabled: true, prepare: false, verified: false, bypass: true, effective: false, run: false}
        - {route: recovery, enabled: true, prepare: false, verified: false, bypass: true, effective: true, run: true}
      loop_control:
        loop_var: billet_gate_policy

- name: No inadmissible route reaches the effective configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_config: {node: {provider: docker}}
    billet_enable_server: true
    billet_server_prepare_only: false
  tasks:
    - name: Exercise each route the ordinary entry must refuse
      ansible.builtin.include_tasks: effective-admission-case.yml
      loop:
        - {name: bypassed, route: hold, bypass: true, verified: false, ordinary: false, interrupted: false}
        - {name: recovery, route: ordinary, bypass: false, verified: false, ordinary: false, interrupted: true}
        - {name: unverified-retained, route: continue, bypass: false, verified: false, ordinary: true, interrupted: false}
        - {name: held, route: hold, bypass: false, verified: false, ordinary: false, interrupted: false}
        - {name: new-request, route: new-request, bypass: false, verified: false, ordinary: false, interrupted: false}
      loop_control:
        loop_var: billet_gate_refusal
        label: "{{ billet_gate_refusal.name }}"
