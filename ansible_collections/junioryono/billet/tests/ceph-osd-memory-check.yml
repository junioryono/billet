---
# Runs the host role's OSD memory tasks (tasks_from: ceph-osd-memory) against a
# fake `ceph` that keeps the cluster's settings in a file: it records every call,
# answers `config dump` from what it holds, and applies `config set` and `config
# rm`. Like cephadm, it writes a host's target back whenever one is removed while
# any autotune setting is still on, and it answers `mgr stat` and `mgr fail` for a
# manager whose epoch a failover moves on. Escalated as the role runs them. Five
# clusters:
#
#   - autotuned, as the reference host was on 2026-11-25 (autotune on, a per-host
#     target autotune wrote, and one daemon's own): autotune is turned off and the
#     osd section's target set, both before anything is removed, and then each
#     setting that would outrank the section is removed by its own section and
#     mask;
#   - one daemon still autotuned beside a host target, where removing the target
#     first would have cephadm write it back for good: that daemon's autotune goes
#     before the target does, and the cluster ends with the osd section's values
#     alone;
#   - a cephadm pass already under way, which publishes its stale target at the
#     role's last read unless the manager fails over first, which ends it: the role
#     fails the manager over once autotune is off, and the cluster ends clean;
#   - a stale target that lands after the last cleanup however the manager went:
#     the role's own final check refuses the converge;
#   - converged: the reads are the only calls, so a second converge changes
#     nothing;
#   - 0: no call at all, a shared cluster's own policy left alone.
- name: The host role holds each OSD's memory at the inventory's target
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: Make the tree the cases run in
      ansible.builtin.tempfile:
        state: directory
        suffix: -osd-memory
      register: billet_gate_tree

    - name: Run the cases and remove the tree
      block:
        - name: Make the fake ceph's directory
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}/bin"
            state: directory
            mode: "0755"

        - name: Plant the fake ceph
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/bin/ceph"
            mode: "0755"
            content: |
              #!/usr/bin/env python3
              import json, os, sys
              args = sys.argv[1:]
              with open(os.environ['BILLET_GATE_CEPH_LOG'], 'a') as log:
                  log.write(' '.join(args) + '\n')
              path = os.environ['BILLET_GATE_CEPH_DUMP']
              with open(path) as f:
                  held = json.load(f)
              # A PASS UNDER WAY, armed until it publishes: its stale target lands at
              # the role's second read, the last, unless the manager it runs on fails
              # over first, when it has published or never will.
              inflight = os.environ.get('BILLET_GATE_CEPHADM_INFLIGHT', '')
              stale = {'section': 'osd', 'name': 'osd_memory_target', 'value': '182725545984',
                       'mask': 'host:ubuntu-01'}

              def publish():
                  global held
                  held = [e for e in held if not (e['mask'] == stale['mask'] and e['name'] == stale['name'])]
                  held.append(stale)
                  open(inflight, 'w').close()
                  with open(path, 'w') as f:
                      json.dump(held, f)

              armed = bool(inflight) and not os.path.exists(inflight)
              mgr_path = path + '.mgr'
              mgr = {'epoch': 37, 'available': True, 'active_name': 'ubuntu-01.a', 'num_standby': 1}
              if os.path.exists(mgr_path):
                  with open(mgr_path) as f:
                      mgr = json.load(f)
              if args[:2] == ['mgr', 'stat']:
                  print(json.dumps(mgr))
                  sys.exit(0)
              if args[:2] == ['mgr', 'fail']:
                  if args[2:] != [mgr['active_name']]:
                      sys.exit('failed over ' + ' '.join(args[2:]) + ', not the active manager')
                  if armed and not os.environ.get('BILLET_GATE_CEPHADM_STUBBORN'):
                      publish()
                  mgr['epoch'] += 1
                  mgr['active_name'] = 'ubuntu-01.b' if mgr['active_name'] == 'ubuntu-01.a' else 'ubuntu-01.a'
                  with open(mgr_path, 'w') as f:
                      json.dump(mgr, f)
                  sys.exit(0)
              if args[:2] == ['config', 'dump']:
                  reads = 1
                  if inflight:
                      counter = inflight + '.reads'
                      reads = (int(open(counter).read()) if os.path.exists(counter) else 0) + 1
                      open(counter, 'w').write(str(reads))
                  if armed and reads == 2:
                      publish()
                  print(json.dumps(held))
                  sys.exit(0)
              if args[:2] == ['config', 'set']:
                  section, name, value = args[2:5]
                  held = [e for e in held if not (e['section'] == section and e['mask'] == '' and e['name'] == name)]
                  held.append({'section': section, 'name': name, 'value': value, 'mask': ''})
              elif args[:2] == ['config', 'rm']:
                  who, name = args[2:4]
                  section, _, mask = who.partition('/')
                  gone = [e for e in held if e['section'] == section and e['mask'] == mask and e['name'] == name]
                  held = [e for e in held if e not in gone]
                  # CEPHADM: a host's target removed while any daemon's autotune is on
                  # is written back.
                  if mask.startswith('host:') and name == 'osd_memory_target' and any(
                          e['name'] == 'osd_memory_target_autotune' and e['value'] == 'true' for e in held):
                      held.extend(gone)
              with open(path, 'w') as f:
                  json.dump(held, f)

        - name: Run each cluster through the role's tasks
          ansible.builtin.include_tasks: ceph-osd-memory-case.yml
          loop:
            - name: autotuned
              target_gib: 16
              dump:
                - {section: osd, name: osd_mclock_profile, value: high_client_ops, mask: ""}
                - {section: osd, name: osd_memory_target_autotune, value: "true", mask: ""}
                - {section: osd, name: osd_memory_target, value: "182725545984", mask: "host:ubuntu-01"}
                - {section: osd.1, name: osd_memory_target, value: "1073741824", mask: ""}
              calls:
                - config dump --format json
                - config set osd osd_memory_target_autotune false
                - mgr stat --format json
                - mgr fail ubuntu-01.a
                - mgr stat --format json
                - config set osd osd_memory_target 17179869184
                - config rm osd/host:ubuntu-01 osd_memory_target
                - config rm osd.1 osd_memory_target
                - config dump --format json
            - name: one daemon still autotuned
              target_gib: 16
              dump:
                - {section: osd, name: osd_memory_target_autotune, value: "true", mask: ""}
                - {section: osd.1, name: osd_memory_target_autotune, value: "true", mask: ""}
                - {section: osd, name: osd_memory_target, value: "182725545984", mask: "host:ubuntu-01"}
              calls:
                - config dump --format json
                - config set osd osd_memory_target_autotune false
                - config rm osd.1 osd_memory_target_autotune
                - mgr stat --format json
                - mgr fail ubuntu-01.a
                - mgr stat --format json
                - config set osd osd_memory_target 17179869184
                - config rm osd/host:ubuntu-01 osd_memory_target
                - config dump --format json
            - name: a cephadm pass under way
              target_gib: 16
              inflight: true
              dump:
                - {section: osd, name: osd_memory_target_autotune, value: "true", mask: ""}
                - {section: osd, name: osd_memory_target, value: "182725545984", mask: "host:ubuntu-01"}
              calls:
                - config dump --format json
                - config set osd osd_memory_target_autotune false
                - mgr stat --format json
                - mgr fail ubuntu-01.a
                - mgr stat --format json
                - config set osd osd_memory_target 17179869184
                - config rm osd/host:ubuntu-01 osd_memory_target
                - config dump --format json
            - name: a stale target after the last cleanup
              target_gib: 16
              inflight: true
              stubborn: true
              refused: true
              dump:
                - {section: osd, name: osd_memory_target_autotune, value: "true", mask: ""}
            - name: converged
              target_gib: 16
              dump:
                - {section: osd, name: osd_mclock_profile, value: high_client_ops, mask: ""}
                - {section: osd, name: osd_memory_target_autotune, value: "false", mask: ""}
                - {section: osd, name: osd_memory_target, value: "17179869184", mask: ""}
              calls:
                - config dump --format json
                - config dump --format json
            - name: left to the cluster
              target_gib: 0
              dump:
                - {section: osd, name: osd_memory_target_autotune, value: "true", mask: ""}
              calls: []
          loop_control:
            loop_var: billet_gate_case
            label: "{{ billet_gate_case.name }}"
      always:
        - name: Remove the tree
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}"
            state: absent
