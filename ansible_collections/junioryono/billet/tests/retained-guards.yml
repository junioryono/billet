---
- name: Retained ordinary work excludes controller resources and preserves node lifecycle
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_role: "{{ playbook_dir }}/../roles/host"
    billet_gate_main: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/main.yml') | from_yaml }}"
    billet_gate_effective: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/effective-config.yml') | from_yaml }}"
  tasks:
    # File lookup content is text, never a trusted when expression.
    - name: Pin each controller exclusion by task name
      ansible.builtin.assert:
        that:
          - billet_gate_matches | length == 1
          - "'not billet_retirement_node_ordinary | bool' in billet_gate_conditions"
        fail_msg: "{{ item.file }} / {{ item.name }} must exclude retained ordinary work."
      vars:
        billet_gate_source: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/' + item.file) | from_yaml }}"
        billet_gate_tasks: "{{ billet_gate_source[-1].block if item.file == 'main.yml' else billet_gate_source }}"
        billet_gate_matches: "{{ billet_gate_tasks | selectattr('name', 'equalto', item.name) | list }}"
        billet_gate_conditions: "{{ [billet_gate_matches[0].when] if billet_gate_matches[0].when is string else billet_gate_matches[0].when }}"
      loop:
        - file: main.yml
          name: Record the service account and provision the authority locks on an existing installation
        - file: main.yml
          name: Compute the ledger mount name for ordinary convergence
        - file: main.yml
          name: Inspect the installed ledger mount unit
        - file: main.yml
          name: Refuse to drop a previously configured ledger volume
        - file: main.yml
          name: Record the service account and provision the authority locks on a fresh host
        - file: main.yml
          name: Mount the control-plane ledger volume fail closed
        - file: main.yml
          name: Configure or remove the deployment backup timer
        - file: account.yml
          name: Refuse to move installed server state implicitly
        - file: account.yml
          name: Render the billet server environment
        - file: account.yml
          name: Install the ledger's certificate bundle
        - file: account.yml
          name: Record ownership of the billet server environment
        - file: account.yml
          name: Inspect ownership of the billet server environment
        - file: account.yml
          name: Remove the billet server environment when nothing configures it
        - file: services.yml
          name: Validate a billet host whose binary did not change
        - file: services.yml
          name: Return server state created by validation to the control-plane account
        - file: services.yml
          name: Inspect control-plane state files
        - file: services.yml
          name: Protect control-plane state files
        - file: services.yml
          name: Restart the billet server after non-binary inputs change
        - file: services.yml
          name: Enable and start the billet server
        - file: services.yml
          name: Stop and disable the billet server unless it may run here
        - file: services.yml
          name: Install the scheduled updater units
        - file: services.yml
          name: Load the scheduled updater units
        - file: services.yml
          name: Enable the scheduled updaters
      loop_control:
        label: "{{ item.file }} / {{ item.name }}"

    - name: Pin the complete shared node lifecycle conditions as text
      ansible.builtin.assert:
        that: billet_gate_task.when == item.conditions
        fail_msg: "{{ item.name }} changed the shared node lifecycle condition."
      vars:
        billet_gate_source: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/' + item.file) | from_yaml }}"
        billet_gate_task: "{{ billet_gate_source | selectattr('name', 'equalto', item.name) | first }}"
      loop:
        - file: services.yml
          name: Restart the billet node after non-binary inputs change
          conditions:
            - billet_node_should_run
            - not ansible_check_mode
            - not billet_binary_upgrade | default(false)
            - not billet_endpoint_migrated | default(false) | bool
            - >-
              billet_config_install.changed | default(false) or
              billet_firecracker_install.changed | default(false) or
              billet_firecracker_links.changed | default(false) or
              (billet_server_environment | default({}) | length > 0 and
               billet_server_environment_install.changed | default(false)) or
              (billet_unit_templates_by_unit.values() | selectattr('changed', 'equalto', true) | list | length > 0)
        - file: services.yml
          name: Enable and start the billet node
          conditions: [billet_node_should_run, not ansible_check_mode]
        - file: services.yml
          name: Stop and disable the billet node unless it may run here
          conditions: [not billet_node_should_run, not ansible_check_mode]
        - file: network.yml
          name: Drain billet compute before changing guest networking
          conditions:
            - billet_network_requires_drain
            - billet_node_unit_load_state.stdout | trim != 'not-found'
            - not ansible_check_mode
      loop_control:
        label: "{{ item.name }}"

    - name: Require binary refusal at ordinary entry before inspection or mutation
      ansible.builtin.assert:
        that:
          - billet_gate_main[-1].block[0]['ansible.builtin.import_tasks'] == 'effective-config.yml'
          - billet_gate_effective[0]['ansible.builtin.import_tasks'] == 'retirement-binary-refusal.yml'
          - billet_gate_refusal | length == 1
          - billet_gate_refusal[0].when == 'billet_retirement_node_ordinary | bool and billet_binary_upgrade | default(false) | bool'
      vars:
        billet_gate_refusal: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/retirement-binary-refusal.yml') | from_yaml }}"

    - name: Require settled callers to remain disconnected from routing
      ansible.builtin.assert:
        that:
          - "'retirement-settled-entry.yml' not in billet_gate_source"
          - "'retirement-settled-closing.yml' not in billet_gate_source"
          - "'billet_retirement_node_ordinary: true' not in billet_gate_source"
      vars:
        billet_gate_source: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/' + item) }}"
      loop: [main.yml, retirement.yml, retirement-continue.yml, retirement-continue-call.yml]

- name: Retained binary refusal and server directory emptiness use real production tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    billet_gate_role: "{{ playbook_dir }}/../roles/host"
    billet_service_user: billet
    billet_service_group: billet
  tasks:
    - name: Exercise every binary decision beside both desired server shapes
      ansible.builtin.include_tasks: retained-guards-case.yml
      loop:
        - {retained: true, upgrade: true, server: true}
        - {retained: true, upgrade: true, server: false}
        - {retained: false, upgrade: true, server: true}
        - {retained: false, upgrade: true, server: false}
        - {retained: true, upgrade: false, server: true}
        - {retained: true, upgrade: false, server: false}
        - {retained: false, upgrade: false, server: true}
        - {retained: false, upgrade: false, server: false}
      loop_control:
        loop_var: billet_gate_case
