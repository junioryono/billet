---
# Runs the host role's LVM filter tasks (tasks_from: lvm-rbd-filter) against
# temporary LVM configuration directories, with the real lvmconfig reading each
# through LVM_SYSTEM_DIR, escalated as the role runs them:
#
#   - a package's lvm.conf with no filter: billet's block is written, LVM applies
#     exactly it, the operator's own lvmlocal.conf lines are kept, and a second
#     converge changes nothing;
#   - billet_lvm_rbd_filter false: the block is removed and nothing else is, and
#     on a host that never had lvmlocal.conf nothing is created;
#   - an operator's own global_filter, in lvm.conf on one line or in lvmlocal.conf
#     beside billet's block: refused, and nothing written;
#   - lvm.conf or lvmlocal.conf that is not a regular file: refused, and
#     nothing copied;
#   - lvmconfig failing on the operator's copy with anything but its own "not
#     found": the converge stops, and billet's block is not written;
#   - a devices file in use that names a mapped image, root's and 0600 as LVM
#     leaves it, under its own name or LVM's default when the setting is empty:
#     refused;
#   - check mode on a host with no filter: nothing written, nothing refused;
#   - two converges of a host: the second reports nothing changed;
#   - no lvm.conf at all: nothing is created.
- name: The host role keeps LVM's scans off mapped RBD images
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    billet_gate_block: |
      devices {
      	global_filter = [ "r|^/dev/rbd|", "r|^/dev/nbd|" ]
      }
    billet_gate_plain_conf: "devices {\n\t# filter = [ \"a|.*|\" ]\n}\n"

  tasks:
    - name: Make the tree the cases run in
      ansible.builtin.tempfile:
        state: directory
        suffix: -lvm-filter
      register: billet_gate_tree

    # THE ROLE'S COPIES ARE ITS OWN TO REMOVE, by name and then rmdir, on every
    # case: these are the copy directories there before any case ran.
    - name: Find the LVM copy directories before the cases
      ansible.builtin.find:
        paths: "{{ ['/tmp', billet_gate_tree.path | dirname] | unique }}"
        patterns: "*-billet-lvm"
        file_type: directory
      register: billet_gate_copies_before
      become: true

    - name: Run the cases and remove the tree
      block:
        - name: Make each case's configuration directory
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}/{{ item }}"
            state: directory
            mode: "0755"
          loop: [plain, never, conf, local, devfile/devices, emptyname/devices, check, unread, unread-bin, notafile/lvmlocal.conf, idem]

        - name: Write each case's configuration
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/{{ item.path }}"
            content: "{{ item.content }}"
            mode: "0644"
          loop:
            - {path: plain/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: plain/lvmlocal.conf, content: "local {\n\tsystem_id = \"operator\"\n}\n"}
            - {path: never/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: idem/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: idem/lvmlocal.conf, content: "local {\n\tsystem_id = \"operator\"\n}\n"}
            - {path: notafile/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: notafile/lvmlocal.conf/keep, content: "the operator's\n"}
            - {path: conf/lvm.conf, content: "devices { global_filter = [ \"r|^/dev/sdz|\", \"a|.*|\" ] }\n"}
            - {path: local/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: local/lvmlocal.conf, content: "devices {\n\tglobal_filter = [ \"r|^/dev/sdz|\" ]\n}\n"}
            - {path: devfile/lvm.conf, content: "devices {\n\tuse_devicesfile = 1\n}\n"}
            - {path: emptyname/lvm.conf, content: "devices {\n\tuse_devicesfile = 1\n\tdevicesfile = \"\"\n}\n"}
            - {path: check/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
            - {path: unread/lvm.conf, content: "{{ billet_gate_plain_conf }}"}
          loop_control:
            label: "{{ item.path }}"

        # ROOT'S AND 0600, as lvmdevices leaves the file: the role must read it as
        # root, or it would find nothing to refuse.
        - name: Write the devices files as LVM leaves them
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/{{ item }}/devices/system.devices"
            content: "VERSION=1.1.1\nIDTYPE=devname IDNAME=/dev/rbd0 DEVNAME=/dev/rbd0 PVID=none\n"
            owner: root
            group: root
            mode: "0600"
          loop: [devfile, emptyname]
          become: true

        # PLAIN: written, applied, the operator's lines kept, and a second run idle.
        - name: Converge the plain host
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"

        - name: Read lvmlocal.conf after the first converge
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_first

        - name: Ask LVM what it applies
          ansible.builtin.command:
            argv: [lvmconfig, devices/global_filter]
          environment:
            LVM_SYSTEM_DIR: "{{ billet_gate_tree.path }}/plain"
          register: billet_gate_applied
          changed_when: false
          become: true

        - name: LVM applies billet's filter and the operator's lines are kept
          ansible.builtin.assert:
            that:
              - billet_gate_applied.stdout | trim == 'global_filter=["r|^/dev/rbd|","r|^/dev/nbd|"]'
              - "'system_id = \"operator\"' in (billet_gate_first.content | b64decode)"
              - billet_gate_block in (billet_gate_first.content | b64decode)
            fail_msg: "LVM applies {{ billet_gate_applied.stdout }}; lvmlocal.conf is {{ billet_gate_first.content | b64decode }}"

        - name: Converge the plain host again
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"

        - name: Read lvmlocal.conf after the second converge
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_second

        - name: A second converge changes nothing
          ansible.builtin.assert:
            that: billet_gate_second.content == billet_gate_first.content

        # OFF: billet's block removed and nothing else; a host that never had
        # lvmlocal.conf is left without one.
        - name: Converge the plain host with the filter turned off
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"
            billet_lvm_rbd_filter: false

        - name: Read lvmlocal.conf with the filter off
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_off

        - name: Off removes billet's block and only it
          ansible.builtin.assert:
            that: (billet_gate_off.content | b64decode) == "local {\n\tsystem_id = \"operator\"\n}\n"
            fail_msg: "lvmlocal.conf is {{ billet_gate_off.content | b64decode }}"

        - name: Converge a host that never had lvmlocal.conf with the filter off
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/never"
            billet_lvm_rbd_filter: false

        - name: Off on such a host creates nothing
          ansible.builtin.assert:
            that: not (billet_gate_tree.path ~ '/never/lvmlocal.conf') is exists

        # THE OPERATOR'S OWN FILTER, however and wherever it is written, refused.
        - name: Converge each host whose operator wrote a filter
          ansible.builtin.include_tasks: lvm-rbd-filter-refused.yml
          loop:
            - {dir: conf, says: "already sets devices/global_filter", untouched: lvmlocal.conf}
            - {dir: local, says: "already sets devices/global_filter", untouched: ""}
            - {dir: devfile, says: "names an RBD or NBD device", untouched: lvmlocal.conf}
            - {dir: emptyname, says: "names an RBD or NBD device", untouched: lvmlocal.conf}
            - {dir: notafile, says: "is not a regular file", untouched: ""}
          loop_control:
            loop_var: billet_gate_refused
            label: "{{ billet_gate_refused.dir }}"

        - name: A directory where lvmlocal.conf belongs is left as it was
          ansible.builtin.assert:
            that: (billet_gate_tree.path ~ '/notafile/lvmlocal.conf/keep') is file

        - name: The operator's lvmlocal.conf was left as it was
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/local/lvmlocal.conf"
          register: billet_gate_local

        - name: Nothing was added to it
          ansible.builtin.assert:
            that: (billet_gate_local.content | b64decode) == "devices {\n\tglobal_filter = [ \"r|^/dev/sdz|\" ]\n}\n"

        # COULD NOT TELL IS NOT NO FILTER: an lvmconfig that fails on billet's copy of
        # the configuration, as one killed under memory pressure would, stops the
        # converge before billet's block is written. Every other call is the real one.
        - name: Plant an lvmconfig that cannot read billet's copy
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/unread-bin/lvmconfig"
            mode: "0755"
            content: |
              #!/bin/sh
              case "$LVM_SYSTEM_DIR" in
              *-billet-lvm) echo "  killed" >&2; exit 137 ;;
              esac
              PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin exec lvmconfig "$@"

        - name: Converge the host whose copy cannot be read
          block:
            - name: Include the role's LVM filter tasks
              ansible.builtin.include_role:
                name: junioryono.billet.host
                tasks_from: lvm-rbd-filter
                apply:
                  environment:
                    PATH: "{{ billet_gate_tree.path }}/unread-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
              vars:
                billet_lvm_system_dir: "{{ billet_gate_tree.path }}/unread"

            - name: The unreadable copy was not refused
              ansible.builtin.fail:
                msg: The role read a failed lvmconfig as no filter, and went ahead.
          rescue:
            - name: Stopped before billet's block was written
              ansible.builtin.assert:
                that:
                  - "'Read any global filter' in (ansible_failed_task.name | default(''))"
                  - not (billet_gate_tree.path ~ '/unread/lvmlocal.conf') is exists
                fail_msg: "{{ ansible_failed_task.name | default('') }}: {{ ansible_failed_result.msg | default('') }}"

        # CHECK MODE on a host with no filter yet: nothing written, nothing refused.
        # A real --check run, because only that sets ansible_check_mode; a task's
        # own check_mode keyword does not.
        - name: Write a play that converges the host's filter
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/check-play.yml"
            mode: "0644"
            content: |
              - hosts: localhost
                gather_facts: false
                connection: local
                tasks:
                  - name: Converge the host's filter
                    ansible.builtin.include_role:
                      name: junioryono.billet.host
                      tasks_from: lvm-rbd-filter
                    vars:
                      billet_lvm_system_dir: "{{ billet_gate_tree.path }}/check"

        - name: Converge the host in check mode
          ansible.builtin.command:
            argv: [ansible-playbook, --check, -i, "localhost,", "{{ billet_gate_tree.path }}/check-play.yml"]
          register: billet_gate_check
          changed_when: false
          failed_when: false

        - name: Check mode refused nothing and wrote nothing
          ansible.builtin.assert:
            that:
              - billet_gate_check.rc == 0
              - not (billet_gate_tree.path ~ '/check/lvmlocal.conf') is exists
            fail_msg: "check mode answered {{ billet_gate_check.rc }}: {{ billet_gate_check.stdout_lines[-12:] | default([]) }}"

        # A SECOND PASS OF THESE TASKS CHANGES NOTHING, counted as a converge counts
        # it: a fleet's converge fails any host whose second pass reports a change,
        # so a scratch copy reported as changed would fail every converge after the
        # first. This covers the filter's tasks alone; the rest of a Ceph host's
        # converge needs a real cluster, and the consumer's own second pass is
        # where that is proved.
        - name: Write a play that converges a host's filter, for the count
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/idem-play.yml"
            mode: "0644"
            content: |
              - hosts: localhost
                gather_facts: false
                connection: local
                tasks:
                  - name: Converge the host's filter
                    ansible.builtin.include_role:
                      name: junioryono.billet.host
                      tasks_from: lvm-rbd-filter
                    vars:
                      billet_lvm_system_dir: "{{ billet_gate_tree.path }}/idem"

        - name: Converge the host twice
          ansible.builtin.command:
            argv: [ansible-playbook, -i, "localhost,", "{{ billet_gate_tree.path }}/idem-play.yml"]
          register: billet_gate_idem
          loop: [first, second]
          changed_when: false
          failed_when: false

        - name: The first converge wrote the filter and the second changed nothing
          ansible.builtin.assert:
            that:
              - billet_gate_idem.results[0].rc == 0
              - billet_gate_idem.results[1].rc == 0
              - "billet_gate_idem.results[0].stdout is search('localhost +: ok=[0-9]+ +changed=[1-9]')"
              - "billet_gate_idem.results[1].stdout is search('localhost +: ok=[0-9]+ +changed=0 ')"
            fail_msg: >-
              first: {{ billet_gate_idem.results[0].stdout_lines[-3:] | default([]) }};
              second: {{ billet_gate_idem.results[1].stdout_lines[-3:] | default([]) }}

        - name: Converge a host with no LVM
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/absent"

        - name: No LVM, nothing written
          ansible.builtin.assert:
            that: not (billet_gate_tree.path ~ '/absent') is exists

        - name: Find the LVM copy directories after the cases
          ansible.builtin.find:
            paths: "{{ ['/tmp', billet_gate_tree.path | dirname] | unique }}"
            patterns: "*-billet-lvm"
            file_type: directory
          register: billet_gate_copies_after
          become: true

        - name: Every case removed its copy, the refused and the failed ones too
          ansible.builtin.assert:
            that: >-
              (billet_gate_copies_after.files | map(attribute='path') | sort)
              == (billet_gate_copies_before.files | map(attribute='path') | sort)
            fail_msg: "left behind: {{ billet_gate_copies_after.files | map(attribute='path') | difference(billet_gate_copies_before.files | map(attribute='path')) }}"
      always:
        - name: Remove the tree
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}"
            state: absent
          become: true
