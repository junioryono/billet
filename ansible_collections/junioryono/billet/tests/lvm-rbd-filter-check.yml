---
# Runs the host role's LVM filter tasks (tasks_from: lvm-rbd-filter) against a
# temporary LVM configuration directory, with the real lvmconfig reading it through
# LVM_SYSTEM_DIR, escalated as the role runs them:
#
#   - a package's lvm.conf with no filter: billet's block is written, LVM applies
#     exactly it, the operator's own lvmlocal.conf lines are kept, and a second
#     converge changes nothing;
#   - billet_lvm_rbd_filter false: the block is removed and nothing else is;
#   - an lvm.conf that sets its own global_filter: refused by its name, and
#     lvmlocal.conf left as it was;
#   - no lvm.conf at all: nothing is created.
- name: The host role keeps LVM's scans off mapped RBD images
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    billet_gate_block: |
      devices {
      	global_filter = [ "r|^/dev/rbd|", "r|^/dev/nbd|", "a|.*|" ]
      }

  tasks:
    - name: Make the tree the cases run in
      ansible.builtin.tempfile:
        state: directory
        suffix: -lvm-filter
      register: billet_gate_tree

    - name: Run the cases and remove the tree
      block:
        - name: Make the two configured hosts' directories
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}/{{ item }}"
            state: directory
            mode: "0755"
          loop: [plain, own]

        - name: Write a package's lvm.conf with no filter and an operator's lvmlocal.conf
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/plain/{{ item.name }}"
            content: "{{ item.content }}"
            mode: "0644"
          loop:
            - {name: lvm.conf, content: "devices {\n\t# filter = [ \"a|.*|\" ]\n}\n"}
            - {name: lvmlocal.conf, content: "local {\n\tsystem_id = \"operator\"\n}\n"}
          loop_control:
            label: "{{ item.name }}"

        - name: Converge the plain host
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"

        - name: Read lvmlocal.conf after the first converge
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_first

        - name: Ask LVM what it applies
          ansible.builtin.command:
            argv: [lvmconfig, devices/global_filter]
          environment:
            LVM_SYSTEM_DIR: "{{ billet_gate_tree.path }}/plain"
          register: billet_gate_applied
          changed_when: false
          become: true

        - name: LVM applies billet's filter and the operator's lines are kept
          ansible.builtin.assert:
            that:
              - billet_gate_applied.stdout | trim == 'global_filter=["r|^/dev/rbd|","r|^/dev/nbd|","a|.*|"]'
              - "'system_id = \"operator\"' in (billet_gate_first.content | b64decode)"
              - billet_gate_block in (billet_gate_first.content | b64decode)
            fail_msg: "LVM applies {{ billet_gate_applied.stdout }}; lvmlocal.conf is {{ billet_gate_first.content | b64decode }}"

        - name: Converge the plain host again
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"

        - name: Read lvmlocal.conf after the second converge
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_second

        - name: A second converge changes nothing
          ansible.builtin.assert:
            that: billet_gate_second.content == billet_gate_first.content

        - name: Converge the plain host with the filter turned off
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/plain"
            billet_lvm_rbd_filter: false

        - name: Read lvmlocal.conf with the filter off
          ansible.builtin.slurp:
            src: "{{ billet_gate_tree.path }}/plain/lvmlocal.conf"
          register: billet_gate_off

        - name: Off removes billet's block and only it
          ansible.builtin.assert:
            that: (billet_gate_off.content | b64decode) == "local {\n\tsystem_id = \"operator\"\n}\n"
            fail_msg: "lvmlocal.conf is {{ billet_gate_off.content | b64decode }}"

        - name: Write an lvm.conf that sets its own filter
          ansible.builtin.copy:
            dest: "{{ billet_gate_tree.path }}/own/lvm.conf"
            content: "devices {\n\tglobal_filter = [ \"r|^/dev/sdz|\", \"a|.*|\" ]\n}\n"
            mode: "0644"

        - name: Converge the host with its own filter
          block:
            - name: Include the role's LVM filter tasks
              ansible.builtin.include_role:
                name: junioryono.billet.host
                tasks_from: lvm-rbd-filter
              vars:
                billet_lvm_system_dir: "{{ billet_gate_tree.path }}/own"

            - name: The operator's filter was not refused
              ansible.builtin.fail:
                msg: The role would have replaced a global_filter the operator wrote.
          rescue:
            - name: Refused by the setting's name, before anything was written
              ansible.builtin.assert:
                that:
                  - "'sets devices/global_filter' in ansible_failed_result.msg"
                  - not (billet_gate_tree.path ~ '/own/lvmlocal.conf') is exists
                fail_msg: "{{ ansible_failed_result.msg }}"

        - name: Converge a host with no LVM
          ansible.builtin.include_role:
            name: junioryono.billet.host
            tasks_from: lvm-rbd-filter
          vars:
            billet_lvm_system_dir: "{{ billet_gate_tree.path }}/absent"

        - name: Nothing is created where LVM is not configured
          ansible.builtin.stat:
            path: "{{ billet_gate_tree.path }}/absent"
          register: billet_gate_absent

        - name: No LVM, nothing written
          ansible.builtin.assert:
            that: not billet_gate_absent.stat.exists
      always:
        - name: Remove the tree
          ansible.builtin.file:
            path: "{{ billet_gate_tree.path }}"
            state: absent
          become: true
