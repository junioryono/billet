---
- name: Clear the preceding case's observations and sentinels
  ansible.builtin.file:
    path: "{{ billet_gate_environment_root.path }}/{{ item }}"
    state: absent
  loop: [called, environment, replaced, restarted]

- name: Plant an empty existing environment file without credential contents
  ansible.builtin.copy:
    content: ''
    dest: "{{ billet_gate_environment_root.path }}/environment"
    mode: "0600"
  when: billet_gate_environment_case.exists

- name: Prepare this case's typed observation
  ansible.builtin.set_fact:
    billet_gate_environment_refused: false
    billet_exclusion_answerer: "{{ billet_gate_environment_root.path }}/inspect"
    billet_gate_specs: >-
      {{ {'empty': [], 'absent': none, 'unknown': {'unknown': 'malformed optionality'},
          'malformed': [{'path': billet_gate_environment_root.path ~ '/environment', 'ignore_errors': 'yes'}],
          'multiple': [billet_gate_spec, billet_gate_spec],
          'unsupported': [{'path': '/etc/billet/%n.env', 'ignore_errors': false}]}.get(billet_gate_environment_case.shape, [billet_gate_spec]) }}
  vars:
    billet_gate_spec: {path: "{{ billet_gate_environment_root.path }}/environment", ignore_errors: "{{ billet_gate_environment_case.optional }}"}

- name: Write the opening release inspection envelope
  ansible.builtin.copy:
    content: "{{ {'services': {'node': {'unit_present': billet_gate_environment_case.shape != 'absent', 'environment_file_specs': billet_gate_specs}}} | to_json }}"
    dest: "{{ billet_gate_environment_root.path }}/opening.json"
    mode: "0600"

- name: Write the closing release inspection envelope
  ansible.builtin.copy:
    content: "{{ {'services': {'node': {'unit_present': billet_gate_environment_case.shape != 'absent', 'environment_file_specs': ([] if billet_gate_environment_case.shape == 'changing' else billet_gate_specs)}}} | to_json }}"
    dest: "{{ billet_gate_environment_root.path }}/closing.json"
    mode: "0600"

- name: Exercise the production reader before replacement
  block:
    - name: Read and reobserve typed node environment operands
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: node-environment

    - name: Plant the pre-projection effective document and a conflicting public environment
      ansible.builtin.set_fact:
        billet_effective_config: {server: {identity_dir: /var/lib/billet/server}, node: {state_dir: /var/lib/billet/node}}
        billet_server_environment: {INVENTORY_ONLY: unused}

    - name: Render the supported node unit before projection
      ansible.builtin.set_fact:
        billet_gate_installed_unit: "{{ lookup('ansible.builtin.template', billet_gate_role + '/templates/billet-node.service.j2') }}"

    - name: Plant the supported installed unit
      ansible.builtin.copy:
        content: "{{ billet_gate_installed_unit }}"
        dest: "{{ billet_gate_environment_root.path }}/replaced"
        mode: "0600"

    - name: Remove controller members and environment inventory without changing installed node operands
      ansible.builtin.set_fact:
        billet_effective_config: {node: {state_dir: /var/lib/billet/node}}
        billet_server_environment: {}

    - name: Render the same unit after projection through the production template
      ansible.builtin.template:
        src: "{{ billet_gate_role }}/templates/billet-node.service.j2"
        dest: "{{ billet_gate_environment_root.path }}/replaced"
        mode: "0600"
      register: billet_gate_projected_unit

    - name: Record a restart only if projection changed the unit
      ansible.builtin.copy:
        content: restarted
        dest: "{{ billet_gate_environment_root.path }}/restarted"
        mode: "0600"
      when: billet_gate_projected_unit.changed

    - name: Supply the unchanged non-unit inputs to the production restart predicate
      ansible.builtin.set_fact:
        billet_config_install: {changed: false}
        billet_firecracker_install: {changed: false}
        billet_firecracker_links: {changed: false}
        billet_server_environment_install: {changed: false}
        billet_unit_templates_by_unit: "{{ {'billet-node.service': billet_gate_projected_unit} }}"

    - name: Require projection alone to leave the production restart predicate false
      vars:
        billet_gate_service_tasks: "{{ lookup('ansible.builtin.file', billet_gate_role + '/tasks/services.yml') | from_yaml }}"
        billet_gate_restart_task: "{{ billet_gate_service_tasks | selectattr('name', 'equalto', 'Restart the billet node after non-binary inputs change') | first }}"
      ansible.builtin.assert:
        that: "{{ ['not (' ~ billet_gate_restart_task.when[-1] ~ ')'] }}"

    - name: Require typed optionality and filename preservation in the rendered bytes
      ansible.builtin.assert:
        that:
          - not billet_gate_projected_unit.changed
          - billet_node_environment_files == billet_gate_specs
          - >-
            ('EnvironmentFile=' ~ ('-' if billet_gate_environment_case.optional else '') ~ billet_gate_environment_root.path ~ '/environment')
            in billet_gate_installed_unit if billet_gate_specs | length > 0 else 'EnvironmentFile=' not in billet_gate_installed_unit
  rescue:
    - name: Require the expected refusal at the production observation boundary
      ansible.builtin.assert:
        that:
          - billet_gate_environment_case.refuses
          - ansible_failed_task.name in ['Decode the installed node environment', 'Require the retained node unit to exist', 'Prove the retained environment files are readable or optionally absent', 'Require unchanged typed node environment observations']
    - name: Record the observation refusal
      ansible.builtin.set_fact:
        billet_gate_environment_refused: true

- name: Observe the unit replacement and restart sentinels
  ansible.builtin.stat:
    path: "{{ billet_gate_environment_root.path }}/{{ item }}"
  loop: [replaced, restarted]
  register: billet_gate_environment_sentinels

- name: Require refusal before replacement and byte stability on every supported case
  ansible.builtin.assert:
    that:
      - billet_gate_environment_refused == billet_gate_environment_case.refuses
      - billet_gate_environment_sentinels.results[0].stat.exists == (not billet_gate_environment_case.refuses)
      - not billet_gate_environment_sentinels.results[1].stat.exists
