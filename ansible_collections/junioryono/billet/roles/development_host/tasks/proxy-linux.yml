---
- name: Install the Linux development proxy service
  ansible.builtin.template:
    src: billet-development-proxy.service.j2
    dest: "/etc/systemd/system/{{ billet_development_proxy_systemd_unit }}"
    owner: root
    group: root
    mode: "0644"
  register: billet_development_proxy_linux_service
  become: true

- name: Enable and converge the Linux development proxy
  ansible.builtin.systemd_service:
    name: "{{ billet_development_proxy_systemd_unit }}"
    enabled: true
    daemon_reload: "{{ billet_development_proxy_linux_service is changed }}"
    state: >-
      {{
        'restarted' if
        billet_development_proxy_linux_service is changed or
        billet_development_proxy_config_copy is changed or
        billet_development_proxy_config_template is changed or
        billet_development_proxy_environment_file is changed or
        billet_development_certificate_mint is changed or
        billet_development_certificate_permissions is changed
        else 'started'
      }}
  become: true
