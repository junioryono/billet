---
- name: Install the macOS development proxy LaunchDaemon
  ansible.builtin.template:
    src: io.billet.development-proxy.plist.j2
    dest: "/Library/LaunchDaemons/{{ billet_development_proxy_launchd_label }}.plist"
    owner: root
    group: wheel
    mode: "0644"
  register: billet_development_proxy_macos_service
  become: true

- name: Inspect the macOS development proxy definition
  ansible.builtin.command:
    argv: [launchctl, print, "system/{{ billet_development_proxy_launchd_label }}"]
  register: billet_development_proxy_macos_status
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Remove a stale macOS development proxy definition
  ansible.builtin.command:
    argv: [launchctl, bootout, "system/{{ billet_development_proxy_launchd_label }}"]
  when:
    - billet_development_proxy_macos_service is changed
    - billet_development_proxy_macos_status.rc == 0
  failed_when: false
  changed_when: false
  become: true

- name: Load the macOS development proxy definition
  ansible.builtin.command:
    argv:
      - launchctl
      - bootstrap
      - system
      - "/Library/LaunchDaemons/{{ billet_development_proxy_launchd_label }}.plist"
  when: >-
    billet_development_proxy_macos_service is changed or
    billet_development_proxy_macos_status.rc != 0
  changed_when: true
  become: true

- name: Restart the loaded macOS development proxy after input changes
  ansible.builtin.command:
    argv: [launchctl, kickstart, -k, "system/{{ billet_development_proxy_launchd_label }}"]
  when: >-
    billet_development_proxy_macos_service is not changed and
    billet_development_proxy_macos_status.rc == 0 and
    (
      billet_development_proxy_config_copy is changed or
      billet_development_proxy_config_template is changed or
      billet_development_proxy_environment_file is changed or
      billet_development_certificate_mint is changed or
      billet_development_certificate_permissions is changed or
      billet_development_certificate_prediction is changed or
      billet_development_proxy_files_prediction is changed
    )
  changed_when: true
  become: true
