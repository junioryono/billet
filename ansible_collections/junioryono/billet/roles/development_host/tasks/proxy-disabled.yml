---
- name: Inspect the Linux development proxy definition
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ billet_development_proxy_systemd_unit }}"
  register: billet_development_proxy_disabled_linux_definition
  when: ansible_facts["system"] == "Linux"
  become: true

- name: Stop and disable the Linux development proxy
  ansible.builtin.systemd_service:
    name: "{{ billet_development_proxy_systemd_unit }}"
    enabled: false
    state: stopped
  when:
    - ansible_facts["system"] == "Linux"
    - billet_development_proxy_disabled_linux_definition.stat.exists
    - not ansible_check_mode
  become: true

- name: Remove the disabled Linux development proxy definition
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ billet_development_proxy_systemd_unit }}"
    state: absent
  register: billet_development_proxy_disabled_linux_removal
  when: ansible_facts["system"] == "Linux"
  become: true

- name: Reload systemd after removing the development proxy
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - ansible_facts["system"] == "Linux"
    - billet_development_proxy_disabled_linux_removal is changed
    - not ansible_check_mode
  become: true

- name: Inspect the disabled macOS development proxy
  ansible.builtin.command:
    argv: [launchctl, print, "system/{{ billet_development_proxy_launchd_label }}"]
  register: billet_development_proxy_disabled_macos_status
  changed_when: false
  failed_when: false
  when: ansible_facts["system"] == "Darwin"
  become: true

- name: Unload the disabled macOS development proxy
  ansible.builtin.command:
    argv: [launchctl, bootout, "system/{{ billet_development_proxy_launchd_label }}"]
  changed_when: true
  when:
    - ansible_facts["system"] == "Darwin"
    - billet_development_proxy_disabled_macos_status.rc == 0
    - not ansible_check_mode
  become: true

- name: Remove the disabled macOS development proxy definition
  ansible.builtin.file:
    path: "/Library/LaunchDaemons/{{ billet_development_proxy_launchd_label }}.plist"
    state: absent
  when: ansible_facts["system"] == "Darwin"
  become: true
