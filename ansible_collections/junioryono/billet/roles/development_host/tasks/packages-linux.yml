---
- name: Inspect the development package staging directory
  ansible.builtin.stat:
    path: "{{ billet_development_apt_stage }}"
  register: billet_development_apt_stage_stat
  become: true

# THE KEYRINGS ARE REPAIRED BEFORE ANY CACHE UPDATE. A publisher that rotates
# its signing key leaves every host holding the previous one, and from then on
# every apt cache update on that host fails with NO_PUBKEY, the prerequisites'
# included; so the verified keys go in first, or the role could never repair a
# rotation it knows about (HashiCorp's of 2026-09-09, measured on the reference
# deployment's node, whose converge failed at its first apt task).
#
# THE BOOTSTRAP: the download needs a CA store and the verifier needs gpg, and
# a host may lack either (a minimal image; a host provisioned with the
# repositories and keyrings but not the tool). Both are probed as root, the
# account the verifier runs as, since a gpg on the connecting user's PATH says
# nothing about root's. The bootstrap refreshes the lists with apt-get itself
# and not the apt module: apt-get reports a source it cannot verify as a
# warning and exits 0 (measured 2026-09-11 in ubuntu:24.04 with a deb822 source
# whose Signed-By names no key), so a stale third-party keyring on such a host
# does not stop the distribution's own packages from installing, where the
# module reads the same warning as a failed update and would leave the host
# unable to repair itself.
- name: Inspect whether gpg and a CA store are present for the key download and verifier
  ansible.builtin.command:
    argv: [sh, -c, "command -v gpg >/dev/null && test -r /etc/ssl/certs/ca-certificates.crt"]
  register: billet_development_bootstrap_probe
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Refresh the distribution's package lists before the bootstrap
  ansible.builtin.command:
    argv: [apt-get, -o, Acquire::Retries=3, update]
  changed_when: false
  when:
    - not ansible_check_mode
    - billet_development_bootstrap_probe.rc != 0
  become: true

- name: Install gnupg and ca-certificates before any repository key is fetched or verified
  ansible.builtin.apt:
    name:
      - ca-certificates
      - gnupg
    state: present
  when:
    - not ansible_check_mode
    - billet_development_bootstrap_probe.rc != 0
  become: true

- name: Create the development package staging directory
  ansible.builtin.file:
    path: "{{ billet_development_apt_stage }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

- name: Download development repository signing keys
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ billet_development_apt_stage }}/{{ item.name }}.asc"
    timeout: "{{ billet_development_fetch_timeout }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - { name: caddy, url: "https://dl.cloudsmith.io/public/caddy/stable/gpg.key" }
    - { name: hashicorp, url: "https://apt.releases.hashicorp.com/gpg" }
  register: billet_development_key_download
  until: billet_development_key_download is succeeded
  retries: "{{ billet_development_fetch_retries }}"
  delay: "{{ billet_development_fetch_retry_delay }}"
  when: not ansible_check_mode or billet_development_apt_stage_stat.stat.exists
  become: true

- name: Install the repository key verifier
  ansible.builtin.copy:
    src: verify-repository-key.sh
    dest: "{{ billet_development_apt_stage }}/verify-repository-key.sh"
    owner: root
    group: root
    mode: "0700"
  when: not ansible_check_mode or billet_development_apt_stage_stat.stat.exists
  become: true

- name: Verify development repository primary signing fingerprints
  ansible.builtin.command:
    argv:
      - "{{ billet_development_apt_stage }}/verify-repository-key.sh"
      - "{{ billet_development_apt_stage }}/{{ item.key }}.asc"
      - "{{ item.fingerprint }}"
  loop:
    - name: Caddy
      key: caddy
      fingerprint: "{{ billet_development_caddy_signing_fingerprint }}"
    - name: HashiCorp
      key: hashicorp
      fingerprint: "{{ billet_development_hashicorp_signing_fingerprint }}"
  changed_when: false
  when: not ansible_check_mode
  become: true

- name: Install verified development repository keys
  ansible.builtin.copy:
    src: "{{ billet_development_apt_stage }}/{{ item }}.asc"
    dest: "/etc/apt/keyrings/{{ item }}.asc"
    remote_src: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - caddy
    - hashicorp
  register: billet_development_key_install
  when: not ansible_check_mode
  become: true

- name: Install development package prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - debian-keyring
      - debian-archive-keyring
      - gnupg
      - libnss3-tools
      - mkcert
      - python3-debian
    state: present
    update_cache: true
  become: true

- name: Inspect development repository artifacts
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ billet_development_apt_stage }}/caddy.asc"
    - "{{ billet_development_apt_stage }}/hashicorp.asc"
    - /etc/apt/keyrings/caddy.asc
    - /etc/apt/keyrings/hashicorp.asc
    - /etc/apt/sources.list.d/caddy-stable.sources
    - /etc/apt/sources.list.d/hashicorp.sources
  register: billet_development_apt_artifacts
  become: true

- name: Inspect deb822 repository support
  ansible.builtin.command:
    argv:
      - "{{ ansible_facts['python']['executable'] }}"
      - -c
      - import debian.deb822
  register: billet_development_deb822_support
  changed_when: false
  failed_when: false
  check_mode: false

- name: Add the Caddy repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: /etc/apt/keyrings/caddy.asc
    state: present
    enabled: true
  register: billet_development_caddy_repository
  when: not ansible_check_mode or billet_development_deb822_support.rc == 0
  become: true

- name: Add the HashiCorp repository
  ansible.builtin.deb822_repository:
    name: hashicorp
    types: [deb]
    uris: https://apt.releases.hashicorp.com
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [main]
    signed_by: /etc/apt/keyrings/hashicorp.asc
    state: present
    enabled: true
  register: billet_development_hashicorp_repository
  when:
    - billet_development_install_terraform
    - not ansible_check_mode or billet_development_deb822_support.rc == 0
  become: true

# A key-only replacement (a rotation) refreshes the cache too: the repository
# definitions keep their signed_by paths, so nothing else would notice.
- name: Refresh apt for development repositories
  ansible.builtin.apt:
    update_cache: true
  when:
    - not ansible_check_mode
    - >-
      billet_development_caddy_repository is changed or
      billet_development_hashicorp_repository is changed or
      billet_development_key_install is changed
  become: true

- name: Decide whether Linux package metadata is ready
  ansible.builtin.import_tasks: package-readiness.yml

- name: Install Caddy and Terraform
  ansible.builtin.apt:
    name: "{{ ['caddy'] + (['terraform'] if billet_development_install_terraform else []) }}"
    state: latest
  when: billet_development_linux_packages_ready
  become: true

- name: Predict first-run Linux repository and package installation
  ansible.builtin.debug:
    msg: "Would verify the publisher repositories and install {{ (['Caddy', 'mkcert'] + (['Terraform'] if billet_development_install_terraform else [])) | join(', ') }}."
  register: billet_development_linux_package_prediction
  when:
    - ansible_check_mode
    - >-
      not billet_development_apt_stage_stat.stat.exists or
      not billet_development_apt_artifacts.results[0].stat.exists or
      not billet_development_linux_packages_ready or
      (billet_development_install_terraform and
      not billet_development_apt_artifacts.results[1].stat.exists)
  changed_when: true

- name: Inspect installed Linux services
  ansible.builtin.service_facts:

- name: Stop the package's default Caddy service
  ansible.builtin.systemd_service:
    name: caddy.service
    enabled: false
    state: stopped
  when:
    - not ansible_check_mode or 'caddy.service' in ansible_facts.services
  become: true

- name: Record Linux development tool paths
  ansible.builtin.set_fact:
    billet_development_caddy_bin: /usr/bin/caddy
    billet_development_mkcert_bin: /usr/bin/mkcert
    billet_development_terraform_bin: /usr/bin/terraform
