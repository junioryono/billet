---
- name: Create development TLS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "0700"
  loop:
    - "{{ billet_development_tls_caroot }}"
    - "{{ billet_development_tls_dir }}"
  become: true

- name: Create and trust the local development CA
  ansible.builtin.command:
    argv: ["{{ billet_development_mkcert_bin }}", -install]
  environment:
    CAROOT: "{{ billet_development_tls_caroot }}"
    HOME: "{{ billet_development_home }}"
  become: true
  register: billet_development_mkcert_install
  changed_when: "'Created a new local CA' in billet_development_mkcert_install.stdout"

- name: Return the local development CA to its user
  ansible.builtin.file:
    path: "{{ billet_development_tls_caroot }}"
    state: directory
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    recurse: true
  become: true

- name: Protect the local development CA directory
  ansible.builtin.file:
    path: "{{ billet_development_tls_caroot }}"
    state: directory
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "0700"
  become: true

- name: Inspect the development certificate inputs
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ billet_development_tls_cert_path }}"
    - "{{ billet_development_tls_key_path }}"
    - "{{ billet_development_tls_dir }}/sans.json"
  register: billet_development_tls_inputs

- name: Read the recorded development certificate SANs
  ansible.builtin.slurp:
    src: "{{ billet_development_tls_dir }}/sans.json"
  register: billet_development_tls_sans_recorded
  when: billet_development_tls_inputs.results[2].stat.exists

- name: Read the installed development certificate public key
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ billet_development_tls_cert_path }}", -pubkey, -noout]
  register: billet_development_installed_certificate_public_key
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - billet_development_tls_inputs.results[0].stat.exists
    - billet_development_tls_inputs.results[1].stat.exists

- name: Read the installed development private key's public half
  ansible.builtin.command:
    argv: [openssl, pkey, -in, "{{ billet_development_tls_key_path }}", -pubout]
  register: billet_development_installed_private_public_key
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  when:
    - billet_development_tls_inputs.results[0].stat.exists
    - billet_development_tls_inputs.results[1].stat.exists

- name: Decide whether to mint the development certificate
  ansible.builtin.set_fact:
    billet_development_tls_needs_certificate: >-
      {{
        not billet_development_tls_inputs.results[0].stat.exists or
        not billet_development_tls_inputs.results[1].stat.exists or
        not billet_development_tls_inputs.results[2].stat.exists or
        (billet_development_installed_certificate_public_key.rc | default(1)) != 0 or
        (billet_development_installed_private_public_key.rc | default(1)) != 0 or
        ((billet_development_installed_certificate_public_key.stdout | default('')) != (billet_development_installed_private_public_key.stdout | default(''))) or
        ((billet_development_tls_sans_recorded.content | default('') | b64decode | trim) != (billet_development_tls_sans | to_json))
      }}

- name: Mint the development certificate
  ansible.builtin.command:
    argv: "{{ [billet_development_mkcert_bin, '-cert-file', billet_development_tls_dir ~ '/.development-next.pem', '-key-file', billet_development_tls_dir ~ '/.development-next-key.pem'] + billet_development_tls_sans }}"
  environment:
    CAROOT: "{{ billet_development_tls_caroot }}"
    HOME: "{{ billet_development_home }}"
  become: true
  become_user: "{{ billet_development_user }}"
  register: billet_development_certificate_mint
  when: billet_development_tls_needs_certificate
  changed_when: true

- name: Read the staged development certificate public key
  ansible.builtin.command:
    argv: [openssl, x509, -in, "{{ billet_development_tls_dir }}/.development-next.pem", -pubkey, -noout]
  register: billet_development_staged_certificate_public_key
  changed_when: false
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Read the staged development private key's public half
  ansible.builtin.command:
    argv: [openssl, pkey, -in, "{{ billet_development_tls_dir }}/.development-next-key.pem", -pubout]
  register: billet_development_staged_private_public_key
  changed_when: false
  no_log: true
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Refuse a mismatched staged development identity
  ansible.builtin.assert:
    that: billet_development_staged_certificate_public_key.stdout == billet_development_staged_private_public_key.stdout
    fail_msg: The staged development certificate and private key do not match.
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Install the staged development private key
  ansible.builtin.copy:
    src: "{{ billet_development_tls_dir }}/.development-next-key.pem"
    dest: "{{ billet_development_tls_key_path }}"
    remote_src: true
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "0600"
  become: true
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Install the matching staged development certificate
  ansible.builtin.copy:
    src: "{{ billet_development_tls_dir }}/.development-next.pem"
    dest: "{{ billet_development_tls_cert_path }}"
    remote_src: true
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "0644"
  become: true
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Remove staged development identity files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ billet_development_tls_dir }}/.development-next.pem"
    - "{{ billet_development_tls_dir }}/.development-next-key.pem"
  become: true
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode

- name: Record the development certificate SANs
  ansible.builtin.copy:
    dest: "{{ billet_development_tls_dir }}/sans.json"
    content: "{{ billet_development_tls_sans | to_json }}\n"
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "0600"
  when:
    - billet_development_tls_needs_certificate
    - not ansible_check_mode
  become: true

- name: Protect development certificate material
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ billet_development_user }}"
    group: "{{ billet_development_group_result.stdout }}"
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ billet_development_tls_cert_path }}", mode: "0644" }
    - { path: "{{ billet_development_tls_key_path }}", mode: "0600" }
  become: true
  register: billet_development_certificate_permissions
  when: >-
    not ansible_check_mode or
    (billet_development_tls_inputs.results[0].stat.exists and
    billet_development_tls_inputs.results[1].stat.exists)
