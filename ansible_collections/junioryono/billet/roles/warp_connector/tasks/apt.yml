---
# Cloudflare's WARP client repository, trusted only after its signing key has
# been verified against the pinned fingerprint; staged root-only and verified
# before it lands at the trusted path, as the cloudflared role does.

- name: Remove the key an earlier convention staged in world-writable /tmp
  ansible.builtin.file:
    path: /tmp/cloudflare-warp.asc
    state: absent
  become: true

- name: Create a private staging directory for the signing key
  ansible.builtin.file:
    path: "{{ billet_warp_stage_dir }}"
    state: directory
    mode: "0700"
  become: true

- name: Stage the Cloudflare WARP signing key
  ansible.builtin.get_url:
    url: "{{ billet_warp_signing_key_url }}"
    dest: "{{ billet_warp_stage_dir }}/cloudflare-warp.asc"
    mode: "0600"
    timeout: "{{ billet_fetch_timeout }}"
  register: billet_warp_key_fetch
  until: billet_warp_key_fetch is succeeded
  retries: "{{ billet_fetch_retries }}"
  delay: "{{ billet_fetch_retry_delay }}"
  become: true

- name: Read the staged signing key's fingerprint
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, "{{ billet_warp_stage_dir }}/cloudflare-warp.asc"]
  register: billet_warp_key
  changed_when: false
  check_mode: false
  become: true

- name: Verify the Cloudflare WARP signing key
  ansible.builtin.assert:
    that:
      - (billet_warp_key.stdout_lines | default([]) | select('match', '^pub:') | list | length) == 1
      - ((billet_warp_key.stdout_lines | default([]) | select('match', '^fpr:::::::::') | list | first) | default(''))
        == ('fpr:::::::::' ~ billet_warp_signing_fingerprint ~ ':')
    fail_msg: >-
      The Cloudflare WARP signing key is not exactly one primary key with the
      pinned fingerprint {{ billet_warp_signing_fingerprint }}. Refusing to add
      the repository. Either the download was intercepted or Cloudflare rotated
      the key: confirm against pkg.cloudflareclient.com from a trusted network
      before updating billet_warp_signing_fingerprint.

# REWRITTEN FROM THE VERIFIED SOURCE EVERY RUN, never gated on the keyring
# existing: that froze a rotated upstream key out of the trusted path forever.
- name: Convert the verified key to a keyring
  ansible.builtin.command:
    argv: [gpg, --yes, --dearmor, -o, "{{ billet_warp_keyring_path }}", "{{ billet_warp_stage_dir }}/cloudflare-warp.asc"]
  changed_when: false
  become: true

- name: Add the Cloudflare WARP apt repository
  ansible.builtin.deb822_repository:
    name: cloudflare-client
    types: [deb]
    uris: "{{ billet_warp_apt_uri }}"
    suites: ["{{ billet_warp_apt_suite }}"]
    components: [main]
    signed_by: "{{ billet_warp_keyring_path }}"
    state: present
    enabled: true
  register: billet_warp_repo
  become: true

- name: Remove a superseded one-line repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflare-client.list
    state: absent
  become: true

- name: Refresh the apt cache for the Cloudflare WARP repository
  ansible.builtin.apt:
    update_cache: true
  when: billet_warp_repo is changed
  become: true

- name: Install the Cloudflare WARP client
  ansible.builtin.apt:
    name: cloudflare-warp
    state: present
  become: true
