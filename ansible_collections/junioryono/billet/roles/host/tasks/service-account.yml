---
# THE SERVICE-ACCOUNT RECORD AND BOTH AUTHORITY LOCKS, PROVISIONED BY THE ROLE.
#
# `billet local prepare` is the privileged bootstrap every installer runs: it
# records the account the units run as (a root-provided ownership assertion the
# lock owners and the hand-back of root-created identity artefacts consult),
# creates the server's identity directory on a positively fresh host (before
# any metadata exists beside it; never beside a global lock or a status, which
# a retirement leaves and a bootstrap must not recreate over), creates or
# repairs the global authority lock and the identity directory's own lock by
# descriptor, and reads back the published authority status. It authorises
# nothing: a closed status is a retired controller, and the role's later tasks
# decide from the fact this file sets what a closed authority forbids.
#
# TWO CALL SITES, ONE FILE. On an EXISTING installation this runs early (after
# the exclusion is prepared, before any retirement dispatch), so a converge that
# requests a retirement on a host prepared by an older release provisions the
# record first and reaches its request. On a POSITIVELY FRESH host (no installed
# units, no account) the early site is skipped, because the account it would
# record does not exist yet, and the file runs again after account.yml has
# created the validated account and /var/lib/billet, BEFORE the services
# transaction runs its root `billet check` (which creates the identity and the
# ledger on a fresh host, and hands them back only once the record exists). The
# caller says which site it is through billet_service_account_site.
#
# WHAT RUNS THE COMMAND is the executable the preparation recorded as able to
# answer for this converge (billet_exclusion_answerer: the managed binary, the
# verified fallback, or the staged candidate that answered the first call),
# because on a fresh host the managed binary is installed by the transaction
# later than this, and a release before this command cannot prepare the host
# at all: under the legacy shape the record is not written, the host stays on
# the legacy path, and a retirement request on it refuses naming the
# installers.
- name: Validate the installed service identity before the account is recorded
  ansible.builtin.import_tasks: installed-identity.yml
  when: billet_service_account_site == 'early'

# THE ACCOUNT IS LOOKED UP AGAIN AT THE LATE SITE: the passwd fact the early
# validation cached predates account.yml's creation of the account, and a
# cached None would skip the bootstrap on every fresh host.
- name: Look the service account up after its creation
  ansible.builtin.getent:
    database: passwd
    key: "{{ billet_service_user }}"
    fail_key: false
  when: billet_service_account_site == 'late'

- name: Decide whether this host's service account exists to be recorded
  ansible.builtin.set_fact:
    billet_service_account_present: >-
      {{ ansible_facts.getent_passwd is defined and
         ansible_facts.getent_passwd.get(billet_service_user) is not none }}

# WHICH EXECUTABLE KNOWS `local prepare` IS PROVED, NOT INFERRED. The answerer
# proved it can answer the converge guard, which a release before this command
# also can; `billet local <unknown>` names the local subcommands it knows in
# its refusal, so a probe with a word no release knows answers the question
# without preparing anything, and a staged candidate is asked the same when the
# answerer cannot. THE PROBE WORD CARRIES NO "prepare", because the refusal
# quotes the word it was given, and the match is on the list the refusal ends
# with (`... uninstall or prepare`), never on the echoed word. Nothing runs
# unbounded: a probe that hangs is not capable.
- name: Ask which executable knows how to prepare this host
  ansible.builtin.command:
    argv:
      - timeout
      - -k
      - "5"
      - "20"
      - "{{ item }}"
      - local
      - capability-probe
  loop: >-
    {{ ([billet_exclusion_answerer] if billet_exclusion_answerer | default('') | length > 0 else [])
       + ([billet_candidate_binary.stat.path]
          if billet_candidate_selected | default(false) | bool
             and billet_candidate_binary.stat.path | default('') | length > 0
             and billet_candidate_binary.stat.path != billet_exclusion_answerer | default('')
          else []) }}
  register: billet_prepare_probe
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when:
    - ansible_facts['os_family'] != 'Darwin'
    - billet_service_account_present | bool
    - billet_service_account_site == 'early' or not (billet_service_account_recorded | default(false))

- name: Choose the executable that prepares this host
  ansible.builtin.set_fact:
    billet_prepare_executable: >-
      {{ (billet_prepare_probe.results | default([])
          | selectattr('skipped', 'undefined')
          | selectattr('stderr', 'defined')
          | selectattr('stderr', 'search', '(^|[ ,])prepare($|[ ,.])')
          | map(attribute='item') | list | first) | default('', true) }}

- name: Note that no executable can prepare this host yet
  ansible.builtin.debug:
    msg: >-
      No billet that knows `local prepare` answers for this converge
      ({{ billet_exclusion_binary }} is
      {{ 'absent' if not billet_exclusion_binary_present | default(false) | bool else 'a release before it' }}
      and no staged candidate carries it), so the service-account record is not
      written and this host stays on the legacy authority path until a release
      that carries it is installed.
  when:
    - ansible_facts['os_family'] != 'Darwin'
    - billet_service_account_present | bool
    - billet_prepare_executable | length == 0
    - billet_service_account_site == 'early' or not (billet_service_account_recorded | default(false))

# The bootstrap runs on Linux alone: a darwin host keeps the identity
# directory's own lock as its whole exclusion and records nothing.
- name: Prepare this host's authority exclusion
  ansible.builtin.command:
    argv:
      - "{{ billet_prepare_executable }}"
      - local
      - prepare
      - --config
      - "{{ billet_config_path | default('/etc/billet/billet.yaml') }}"
      - --account
      - "{{ billet_service_user }}"
      - --group
      - "{{ billet_service_group }}"
      - --json
  register: billet_prepare_answer
  changed_when: >-
    billet_prepare_answer.rc == 0 and
    ((billet_prepare_answer.stdout | from_json).created_identity_dir | default(false) | bool or
     ((billet_prepare_answer.stdout | from_json).repaired | default([], true) | length) > 0)
  become: true
  when:
    - ansible_facts['os_family'] != 'Darwin'
    - billet_service_account_present | bool
    - billet_prepare_executable | length > 0
    - billet_service_account_site == 'early' or not (billet_service_account_recorded | default(false))

- name: Note the published authority status
  ansible.builtin.set_fact:
    billet_service_account_recorded: true
    billet_authority_status: "{{ (billet_prepare_answer.stdout | from_json).status }}"
    billet_authority_closed: "{{ (billet_prepare_answer.stdout | from_json).closed | bool }}"
    billet_identity_dir_absent: "{{ (billet_prepare_answer.stdout | from_json).identity_dir_absent | default(false) | bool }}"
  when: billet_prepare_answer is not skipped

# A CLOSED AUTHORITY OR A MOVED DIRECTORY STOPS ORDINARY CONVERGENCE HERE,
# before account.yml would recreate the server's directory and the render its
# configuration: a retired controller stays retired, and the retirement's own
# task file (a later change) is what handles such a host. Until then the
# refusal names the runbook.
- name: Refuse to converge a retired or damaged controller as an ordinary host
  ansible.builtin.assert:
    that:
      - not (billet_authority_closed | default(false) | bool)
      - not (billet_identity_dir_absent | default(false) | bool)
    fail_msg: >-
      This controller's authority is
      {{ 'closed (its retirement is at ' ~ billet_authority_status ~ ')' if billet_authority_closed | default(false) | bool
         else 'open but its identity directory is absent beside existing authority metadata' }};
      a retired controller stays retired and this role does not converge it as
      an ordinary host. docs/operating/upgrades.md says how a host that must
      serve again is commissioned afresh.
  when: billet_prepare_answer is not skipped
