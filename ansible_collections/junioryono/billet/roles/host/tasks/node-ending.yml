---
# A NODE STOP IS PROVED BY THE STOPPED PROCESS'S OWN ENDING, AND A NODE STARTS
# ONLY OVER A PROVED ONE (#127). systemd's exit is not a drain: the node exits 0
# after a drain, a handoff, a drain a second signal cut short and a
# supersession, and a stop killed at TimeoutStopSec leaves inactive/dead/success
# after reset-failed (measured on systemd 255, 2026-10-17). So the role asks the
# node's own record, through `billet node ending`, and goes on only on a proof.
#
# THE EXECUTABLES are tried in the order the caller names them
# (billet_ending_with: each an executable and the configuration it reads, the
# stopped node's own release first), by default this converge's answerer with
# the installed configuration. The first that answers decides. A release from
# before the record refuses the word (`unexpected argument "ending"`) and never
# runs a node, so the next one is asked; when every one is from before the
# record, and only then, the node can only have been one that kept none, and
# systemd's account is the floor, judged here the older way and said to be the
# weaker proof.
#
# Inputs: billet_ending_call ('check' or 'admit-start'); for a check,
# billet_ending_invocation (the node's InvocationID read before its stop, or ''
# for a node that had no process to stop, judged by what its last process left)
# and billet_ending_drain (true where a drain was asked for); billet_ending_with;
# billet_ending_state_dir, where the record is not where the configuration says
# (a converge that is rendering the node's configuration away).

- name: Name the executables that judge the node's ending
  ansible.builtin.set_fact:
    billet_ending_pairs: >-
      {{ (billet_ending_with if billet_ending_with is defined
          else [{'exe': billet_exclusion_answerer | default('', true), 'config': '/etc/billet/billet.yaml'}])
         | selectattr('exe', 'truthy') | list }}

- name: Ask the node's own record how its last process ended
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '-k', '10', '180', item.exe, 'node', 'ending', billet_ending_call, '--config', item.config]
         + (((['--invocation', billet_ending_invocation | string])
              if (billet_ending_invocation | default('') | string | length > 0) else [])
            + (['--drain'] if billet_ending_drain | default(false) | bool else [])
            if billet_ending_call == 'check' else [])
         + ((['--state-dir', billet_ending_state_dir | string])
            if (billet_ending_state_dir | default('') | string | length > 0) else [])
         + ['--json'] }}
    expand_argument_vars: false
  register: billet_ending_raws
  loop: "{{ billet_ending_pairs }}"
  loop_control:
    label: "{{ item.exe }}"
  # THE RECORD IS ROOT'S (0600), so the question is asked as root.
  become: "{{ billet_ending_become | default(true) | bool }}"
  changed_when: false
  failed_when: false

# AN ANSWER FROM ANY OF THEM DECIDES. With none, the first that is not from
# before the record is the failure reported; only when every one is from
# before the record does the parser read it as the floor.
- name: Choose the answer that decides
  vars:
    billet_ending_results: "{{ billet_ending_raws.results | default([]) }}"
    billet_ending_answered: >-
      {{ billet_ending_results | selectattr('rc', 'defined') | selectattr('rc', 'in', [0, 2, 3])
         | selectattr('stdout', 'match', '^\s*\{') | list }}
    billet_ending_newer: >-
      {{ billet_ending_results | rejectattr('stderr', 'search', 'unexpected argument "ending"') | list }}
    billet_ending_chosen: >-
      {{ (billet_ending_answered + billet_ending_newer + billet_ending_results) | first }}
  ansible.builtin.set_fact:
    billet_ending_raw: "{{ billet_ending_chosen }}"
    billet_ending_answered_by: "{{ billet_ending_chosen.item.exe }}"
  when: billet_ending_pairs | length > 0

- name: Judge the node ending's answer
  ansible.builtin.include_tasks: ending-answer.yml
  when: billet_ending_pairs | length > 0

# THE FLOOR, for a node from before the record: systemd's own account, read
# now, with no process and no job, and the clean triple. An older updater's
# check, which a handoff or a cut-short drain also passes.
- name: Read systemd's account of a node from before the record
  ansible.builtin.command:
    argv: [systemctl, show, --property=ActiveState, --property=SubState, --property=Result, --property=MainPID,
           --property=Job, billet-node.service]
  register: billet_ending_floor
  changed_when: false
  failed_when: false
  when: billet_ending_pairs | length == 0 or billet_ending_older | default(false) | bool

- name: Prove a stop of a node from before the record by systemd's account
  ansible.builtin.assert:
    that:
      - billet_ending_floor.rc | default(1) == 0
      - "'ActiveState=inactive' in billet_ending_floor.stdout_lines"
      - "'SubState=dead' in billet_ending_floor.stdout_lines"
      - "'Result=success' in billet_ending_floor.stdout_lines"
      - "'MainPID=0' in billet_ending_floor.stdout_lines"
      - "'Job=' in billet_ending_floor.stdout_lines"
    fail_msg: >-
      billet-node.service runs a release from before the node's ending record,
      so only systemd's account can speak for its
      {{ 'stop' if billet_ending_call == 'check' else 'last stop' }}, and it reports
      {{ billet_ending_floor.stdout_lines | default([]) | join(' ') }}, not inactive,
      dead, success with no process and no job. The node is left as it is; read
      `journalctl -u billet-node` for why. Once whatever it left is known to be
      gone, `systemctl reset-failed billet-node` clears systemd's account and the
      next converge goes on.
  when: billet_ending_pairs | length == 0 or billet_ending_older | default(false) | bool

- name: Refuse a node whose ending its record does not prove
  ansible.builtin.assert:
    that: billet_ending_answer.outcome == 'proved'
    fail_msg: >-
      {{ 'billet-node.service is not started: its last stop' if billet_ending_call == 'admit-start'
         else ('billet-node.service stopped, but its stop'
               if (billet_ending_invocation | default('') | string | length > 0)
               else 'billet-node.service had no process to stop, and what its last process left') }}
      is {{ billet_ending_answer.outcome }} by the node's own ending:
      {{ billet_ending_answer.why }}.
      {{ ('Once what it left is known, `billet node ending acknowledge --config /etc/billet/billet.yaml '
          ~ billet_ending_answer.acknowledge ~ ' --json` permits a start, and nothing that needs a drain.')
         if billet_ending_answer.acknowledge is defined else '' }}
      The node is left as it is.
  when:
    - billet_ending_pairs | length > 0
    - not billet_ending_older | bool
