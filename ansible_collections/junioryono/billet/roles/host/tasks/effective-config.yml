---
# Only an admitted ordinary route consumes desired configuration.
- name: Refuse retained binary transactions before ordinary input or host mutation
  ansible.builtin.import_tasks: retirement-binary-refusal.yml

- name: Require ordinary admission before reading effective configuration
  ansible.builtin.assert:
    that:
      - not billet_retirement_bypass | bool
      - not billet_interrupted_upgrade | bool
      - >-
        (billet_retirement_node_ordinary | bool and billet_retirement_node_verified | bool)
        or (not billet_retirement_node_ordinary | bool
            and billet_retirement_route in ['ordinary', 'cancel', 'unverified-check-mode'])
    fail_msg: Effective configuration requires an admitted ordinary route outside recovery.

- name: Refuse possible recommissioning from frozen controller configuration
  ansible.builtin.assert:
    that:
      - billet_config is mapping
      - "'server' not in billet_config or billet_server_retire | bool"
    fail_msg: >-
      billet_config still contains server on a retired host. Set billet_server_retire
      to retain retirement intent, or supply explicitly serverless configuration;
      ordinary convergence cannot authorize possible recommissioning.
  when: billet_retirement_node_ordinary | bool

- name: Derive the configuration for this ordinary pass
  ansible.builtin.set_fact:
    billet_effective_config: >-
      {{ (billet_config | dict2items | rejectattr('key', 'in', ['server', 'github', 'targets', 'backup']) | items2dict)
         if billet_retirement_node_ordinary | bool else billet_config }}
  no_log: true

- name: Mark this ordinary configuration ready
  ansible.builtin.set_fact:
    billet_effective_ready: true

- name: Apply the admitted ordinary server policy
  ansible.builtin.import_tasks: effective-server-policy.yml
