---
# Inventory is the deployment, not the current control-plane play's host set.
# hostvars resolves billet_config in its own host's context; the ordinary
# template has exactly that one input, including its final newline.
- name: Find every deployment host whose desired configuration bears a node
  ansible.builtin.set_fact:
    billet_retirement_node_hosts: "{{ billet_retirement_node_hosts + [item] }}"
  loop: "{{ groups['all'] }}"
  when: >-
    (hostvars[item].billet_config | default({}) is mapping
     and 'node' in hostvars[item].billet_config | default({}))
    or hostvars[item].billet_enable_node | default(false) | bool

- name: Read the retiring host's clock before the first collection delegation
  ansible.builtin.command:
    argv: [date, -u, '+%Y-%m-%dT%H:%M:%S.%NZ']
    expand_argument_vars: false
  register: billet_retirement_started
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  become: true

- name: Require an answered collection start clock
  ansible.builtin.assert:
    that:
      - not billet_retirement_started.unreachable | default(false) | bool
      - not billet_retirement_started.failed | default(false) | bool
      - billet_retirement_started.rc | default(-1) == 0
      - billet_retirement_started.stdout | default('') | trim | length > 0
    fail_msg: "Retirement collection: retiring host {{ inventory_hostname }} start clock was unsuccessful or unreachable."

- name: Collect each participant through its own prepared answerer
  ansible.builtin.include_tasks: retirement-collect-host.yml
  loop: "{{ ([inventory_hostname, billet_retirement_survivor] + billet_retirement_node_hosts) | unique(case_sensitive=true) | list }}"
  loop_control:
    loop_var: billet_retirement_collect_host
  vars:
    billet_retirement_collect_vars: "{{ hostvars[billet_retirement_collect_host] }}"
    billet_retirement_collect_answerer: >-
      {{ billet_retirement_answerer if billet_retirement_collect_host == inventory_hostname
         else billet_retirement_collect_vars.billet_exclusion_answerer | default('') }}
    billet_retirement_collect_path: "{{ billet_retirement_collect_vars.billet_config_path | default('/etc/billet/billet.yaml') }}"
    billet_retirement_collect_darwin: "{{ billet_retirement_collect_vars.billet_exclusion_darwin | default(false) | bool }}"

- name: Assemble the one new-request collection document
  ansible.builtin.set_fact:
    billet_retirement_document:
      schema: 1
      round:
        id: "{{ billet_exclusion_holder }}-{{ billet_retirement_started.stdout | trim }}"
        started_at: "{{ billet_retirement_started.stdout | trim }}"
      self: "{{ billet_retirement_reports[inventory_hostname] }}"
      survivor: "{{ billet_retirement_reports[billet_retirement_survivor] }}"
      nodes: "{{ dict(billet_retirement_node_hosts | zip(billet_retirement_node_hosts | map('extract', billet_retirement_reports))) }}"
      desired: null
      desired_nodes: "{{ billet_retirement_desired_nodes }}"
  no_log: true
