---
- name: Inspect the durable host-upgrade pointer
  ansible.builtin.stat:
    path: /var/lib/billet/upgrades/active
    follow: false
  register: billet_active_upgrade_pointer
  check_mode: false
  become: true

# A SYMLINK CLAIM IS `billet host-upgrade`'s, NOT THIS ROLE'S. The Go transaction
# publishes its claim as a symlink to its recovery directory (upgrade-*), and
# this role publishes its own as a hard link to a journal file; the two share
# the path precisely so that neither can start over the other. A converge that
# finds the Go transaction's claim is a converge against a host whose node may
# be draining for a rollout right now, and the right answer is to stop and name
# the command that says where that transaction has got to — not "not a real
# regular file", which sends an operator to look for corruption.
- name: Refuse to converge over a host upgrade billet itself is running
  ansible.builtin.assert:
    that:
      - not (billet_active_upgrade_pointer.stat.islnk | default(false))
    fail_msg: >-
      /var/lib/billet/upgrades/active is a symlink, which is how
      `billet host-upgrade` claims a host: a rollout, or an operator, has a
      transaction on this machine that this role must not converge over. Run
      `billet host-upgrade --status` there to see which decision it belongs to
      and how far it has got, let it finish or resume it with
      `billet host-upgrade --resume`, and converge again once
      /var/lib/billet/upgrades/active is gone.
  when: billet_active_upgrade_pointer.stat.exists

- name: Refuse a redirected or non-file host-upgrade pointer
  ansible.builtin.assert:
    that:
      - billet_active_upgrade_pointer.stat.isreg
      - not billet_active_upgrade_pointer.stat.islnk | default(false)
    fail_msg: >-
      /var/lib/billet/upgrades/active is not a real regular file. Refusing to
      read it or follow it into an untrusted recovery path.
  when: billet_active_upgrade_pointer.stat.exists

- name: Read the durable host-upgrade pointer
  ansible.builtin.slurp:
    src: /var/lib/billet/upgrades/active
  register: billet_active_upgrade_file
  when: billet_active_upgrade_pointer.stat.exists
  become: true

- name: Resolve an interrupted host upgrade
  ansible.builtin.set_fact:
    billet_interrupted_upgrade: "{{ billet_active_upgrade_pointer.stat.exists }}"
    billet_upgrade_recovery_dir: >-
      {{
        (billet_active_upgrade_file.content | b64decode | trim)
        if billet_active_upgrade_file.content is defined
        else ''
      }}

- name: Refuse an unsafe or malformed host-upgrade pointer
  ansible.builtin.assert:
    that:
      - not billet_active_upgrade_pointer.stat.islnk | default(false)
      - billet_upgrade_recovery_dir is match('^/var/lib/billet/upgrades/[0-9]{8}T[0-9]{15}$')
    fail_msg: >-
      /var/lib/billet/upgrades/active does not name a role-created recovery
      directory. Refusing to use an untrusted path for ledger restoration.
  when: billet_interrupted_upgrade | bool

- name: Inspect interrupted-upgrade recovery metadata
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ billet_upgrade_recovery_dir }}"
    - "{{ billet_upgrade_recovery_dir }}/manifest.yml"
  register: billet_interrupted_upgrade_metadata
  when: billet_interrupted_upgrade | bool
  check_mode: false
  become: true

- name: Refuse an incomplete interrupted-upgrade journal
  ansible.builtin.assert:
    that:
      - billet_interrupted_upgrade_metadata.results[0].stat.exists
      - billet_interrupted_upgrade_metadata.results[0].stat.isdir
      - not billet_interrupted_upgrade_metadata.results[0].stat.islnk | default(false)
      - billet_interrupted_upgrade_metadata.results[1].stat.exists
      - billet_interrupted_upgrade_metadata.results[1].stat.isreg
      - not billet_interrupted_upgrade_metadata.results[1].stat.islnk | default(false)
    fail_msg: >-
      The active billet upgrade does not have a complete, real recovery
      directory and manifest. Leave the pointer and host untouched for manual
      recovery instead of guessing which state is authoritative.
  when: billet_interrupted_upgrade | bool

- name: Read interrupted-upgrade recovery metadata
  ansible.builtin.slurp:
    src: "{{ billet_upgrade_recovery_dir }}/manifest.yml"
  register: billet_interrupted_upgrade_manifest_file
  when: billet_interrupted_upgrade | bool
  become: true

- name: Parse interrupted-upgrade recovery metadata
  ansible.builtin.set_fact:
    billet_upgrade_manifest: "{{ billet_interrupted_upgrade_manifest_file.content | b64decode | from_yaml }}"
  when: billet_interrupted_upgrade | bool

- name: Refuse incompatible interrupted-upgrade recovery metadata
  ansible.builtin.assert:
    that:
      - billet_upgrade_manifest.version == 2
      - billet_upgrade_manifest.server_state_dir is string
      - billet_upgrade_manifest.node_state_dir is string
      - billet_upgrade_manifest.service_user is match('^[a-z_][a-z0-9_-]{0,31}$')
      - billet_upgrade_manifest.service_group is match('^[a-z_][a-z0-9_-]{0,31}$')
      - billet_upgrade_manifest.inputs | length == 3
      - billet_upgrade_manifest.inputs | map(attribute='path') | list == ['/etc/billet/billet.yaml', '/etc/systemd/system/billet-server.service', '/etc/systemd/system/billet-node.service']
      - billet_upgrade_manifest.inputs | map(attribute='backup') | list == ['billet.yaml.previous', 'billet-server.service.previous', 'billet-node.service.previous']
      - billet_upgrade_manifest.binary_existed is boolean
      - billet_upgrade_manifest.server_was_active is boolean
      - billet_upgrade_manifest.node_was_active is boolean
      - billet_upgrade_manifest.candidate_server_active is boolean
      - billet_upgrade_manifest.candidate_node_active is boolean
      - billet_upgrade_manifest.server_enablement in ['enabled', 'enabled-runtime', 'disabled', 'static', 'indirect', 'generated', 'transient', 'not-found']
      - billet_upgrade_manifest.node_enablement in ['enabled', 'enabled-runtime', 'disabled', 'static', 'indirect', 'generated', 'transient', 'not-found']
    fail_msg: >-
      The active billet upgrade manifest is incomplete or belongs to an
      unsupported transaction format. Refusing automatic recovery.
  when: billet_interrupted_upgrade | bool

- name: Refuse unsafe interrupted-upgrade input metadata
  ansible.builtin.assert:
    that:
      - item.existed is boolean
      - item.owner is string
      - item.group is string
      - item.mode is match('^[0-7]{4}$')
    fail_msg: >-
      The active billet upgrade manifest carries invalid recovery metadata for
      {{ item.path }}. Refusing to apply it to a privileged host path.
  loop: "{{ billet_upgrade_manifest.inputs }}"
  loop_control:
    label: "{{ item.path }}"
  when: billet_interrupted_upgrade | bool

- name: Resolve recovery identity and candidate state directories
  ansible.builtin.set_fact:
    billet_recovery_service_user: >-
      {{
        billet_upgrade_manifest.service_user
        if billet_interrupted_upgrade | bool
        else billet_service_user
      }}
    billet_recovery_service_group: >-
      {{
        billet_upgrade_manifest.service_group
        if billet_interrupted_upgrade | bool
        else billet_service_group
      }}
    # billet_configured_server_state_dir reads BOTH spellings — see vars/main.yml
    # — because a deployment whose ledger is in PostgreSQL names only
    # `identity_dir`, and the default this used to fall back to is a directory
    # such a host does not use.
    billet_candidate_server_state_dir: >-
      {{
        billet_upgrade_manifest.server_state_dir
        if billet_interrupted_upgrade | bool
        else billet_configured_server_state_dir
      }}
    billet_candidate_node_state_dir: >-
      {{
        billet_upgrade_manifest.node_state_dir
        if billet_interrupted_upgrade | bool
        else billet_config.get('node', {}).get('state_dir', '/var/lib/billet/node')
      }}

# REFUSED HERE RATHER THAN AT `billet check`, because by then the role has
# already acted on the answer. config.Parse rejects a file carrying both
# spellings, but the derivation above runs long before that check — and a
# guess between two directories that disagree is exactly what it must not make.
- name: Refuse a config naming both server.state_dir and server.identity_dir
  ansible.builtin.assert:
    that:
      - not (billet_config.get('server', {}).get('identity_dir') and
             billet_config.get('server', {}).get('state_dir'))
    fail_msg: >-
      billet_config.server names both state_dir and identity_dir. They are two
      spellings of the same directory and only one may be written: state_dir
      means `identity_dir: <dir>` plus `state: {backend: sqlite}`. billet
      refuses this config at load, and the role will not guess which one you
      meant before it fences, chowns and sandboxes a directory.
  when: not billet_interrupted_upgrade | bool

- name: Refuse unsafe billet state directories
  ansible.builtin.assert:
    that:
      - billet_candidate_server_state_dir.startswith('/var/lib/billet/')
      - billet_candidate_node_state_dir.startswith('/var/lib/billet/')
      - "'/./' not in billet_candidate_server_state_dir"
      - "'/../' not in billet_candidate_server_state_dir"
      - "'/./' not in billet_candidate_node_state_dir"
      - "'/../' not in billet_candidate_node_state_dir"
      - not billet_candidate_server_state_dir.endswith('/.')
      - not billet_candidate_server_state_dir.endswith('/..')
      - not billet_candidate_node_state_dir.endswith('/.')
      - not billet_candidate_node_state_dir.endswith('/..')
      - not billet_candidate_server_state_dir.startswith('/var/lib/billet/upgrades/')
      - billet_candidate_server_state_dir != '/var/lib/billet/upgrades'
      - not billet_candidate_node_state_dir.startswith('/var/lib/billet/upgrades/')
      - billet_candidate_node_state_dir != '/var/lib/billet/upgrades'
      - billet_candidate_server_state_dir != billet_candidate_node_state_dir
      - not billet_candidate_server_state_dir.startswith(billet_candidate_node_state_dir + '/')
      - not billet_candidate_node_state_dir.startswith(billet_candidate_server_state_dir + '/')
    fail_msg: >-
      The host role accepts distinct, dedicated server.state_dir and
      node.state_dir paths only below /var/lib/billet. The paths cannot contain
      dot segments, nest inside each other, or overlap the upgrade recovery
      tree. This keeps recursive ownership and systemd's filesystem sandbox
      scoped to billet state and keeps every backup disjoint from its source.

- name: Resolve billet state paths through every existing ancestor
  ansible.builtin.command:
    argv:
      - realpath
      - --canonicalize-missing
      - "{{ item }}"
  loop:
    - /var/lib/billet
    - "{{ billet_candidate_server_state_dir }}"
    - "{{ billet_candidate_node_state_dir }}"
  register: billet_resolved_state_paths
  changed_when: false
  check_mode: false
  become: true

- name: Refuse billet state paths with symlinked or noncanonical ancestors
  ansible.builtin.assert:
    that:
      - item.stdout == item.item
    fail_msg: >-
      {{ item.item }} resolves to {{ item.stdout }}. Billet state paths must be
      canonical and every existing ancestor must remain inside the real
      /var/lib/billet tree; otherwise recursive ownership could cross a symlink
      into unrelated host data.
  loop: "{{ billet_resolved_state_paths.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Inspect billet state paths before creating them
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - /var/lib/billet
    - "{{ billet_candidate_server_state_dir }}"
    - "{{ billet_candidate_node_state_dir }}"
  register: billet_state_paths
  check_mode: false
  become: true

- name: Refuse billet state paths that are symlinks or non-directories
  ansible.builtin.assert:
    that:
      - not item.stat.islnk | default(false)
      - not item.stat.exists or item.stat.isdir
    fail_msg: >-
      {{ item.item }} must be a real directory owned as billet state. Refusing
      a symlink or another file type prevents the role from changing ownership
      or permissions outside the configured state tree.
  loop: "{{ billet_state_paths.results }}"
  loop_control:
    label: "{{ item.item }}"
