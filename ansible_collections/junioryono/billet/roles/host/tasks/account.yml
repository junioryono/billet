---
# A dry run cannot reload the live manager, and on systemd 255 the pending-reload
# flag it would otherwise refuse on is set by any enable on the host; the gate
# in dryrun-policy.yml compares the loaded facts with the fragment instead.
- name: Compare a dry run's view of Billet service policy with what the manager loaded
  ansible.builtin.import_tasks: dryrun-policy.yml

- name: Validate the installed service identity before the account is touched
  ansible.builtin.import_tasks: installed-identity.yml

- name: Check for processes owned by an adopted account
  ansible.builtin.command: "pgrep -u {{ billet_service_user }}"
  register: billet_account_processes
  changed_when: false
  failed_when: billet_account_processes.rc not in [0, 1]
  check_mode: false
  when:
    - ansible_facts.getent_passwd.get(billet_service_user) is not none
    - ansible_facts.getent_passwd[billet_service_user][4] != billet_service_home
    - billet_adopt_existing_service_account

- name: Refuse to change the home of a running account
  ansible.builtin.assert:
    that: billet_account_processes.rc == 1
    fail_msg: >-
      {{ billet_service_user }} still owns a running process. Stop it before
      adopting this legacy account; changing its home while it runs could split
      one deployment across two state directories.
  when: billet_account_processes.rc is defined

- name: Create the billet service group
  ansible.builtin.group:
    name: "{{ billet_service_group }}"
    system: true
    state: present
  become: true
  when: not billet_retirement_node_verified | default(false) | bool

- name: Create or adopt the billet service account
  ansible.builtin.user:
    name: "{{ billet_service_user }}"
    group: "{{ billet_service_group }}"
    home: "{{ billet_service_home }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    state: present
  become: true
  when: not billet_retirement_node_verified | default(false) | bool

- name: Install billet host dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - ceph-common
      - dnsmasq-base
      - e2fsprogs
      - iproute2
      - kmod
      - nftables
      - util-linux
    state: present
    update_cache: true
  become: true

- name: Inspect the installed billet configuration
  ansible.builtin.stat:
    path: /etc/billet/billet.yaml
  register: billet_installed_config
  check_mode: false
  become: true

- name: Read the installed billet configuration
  ansible.builtin.slurp:
    src: /etc/billet/billet.yaml
  register: billet_previous_config_file
  become: true
  when: billet_installed_config.stat.exists

# Installed paths describe I, never E. An absent server has no identity path;
# the transaction's historical placeholder is not an ordinary destination.
- name: Keep installed configuration separate from effective input
  ansible.builtin.set_fact:
    billet_previous_config: "{{ (billet_previous_config_file.content | b64decode | from_yaml) if billet_previous_config_file.content is defined else {} }}"
  no_log: true

- name: Resolve the installed server state directory
  ansible.builtin.set_fact:
    billet_previous_server_state_dir: >-
      {{ (billet_previous_config.server.get('identity_dir') or billet_previous_config.server.get('state_dir') or '/var/lib/billet/server')
         if billet_previous_config.get('server') is mapping else '' }}

- name: Resolve the installed node state directory
  ansible.builtin.set_fact:
    billet_previous_node_state_dir: >-
      {{ billet_previous_config.node.get('state_dir', '/var/lib/billet/node')
         if billet_previous_config.get('node') is mapping else '' }}

- name: Refuse to move installed server state implicitly
  ansible.builtin.assert:
    that:
      - billet_previous_server_state_dir == billet_configured_server_state_dir
    fail_msg: >-
      This host already uses server state {{ billet_previous_server_state_dir }}.
      Refusing desired path {{ billet_candidate_server_state_dir }} because it
      would abandon the authoritative ledger or CA. Move state during explicit
      offline maintenance, then converge with the installed path.
  when:
    - billet_previous_config.get('server') is mapping
    - billet_effective_config.get('server') is mapping
    - not billet_interrupted_upgrade | bool
    - not billet_retirement_node_ordinary | bool

- name: Refuse to move installed node state implicitly
  ansible.builtin.assert:
    that:
      - billet_previous_node_state_dir == billet_candidate_node_state_dir
    fail_msg: >-
      This host already uses node state {{ billet_previous_node_state_dir }}.
      Refusing desired path {{ billet_candidate_node_state_dir }} because it
      would abandon the node identity. Move state during explicit offline
      maintenance, then converge with the installed path.
  when:
    - billet_previous_config.get('node') is mapping
    - billet_effective_config.get('node') is mapping
    - not billet_interrupted_upgrade | bool

- name: Create billet directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ billet_common_directories + billet_server_directories + billet_node_directories }}"
  become: true

# THE BINARY CHANGE WAS DECIDED, AND ITS CANDIDATE STAGED, BEFORE THE HOLD, in
# stage-candidate.yml (imported by prepare-exclusion.yml): the candidate's
# digest, the downgrade refusal, the PostgreSQL refusal, the capability floor,
# the exclusive allocation of the recovery directory and the immutable copy
# inside it are all behind the guard by the time this file runs. What stays
# here is what needs the reload and the stops' neighbourhood: the drop-in
# inspection, the previous inputs' preservation and the candidate units.
- name: Reload systemd before inspecting host-upgrade service overlays
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode
  become: true

- name: Inspect billet service drop-ins before the upgrade transaction
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=DropInPaths
      - --value
      - "{{ item }}"
  loop:
    - billet-server.service
    - billet-node.service
  register: billet_service_dropins_before_upgrade
  changed_when: false
  failed_when: billet_service_dropins_before_upgrade.rc != 0
  check_mode: false
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode
  become: true

- name: Refuse service drop-ins the transaction cannot replace or recover
  ansible.builtin.assert:
    that:
      - item.stdout | trim | length == 0
    fail_msg: "{{ item.item }} has effective systemd drop-ins: {{ item.stdout | trim }}. Remove or fold them into the Billet-managed unit before upgrading; a drop-in can replace the quiescent readiness probe and let workload run before the transaction commits."
  loop: "{{ billet_service_dropins_before_upgrade.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode

- name: Inspect configuration and units before replacing them
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/billet/billet.yaml
    - /etc/systemd/system/billet-server.service
    - /etc/systemd/system/billet-node.service
  register: billet_previous_upgrade_inputs
  check_mode: false
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode

- name: Refuse redirected or non-file upgrade inputs
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.isreg
      - not item.stat.islnk | default(false)
    fail_msg: >-
      {{ item.item }} is not a real regular file. Normalize the installed input
      before a transactional upgrade so rollback never follows or recreates a
      privileged symlink.
  loop: "{{ billet_previous_upgrade_inputs.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode

- name: Preserve configuration and units before replacing them
  ansible.builtin.copy:
    src: "{{ item.item }}"
    dest: "{{ billet_upgrade_recovery_dir }}/{{ item.item | basename }}.previous"
    remote_src: true
    owner: root
    group: root
    mode: preserve
  loop: "{{ billet_previous_upgrade_inputs.results }}"
  loop_control:
    label: "{{ item.item }}"
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode
    - item.stat.exists

- name: Preserve the previous billet binary before live mutation
  ansible.builtin.copy:
    src: "{{ billet_exclusion_binary }}"
    dest: "{{ billet_upgrade_recovery_dir }}/billet.previous"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode
    - billet_installed_binary.stat.exists

# A CANDIDATE THAT DOES NOT KNOW THE HOLD FLAG REFUSES IT, in its own flag parser,
# before it has probed anything. Releases through v0.9.0 hold under --upgrade-probe
# alone; from v0.9.1 a probe exits once ready unless told to hold, and this unit
# needs it to hold. A deliberate downgrade (billet_allow_downgrade) renders the
# older shape, which is why the candidate is asked rather than the version assumed.
# BOUNDED AND JUDGED. `timeout` ends a usage that hangs, killing one that ignores
# the TERM it sends first, and a non-zero exit fails
# the converge here, before a single service is stopped: every release prints its
# usage and exits zero, so a candidate that cannot is one that would fail its own
# probe later, with the host already drained.
- name: Ask the candidate whether its probe can be told to hold
  ansible.builtin.command:
    argv:
      - timeout
      - -k
      - "10"
      - "60"
      - "{{ billet_upgrade_recovery_dir }}/billet.candidate"
      - server
      - -h
  register: billet_candidate_probe_help
  changed_when: false
  check_mode: false
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode

- name: Record whether the candidate's probe holds only when told
  ansible.builtin.set_fact:
    billet_candidate_probe_holds_on_flag: >-
      {{ 'upgrade-probe-hold' in
         ((billet_candidate_probe_help.stdout | default('')) ~ (billet_candidate_probe_help.stderr | default(''))) }}
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode

# THE ENDPOINT DECISION, before the configuration is staged or rendered and
# before the transaction's first stop: what the running node dials against what
# the render would install, judged by the command over the rendering on stdin.
- name: Decide the node's endpoint migration before the render
  ansible.builtin.import_tasks: endpoint-decision.yml
  when: not billet_retirement_node_ordinary | bool

- name: Resolve node environment operands before unit replacement
  ansible.builtin.import_tasks: node-environment.yml
  when: not billet_retirement_node_ordinary | bool

- name: Select ordinary unit templates by unit name
  ansible.builtin.import_tasks: unit-operands.yml
  when: not billet_retirement_node_ordinary | bool

- name: Stage candidate systemd units for the upgrade transaction
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ billet_upgrade_recovery_dir }}/{{ item.dest | basename }}.candidate"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { src: billet-server.service.j2, dest: /etc/systemd/system/billet-server.service }
    - { src: billet-node.service.j2, dest: /etc/systemd/system/billet-node.service }
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode
  vars:
    billet_systemd_upgrade_probe: true
    billet_systemd_upgrade_probe_hold: "{{ billet_candidate_probe_holds_on_flag | default(false) | bool }}"
    billet_systemd_notify_ready: true

- name: Observe readiness before ordinary unit replacement
  ansible.builtin.import_tasks: unit-readiness.yml
  when: not billet_retirement_node_ordinary | bool

- name: Install the billet systemd units
  ansible.builtin.template:
    src: "{{ item.value.src }}"
    dest: "{{ item.value.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ billet_unit_operands | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: billet_systemd_units
  become: true
  notify: Reload systemd
  when: not billet_binary_upgrade | default(false)
  vars:
    # ONLY AN INSTALLED unit THAT SAYS notify EARNS notify, and the reason is
    # what an ABSENT unit does not tell you.
    #
    # Measured on systemd 255 rather than assumed: `systemctl show
    # --property=Type --value <absent>.service` exits 0 and prints NOTHING (its
    # LoadState is not-found). So the exit status never distinguished anything
    # here — an empty answer is "no unit installed", and the rc test below
    # guards a command failure rather than the absent case it reads like.
    #
    # An absent unit is NOT evidence of a fresh billet. This branch only runs
    # when no binary is being installed, so it is reached with a binary of
    # UNKNOWN vintage already on the host: notifyReady has shipped since
    # v0.3.10, but a hand-installed v0.3.9 would be handed a Type=notify unit,
    # never send READY=1, and fail its start after TimeoutStartSec — outside
    # the transaction that would have rolled it back. A genuinely fresh
    # install has no binary, so it takes the transactional path and gets
    # notification from the candidate probes instead. Conservative here costs
    # one upgrade to reach notify; optimistic costs a host that will not start.
    billet_systemd_notify_ready: >-
      {{
        billet_service_types_by_unit[item.key].rc == 0 and
        (billet_service_types_by_unit[item.key].stdout | trim) == 'notify'
      }}

- name: Key unit replacement observations by unit name
  ansible.builtin.set_fact:
    billet_unit_templates_by_unit: "{{ billet_systemd_units.results | junioryono.billet.unit_results }}"
  when: not billet_binary_upgrade | default(false)

- name: Inspect the installed GitHub App private key
  ansible.builtin.stat:
    path: /etc/billet/app-private-key.pem
    checksum_algorithm: sha256
  register: billet_installed_private_key
  become: true
  no_log: true
  when:
    - billet_github_key_managed | bool
    - billet_github_private_key_src | length > 0

- name: Refuse to replace an installed GitHub App private key implicitly
  ansible.builtin.assert:
    that:
      - not billet_installed_private_key.stat.exists or billet_installed_private_key.stat.checksum == (lookup('ansible.builtin.file', billet_github_private_key_src, rstrip=false) | hash('sha256'))
    fail_msg: >-
      /etc/billet/app-private-key.pem already contains a different key. Rotate
      that credential explicitly before converging the host; the reusable role
      will not overwrite a live GitHub App identity.
  no_log: true
  when:
    - billet_github_key_managed | bool
    - billet_github_private_key_src | length > 0

- name: Install the GitHub App private key without replacing an existing identity
  ansible.builtin.copy:
    src: "{{ billet_github_private_key_src }}"
    dest: /etc/billet/app-private-key.pem
    owner: "{{ billet_service_user }}"
    group: "{{ billet_service_group }}"
    mode: "0600"
    force: false
  become: true
  register: billet_private_key_install
  no_log: true
  when:
    - billet_github_key_managed | bool
    - billet_github_private_key_src | length > 0

# THE FURTHER TARGETS' KEYS, under exactly the rule above: inspected by digest,
# never replaced, installed with force false, and only where the config names
# the managed path and a source was passed.
- name: Inspect the installed further targets' GitHub App private keys
  ansible.builtin.stat:
    path: "/etc/billet/app-private-key-{{ item.name }}.pem"
    checksum_algorithm: sha256
  register: billet_installed_target_keys
  become: true
  no_log: true
  loop: "{{ billet_github_target_keys | selectattr('owned') | selectattr('supplied') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Refuse to replace an installed further target's App private key implicitly
  ansible.builtin.assert:
    that:
      - not item.stat.exists or item.stat.checksum == (lookup('ansible.builtin.file', billet_github_target_key_srcs[item.item.name], rstrip=false) | hash('sha256'))
    fail_msg: >-
      /etc/billet/app-private-key-{{ item.item.name }}.pem already contains a
      different key. Rotate that credential explicitly before converging the
      host; the reusable role will not overwrite a live GitHub App identity.
  no_log: true
  loop: "{{ billet_installed_target_keys.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Install the further targets' GitHub App private keys without replacing an existing identity
  ansible.builtin.copy:
    src: "{{ billet_github_target_key_srcs[item.name] }}"
    dest: "/etc/billet/app-private-key-{{ item.name }}.pem"
    owner: "{{ billet_service_user }}"
    group: "{{ billet_service_group }}"
    mode: "0600"
    force: false
  become: true
  no_log: true
  loop: "{{ billet_github_target_keys | selectattr('owned') | selectattr('supplied') | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stage candidate configuration for the upgrade transaction
  vars:
    billet_config_document: "{{ billet_effective_config }}"
  ansible.builtin.template:
    src: billet.yaml.j2
    dest: "{{ billet_upgrade_recovery_dir }}/billet.yaml.candidate"
    owner: root
    group: "{{ billet_service_group }}"
    mode: "0640"
  become: true
  when:
    - billet_binary_upgrade | default(false)
    - not billet_interrupted_upgrade | bool
    - not ansible_check_mode

- name: Render billet configuration
  vars:
    billet_config_document: "{{ billet_effective_config }}"
  ansible.builtin.template:
    src: billet.yaml.j2
    dest: "{{ billet_ordinary_config_path }}"
    owner: root
    group: "{{ billet_service_group }}"
    mode: "0640"
  register: billet_config_install
  become: true
  when: not billet_binary_upgrade | default(false)

# THE CONTROL PLANE'S ENVIRONMENT, and what it exists for is the PostgreSQL
# ledger: `server.state.postgres.dsn_env` names a variable rather than carrying a
# connection string, because a DSN holds a password and a secret in billet.yaml
# ends up in a backup.
#
# OUTSIDE THE UPGRADE TRANSACTION, and it follows the App PRIVATE KEY above
# rather than billet.yaml below. That is the distinction: billet.yaml and the
# units are what a new binary replaces, so they are staged, journaled and rolled
# back; a credential the operator supplies is not, and there is nothing for a
# rollback to put back. The key's install has no binary-upgrade gate for exactly
# this reason and neither does this.
#
# GATING IT ON `not billet_binary_upgrade` WAS THE FIRST SHAPE AND IT WAS WRONG
# IN THE ORDINARY CASE: a FIRST INSTALL is a binary upgrade — there is no
# installed binary to compare against — so that gate meant a fresh host never got
# its DSN at all, converged green, and then failed to start against an empty data
# source. The restart trigger in services.yml keeps its gate, because during a
# transaction the transaction is what restarts things.
- name: Render the billet server environment
  ansible.builtin.template:
    src: server.env.j2
    dest: "{{ billet_server_environment_path }}"
    # 0640 root:billet, the contract billet.yaml already follows: the server runs
    # as the service account and reads it, and nothing else on the host can.
    owner: root
    group: "{{ billet_service_group }}"
    mode: "0640"
  register: billet_server_environment_install
  # A DSN IS A CREDENTIAL, so neither the rendered content nor a diff of it
  # reaches the log — the same rule the App private key's install follows.
  no_log: true
  become: true
  when:
    - billet_server_environment | length > 0
    - not billet_retirement_node_ordinary | bool

# THE LEDGER'S TRUST ANCHOR, when the ledger is somewhere that needs one.
#
# 0644 root:root, deliberately: it is a set of PUBLIC certificate authorities, so
# the file that must be readable is exactly the one with nothing to hide — and
# giving it the 0640 the credential beside it gets would be security theatre that
# an operator later has to debug. WORLD-READABLE IS THE POINT for a trust anchor;
# what matters is that only root can WRITE it.
- name: Install the ledger's certificate bundle
  ansible.builtin.copy:
    src: "{{ billet_state_ca_bundle_src }}"
    dest: "{{ billet_state_ca_bundle_path }}"
    owner: root
    group: root
    mode: "0644"
  register: billet_state_ca_bundle_install
  become: true
  when:
    - billet_state_ca_bundle_src | length > 0
    - not billet_retirement_node_ordinary | bool

# WHOSE FILE IT IS, recorded beside it — the msmtprc sidecar's shape, for the
# same reason: the removal below must never take a file an operator wrote
# themselves, and "it exists" cannot tell the two apart.
- name: Record ownership of the billet server environment
  ansible.builtin.copy:
    content: "managed by junioryono.billet.host\n"
    dest: "{{ billet_server_environment_marker_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - billet_server_environment | length > 0
    - not billet_retirement_node_ordinary | bool

- name: Inspect ownership of the billet server environment
  ansible.builtin.stat:
    path: "{{ billet_server_environment_marker_path }}"
  register: billet_server_environment_marker
  check_mode: false
  become: true
  when:
    - billet_server_environment | length == 0
    - not billet_retirement_node_ordinary | bool

# AND REMOVED WHEN IT IS NO LONGER CONFIGURED, which is not tidiness.
#
# The unit stops naming the EnvironmentFile as soon as billet_server_environment
# is empty, so a host moved back to SQLite — or to some other way of delivering
# the DSN — would keep a database password in a file nothing reads and nothing
# rotates, indefinitely, with no line in any config to remind anyone it is there.
# A credential that outlives its purpose is the one kind of leftover worth
# deleting rather than leaving for an operator to find.
#
# THIS IS THE ROLE REMOVING WHAT THE ROLE WROTE. An operator who manages that
# file themselves leaves billet_server_environment empty AND does not get this,
# because they would never have had the role write it — which is the same
# distinction the msmtprc ownership sidecar draws.
- name: Remove the billet server environment when nothing configures it
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ billet_server_environment_path }}"
    - "{{ billet_server_environment_marker_path }}"
  become: true
  when:
    - billet_server_environment | length == 0
    - billet_server_environment_marker.stat.exists | default(false)
    - not billet_retirement_node_ordinary | bool
