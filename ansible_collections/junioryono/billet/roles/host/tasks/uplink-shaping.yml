---
# A HOST THAT SHARES ITS SITE'S UPLINK KEEPS ITS OWN TRAFFIC BELOW THE LINE
# (shared-uplink record, 2026-10-08). A fleet of guests pulling images and caches
# fills a residential gateway's single queue in bursts, and everything else at
# the site (a call, a game) then waits behind it or is dropped: measured, 2.5% loss
# and latency from 7 to 29 ms while the node moved 378 Mbit/s down and 180 up, and
# no loss with CAKE holding it to 400 each way on a 500 Mbit/s line. The rate is
# the operator's to state, below the line's own, so shaping is off until one is.
- name: Inspect the uplink shaping unit
  ansible.builtin.stat:
    path: /etc/systemd/system/billet-uplink-shaping.service
  register: billet_uplink_shaping_unit
  become: true

- name: Shape this host's share of the uplink
  when: billet_uplink_shaping | length > 0
  block:
    - name: Refuse shaping an interface this host does not have
      ansible.builtin.assert:
        that:
          - billet_uplink_shaping.interface in ansible_facts.interfaces
        fail_msg: >-
          billet_uplink_shaping.interface {{ billet_uplink_shaping.interface }} is not an
          interface of this host; it has {{ ansible_facts.interfaces | sort | join(', ') }}.

    - name: Install the uplink shaping unit
      ansible.builtin.template:
        src: billet-uplink-shaping.service.j2
        dest: /etc/systemd/system/billet-uplink-shaping.service
        owner: root
        group: root
        mode: "0644"
      register: billet_uplink_shaping_install
      become: true
      notify: Reload systemd

    - name: Apply the uplink shaping unit change
      ansible.builtin.meta: flush_handlers

    # RESTARTED ON A CHANGE, because a oneshot that remains active is not run again
    # by a start; the restart's stop removes the old shaping before the new one.
    - name: Apply the uplink shaping
      ansible.builtin.systemd_service:
        name: billet-uplink-shaping.service
        enabled: true
        state: "{{ 'restarted' if billet_uplink_shaping_install.changed else 'started' }}"
      when: not ansible_check_mode
      become: true

- name: Remove uplink shaping that is no longer asked for
  when:
    - billet_uplink_shaping | length == 0
    - billet_uplink_shaping_unit.stat.exists
  block:
    - name: Stop the uplink shaping
      ansible.builtin.systemd_service:
        name: billet-uplink-shaping.service
        enabled: false
        state: stopped
      when: not ansible_check_mode
      become: true

    - name: Remove the uplink shaping unit
      ansible.builtin.file:
        path: /etc/systemd/system/billet-uplink-shaping.service
        state: absent
      become: true
      notify: Reload systemd
