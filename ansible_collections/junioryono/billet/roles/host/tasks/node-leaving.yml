---
# WHERE A NODE THAT MAY NOT RUN HERE KEPT ITS ENDING RECORD (#127): the
# installed configuration's node.state_dir while it still names the node, and
# once a converge has rendered the node away, the marker account.yml wrote
# before it did (billet_node_leaving_path), which outlives a converge that
# failed before the node's drain was proved. A marker that is not there is
# none; one that cannot be read refuses.
#
# Output: billet_node_unwanted_state_dir, empty when neither names a record.

- name: Read where a node that may not run here kept its ending record
  ansible.builtin.slurp:
    src: "{{ billet_node_leaving_path }}"
  register: billet_node_leaving
  failed_when: >-
    billet_node_leaving is failed and
    'file not found' not in (billet_node_leaving.msg | default('') | lower)
  become: "{{ billet_ending_become | default(true) | bool }}"

- name: Resolve the ending record of a node that may not run here
  ansible.builtin.set_fact:
    billet_node_unwanted_state_dir: >-
      {{ billet_previous_node_state_dir | default('', true)
         or ((billet_node_leaving.content | b64decode | trim) if billet_node_leaving.content is defined else '') }}
