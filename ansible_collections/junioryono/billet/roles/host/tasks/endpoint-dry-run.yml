---
# THE ENDPOINT MIGRATION'S DRY RUN, through the answerer, with or without an
# installed configuration (the command reports `config: absent` and judges the
# unit and its process against the rendering), and its strict parse into
# billet_endpoint_answer. One file because the decision asks it and the
# runtime-unit repair asks it again from scratch, and two copies of the argv
# are how the two would come to ask different questions.
#
# Bounded by the judgement's attempts, each an opening observation, the record
# wait, the two observations of a bracket that outlives it, the closing
# observation and the pre-R probe a node without a record may need, plus the
# guard's bound as the margin, `-k 10` so a hang is killed after the grace
# period.

- name: Ask for the endpoint migration's dry run
  ansible.builtin.command:
    argv: >-
      {{ ['timeout', '-k', '10', ((billet_migration_judgement_attempts | int) * ((billet_migration_record_wait | int) + 4 * (billet_migration_observation_bound | int) + (billet_migration_probe_bound | int)) + (billet_guard_timeout | int)) | string,
          billet_endpoint_answerer, 'node', 'migrate-endpoint', '--config', '/etc/billet/billet.yaml',
          '--desired', '-', '--wait', (billet_migration_record_wait | string) ~ 's', '--dry-run', '--json'] }}
    stdin: "{{ billet_endpoint_rendering }}"
    expand_argument_vars: false
  register: billet_endpoint_dry
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  no_log: true

- name: Judge the endpoint migration's dry run
  ansible.builtin.import_tasks: endpoint-answer.yml
  vars:
    billet_endpoint_raw: "{{ billet_endpoint_dry }}"
    billet_endpoint_call: decision
    billet_endpoint_answered_by: "{{ billet_endpoint_answerer }}"
