---
# WHETHER THIS ROLE RUNS THE SITE'S PULL-THROUGH MIRRORS ON THIS HOST, and the
# configuration that says so. A function of the inventory and nothing else on an
# ordinary converge, so a dry run and the real one render the same file.
#
# IT NAMES ONLY node.registry_mirrors, which every billet this role can meet loads.
# The authority stays out of the file on purpose: a billet older than
# registry_mirrors_ca refuses a file carrying it, and that billet may be the one
# answering this converge's dry run, or one a rollout or a revert moves the host
# back to. The node reads the authority from a path it knows instead, and an older
# one never looks there, so its guests cannot verify the mirror and pull from the
# registry.
#
# AN OPERATOR'S OWN MIRRORS WIN: a node naming registry_mirrors or
# registry_mirrors_ca keeps them, and this role runs none.
#
# A RETAINED CONVERGE TAKES UP NOTHING NEW. Its writes are admitted one destination
# at a time, so the mirrors' tasks do not run there and the node is held to the
# file it started with: it keeps naming mirrors only an earlier converge left their
# authority for.
#
# THE RULE IS THE role_registry_mirrors FILTER'S, which a retirement's two renderings
# of a node's file apply too: deciding it here alone refused every retirement of a
# deployment whose nodes this role gave mirrors.
- name: Inspect the mirrors' authority on a retained converge
  ansible.builtin.stat:
    path: "{{ billet_registry_mirror_dir }}/ca.pem"
  register: billet_registry_mirror_authority
  check_mode: false
  become: true
  when: billet_retirement_node_ordinary | bool

- name: Decide whether this role runs the registry mirrors here
  ansible.builtin.set_fact:
    billet_registry_mirrors_active: >-
      {{ billet_effective_config | junioryono.billet.role_registry_mirrors_active(
           billet_registry_mirrors | bool, billet_networks, billet_registry_mirror_instances,
           not billet_retirement_node_ordinary | bool or billet_registry_mirror_authority.stat.exists) }}

- name: Name the mirrors this role runs in the node's configuration
  ansible.builtin.set_fact:
    billet_effective_config: >-
      {{ billet_effective_config | junioryono.billet.role_registry_mirrors(
           true, billet_networks, billet_registry_mirror_instances) }}
  no_log: true
  when: billet_registry_mirrors_active | bool

- name: Decide which ports guests reach the mirrors on
  ansible.builtin.set_fact:
    billet_registry_mirror_guest_ports: >-
      {{ (billet_registry_mirror_instances | map(attribute='port') | list)
         if billet_registry_mirrors_active | bool else [] }}
