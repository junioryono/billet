---
- name: Inspect durable recovery inputs before stopping anything
  ansible.builtin.stat:
    path: "{{ billet_upgrade_recovery_dir }}/{{ item.backup }}"
    follow: false
  loop: "{{ billet_upgrade_manifest.inputs }}"
  loop_control:
    label: "{{ item.path }}"
  register: billet_recovery_input_files
  become: true

- name: Refuse recovery with a missing or redirected input copy
  ansible.builtin.assert:
    that:
      - not item.item.existed | bool or item.stat.exists
      - not item.item.existed | bool or item.stat.isreg
      - not item.item.existed | bool or not item.stat.islnk | default(false)
    fail_msg: >-
      {{ item.item.path }} existed before the upgrade, but its durable copy is
      missing or redirected. The role will not stop services or guess at a
      replacement; inspect {{ billet_upgrade_recovery_dir }} manually.
  loop: "{{ billet_recovery_input_files.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Inspect the durable previous billet binary
  ansible.builtin.stat:
    path: "{{ billet_upgrade_recovery_dir }}/billet.previous"
    follow: false
  register: billet_recovery_binary
  become: true

- name: Refuse recovery without the previous binary it records
  ansible.builtin.assert:
    that:
      - not billet_upgrade_manifest.binary_existed | bool or billet_recovery_binary.stat.exists
      - not billet_upgrade_manifest.binary_existed | bool or billet_recovery_binary.stat.isreg
      - not billet_upgrade_manifest.binary_existed | bool or not billet_recovery_binary.stat.islnk | default(false)
    fail_msg: >-
      The interrupted upgrade records a previous billet binary, but its durable
      copy is missing or redirected. Refusing automatic recovery.

- name: Stop compute before recovering the authoritative ledger
  ansible.builtin.systemd_service:
    name: billet-node.service
    state: stopped
  failed_when: false
  become: true

- name: Stop the control plane before recovering its authoritative ledger
  ansible.builtin.systemd_service:
    name: billet-server.service
    state: stopped
  failed_when: false
  become: true

- name: Hide the installed executable while recovery owns the ledger
  ansible.builtin.file:
    path: /usr/bin/billet
    state: absent
  become: true

- name: Fence the ledger throughout recovery
  ansible.builtin.copy:
    content: "transactional host recovery in progress\n"
    dest: "{{ billet_candidate_server_state_dir }}/billet.maintenance"
    owner: "{{ billet_recovery_service_user }}"
    group: "{{ billet_recovery_service_group }}"
    mode: "0600"
  become: true

- name: Wait for every billet process started before executable removal to finish
  ansible.builtin.command:
    argv:
      - pgrep
      - -x
      - billet
  register: billet_processes_before_recovery
  changed_when: false
  failed_when: billet_processes_before_recovery.rc not in [0, 1]
  until: billet_processes_before_recovery.rc == 1
  retries: 30
  delay: 1
  become: true

- name: Inspect service process state before recovering upgrade inputs
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=MainPID
      - --property=ControlPID
      - "{{ item }}"
  loop:
    - billet-node.service
    - billet-server.service
  register: billet_service_process_state_before_restore
  changed_when: false
  failed_when: false
  become: true

- name: Inspect service cgroups before recovering upgrade inputs
  ansible.builtin.command:
    argv:
      - systemd-cgls
      - --no-pager
      - --unit
      - "{{ item }}"
  loop:
    - billet-node.service
    - billet-server.service
  register: billet_service_cgroups_before_restore
  changed_when: false
  failed_when: billet_service_cgroups_before_restore.rc not in [0, 1]
  become: true

- name: Refuse recovery without conclusive process and cgroup evidence
  ansible.builtin.assert:
    that:
      - item.0.rc == 0
      - "'LoadState=not-found' in item.0.stdout or 'ActiveState=inactive' in item.0.stdout or 'ActiveState=failed' in item.0.stdout"
      - "'LoadState=not-found' in item.0.stdout or 'MainPID=0' in item.0.stdout"
      - "'LoadState=not-found' in item.0.stdout or 'ControlPID=0' in item.0.stdout"
      - >-
        item.1.rc == 0 or
        (
          item.1.rc == 1 and
          item.1.stdout | trim == '' and
          ('Unit ' + item.0.item + ' not found.') in item.1.stderr
        )
      - "item.1.rc != 0 or item.1.stdout_lines | select('match', '^[^0-9]*[0-9]+\\s') | list | length == 0"
    fail_msg: >-
      Recovery stopped before restoring the ledger because {{ item.0.item }}
      did not prove terminal with zero main/control PIDs and either a
      successfully inspected empty cgroup or systemd's explicit absent-cgroup
      result. The recovery copy remains at {{ billet_upgrade_recovery_dir }}.
  loop: "{{ billet_service_process_state_before_restore.results | zip(billet_service_cgroups_before_restore.results) | list }}"
  loop_control:
    label: "{{ item.0.item }}"

- name: Inspect the durable ledger snapshot state
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
  loop:
    - "{{ billet_upgrade_recovery_dir }}/ledger.complete"
    - "{{ billet_upgrade_recovery_dir }}/ledger.existed"
    - "{{ billet_upgrade_recovery_dir }}/server"
  register: billet_recovery_ledger_state
  become: true

- name: Refuse a completed ledger snapshot without its recorded directory
  ansible.builtin.assert:
    that:
      - >-
        not (
          billet_recovery_ledger_state.results[0].stat.exists and
          billet_recovery_ledger_state.results[1].stat.exists
        ) or
        (
          billet_recovery_ledger_state.results[2].stat.exists and
          billet_recovery_ledger_state.results[2].stat.isdir and
          not billet_recovery_ledger_state.results[2].stat.islnk | default(false)
        )
    fail_msg: >-
      The upgrade records a completed ledger snapshot, but its server directory
      is missing or redirected. Refusing to replace the current ledger.

- name: Read the previous configuration for ledger snapshot validation
  ansible.builtin.slurp:
    src: "{{ billet_upgrade_recovery_dir }}/{{ billet_upgrade_manifest.inputs[0].backup }}"
  register: billet_recovery_previous_config_file
  when:
    - billet_recovery_ledger_state.results[0].stat.exists
    - billet_recovery_ledger_state.results[1].stat.exists
    - billet_upgrade_manifest.binary_existed | bool
    - billet_upgrade_manifest.inputs[0].existed | bool
  become: true

- name: Point recovery validation at the durable ledger snapshot
  ansible.builtin.set_fact:
    billet_recovery_validation_config: >-
      {{
        (billet_recovery_previous_config_file.content | b64decode | from_yaml)
        | combine(
          {
            'server':
              (billet_recovery_previous_config_file.content | b64decode | from_yaml).get('server', {})
              | combine({'state_dir': billet_upgrade_recovery_dir + '/server'})
          },
          recursive=true
        )
      }}
  when:
    - billet_recovery_previous_config_file.content is defined

- name: Write the isolated recovery validation configuration
  ansible.builtin.copy:
    content: "{{ billet_recovery_validation_config | to_nice_yaml(indent=2, sort_keys=false) }}"
    dest: "{{ billet_upgrade_recovery_dir }}/billet-recovery-check.yaml"
    owner: root
    group: root
    mode: "0600"
  when: billet_recovery_validation_config is defined
  become: true

- name: Prove the durable ledger snapshot is valid before replacing current state
  ansible.builtin.command:
    argv:
      - "{{ billet_upgrade_recovery_dir }}/billet.previous"
      - check
      - --config
      - "{{ billet_upgrade_recovery_dir }}/billet-recovery-check.yaml"
  changed_when: false
  environment:
    BILLET_MAINTENANCE: "1"
  when: billet_recovery_validation_config is defined
  become: true

- name: Find current ledger entries before restoring a completed snapshot
  ansible.builtin.find:
    paths: "{{ billet_candidate_server_state_dir }}"
    file_type: any
    recurse: false
    excludes:
      - billet.maintenance
  register: billet_migrated_ledger_entries
  when: billet_recovery_ledger_state.results[0].stat.exists
  become: true

- name: Remove current ledger entries before restoring a completed snapshot
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ billet_migrated_ledger_entries.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: billet_recovery_ledger_state.results[0].stat.exists
  become: true

- name: Restore the previous control-plane ledger
  ansible.builtin.command:
    argv:
      - cp
      - -a
      - "{{ billet_upgrade_recovery_dir }}/server/."
      - "{{ billet_candidate_server_state_dir }}"
  when:
    - billet_recovery_ledger_state.results[0].stat.exists
    - billet_recovery_ledger_state.results[1].stat.exists
  become: true

- name: Restore configuration and units that existed before the upgrade
  ansible.builtin.copy:
    src: "{{ billet_upgrade_recovery_dir }}/{{ item.backup }}"
    dest: "{{ item.path }}"
    remote_src: true
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ billet_upgrade_manifest.inputs }}"
  loop_control:
    label: "{{ item.path }}"
  when: item.existed | bool
  become: true

- name: Remove configuration and units created only for the interrupted upgrade
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ billet_upgrade_manifest.inputs }}"
  loop_control:
    label: "{{ item.path }}"
  when: not item.existed | bool
  become: true

- name: Reload restored systemd units before restarting the previous version
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Restore prior service enablement exactly
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    enabled: "{{ item.was_enabled }}"
  loop:
    - name: billet-server.service
      existed: "{{ billet_upgrade_manifest.inputs[1].existed }}"
      was_enabled: "{{ billet_upgrade_manifest.server_was_enabled }}"
    - name: billet-node.service
      existed: "{{ billet_upgrade_manifest.inputs[2].existed }}"
      was_enabled: "{{ billet_upgrade_manifest.node_was_enabled }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.existed | bool
  become: true

- name: Restore the previous billet binary
  ansible.builtin.copy:
    src: "{{ billet_upgrade_recovery_dir }}/billet.previous"
    dest: /usr/bin/billet
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: billet_upgrade_manifest.binary_existed | bool
  become: true

- name: Keep a failed first installation without an invented predecessor
  ansible.builtin.file:
    path: /usr/bin/billet
    state: absent
  when: not billet_upgrade_manifest.binary_existed | bool
  become: true

- name: Restart prior services under a temporary maintenance bypass
  become: true
  block:
    - name: Permit restored services through the maintenance fence for this start
      ansible.builtin.command:
        argv:
          - systemctl
          - set-environment
          - BILLET_MAINTENANCE=1
      changed_when: true

    - name: Restart the previous billet server after recovery
      ansible.builtin.systemd_service:
        name: billet-server.service
        state: started
      failed_when: false
      when: billet_upgrade_manifest.server_was_active | bool

    - name: Restart the previous billet node after recovery
      ansible.builtin.systemd_service:
        name: billet-node.service
        state: started
      failed_when: false
      when: billet_upgrade_manifest.node_was_active | bool
  always:
    - name: Remove the restored-service maintenance bypass from systemd
      ansible.builtin.command:
        argv:
          - systemctl
          - unset-environment
          - BILLET_MAINTENANCE
      changed_when: true

- name: Inspect restored service stability baseline
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=MainPID
      - --property=ControlPID
      - --property=Result
      - --property=NRestarts
      - --property=ActiveEnterTimestampMonotonic
      - --property=ExecMainStartTimestampMonotonic
      - "{{ item.name }}"
  loop:
    - name: billet-server.service
      was_active: "{{ billet_upgrade_manifest.server_was_active }}"
    - name: billet-node.service
      was_active: "{{ billet_upgrade_manifest.node_was_active }}"
  register: billet_restored_service_baseline
  changed_when: false
  failed_when: false
  when: item.was_active | bool
  become: true

- name: Observe restored services across the restart interval
  ansible.builtin.pause:
    seconds: 6
  when:
    - billet_upgrade_manifest.server_was_active | bool or billet_upgrade_manifest.node_was_active | bool

- name: Inspect restored service stability after the restart interval
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=MainPID
      - --property=ControlPID
      - --property=Result
      - --property=NRestarts
      - --property=ActiveEnterTimestampMonotonic
      - --property=ExecMainStartTimestampMonotonic
      - "{{ item.name }}"
  loop:
    - name: billet-server.service
      was_active: "{{ billet_upgrade_manifest.server_was_active }}"
    - name: billet-node.service
      was_active: "{{ billet_upgrade_manifest.node_was_active }}"
  register: billet_restored_service_state
  changed_when: false
  failed_when: false
  when: item.was_active | bool
  become: true

- name: Prove services active before the upgrade are stably active again
  ansible.builtin.assert:
    that:
      - item.0.rc == 0
      - item.1.rc == 0
      - item.0.stdout == item.1.stdout
      - "'LoadState=loaded' in item.1.stdout"
      - "'ActiveState=active' in item.1.stdout"
      - "'SubState=running' in item.1.stdout"
      - "'MainPID=0' not in item.1.stdout"
      - "'ControlPID=0' in item.1.stdout"
      - "'Result=success' in item.1.stdout"
    fail_msg: >-
      Upgrade inputs were restored at {{ billet_upgrade_recovery_dir }}, but
      {{ item.1.item.name }} did not remain unchanged, active and running across
      the systemd restart interval. Inspect the recovery copy and systemd
      journal before retrying.
  loop: "{{ billet_restored_service_baseline.results | zip(billet_restored_service_state.results) | list }}"
  loop_control:
    label: "{{ item.1.item.name }}"
  when: not (item.1.skipped | default(false))

- name: Record the durable rollback commit before opening administration
  ansible.builtin.copy:
    content: "host rollback committed\n"
    dest: "{{ billet_upgrade_recovery_dir }}/commit.complete"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Durably publish the rollback commit before opening administration
  ansible.builtin.command:
    argv:
      - sync
      - -f
      - "{{ billet_upgrade_recovery_dir }}"
  changed_when: false
  become: true

- name: Finalize the committed host rollback
  ansible.builtin.include_tasks: upgrade-finalize.yml
