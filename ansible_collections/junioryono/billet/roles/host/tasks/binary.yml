---
# Fetch a PINNED billet release onto the target, for an operator who would
# rather name a version than stage a binary and hand it over.
#
# THE TRUST MODEL IS WEAKER THAN FIRECRACKER'S, one file over, and the
# difference is the whole reason this comment exists. Those hashes are pinned in
# THIS COLLECTION, so a tampered release fails here. billet's own checksums.txt
# comes from the same origin as the archive it describes, so verifying against
# it proves the download is complete and uncorrupted and says NOTHING about
# whether the release host is honest. A collection that ships independently of
# billet's releases cannot pin their hashes; billet_binary_src remains the way
# to install an artefact you verified yourself.
#
# It also changes the DEPLOYMENT SHAPE. A host given billet_binary_src needs no
# outbound access at all — the binary arrives over the SSH connection Ansible
# already has, which is what makes an air-gapped or egress-filtered node
# possible. Fetching here makes the release origin a requirement of
# provisioning. billet_release_url_base points that at an internal mirror.

# A CHANNEL IS RESOLVED ONCE, HERE, AND EVERYTHING BELOW SEES A PINNED VERSION.
#
# The refusal that follows is unchanged and still applies — to the RESOLVED value.
# An operator who set a channel has opted into a non-deterministic converge
# knowingly; what they have not opted into is the rest of this file guessing, so
# the channel stops existing at this line.
#
# THE STATEMENT'S SIGNATURE IS NOT CHECKED HERE, and saying so is the point. This
# is Ansible reading a pointer to work out which archive to fetch; the integrity
# check for what it then installs is checksums.txt, exactly as it is for a pinned
# version, with exactly the same limits the comment at the top of this file
# describes. `billet host-upgrade` is the path that verifies a signature, because
# by then there is a billet on the host to do it with.
- name: Resolve the release channel
  when:
    - billet_release_channel | length > 0
    - billet_version | length == 0
  block:
    - name: Read the signed channel statement
      ansible.builtin.uri:
        url: "{{ billet_release_channel_base }}/{{ billet_release_channel }}.json"
        return_content: true
        timeout: "{{ billet_fetch_timeout }}"
      register: billet_channel_statement
      until: billet_channel_statement is succeeded
      retries: "{{ billet_fetch_retries }}"
      delay: "{{ billet_fetch_retry_delay }}"
      delegate_to: localhost
      become: false
      # A DRY RUN READS THE CHANNEL: the GET changes nothing, and a module
      # skipped in check mode would leave the next task reading a statement
      # that was never fetched, so a dry run of a channel could neither report
      # the release it would install nor refuse a moving one.
      check_mode: false

    # INTO THE PRIVATE RESOLVED VARIABLE, never the public pin: an input a task
    # assigns is one a frozen inventory cannot stand for, and everything below
    # reads the resolved value.
    - name: Take the release the channel names
      ansible.builtin.set_fact:
        billet_resolved_version: "{{ billet_channel_statement.json.tag }}"

    - name: Report which release the channel resolved to
      ansible.builtin.debug:
        msg: >-
          The {{ billet_release_channel }} channel names {{ billet_resolved_version }};
          this converge installs that. Pin billet_version to make the same
          playbook install the same binary on a later day.

- name: Refuse an unpinned billet version
  ansible.builtin.assert:
    that:
      - billet_resolved_version | lower not in ['latest', 'main', 'head']
    fail_msg: >-
      billet_version must name one release, not {{ billet_resolved_version }}. A moving
      target makes a converge non-deterministic: the same playbook installs
      different binaries on different days, and does it through the drain and
      restart of a real upgrade transaction. Server and node cannot negotiate
      across versions either, so a fleet has to pin one and move it
      deliberately.

- name: Resolve the release architecture
  ansible.builtin.set_fact:
    # .get rather than an index: an architecture billet does not publish must
    # reach the refusal below, not raise an undefined-key error in its place.
    billet_release_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], '') }}

- name: Refuse an architecture billet does not publish
  ansible.builtin.assert:
    that:
      - billet_release_arch | length > 0
    fail_msg: >-
      billet publishes linux amd64 and arm64; this host reports
      {{ ansible_facts['architecture'] }}. Build the binary yourself and pass it
      as billet_binary_src.

- name: Name the release artefacts
  ansible.builtin.set_fact:
    # goreleaser's archive name drops the tag's leading v, while the release
    # itself keeps it. Both spellings appear in one URL.
    billet_release_archive: >-
      billet_{{ billet_resolved_version | regex_replace('^v', '') }}_linux_{{ billet_release_arch }}.tar.gz
    billet_release_base: "{{ billet_release_url_base }}/{{ billet_resolved_version }}"
    billet_release_candidate: "{{ billet_release_stage }}/billet-{{ billet_resolved_version }}"
    # THE EVIDENCE `billet release record` NEEDS, kept beside the candidate: the
    # archive it was unpacked from and the manifest that names that archive. A
    # release that answered 404 for its manifest is asked again next time, one
    # request, because a manifest can be published after its archive or a
    # mirror can catch up, and a remembered absence would never learn of it.
    billet_release_evidence_archive: "{{ billet_release_stage }}/billet-{{ billet_resolved_version }}.tar.gz"
    billet_release_evidence_manifest: "{{ billet_release_stage }}/billet-{{ billet_resolved_version }}.release-manifest.json"

- name: Inspect the release candidate already staged for this version
  ansible.builtin.stat:
    path: "{{ billet_release_candidate }}"
  register: billet_release_candidate_stat
  check_mode: false
  become: true

- name: Refuse a staged candidate that root did not put there
  ansible.builtin.assert:
    that:
      - billet_release_candidate_stat.stat.pw_name == 'root'
      - not billet_release_candidate_stat.stat.wgrp
      - not billet_release_candidate_stat.stat.woth
      - billet_release_candidate_stat.stat.isreg
      - not billet_release_candidate_stat.stat.islnk
    fail_msg: >-
      {{ billet_release_candidate }} is reused as {{ billet_resolved_version }} without
      re-verifying it, so it must be a regular file owned by root and writable by
      nobody else. It is owned by
      {{ billet_release_candidate_stat.stat.pw_name | default('?') }}. Remove it
      and converge again to refetch from {{ billet_release_base }}.
  when: billet_release_candidate_stat.stat.exists

- name: Inspect the release evidence already staged beside the candidate
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ billet_release_evidence_archive }}"
    - "{{ billet_release_evidence_manifest }}"
  register: billet_release_evidence_stat
  check_mode: false
  become: true

# THE SAME RULE AS THE CANDIDATE'S: what `release record` is handed is what it
# attests to, so it must be root's and writable by nobody else.
- name: Refuse staged release evidence that root did not put there
  ansible.builtin.assert:
    that:
      - item.stat.pw_name == 'root'
      - not item.stat.wgrp
      - not item.stat.woth
      - item.stat.isreg
      - not item.stat.islnk
    fail_msg: >-
      {{ item.item }} is the evidence a provenance record for {{ billet_resolved_version }}
      would be written from, so it must be a regular file owned by root and writable by
      nobody else. Remove it and converge again to refetch it from {{ billet_release_base }}.
  loop: "{{ billet_release_evidence_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

# FETCHED AGAIN WHEN A CANDIDATE WAS STAGED WITHOUT IT, by a collection from
# before the role recorded provenance (#91): the archive is verified against
# checksums.txt exactly as below, and the candidate is not replaced, so an
# archive whose binary is not the staged one is refused by `release record`.
- name: Decide what of the release this run fetches
  ansible.builtin.set_fact:
    billet_release_fetch_archive: >-
      {{ not billet_release_candidate_stat.stat.exists
         or not billet_release_evidence_stat.results[0].stat.exists }}
    billet_release_fetch_manifest: >-
      {{ not billet_release_candidate_stat.stat.exists
         or not billet_release_evidence_stat.results[1].stat.exists }}

- name: Inspect the release staging directory before creating it
  ansible.builtin.stat:
    path: "{{ billet_release_stage }}"
    follow: false
  register: billet_release_stage_stat
  check_mode: false
  become: true

# account.yml creates this directory too, and runs AFTER this file — so on a
# fresh host it does not exist yet and cannot be relied on here.
- name: Refuse a release staging path that is not a directory
  ansible.builtin.assert:
    that:
      - not billet_release_stage_stat.stat.exists or
        (billet_release_stage_stat.stat.isdir and not billet_release_stage_stat.stat.islnk)
    fail_msg: >-
      {{ billet_release_stage }} exists and is not a real directory. billet
      stages a downloaded release there as root; following a symlink out of it
      would write wherever the link points.

- name: Create the release staging directory
  ansible.builtin.file:
    path: "{{ billet_release_stage }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true

# VERIFIED BEFORE IT IS UNPACKED. get_url is given the checksums file rather
# than a literal, and matches this archive's line in it by name; a mismatch
# leaves nothing behind to unpack. The checksums fetch happens inside the
# module, so the retry below covers it too — and a checksum that does not
# match is retried like any other failure, which costs a tampered release a
# few more refusals and nothing else.
- name: Create a private working directory for this run
  ansible.builtin.tempfile:
    state: directory
    prefix: billet-release-
    suffix: .d
  register: billet_release_workdir
  # SCRATCH, NOT A CHANGE TO THE HOST: removed below, whatever was fetched.
  changed_when: false
  become: true
  when:
    - billet_release_fetch_archive or billet_release_fetch_manifest
    - not ansible_check_mode

- name: Name this run's private working directory
  ansible.builtin.set_fact:
    billet_release_unpack: "{{ billet_release_workdir.path | default('') }}"
  when:
    - billet_release_fetch_archive or billet_release_fetch_manifest
    - not ansible_check_mode

# THE ARCHIVE IS REQUIRED ONLY WHERE IT IS THE CANDIDATE. Fetched again beside a
# candidate already staged, it is evidence for the provenance record, which
# decides nothing: a fleet whose origin has since gone away, or a mirror that
# pruned the version, converges as it did before and records nothing.
- name: Download the pinned billet release
  ansible.builtin.get_url:
    url: "{{ billet_release_base }}/{{ billet_release_archive }}"
    dest: "{{ billet_release_unpack }}/{{ billet_release_archive }}"
    checksum: "sha256:{{ billet_release_base }}/checksums.txt"
    timeout: "{{ billet_fetch_timeout }}"
    owner: root
    group: root
    mode: "0600"
  register: billet_release_download
  until: billet_release_download is succeeded
  retries: "{{ billet_fetch_retries }}"
  delay: "{{ billet_fetch_retry_delay }}"
  changed_when: false
  ignore_errors: "{{ billet_release_candidate_stat.stat.exists }}"
  become: true
  when:
    - billet_release_fetch_archive
    - not ansible_check_mode

# THE MANIFEST, IF THIS RELEASE PUBLISHES ONE, as install.sh fetches it: any
# failure to fetch one (a release cut before manifests answers 404, a mirror may
# answer 403 or be unreachable) is a release with none here, said and never a
# failure of the converge, since the record decides nothing. A 404 is not
# retried. Its bytes are kept as served, because their sha256 is the digest a
# rollout compares. NOT VERIFIED HERE: `billet release record` refuses unless
# the manifest names this archive by hash and the binary is the one inside it.
- name: Download the release manifest, when the release publishes one
  ansible.builtin.get_url:
    url: "{{ billet_release_base }}/release-manifest.json"
    dest: "{{ billet_release_unpack }}/release-manifest.json"
    timeout: "{{ billet_fetch_timeout }}"
    owner: root
    group: root
    mode: "0600"
  register: billet_release_manifest_download
  until: >-
    billet_release_manifest_download is succeeded
    or billet_release_manifest_download.status_code | default(0) == 404
  retries: "{{ billet_fetch_retries }}"
  delay: "{{ billet_fetch_retry_delay }}"
  changed_when: false
  ignore_errors: true
  become: true
  when:
    - billet_release_fetch_manifest
    - not ansible_check_mode

- name: Unpack only the billet binary from the release
  ansible.builtin.unarchive:
    src: "{{ billet_release_unpack }}/{{ billet_release_archive }}"
    dest: "{{ billet_release_unpack }}"
    remote_src: true
    include: [billet]
    owner: root
    group: root
  become: true
  when:
    - not billet_release_candidate_stat.stat.exists
    - not ansible_check_mode

- name: Publish the unpacked binary under the version it came from
  ansible.builtin.copy:
    src: "{{ billet_release_unpack }}/billet"
    dest: "{{ billet_release_candidate }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - not billet_release_candidate_stat.stat.exists
    - not ansible_check_mode

# BESIDE THE CANDIDATE, so a later converge of the same version still has what
# `billet release record` needs: the transaction records from these after it
# installs, and a host whose binary is unchanged backfills from them.
- name: Keep the verified archive beside the candidate
  ansible.builtin.copy:
    src: "{{ billet_release_unpack }}/{{ billet_release_archive }}"
    dest: "{{ billet_release_evidence_archive }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - billet_release_fetch_archive
    - not ansible_check_mode
    - billet_release_download is succeeded

- name: Keep the release manifest beside the candidate
  ansible.builtin.copy:
    src: "{{ billet_release_unpack }}/release-manifest.json"
    dest: "{{ billet_release_evidence_manifest }}"
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - billet_release_fetch_manifest
    - not ansible_check_mode
    - billet_release_manifest_download is succeeded

- name: Say that nothing here can name this release's manifest
  ansible.builtin.debug:
    msg: >-
      {{ 'The release archive could not be fetched again beside the staged candidate ('
         ~ (billet_release_download.msg | default('no reason given')) ~ '), so'
         if billet_release_fetch_archive and billet_release_download is not succeeded
         else billet_resolved_version ~ ' publishes no release-manifest.json'
              if billet_release_manifest_download.status_code | default(0) == 404
         else 'The release manifest could not be fetched ('
              ~ (billet_release_manifest_download.msg | default('no reason given')) ~ '), so' }}
      nothing will record which manifest produced this host's binary, and a rollout
      reads its version rather than its bytes. Nothing else of the converge depends on it.
  when:
    - not ansible_check_mode
    - >-
      (billet_release_fetch_archive and billet_release_download is not succeeded)
      or (billet_release_fetch_manifest and billet_release_manifest_download is not succeeded)

# What account.yml inspects, journals and installs. The transaction is unchanged
# by where the candidate came from; only the side it lives on moves.
- name: Remove this run's working directory once the candidate is published
  ansible.builtin.file:
    path: "{{ billet_release_unpack }}"
    state: absent
  changed_when: false
  become: true
  when:
    - billet_release_fetch_archive or billet_release_fetch_manifest
    - not ansible_check_mode
    - billet_release_unpack | default('') | length > 0

- name: Report that a dry run does not fetch
  ansible.builtin.debug:
    msg: >-
      This is a check run, so nothing was fetched and the binary decision
      cannot be made. A real converge would download
      would-fetch={{ billet_release_base }}/{{ billet_release_archive }}
      and verify it against that release's checksums.txt.
  when:
    - ansible_check_mode
    - not billet_release_candidate_stat.stat.exists

# THE EVIDENCE IS NAMED ONLY WHEN BOTH HALVES ARE ON THE TARGET: an archive
# without a manifest records nothing, and record-provenance.yml reads an empty
# name as "nothing to record from".
- name: Inspect the release evidence this run leaves beside the candidate
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  loop:
    - "{{ billet_release_evidence_archive }}"
    - "{{ billet_release_evidence_manifest }}"
  register: billet_release_evidence_kept
  check_mode: false
  become: true

- name: Point the upgrade transaction at the fetched candidate
  ansible.builtin.set_fact:
    billet_candidate_path: "{{ billet_release_candidate }}"
    billet_candidate_on_target: >-
      {{ billet_release_candidate_stat.stat.exists or not ansible_check_mode }}
    billet_candidate_evidence_archive: >-
      {{ billet_release_evidence_archive
         if billet_release_evidence_kept.results | selectattr('stat.exists') | list | length == 2
         else '' }}
    billet_candidate_evidence_manifest: >-
      {{ billet_release_evidence_manifest
         if billet_release_evidence_kept.results | selectattr('stat.exists') | list | length == 2
         else '' }}
