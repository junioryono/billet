---
# A new holder cannot abandon an older run's row. Adopt the observed binding
# first, without importing the service account or collecting fleet evidence.
- name: Report the prospective reservation cancellation
  ansible.builtin.debug:
    msg: >-
      Would adopt the reservation through its recorded survivor
      {{ billet_retirement_classification.row.survivor }} under holder
      {{ billet_exclusion_holder }}, validate its binding, then abandon it.
      Check mode cancels nothing; ordinary host tasks remain bypassed.
  when: ansible_check_mode

- name: Cancel only after every step confirms the observed reservation
  when: not ansible_check_mode
  block:
    - name: Name cancellation's preparation step
      ansible.builtin.set_fact:
        billet_retirement_cancel_step: preparation

    - name: Require cancellation's recorded row operands
      ansible.builtin.assert:
        that:
          - billet_retirement_classification.row is mapping
          - billet_retirement_classification.row.retiring == inventory_hostname
          - billet_retirement_classification.row.state == 'reserved'
        fail_msg: Cancellation has no observed reservation for this retiring host.

    - name: Read the installed configuration's cancellation digest
      ansible.builtin.stat:
        path: /etc/billet/billet.yaml
        follow: true
        checksum_algorithm: sha256
        get_mime: false
      register: billet_retirement_cancel_installed
      ignore_unreachable: true
      failed_when: false
      become: true

    - name: Require the cancellation configuration digest
      ansible.builtin.assert:
        that:
          - not billet_retirement_cancel_installed.unreachable | default(false) | bool
          - not billet_retirement_cancel_installed.failed | default(false) | bool
          - billet_retirement_cancel_installed.stat.isreg | default(false)
          - billet_retirement_cancel_installed.stat.checksum | default('') is match('^[0-9a-f]{64}\Z')
        fail_msg: Cancellation could not read the installed configuration's digest.

    - name: Name cancellation's adoption step
      ansible.builtin.set_fact:
        billet_retirement_cancel_step: adoption

    - name: Adopt the cancellation reservation under this holder
      ansible.builtin.command:
        argv: >-
          {{ [billet_retirement_answerer, 'server', 'retire', '--reserve', '--json',
              '--run', billet_exclusion_holder, '--retiring-host', inventory_hostname,
              '--survivor-host', billet_retirement_classification.row.survivor,
              '--installed-sha256', billet_retirement_cancel_installed.stat.checksum,
              '--config', '/etc/billet/billet.yaml']
             + (['--environment-file', billet_retirement_environment_file]
                if billet_retirement_environment_file | length > 0 else []) }}
        expand_argument_vars: false
      register: billet_retirement_cancel_adopt_raw
      ignore_unreachable: true
      changed_when: false
      failed_when: false
      become: true

    - name: Parse cancellation adoption
      ansible.builtin.include_tasks: retire-answer.yml
      vars:
        billet_retire_raw: "{{ billet_retirement_cancel_adopt_raw }}"
        billet_retire_call: reserve
        billet_retire_answered_by: "{{ billet_retirement_answerer }}"

    - name: Bind cancellation adoption to the classified reservation
      ansible.builtin.assert:
        that:
          - billet_retire_answer.outcome == 'adopted'
          - billet_retire_answer.run == billet_exclusion_holder
          - billet_retire_answer.retiring == inventory_hostname
          - billet_retire_answer.retiring == billet_retirement_classification.row.retiring
          - billet_retire_answer.survivor == billet_retirement_classification.row.survivor
          - billet_retire_answer.transition_id == billet_retirement_classification.row.transition_id
        fail_msg: Cancellation adoption did not confirm the observed binding under this holder; abandonment was not attempted.

    - name: Name cancellation's abandonment step
      ansible.builtin.set_fact:
        billet_retirement_cancel_step: abandonment

    - name: Abandon the adopted cancellation reservation
      ansible.builtin.command:
        argv: >-
          {{ [billet_retirement_answerer, 'server', 'retire', '--abandon-reservation', '--json',
              '--run', billet_exclusion_holder, '--retiring-host', inventory_hostname,
              '--config', '/etc/billet/billet.yaml']
             + (['--environment-file', billet_retirement_environment_file]
                if billet_retirement_environment_file | length > 0 else []) }}
        expand_argument_vars: false
      register: billet_retirement_cancel_abandon_raw
      ignore_unreachable: true
      changed_when: false
      failed_when: false
      become: true

    - name: Parse cancellation abandonment
      ansible.builtin.include_tasks: retire-answer.yml
      vars:
        billet_retire_raw: "{{ billet_retirement_cancel_abandon_raw }}"
        billet_retire_call: abandon
        billet_retire_answered_by: "{{ billet_retirement_answerer }}"

    - name: Bind cancellation abandonment to the classified reservation
      ansible.builtin.assert:
        that: billet_retire_answer.transition_id == billet_retirement_classification.row.transition_id
        fail_msg: Cancellation abandonment answered for another transition; release is unproved.

    - name: Admit ordinary work after confirmed cancellation
      ansible.builtin.set_fact:
        billet_retirement_bypass: false
      changed_when: true
  rescue:
    - name: Fail the cancellation with its outstanding step
      ansible.builtin.fail:
        msg: >-
          Reservation cancellation failed at {{ billet_retirement_cancel_step }}
          ({{ ansible_failed_task.name }}):
          {{ ansible_failed_result.msg | default('The call did not answer.') }}
          Cancellation is unconfirmed for retiring host {{ inventory_hostname }},
          run {{ billet_exclusion_holder }}. Ordinary host tasks remain bypassed.
