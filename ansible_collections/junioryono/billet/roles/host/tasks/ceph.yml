---
- name: Bootstrap a new single-host Ceph cluster
  when: billet_ceph_bootstrap
  block:
    - name: Install Ceph bootstrap dependencies
      ansible.builtin.apt:
        name:
          - cephadm
          - docker.io
        state: present
      become: true

    - name: Work around Ubuntu uutils numeric owner handling
      ansible.builtin.group:
        name: ceph-daemon
        gid: 167
        system: true
        state: present
      become: true

    - name: Create the matching Ceph daemon account
      ansible.builtin.user:
        name: ceph-daemon
        uid: 167
        group: ceph-daemon
        home: /var/lib/ceph
        create_home: false
        shell: /usr/sbin/nologin
        system: true
        state: present
      become: true

    - name: Check whether Ceph is already configured
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: billet_ceph_conf

    # THE DAEMONS RUN THE HOST CLIENT'S OWN RELEASE. cephadm's default image is a
    # floating tag (quay.io/ceph/ceph:v19), and on 2026-11-08 it was 19.2.7 against
    # Ubuntu 24.04's ceph-common 19.2.3, which could not parse the admin key 19.2.7
    # wrote ("error setting modifier for [client.admin] type=key ... Malformed input"):
    # every `ceph` and `rbd` on the host, the role's own included, then failed to
    # connect. So the image is the tag of the installed client's release unless one
    # is named.
    - name: Read the release of the host's Ceph client
      ansible.builtin.command:
        argv: [dpkg-query, -W, "-f=${Version}", ceph-common]
      register: billet_ceph_client_release
      changed_when: false
      check_mode: false
      when:
        - not billet_ceph_conf.stat.exists
        - billet_ceph_container_image | length == 0

    - name: Name the image the daemons run
      ansible.builtin.set_fact:
        billet_ceph_bootstrap_image: >-
          {{ billet_ceph_container_image
             if billet_ceph_container_image | length > 0
             else 'quay.io/ceph/ceph:v' ~ (billet_ceph_client_release.stdout | trim | regex_replace('^[0-9]+:', '') | regex_search('^[0-9]+[.][0-9]+[.][0-9]+') | default('', true)) }}
      when: not billet_ceph_conf.stat.exists

    - name: Refuse a bootstrap whose image names no release
      ansible.builtin.assert:
        that:
          - >-
            billet_ceph_container_image | length > 0
            or billet_ceph_bootstrap_image is match('^quay[.]io/ceph/ceph:v[0-9]+[.][0-9]+[.][0-9]+$')
        fail_msg: >-
          The Ceph daemons' image would be {{ billet_ceph_bootstrap_image }}, which names no
          release: ceph-common answered {{ billet_ceph_client_release.stdout | default('nothing') }}.
          Name the image with billet_ceph_container_image (a named image is used as given).
      when: not billet_ceph_conf.stat.exists

    - name: Bootstrap Ceph without opening root SSH
      ansible.builtin.command:
        argv:
          - cephadm
          - --image
          - "{{ billet_ceph_bootstrap_image }}"
          - bootstrap
          - --mon-ip
          - "{{ billet_ceph_mon_ip }}"
          - --single-host-defaults
          - --ssh-user
          - "{{ billet_ceph_ssh_user }}"
          - --skip-monitoring-stack
          - --skip-dashboard
      become: true
      when: not billet_ceph_conf.stat.exists


    # ASKED AGAIN UNTIL IT NAMES EVERY DEVICE, BOUNDED. On a cluster this converge just
    # bootstrapped, cephadm has not yet inventoried the host's disks: on a fresh z1d.metal
    # (2026-11-08) the first answer did not list the named NVMe, so no OSD was added and
    # the pools' initialisation then waited on placement groups that had no OSD to land
    # on. A device listed at all, available or already an OSD, ends the wait; a name the
    # host never lists fails the converge here instead of being skipped.
    - name: Inspect Ceph's current device inventory
      ansible.builtin.command:
        argv: [ceph, orch, device, ls, --hostname, "{{ inventory_hostname }}", --format, json, --refresh]
      register: billet_ceph_device_inventory
      changed_when: false
      become: true
      until: >-
        billet_ceph_device_inventory.rc == 0 and
        (billet_ceph_devices | difference(
          (((billet_ceph_device_inventory.stdout | from_json) | selectattr('devices', 'defined') | map(attribute='devices') | flatten(levels=1))
           + ((billet_ceph_device_inventory.stdout | from_json) | rejectattr('devices', 'defined') | list))
          | selectattr('path', 'defined') | map(attribute='path') | list)) | length == 0
      retries: 30
      delay: 10

    # A LIST OF HOSTS, EACH WITH ITS devices (measured on Ceph 19.2.3, 2026-11-08:
    # `[{"addr", "devices": [{"path", "available", ...}], "labels", "name"}]`), so the
    # devices are read from inside each host; an entry with no devices list is read
    # as a device itself, the flat shape.
    - name: Add each explicitly named available OSD device
      ansible.builtin.command:
        argv: [ceph, orch, daemon, add, osd, "{{ inventory_hostname }}:{{ item }}"]
      loop: "{{ billet_ceph_devices }}"
      vars:
        billet_ceph_inventory_entries: "{{ billet_ceph_device_inventory.stdout | from_json }}"
        billet_ceph_inventory_devices: >-
          {{ (billet_ceph_inventory_entries | selectattr('devices', 'defined') | map(attribute='devices') | flatten(levels=1))
             + (billet_ceph_inventory_entries | rejectattr('devices', 'defined') | list) }}
      when: >-
        item in (
          billet_ceph_inventory_devices |
          selectattr('available', 'defined') | selectattr('available', 'equalto', true) |
          map(attribute='path') | list
        )
      changed_when: true
      become: true

- name: Inspect Ceph pools
  ansible.builtin.command: ceph osd pool ls
  register: billet_ceph_pools
  changed_when: false
  check_mode: false
  become: true

- name: Create billet Ceph pools
  ansible.builtin.command:
    argv: [ceph, osd, pool, create, "{{ item }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  when: item not in billet_ceph_pools.stdout_lines
  become: true

- name: Initialize billet Ceph pools for RBD
  ansible.builtin.command:
    argv: [rbd, pool, init, "{{ item }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  changed_when: false
  become: true

# ONE COPY IS A DECISION CEPH MAKES YOU STATE TWICE: the monitors refuse a size of
# 1 until mon_allow_pool_size_one is set, and the pool command until it is told
# --yes-i-really-mean-it. Both are said only where an inventory asked for it.
- name: Allow a billet Ceph pool to keep a single copy
  ansible.builtin.command:
    argv: [ceph, config, set, global, mon_allow_pool_size_one, "true"]
  when: (billet_ceph_pool_size | int) == 1 or (billet_ceph_cache_pool_size | int) == 1
  changed_when: false
  become: true

- name: Configure billet Ceph pool replication
  ansible.builtin.command:
    argv: [ceph, osd, pool, set, "{{ item.0 }}", "{{ item.1 }}", "{{ item.2 }}"]
  loop:
    - ["{{ billet_ceph_image_pool }}", size, "{{ billet_ceph_pool_size }}"]
    - ["{{ billet_ceph_image_pool }}", min_size, "{{ billet_ceph_pool_min_size }}"]
    - ["{{ billet_ceph_cache_pool }}", size, "{{ billet_ceph_cache_pool_size }}"]
    - ["{{ billet_ceph_cache_pool }}", min_size, "{{ billet_ceph_cache_pool_min_size }}"]
  when: item.1 != 'size' or (item.2 | int) > 1
  changed_when: false
  become: true

- name: Keep a single copy of each billet Ceph pool asked to
  ansible.builtin.command:
    argv: [ceph, osd, pool, set, "{{ item.0 }}", size, "1", --yes-i-really-mean-it]
  loop:
    - ["{{ billet_ceph_image_pool }}", "{{ billet_ceph_pool_size }}"]
    - ["{{ billet_ceph_cache_pool }}", "{{ billet_ceph_cache_pool_size }}"]
  when: (item.1 | int) == 1
  changed_when: false
  become: true

# NEVER MUTED. Ceph can only mute POOL_NO_REDUNDANCY for the whole cluster, which
# would also hide a pool left with one copy by mistake, so the health alert
# (ceph-health.sh) drops it only for the pools this inventory chose. Unmuting
# answers success when nothing is muted, so a failure here is a real one.
- name: Keep the no-redundancy warning unmuted
  ansible.builtin.command:
    argv: [ceph, health, unmute, POOL_NO_REDUNDANCY]
  changed_when: false
  become: true

- name: Require clone-v2-compatible Ceph clients
  ansible.builtin.command: ceph osd set-require-min-compat-client mimic
  changed_when: false
  become: true

# JOBS' IO BEFORE SCRUBBING AND RECOVERY (junioryono/billet#394). The cluster
# exists to serve guests' disks, and on 2026-10-05 a deep scrub ran on drives
# the trash purge already held near saturation while every job waited. mClock's
# high_client_ops profile gives client requests the larger share of each OSD,
# so scrubbing and recovery take longer instead of slowing the jobs. A cluster
# setting, for every OSD: an empty profile leaves a shared cluster's own policy
# alone.
- name: Let Ceph serve client IO ahead of scrubbing and recovery
  ansible.builtin.command:
    argv: [ceph, config, set, osd, osd_mclock_profile, "{{ billet_ceph_osd_mclock_profile }}"]
  when: billet_ceph_osd_mclock_profile | length > 0
  changed_when: false
  become: true

- name: Create the scoped billet Ceph identity
  ansible.builtin.command:
    argv:
      - ceph
      - auth
      - get-or-create
      - "client.{{ billet_ceph_user }}"
      - mon
      - profile rbd
      - osd
      - "profile rbd pool={{ billet_ceph_image_pool }}, profile rbd pool={{ billet_ceph_cache_pool }}"
      - -o
      - "{{ billet_ceph_keyring_path }}"
  changed_when: false
  become: true

- name: Protect the billet Ceph keyring
  ansible.builtin.file:
    path: "{{ billet_ceph_keyring_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Verify the scoped Ceph identity can read both pools
  ansible.builtin.command:
    argv: [rbd, ls, "{{ item }}", --id, "{{ billet_ceph_user }}", --keyring, "{{ billet_ceph_keyring_path }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  changed_when: false
  become: true

- name: Load the RBD kernel client after every boot
  ansible.builtin.copy:
    content: "rbd\n"
    dest: /etc/modules-load.d/billet-rbd.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Load the RBD kernel client now
  ansible.builtin.command: modprobe rbd
  changed_when: false
  when: not ansible_check_mode
  become: true
