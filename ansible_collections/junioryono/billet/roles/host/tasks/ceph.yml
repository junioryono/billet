---
- name: Bootstrap a new single-host Ceph cluster
  when: billet_ceph_bootstrap
  block:
    - name: Install Ceph bootstrap dependencies
      ansible.builtin.apt:
        name:
          - cephadm
          - docker.io
        state: present
      become: true

    - name: Work around Ubuntu uutils numeric owner handling
      ansible.builtin.group:
        name: ceph-daemon
        gid: 167
        system: true
        state: present
      become: true

    - name: Create the matching Ceph daemon account
      ansible.builtin.user:
        name: ceph-daemon
        uid: 167
        group: ceph-daemon
        home: /var/lib/ceph
        create_home: false
        shell: /usr/sbin/nologin
        system: true
        state: present
      become: true

    - name: Check whether Ceph is already configured
      ansible.builtin.stat:
        path: /etc/ceph/ceph.conf
      register: billet_ceph_conf

    - name: Bootstrap Ceph without opening root SSH
      ansible.builtin.command:
        argv:
          - cephadm
          - bootstrap
          - --mon-ip
          - "{{ billet_ceph_mon_ip }}"
          - --single-host-defaults
          - --ssh-user
          - "{{ billet_ceph_ssh_user }}"
          - --skip-monitoring-stack
          - --skip-dashboard
      become: true
      when: not billet_ceph_conf.stat.exists


    - name: Inspect Ceph's current device inventory
      ansible.builtin.command:
        argv: [ceph, orch, device, ls, --hostname, "{{ inventory_hostname }}", --format, json, --refresh]
      register: billet_ceph_device_inventory
      changed_when: false
      become: true

    - name: Add each explicitly named available OSD device
      ansible.builtin.command:
        argv: [ceph, orch, daemon, add, osd, "{{ inventory_hostname }}:{{ item }}"]
      loop: "{{ billet_ceph_devices }}"
      when: >-
        item in (
          billet_ceph_device_inventory.stdout | from_json |
          selectattr('available', 'equalto', true) |
          map(attribute='path') | list
        )
      changed_when: true
      become: true

- name: Inspect Ceph pools
  ansible.builtin.command: ceph osd pool ls
  register: billet_ceph_pools
  changed_when: false
  check_mode: false
  become: true

- name: Create billet Ceph pools
  ansible.builtin.command:
    argv: [ceph, osd, pool, create, "{{ item }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  when: item not in billet_ceph_pools.stdout_lines
  become: true

- name: Initialize billet Ceph pools for RBD
  ansible.builtin.command:
    argv: [rbd, pool, init, "{{ item }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  changed_when: false
  become: true

- name: Configure billet Ceph pool replication
  ansible.builtin.command:
    argv: [ceph, osd, pool, set, "{{ item.0 }}", "{{ item.1 }}", "{{ item.2 }}"]
  loop:
    - ["{{ billet_ceph_image_pool }}", size, "{{ billet_ceph_pool_size }}"]
    - ["{{ billet_ceph_image_pool }}", min_size, "{{ billet_ceph_pool_min_size }}"]
    - ["{{ billet_ceph_cache_pool }}", size, "{{ billet_ceph_pool_size }}"]
    - ["{{ billet_ceph_cache_pool }}", min_size, "{{ billet_ceph_pool_min_size }}"]
  changed_when: false
  become: true

- name: Require clone-v2-compatible Ceph clients
  ansible.builtin.command: ceph osd set-require-min-compat-client mimic
  changed_when: false
  become: true

- name: Create the scoped billet Ceph identity
  ansible.builtin.command:
    argv:
      - ceph
      - auth
      - get-or-create
      - "client.{{ billet_ceph_user }}"
      - mon
      - profile rbd
      - osd
      - "profile rbd pool={{ billet_ceph_image_pool }}, profile rbd pool={{ billet_ceph_cache_pool }}"
      - -o
      - "{{ billet_ceph_keyring_path }}"
  changed_when: false
  become: true

- name: Protect the billet Ceph keyring
  ansible.builtin.file:
    path: "{{ billet_ceph_keyring_path }}"
    owner: root
    group: root
    mode: "0600"
  become: true

- name: Verify the scoped Ceph identity can read both pools
  ansible.builtin.command:
    argv: [rbd, ls, "{{ item }}", --id, "{{ billet_ceph_user }}", --keyring, "{{ billet_ceph_keyring_path }}"]
  loop:
    - "{{ billet_ceph_image_pool }}"
    - "{{ billet_ceph_cache_pool }}"
  changed_when: false
  become: true

- name: Classify optional SMTP alert credentials
  ansible.builtin.set_fact:
    billet_smtp_user_set: "{{ billet_smtp_username | length > 0 }}"
    billet_smtp_password_set: "{{ billet_smtp_password | length > 0 }}"

- name: Inspect an existing SMTP configuration
  ansible.builtin.stat:
    path: /etc/msmtprc
  register: billet_smtp_config

- name: Inspect whether billet owns the SMTP configuration
  ansible.builtin.stat:
    path: /etc/billet/msmtprc-managed
  register: billet_smtp_managed

- name: Inspect the Ceph health timer unit
  ansible.builtin.stat:
    path: /etc/systemd/system/billet-ceph-health.timer
  register: billet_ceph_health_timer_unit

- name: Refuse partial Ceph alerting configuration
  ansible.builtin.assert:
    that:
      - billet_alert_email | length == 0 or billet_smtp_user_set == billet_smtp_password_set
      - (billet_alert_email | length == 0) == (billet_alert_from | length == 0)
      - billet_alert_email | length == 0 or billet_smtp_user_set or billet_smtp_config.stat.exists
    fail_msg: >-
      Ceph email alerting needs a recipient, a sender, and both SMTP credential
      fields. A partial setup would look monitored and report nothing.

- name: Configure Ceph email health alerts
  when: billet_alert_email | length > 0
  block:
    - name: Install the send-only mail path
      ansible.builtin.apt:
        name:
          - bsd-mailx
          - msmtp-mta
        state: present
      become: true

    - name: Install the protected SMTP configuration
      ansible.builtin.template:
        src: msmtprc.j2
        dest: /etc/msmtprc
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: billet_smtp_user_set

    - name: Record ownership of the SMTP configuration
      ansible.builtin.copy:
        content: "managed by junioryono.billet.host\n"
        dest: /etc/billet/msmtprc-managed
        owner: root
        group: root
        mode: "0600"
      become: true
      when: billet_smtp_user_set

    - name: Verify SMTP authentication without sending mail
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - >-
            import re,smtplib,ssl; c=open('/etc/msmtprc').read();
            v=lambda k: re.search(rf'^{k}\s+(\S+)',c,re.M).group(1);
            s=smtplib.SMTP(v('host'),int(v('port')),timeout=25); s.ehlo();
            s.starttls(context=ssl.create_default_context()); s.ehlo();
            s.login(v('user'),v('password')); s.quit()
      changed_when: false
      become: true
      no_log: true
      when: billet_smtp_user_set

    - name: Install the Ceph health monitor
      ansible.builtin.template:
        src: ceph-health.sh.j2
        dest: /usr/local/libexec/billet-ceph-health
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the Ceph health systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - billet-ceph-health.service
        - billet-ceph-health.timer
      become: true
      notify: Reload systemd

    - name: Apply Ceph health unit changes
      ansible.builtin.meta: flush_handlers

    - name: Start the Ceph health timer
      ansible.builtin.systemd_service:
        name: billet-ceph-health.timer
        enabled: true
        state: started
      when: not ansible_check_mode
      become: true

- name: Remove disabled Ceph email health alerts
  when: billet_alert_email | length == 0
  block:
    - name: Stop and disable the Ceph health timer
      ansible.builtin.systemd_service:
        name: billet-ceph-health.timer
        enabled: false
        state: stopped
      when:
        - billet_ceph_health_timer_unit.stat.exists
        - not ansible_check_mode
      become: true

    - name: Remove the Ceph health monitor and units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/libexec/billet-ceph-health
        - /etc/systemd/system/billet-ceph-health.service
        - /etc/systemd/system/billet-ceph-health.timer
      become: true
      notify: Reload systemd

    - name: Remove billet-owned SMTP credentials
      ansible.builtin.file:
        path: /etc/msmtprc
        state: absent
      when: billet_smtp_managed.stat.exists
      become: true
      no_log: true

    - name: Remove the SMTP ownership marker
      ansible.builtin.file:
        path: /etc/billet/msmtprc-managed
        state: absent
      become: true
