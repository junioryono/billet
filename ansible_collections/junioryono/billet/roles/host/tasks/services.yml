---
- name: Apply unit changes before billet validation
  ansible.builtin.meta: flush_handlers

- name: Inspect billet service state before the upgrade transaction
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item }}"
  loop:
    - billet-server.service
    - billet-node.service
  register: billet_service_state_before_upgrade
  changed_when: false
  failed_when: billet_service_state_before_upgrade.rc not in [0, 3, 4]
  check_mode: false
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode
  become: true

- name: Initialize upgrade rollback facts
  ansible.builtin.set_fact:
    billet_guest_refresh_images: []
    billet_previous_binary_preserved: false
    billet_ledger_preserved: false
    billet_ledger_snapshot_taken: false
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode

- name: Prove every configured guest image is compatible with the candidate binary
  ansible.builtin.command:
    argv:
      - "{{ billet_firecracker_stage }}/billet-candidate"
      - images
      - compatible
      - --result-file
      - "{{ billet_firecracker_stage }}/guest-images-to-refresh"
      - --config
      - "{{ billet_upgrade_recovery_dir }}/billet.yaml.candidate"
  register: billet_guest_compatibility
  changed_when: false
  failed_when: billet_guest_compatibility.rc not in [0, 2]
  when:
    - billet_binary_upgrade | default(false)
    - billet_firecracker_enabled
    - not ansible_check_mode
  become: true

- name: Read the guest images that need a compatible generation
  ansible.builtin.slurp:
    src: "{{ billet_firecracker_stage }}/guest-images-to-refresh"
  register: billet_guest_refresh_file
  when:
    - billet_binary_upgrade | default(false)
    - billet_firecracker_enabled
    - not ansible_check_mode
    - billet_guest_compatibility.rc == 2
  become: true

- name: Remember every guest image that needs a compatible generation
  ansible.builtin.set_fact:
    billet_guest_refresh_images: "{{ (billet_guest_refresh_file.content | b64decode).splitlines() }}"
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode
    - billet_guest_refresh_file.content is defined

- name: Upgrade billet as one recoverable host transaction
  when:
    - billet_binary_upgrade | default(false)
    - not ansible_check_mode
  become: true
  block:
    - name: Gracefully stop the billet node before changing its guest contract
      ansible.builtin.systemd_service:
        name: billet-node.service
        state: stopped
      when: billet_previous_upgrade_inputs.results[2].stat.exists

    - name: Pull, boot-verify, and promote every compatible guest needed
      ansible.builtin.command:
        argv:
          - "{{ billet_firecracker_stage }}/billet-candidate"
          - images
          - pull
          - --verify
          - --rollback-file
          - "{{ billet_upgrade_recovery_dir }}/prepared-image-{{ billet_guest_refresh_index }}"
          - --config
          - "{{ billet_upgrade_recovery_dir }}/billet.yaml.candidate"
          - "{{ item }}"
      loop: "{{ billet_guest_refresh_images }}"
      loop_control:
        index_var: billet_guest_refresh_index
        label: "{{ item }}"

    - name: Gracefully stop the billet server after compute has drained
      ansible.builtin.systemd_service:
        name: billet-server.service
        state: stopped
      when: billet_previous_upgrade_inputs.results[1].stat.exists

    - name: Preserve the previous billet binary
      ansible.builtin.copy:
        src: /usr/bin/billet
        dest: "{{ billet_upgrade_recovery_dir }}/billet.previous"
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when: billet_binary_checksums.results[0].stat.exists

    - name: Remember that the previous billet binary is recoverable
      ansible.builtin.set_fact:
        billet_previous_binary_preserved: true
      when: billet_binary_checksums.results[0].stat.exists

    - name: Inspect the stopped control-plane ledger
      ansible.builtin.stat:
        path: "{{ billet_candidate_server_state_dir }}"
      register: billet_ledger_before_upgrade

    - name: Remember that the stopped ledger was inspected
      ansible.builtin.set_fact:
        billet_ledger_snapshot_taken: true

    - name: Preserve the stopped control-plane ledger
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ billet_candidate_server_state_dir }}"
          - "{{ billet_upgrade_recovery_dir }}/server"
        creates: "{{ billet_upgrade_recovery_dir }}/server"
      when: billet_ledger_before_upgrade.stat.exists

    - name: Remember that the stopped control-plane ledger is recoverable
      ansible.builtin.set_fact:
        billet_ledger_preserved: true
      when: billet_ledger_before_upgrade.stat.exists

    - name: Install candidate configuration after preserving the stopped ledger
      ansible.builtin.copy:
        src: "{{ billet_upgrade_recovery_dir }}/billet.yaml.candidate"
        dest: /etc/billet/billet.yaml
        remote_src: true
        owner: root
        group: "{{ billet_service_group }}"
        mode: "0640"

    - name: Install candidate systemd units after preserving the stopped ledger
      ansible.builtin.copy:
        src: "{{ billet_upgrade_recovery_dir }}/{{ item | basename }}.candidate"
        dest: "{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/systemd/system/billet-server.service
        - /etc/systemd/system/billet-node.service

    - name: Load candidate systemd units before starting either upgraded service
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Install the candidate billet binary after the ledger lock is released
      ansible.builtin.copy:
        src: "{{ billet_firecracker_stage }}/billet-candidate"
        dest: /usr/bin/billet
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      register: billet_binary_install

    - name: Validate and migrate with the new billet binary as the only ledger writer
      ansible.builtin.command: /usr/bin/billet check --config /etc/billet/billet.yaml
      register: billet_check
      changed_when: false

    - name: Return the migrated ledger to the control-plane account before restart
      ansible.builtin.file:
        path: "{{ billet_candidate_server_state_dir }}"
        state: directory
        owner: "{{ billet_service_user }}"
        group: "{{ billet_service_group }}"
        recurse: true

    - name: Start the upgraded billet server before admitting compute
      ansible.builtin.systemd_service:
        name: billet-server.service
        enabled: true
        state: started
      when: billet_enable_server

    - name: Start the upgraded billet node after validation and image verification
      ansible.builtin.systemd_service:
        name: billet-node.service
        enabled: true
        state: started
      when: billet_enable_node

  rescue:
    - name: Stop upgraded compute before rollback
      ansible.builtin.systemd_service:
        name: billet-node.service
        state: stopped
      failed_when: false

    - name: Stop the upgraded control plane before restoring its ledger
      ansible.builtin.systemd_service:
        name: billet-server.service
        state: stopped
      failed_when: false

    - name: Inspect service state before restoring upgrade inputs
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item }}"
      loop:
        - billet-node.service
        - billet-server.service
      register: billet_service_state_before_restore
      changed_when: false
      failed_when: false

    - name: Refuse rollback while either upgraded process may still be running
      ansible.builtin.assert:
        that:
          - billet_service_state_before_restore.results[0].rc in [3, 4]
          - billet_service_state_before_restore.results[1].rc in [3, 4]
        fail_msg: >-
          Rollback stopped before restoring the ledger because billet-node or
          billet-server did not prove inactive. The untouched recovery copy is
          at {{ billet_upgrade_recovery_dir }}.

    - name: Find guest rollback handles written before promotion
      ansible.builtin.find:
        paths: "{{ billet_upgrade_recovery_dir }}"
        patterns: prepared-image-*
        file_type: file
      register: billet_guest_rollback_handles

    - name: Read every guest rollback handle
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ billet_guest_rollback_handles.files }}"
      loop_control:
        label: "{{ item.path }}"
      register: billet_rollback_image_files

    - name: Withdraw guest generations prepared only for the failed upgrade
      ansible.builtin.command:
        argv:
          - "{{ billet_firecracker_stage }}/billet-candidate"
          - images
          - unpromote
          - --config
          - "{{ billet_upgrade_recovery_dir }}/billet.yaml.candidate"
          - "{{ item.content | b64decode | trim }}"
      loop: "{{ billet_rollback_image_files.results | default([]) }}"
      loop_control:
        label: "{{ item.content | b64decode | trim }}"
      failed_when: false
      when: item.content is defined

    - name: Remove the migrated ledger copy before restoring the stopped snapshot
      ansible.builtin.file:
        path: "{{ billet_candidate_server_state_dir }}"
        state: absent
      when:
        - billet_ledger_snapshot_taken | default(false)

    - name: Restore the previous control-plane ledger
      ansible.builtin.command:
        argv:
          - cp
          - -a
          - "{{ billet_upgrade_recovery_dir }}/server"
          - "{{ billet_candidate_server_state_dir }}"
      when:
        - billet_ledger_preserved | default(false)

    - name: Restore configuration and units that existed before the upgrade
      ansible.builtin.copy:
        src: "{{ billet_upgrade_recovery_dir }}/{{ item.item | basename }}.previous"
        dest: "{{ item.item }}"
        remote_src: true
        owner: "{{ item.stat.pw_name }}"
        group: "{{ item.stat.gr_name }}"
        mode: "{{ item.stat.mode }}"
      loop: "{{ billet_previous_upgrade_inputs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: item.stat.exists

    - name: Remove configuration and units created only for the failed upgrade
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: absent
      loop: "{{ billet_previous_upgrade_inputs.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not item.stat.exists

    - name: Reload restored systemd units before restarting the previous version
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Restore the previous billet binary
      ansible.builtin.copy:
        src: "{{ billet_upgrade_recovery_dir }}/billet.previous"
        dest: /usr/bin/billet
        remote_src: true
        owner: root
        group: root
        mode: "0755"
      when:
        - billet_previous_binary_preserved | default(false)

    - name: Remove a failed first-install binary with no predecessor
      ansible.builtin.file:
        path: /usr/bin/billet
        state: absent
      when:
        - billet_upgrade_recovery_dir | length > 0
        - not billet_binary_checksums.results[0].stat.exists

    - name: Restart the previous billet server after rollback
      ansible.builtin.systemd_service:
        name: billet-server.service
        state: started
      failed_when: false
      when:
        - billet_service_state_before_upgrade.results[0].rc == 0

    - name: Restart the previous billet node after rollback
      ansible.builtin.systemd_service:
        name: billet-node.service
        state: started
      failed_when: false
      when:
        - billet_service_state_before_upgrade.results[1].rc == 0

    - name: Let restored services pass their immediate startup checks
      ansible.builtin.pause:
        seconds: 2

    - name: Inspect restored service state
      ansible.builtin.command:
        argv:
          - systemctl
          - is-active
          - "{{ item.name }}"
      loop:
        - name: billet-server.service
          was_active: "{{ billet_service_state_before_upgrade.results[0].rc == 0 }}"
        - name: billet-node.service
          was_active: "{{ billet_service_state_before_upgrade.results[1].rc == 0 }}"
      register: billet_restored_service_state
      changed_when: false
      failed_when: false
      until: not (item.was_active | bool) or billet_restored_service_state.rc == 0
      retries: 30
      delay: 1

    - name: Prove services that were active before the upgrade are active again
      ansible.builtin.assert:
        that:
          - not (item.item.was_active | bool) or item.rc == 0
        fail_msg: >-
          Upgrade inputs were restored at {{ billet_upgrade_recovery_dir }}, but
          {{ item.item.name }} did not return to its prior active state. Inspect
          that recovery copy and the systemd journal before retrying.
      loop: "{{ billet_restored_service_state.results }}"
      loop_control:
        label: "{{ item.item.name }}"

    - name: Report the failed upgrade and its recovery copy
      ansible.builtin.fail:
        msg: >-
          The billet upgrade failed. Its previous binary, configuration, units,
          ledger, and active service state were restored. The recovery copy
          remains at {{ billet_upgrade_recovery_dir }}.

- name: Validate a billet host whose binary did not change
  ansible.builtin.command: /usr/bin/billet check --config /etc/billet/billet.yaml
  register: billet_check
  changed_when: false
  when:
    - not billet_binary_upgrade | default(false)
    - not ansible_check_mode
  become: true

- name: Return server state created by validation to the control-plane account
  ansible.builtin.file:
    path: "{{ billet_config.get('server', {}).get('state_dir', '/var/lib/billet/server') }}"
    state: directory
    owner: "{{ billet_service_user }}"
    group: "{{ billet_service_group }}"
    recurse: true
  when:
    - billet_enable_server
    - not ansible_check_mode
  become: true

- name: Inspect control-plane state files
  ansible.builtin.find:
    paths: "{{ billet_config.get('server', {}).get('state_dir', '/var/lib/billet/server') }}"
    file_type: file
    recurse: false
  register: billet_server_state_files
  when:
    - billet_enable_server
    - not ansible_check_mode
  become: true

- name: Protect control-plane state files
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ billet_service_user }}"
    group: "{{ billet_service_group }}"
    mode: "0600"
  loop: "{{ billet_server_state_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - billet_enable_server
    - not ansible_check_mode
  become: true

- name: Restart the billet server after non-binary inputs change
  ansible.builtin.systemd_service:
    name: billet-server.service
    state: restarted
  when:
    - billet_enable_server
    - not ansible_check_mode
    - not billet_binary_upgrade | default(false)
    - >-
      billet_config_install.changed | default(false) or
      billet_private_key_install.changed | default(false) or
      billet_systemd_units.changed | default(false)
  become: true

- name: Restart the billet node after non-binary inputs change
  ansible.builtin.systemd_service:
    name: billet-node.service
    state: restarted
  when:
    - billet_enable_node
    - not ansible_check_mode
    - not billet_binary_upgrade | default(false)
    - >-
      billet_config_install.changed | default(false) or
      billet_firecracker_install.changed | default(false) or
      billet_firecracker_links.changed | default(false) or
      billet_systemd_units.changed | default(false)
  become: true

- name: Enable and start the billet server
  ansible.builtin.systemd_service:
    name: billet-server.service
    enabled: true
    state: started
  when:
    - billet_enable_server
    - not ansible_check_mode
  become: true

- name: Enable and start the billet node
  ansible.builtin.systemd_service:
    name: billet-node.service
    enabled: true
    state: started
  when:
    - billet_enable_node
    - not ansible_check_mode
  become: true

- name: Stop and disable the billet server when this host no longer owns that role
  ansible.builtin.systemd_service:
    name: billet-server.service
    enabled: false
    state: stopped
  when:
    - not billet_enable_server
    - not ansible_check_mode
  become: true

- name: Stop and disable the billet node when this host no longer owns that role
  ansible.builtin.systemd_service:
    name: billet-node.service
    enabled: false
    state: stopped
  when:
    - not billet_enable_node
    - not ansible_check_mode
  become: true
