---
# THE BINARY CHANGE, DECIDED BEFORE THE HOLD. This file resolves what this
# invocation intends for the binary (a supplied file, a pinned release, a
# channel, or nothing), compares it with what is installed and with what a
# guard this holder already holds records, and, when the binary changes,
# allocates the transaction's journal, stages the candidate into it, and
# asks the STAGED copy what it is and whether it can take part in the
# exclusion, all before the hold. It runs on EVERY invocation of the role
# (its facts are per invocation: a host in two plays decides "no change" in
# the second from the installed digest, and never reuses a completed journal)
# and resets nothing the classification owns.
#
# IN CHECK MODE it resolves and inspects, fetches nothing, allocates nothing
# and stages nothing, as binary.yml already says of a dry run. ON A MAC it
# resets and does nothing else: the host role manages no Mac's binary, so a
# candidate or a pin an inventory carries for the Linux hosts is not staged,
# fetched or executed there, and a Mac holds through its managed binary.

- name: Reset the transaction facts for this invocation
  ansible.builtin.set_fact:
    billet_binary_upgrade: "{{ billet_interrupted_upgrade | default(false) }}"
    billet_candidate_on_target: false
    billet_candidate_path: ""
    billet_candidate_selected: false
    billet_candidate_binary: {}
    billet_candidate_source: ""

- name: Inspect the installed billet binary
  ansible.builtin.stat:
    path: "{{ billet_exclusion_binary }}"
    checksum_algorithm: sha256
  register: billet_installed_binary
  check_mode: false
  become: "{{ billet_exclusion_become }}"
  when: not (billet_exclusion_darwin | default(false) | bool)

- name: Resolve and stage this invocation's candidate
  when:
    - not (billet_interrupted_upgrade | default(false))
    - not (billet_exclusion_darwin | default(false) | bool)
  block:
    # billet_binary_src WINS, and says so rather than ignoring the other input
    # quietly. Overriding a pinned inventory for one run is the supported way
    # to try a build, so this is a report and not a refusal.
    - name: Report that a supplied binary overrides the pinned version
      ansible.builtin.debug:
        msg: >-
          billet_binary_src is set, so billet_version {{ billet_version }} is NOT
          being fetched; the supplied binary is what will be installed.
      when:
        - billet_version | length > 0 or billet_release_channel | length > 0
        - billet_binary_src | length > 0

    # Skipped unless a version or a channel is named AND no binary was
    # supplied, so an ordinary billet_binary_src host never reaches the network.
    - name: Fetch the pinned billet release onto the target
      ansible.builtin.import_tasks: binary.yml
      when:
        - billet_version | length > 0 or billet_release_channel | length > 0
        - billet_binary_src | length == 0
        - not ansible_check_mode

    - name: Inspect the supplied candidate billet binary on the controller
      ansible.builtin.stat:
        path: "{{ billet_binary_src }}"
        checksum_algorithm: sha256
      register: billet_controller_candidate
      delegate_to: localhost
      become: false
      when: billet_binary_src | length > 0

    - name: Inspect the fetched candidate billet binary on the target
      ansible.builtin.stat:
        path: "{{ billet_candidate_path | default('') }}"
        checksum_algorithm: sha256
      register: billet_target_candidate
      check_mode: false
      become: "{{ billet_exclusion_become }}"
      when:
        - billet_binary_src | length == 0
        - billet_candidate_on_target | default(false) | bool

    # ONE name for the candidate from here down, so the transaction is written
    # once. Which side it came from decides nothing after this point.
    - name: Resolve the candidate billet binary for this transaction
      ansible.builtin.set_fact:
        billet_candidate_selected: >-
          {{ (billet_binary_src | length > 0) or
             (billet_candidate_on_target | default(false) | bool) }}
        billet_candidate_binary: >-
          {{ billet_controller_candidate if billet_binary_src | length > 0
             else billet_target_candidate | default({}) }}
        billet_candidate_source: >-
          {{ billet_binary_src if billet_binary_src | length > 0
             else billet_candidate_path | default('') }}

    - name: Refuse a missing or redirected candidate billet binary
      ansible.builtin.assert:
        that:
          - billet_candidate_binary.stat.exists
          - billet_candidate_binary.stat.isreg
          - not billet_candidate_binary.stat.islnk | default(false)
        fail_msg: >-
          {{ billet_candidate_source }} must name one real regular file so the
          transaction can bind an immutable journal copy to its inspected digest.
      when: billet_candidate_selected | bool

    - name: Decide whether the billet binary needs a transactional upgrade
      ansible.builtin.set_fact:
        billet_binary_upgrade: >-
          {{
            billet_candidate_selected | bool and
            (
              not billet_installed_binary.stat.exists or
              billet_installed_binary.stat.checksum != billet_candidate_binary.stat.checksum
            )
          }}

    # A SAME-HOLDER RERUN'S INTENT AGAINST THE RECORD. A guard this holder
    # already holds records one executable, and a run under that guard must
    # intend the same one: the managed binary (no change, or a candidate whose
    # digest is the installed one's) or the recorded candidate (this run's
    # candidate has its digest and the managed binary does not, the earlier run
    # having held and never installed; a bootstrap retry included). Anything
    # else is a DIFFERENT INTENT, refused: the command allows a retained guard
    # around another transaction, and the role refuses it, because a guard that
    # recorded one executable must not be the exclusion under which a second is
    # installed. The remedy is a release and a fresh converge.
    - name: Refuse a same-holder rerun with a different intent
      vars:
        billet_recorded_digest: "{{ (billet_exclusion_guard | default({})).release_executable_sha256 | default('') }}"
        billet_managed_digest: "{{ billet_installed_binary.stat.checksum | default('') if billet_installed_binary.stat.exists else '' }}"
        billet_intent_digest: "{{ billet_candidate_binary.stat.checksum | default('') if billet_candidate_selected | bool else '' }}"
      ansible.builtin.assert:
        that:
          - >-
            (billet_recorded_digest == billet_managed_digest and billet_managed_digest | length > 0
             and (billet_intent_digest | length == 0 or billet_intent_digest == billet_managed_digest))
            or
            (billet_recorded_digest == billet_intent_digest and billet_intent_digest | length > 0
             and billet_intent_digest != billet_managed_digest)
        fail_msg: >-
          The guard by {{ billet_exclusion_holder }} at {{ billet_exclusion_root }}/active
          records an executable with digest {{ billet_recorded_digest }}; this run
          {{ ('intends a candidate with digest ' ~ billet_intent_digest) if billet_intent_digest | length > 0 else 'intends no binary change' }}
          over a managed binary {{ ('with digest ' ~ billet_managed_digest) if billet_managed_digest | length > 0 else 'that is absent' }}.
          A guard that recorded one executable is not the exclusion under which another
          is installed: release it (`{{ billet_exclusion_executable }} converge-guard
          release --holder {{ billet_exclusion_holder }}`) and converge again.
      when:
        - billet_upgrade_claim_shape | default('none') == 'guard'
        - not ansible_check_mode

    # THIS ROLE'S TRANSACTION IS THE SQLITE ONE, and refusing here is the
    # difference between a sentence and a wedged host. The transaction fences
    # the deployment, SNAPSHOTS the ledger, installs the candidate, and restores
    # that snapshot if anything fails; an external ledger has no directory to
    # snapshot. billet's own `billet host-upgrade` carries that shape, and
    # billet-upgrade.timer runs it on every controller, so a PostgreSQL
    # controller on automatic updates is upgraded by billet rather than by this
    # role. REFUSED BEFORE ANYTHING IS ALLOCATED OR HELD; a first install is a
    # binary change too, which is why the message names installation, and why
    # the floor applies: the binary a PostgreSQL controller runs is put in place
    # by the package or by `host-upgrade` at or after the release that carries
    # the converge guard, BEFORE its first guarded converge.
    - name: Refuse a transactional binary change against an external ledger
      ansible.builtin.assert:
        that:
          - not (billet_binary_upgrade | default(false))
        fail_msg: >-
          This host's ledger is {{ billet_configured_state_backend }} and this
          role's transaction snapshots a state directory an external ledger does
          not have. billet upgrades such a host itself: billet-upgrade.timer runs
          `billet host-upgrade --from-rollout` against the rollout the ledger
          records, fencing, snapshotting and migrating nothing and letting the
          candidate migrate when it claims. For a first install, put
          {{ billet_exclusion_binary }} in place yourself, at or after the release
          that carries the converge guard, with billet-server and billet-node
          STOPPED, then converge this role again; with the binary already in place
          the role does everything else, including the config, the units, the
          timers and {{ billet_server_environment_path }}. See
          docs/deploying/postgres-and-active-passive.md.
      when: billet_configured_state_backend != 'sqlite'

    # A PRE-R MANAGED BINARY ON A POSTGRESQL CONTROLLER is a controller the role
    # cannot move and cannot hold: refused, naming the same route.
    - name: Refuse a PostgreSQL controller whose binary predates the guard
      ansible.builtin.assert:
        that:
          - not (billet_exclusion_managed_pre_r | default(false) | bool)
        fail_msg: >-
          {{ billet_exclusion_binary }} predates the converge guard, and this host's
          ledger is {{ billet_configured_state_backend }}, which this role's
          transaction cannot move. Put a billet at or after the release that carries
          the converge guard in place by the package or by `billet host-upgrade`,
          with billet-server and billet-node STOPPED, then converge again.
      when: billet_configured_state_backend != 'sqlite'

    # A BOOTSTRAP is eligible when the root holds nothing the role did not write.
    # Judged on an UNHELD host only: a bootstrap retried under this holder's
    # guard finds `active` in the root, which is that guard, and the same-holder
    # comparison above is what admits or refuses the retry.
    - name: Inspect the upgrade root's entries before a bootstrap
      ansible.builtin.find:
        paths: "{{ billet_exclusion_root }}"
        file_type: any
        recurse: false
        hidden: true
      register: billet_exclusion_root_entries
      check_mode: false
      become: "{{ billet_exclusion_become }}"
      when:
        - billet_binary_upgrade | default(false)
        - not billet_installed_binary.stat.exists
        - billet_upgrade_claim_shape | default('none') == 'none'
        - not ansible_check_mode

    - name: Refuse a bootstrap over a root that holds something the role did not write
      ansible.builtin.assert:
        that:
          - >-
            billet_exclusion_root_entries.files | map(attribute='path') | map('basename')
            | reject('match', '^(recovery-[0-9]{8}T[0-9]{6}-[0-9a-f]{8}|[0-9]{8}T[0-9]{15}|transaction\.lock)$')
            | list | length == 0
        fail_msg: >-
          {{ billet_exclusion_binary }} is absent, so this converge would install
          billet for the first time, but {{ billet_exclusion_root }} holds
          {{ billet_exclusion_root_entries.files | map(attribute='path') | map('basename')
             | reject('match', '^(recovery-[0-9]{8}T[0-9]{6}-[0-9a-f]{8}|[0-9]{8}T[0-9]{15}|transaction\.lock)$')
             | list | join(', ') }},
          which the role did not write. Inspect the root by hand before a bootstrap.
      when:
        - billet_binary_upgrade | default(false)
        - not billet_installed_binary.stat.exists
        - billet_upgrade_claim_shape | default('none') == 'none'
        - not ansible_check_mode

    - name: Stage the candidate for the transaction
      when:
        - billet_binary_upgrade | default(false)
        - not ansible_check_mode
      block:
        - name: Allocate the transaction's recovery directory
          ansible.builtin.import_tasks: allocate-recovery.yml

        - name: Stage the immutable candidate binary inside its recovery journal
          ansible.builtin.copy:
            src: "{{ billet_candidate_source }}"
            remote_src: "{{ billet_binary_src | length == 0 }}"
            dest: "{{ billet_upgrade_recovery_dir }}/billet.candidate"
            owner: root
            group: root
            mode: "0755"
          become: true

        - name: Inspect the journaled candidate billet binary
          ansible.builtin.stat:
            path: "{{ billet_upgrade_recovery_dir }}/billet.candidate"
            checksum_algorithm: sha256
          register: billet_journaled_candidate_binary
          check_mode: false
          become: true

        - name: Bind the host transaction to the inspected candidate digest
          ansible.builtin.assert:
            that:
              - billet_journaled_candidate_binary.stat.exists
              - billet_journaled_candidate_binary.stat.isreg
              - not billet_journaled_candidate_binary.stat.islnk | default(false)
              - billet_journaled_candidate_binary.stat.checksum == billet_candidate_binary.stat.checksum
            fail_msg: >-
              {{ billet_candidate_source }} changed while the transaction was being
              prepared. Refusing to upgrade from an artifact other than the one whose
              digest selected this transaction.

        # A DOWNGRADE IS REFUSED BEFORE THE DRAIN, unless asked for by name. The
        # ledger's release watermark would refuse an older candidate at the
        # transaction's probe and roll it back, after the node had drained; the
        # two binaries' own `version` output answers the question for nothing.
        # ASKED OF THE STAGED COPY, on the target, which a controller-side
        # billet_binary_src could never be asked. Only a proved order refuses: a
        # development build reports no release tag and is neither refused nor
        # waved through on that basis.
        - name: Read the installed and candidate releases
          ansible.builtin.command:
            argv:
              - "{{ item }}"
              - version
          loop:
            - "{{ billet_exclusion_binary }}"
            - "{{ billet_upgrade_recovery_dir }}/billet.candidate"
          register: billet_release_of
          changed_when: false
          check_mode: false
          when: billet_installed_binary.stat.exists
          become: true

        - name: Refuse a converge that would downgrade this host
          vars:
            # `billet version` prints "billet vX.Y.Z ..." on its first line, and a
            # release through v0.9.1 prints "billet X.Y.Z ..." without the v; the
            # second word is the release either way. Sliced rather than indexed so
            # a line with one word reads as no release instead of an error naming
            # neither binary. THE v IS OPTIONAL IN THE PATTERN, because a pattern
            # that required it read every older candidate as "not a release" and
            # let an unnamed downgrade to one through: the comparison strips the v
            # from both before ordering.
            billet_installed_release: "{{ (billet_release_of.results[0].stdout_lines[0] | default('') | split)[1:2] | join }}"
            billet_candidate_release: "{{ (billet_release_of.results[1].stdout_lines[0] | default('') | split)[1:2] | join }}"
            billet_release_tag: '^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          ansible.builtin.assert:
            that:
              - billet_allow_downgrade | bool
                or not (billet_installed_release is match(billet_release_tag))
                or not (billet_candidate_release is match(billet_release_tag))
                or (billet_candidate_release | regex_replace('^v', '')) is version(billet_installed_release | regex_replace('^v', ''), '>=')
            fail_msg: >-
              This host runs {{ billet_installed_release }} and this converge would
              install {{ billet_candidate_release }}, which is older. A rollout has
              most likely moved the fleet past the pin in billet_version; leave
              billet_version and billet_binary_src empty so an ordinary converge keeps
              what is installed, or set billet_allow_downgrade: true in the same run as
              a pin you mean. Nothing was drained; the staged candidate stays in
              {{ billet_upgrade_recovery_dir }}.
          when: billet_installed_binary.stat.exists

        # THE CAPABILITY FLOOR. A candidate that cannot take part in the
        # exclusion (it answers "unknown command" to converge-guard) is a release
        # before the guard existed, refused before the hold naming the legacy
        # collection; a candidate whose answer cannot be read is refused as could
        # not determine, never as pre-R. Not downgrade prevention:
        # billet_allow_downgrade stays what it is.
        - name: Ask the candidate whether it can take part in the exclusion
          junioryono.billet.guard_status:
            executable: "{{ billet_upgrade_recovery_dir }}/billet.candidate"
            timeout: "{{ billet_guard_timeout }}"
            expect: capability
          register: billet_candidate_capability
          check_mode: false
          become: true

        - name: Judge the candidate's capability
          ansible.builtin.assert:
            that:
              - billet_candidate_capability.outcome == 'capable'
            fail_msg: >-
              {{ 'The candidate ' ~ billet_upgrade_recovery_dir ~ '/billet.candidate predates the converge guard (it answers "unknown command" to `converge-guard`): a release before it cannot take part in the exclusion; use the legacy collection at that release, or pin a release that carries the guard.'
                 if billet_candidate_capability.outcome == 'pre_r'
                 else 'Whether the candidate ' ~ billet_upgrade_recovery_dir ~ '/billet.candidate can take part in the exclusion could not be determined: ' ~ billet_candidate_capability.problem ~ '. Nothing was held.' }}
              The staged candidate stays in {{ billet_upgrade_recovery_dir }}.
