---
# LVM NEVER READS A MAPPED RBD OR NBD DEVICE (junioryono/billet#922). Every LVM
# scan reads every block device's label, and cephadm runs its scans (`lvs`, `pvs`,
# `pvscan`) through nsenter with the host's own binaries and configuration. On
# 2026-11-25 an OSD killed for memory could not start again for half an hour: its
# activation's scan read the guests' mapped RBD images, whose data lived only on
# that OSD, and the scan could not return until the OSD it was starting was up.
# Rejected by the filter, a device is never opened: strace counted a loop device
# opened twice by an unfiltered `pvs` and never by a filtered `pvs` or `lvs`, on
# LVM 2.03.16 and on the reference host's 2.03.31 (2026-11-26).
# udev's pvscan on each image billet maps is spared the read too.
#
# REJECT RULES ONLY, NO ACCEPT-ALL. The regex filter accepts a device when any of
# its names matches an accept rule (lib/filters/filter-regex.c), so `a|.*|` could
# accept an image under a /dev/disk/by-uuid alias. On 2.03.31 a loop device with
# such an alias was opened by neither form (2026-11-26), but with rejects alone no
# version can: a device one of whose names a rule rejects is rejected under all of
# them, every mapped image keeps its /dev/rbdN or /dev/nbdN name, and a device no
# rule names is accepted, as without a filter.
#
# IN lvmlocal.conf, WHICH LVM MERGES OVER lvm.conf setting by setting: the package
# owns lvm.conf. A global_filter the operator wrote, in either file however it is
# spelled, is found by LVM's own parser reading a copy without billet's block, and
# refused rather than replaced in silence. So is a devices file in use that names
# a mapped image, since a devices file's entries bypass the regex filter. What
# LVM applies afterwards is read back and must be exactly this, so nothing here
# assumes the merge happened. No lvm.conf is no LVM, and nothing to keep off the
# images.
- name: Ask whether LVM is configured on this host
  ansible.builtin.stat:
    path: "{{ billet_lvm_system_dir }}/lvm.conf"
    follow: true
  register: billet_lvm_conf

- name: Ask whether this host has local LVM settings
  ansible.builtin.stat:
    path: "{{ billet_lvm_system_dir }}/lvmlocal.conf"
    follow: true
  register: billet_lvm_local
  when: billet_lvm_conf.stat.exists

# A FILE, OR NOTHING IS COPIED: the copy below is of a regular file, so nothing
# under the temporary directory is ever a tree to remove.
- name: Refuse an LVM configuration that is not a regular file
  ansible.builtin.assert:
    that:
      - not billet_lvm_conf.stat.exists or billet_lvm_conf.stat.isreg
      - billet_lvm_local is skipped or not billet_lvm_local.stat.exists or billet_lvm_local.stat.isreg
    fail_msg: >-
      {{ billet_lvm_system_dir }}/lvm.conf or lvmlocal.conf is not a regular file,
      so billet cannot tell what LVM applies and will not write its filter beside it.

- name: Find what LVM applies apart from billet's filter
  when:
    - billet_lvm_conf.stat.exists
    - billet_lvm_rbd_filter | bool
  # SCRATCH, NOT A CHANGE TO THE HOST: the copy, and what is done to it, are made
  # and removed in this run, so none of it reports changed, or a converge's second
  # pass would never settle.
  block:
    - name: Make a directory for a copy of the LVM configuration
      ansible.builtin.tempfile:
        state: directory
        path: "{{ billet_endpoint_temp_dir }}"
        suffix: -billet-lvm
      register: billet_lvm_copy
      changed_when: false
      check_mode: false
      become: true

    - name: Copy the LVM configuration without billet's block
      block:
        - name: Copy the LVM configuration files
          ansible.builtin.copy:
            src: "{{ billet_lvm_system_dir }}/{{ item }}"
            dest: "{{ billet_lvm_copy.path }}/{{ item }}"
            remote_src: true
            mode: "0600"
          loop: "{{ ['lvm.conf'] + (['lvmlocal.conf'] if billet_lvm_local.stat.exists else []) }}"
          changed_when: false
          check_mode: false
          become: true

        - name: Take billet's block out of the copy
          ansible.builtin.blockinfile:
            path: "{{ billet_lvm_copy.path }}/lvmlocal.conf"
            state: absent
            marker: "# {mark} billet: keep LVM off RBD and NBD devices (junioryono/billet#922)"
          when: billet_lvm_local.stat.exists
          changed_when: false
          check_mode: false
          become: true

        # SET, OR NOT FOUND, AND NOTHING ELSE: lvmconfig answers a setting nobody
        # wrote with exit 5 and "not found" (2.03.16 and 2.03.31), and any other
        # failure is could-not-tell, which must not read as no filter.
        - name: Read any global filter the operator's configuration sets
          ansible.builtin.command:
            argv: [lvmconfig, devices/global_filter]
          environment:
            LVM_SYSTEM_DIR: "{{ billet_lvm_copy.path }}"
          register: billet_lvm_operator_filter
          changed_when: false
          failed_when: >-
            not (billet_lvm_operator_filter.rc == 0
                 or (billet_lvm_operator_filter.rc == 5 and billet_lvm_operator_filter.stderr is search('not found')))
          check_mode: false
          become: true

        - name: Read whether LVM uses a devices file here
          ansible.builtin.command:
            argv: [lvmconfig, --typeconfig, full, devices/use_devicesfile, devices/devicesfile]
          environment:
            LVM_SYSTEM_DIR: "{{ billet_lvm_system_dir }}"
          register: billet_lvm_devicesfile
          changed_when: false
          check_mode: false
          become: true
      # BY NAME, NEVER RECURSIVELY: the copies are the only names this run made
      # there (lvmconfig wrote nothing beside them, 2.03.31, 2026-11-26), so each
      # is removed with rm, which refuses a directory, and the directory with
      # rmdir, which refuses one holding anything else.
      always:
        - name: Remove the copied LVM configuration files
          ansible.builtin.command:
            argv: [rm, -f, --, "{{ billet_lvm_copy.path }}/{{ item }}"]
          loop: [lvm.conf, lvmlocal.conf]
          changed_when: false
          check_mode: false
          become: true

        - name: Remove the empty copy directory
          ansible.builtin.command:
            argv: [rmdir, "{{ billet_lvm_copy.path }}"]
          changed_when: false
          check_mode: false
          become: true

    - name: Refuse to replace a global filter the operator wrote
      ansible.builtin.assert:
        that: billet_lvm_operator_filter.stdout is not search('global_filter=')
        fail_msg: >-
          The LVM configuration in {{ billet_lvm_system_dir }} already sets devices/global_filter
          ({{ billet_lvm_operator_filter.stdout | trim }}), which billet's in lvmlocal.conf would
          replace. Add "r|^/dev/rbd|" and "r|^/dev/nbd|" to it and set billet_lvm_rbd_filter to
          false, or remove it and let billet's stand (junioryono/billet#922).

    # THE FILE LVM READS: an empty devicesfile setting is its default name, as LVM
    # itself falls back to (measured on 2.03.16), and the file is root's, so it is
    # read as root. Absent is what stat says; a file there that cannot be read stops
    # the converge rather than read as one naming nothing.
    - name: Name the devices file LVM uses
      ansible.builtin.set_fact:
        billet_lvm_devicesfile_path: >-
          {{ billet_lvm_system_dir ~ '/devices/' ~ ((billet_lvm_devicesfile.stdout_lines | select('match', '^devicesfile=') | first | default('') | replace('devicesfile=', '', 1) | replace('"', '')) or 'system.devices') }}
      when: billet_lvm_devicesfile.stdout is search('use_devicesfile=1')

    - name: Ask whether the devices file is there
      ansible.builtin.stat:
        path: "{{ billet_lvm_devicesfile_path }}"
      register: billet_lvm_devicesfile_stat
      when: billet_lvm_devicesfile.stdout is search('use_devicesfile=1')
      become: true

    - name: Read the devices file LVM uses
      ansible.builtin.slurp:
        src: "{{ billet_lvm_devicesfile_path }}"
      register: billet_lvm_devicesfile_text
      when:
        - billet_lvm_devicesfile.stdout is search('use_devicesfile=1')
        - billet_lvm_devicesfile_stat.stat.exists
      become: true

    - name: Refuse a devices file that names a mapped image
      ansible.builtin.assert:
        that: >-
          billet_lvm_devicesfile_text is skipped
          or (billet_lvm_devicesfile_text.content | b64decode) is not search('/dev/(rbd|nbd)')
        fail_msg: >-
          LVM uses a devices file in {{ billet_lvm_system_dir }}/devices that names an RBD or NBD
          device, and a devices file's entries bypass the global filter, so LVM would still read a
          mapped image. Remove those entries with lvmdevices --deldev (junioryono/billet#922).

# OFF TAKES IT OUT: a filter left behind by an earlier converge is the role's to
# remove, and blockinfile removes only between its own markers. A file that is not
# there holds no block to remove.
- name: Keep LVM's scans off mapped RBD and NBD devices
  ansible.builtin.blockinfile:
    path: "{{ billet_lvm_system_dir }}/lvmlocal.conf"
    create: "{{ billet_lvm_rbd_filter | bool }}"
    state: "{{ 'present' if billet_lvm_rbd_filter | bool else 'absent' }}"
    mode: "0644"
    marker: "# {mark} billet: keep LVM off RBD and NBD devices (junioryono/billet#922)"
    block: |
      devices {
      	global_filter = [ "r|^/dev/rbd|", "r|^/dev/nbd|" ]
      }
  when:
    - billet_lvm_conf.stat.exists
    - billet_lvm_rbd_filter | bool or billet_lvm_local.stat.exists
  become: true

# NOT IN CHECK MODE: the block was predicted rather than written, so what LVM
# applies is still what it applied before.
- name: Read the global filter LVM applies
  ansible.builtin.command:
    argv: [lvmconfig, devices/global_filter]
  environment:
    LVM_SYSTEM_DIR: "{{ billet_lvm_system_dir }}"
  register: billet_lvm_global_filter
  changed_when: false
  when:
    - billet_lvm_conf.stat.exists
    - billet_lvm_rbd_filter | bool
    - not ansible_check_mode
  become: true

- name: Require LVM to apply billet's filter
  ansible.builtin.assert:
    that: billet_lvm_global_filter.stdout | trim == 'global_filter=["r|^/dev/rbd|","r|^/dev/nbd|"]'
    fail_msg: >-
      LVM applies {{ billet_lvm_global_filter.stdout | trim }} rather than billet's filter,
      so its scans can still read a mapped RBD image whose data is on a stopped OSD
      (junioryono/billet#922).
  when:
    - billet_lvm_conf.stat.exists
    - billet_lvm_rbd_filter | bool
    - not ansible_check_mode
