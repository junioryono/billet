---
# An explicit override goes through the same observations; public inventory
# supplies candidates and connection names, never a verified result.
- name: Verify this confirmation candidate
  vars:
    billet_confirmation_vars: "{{ hostvars[billet_confirmation_host] }}"
    billet_confirmation_executable: "{{ billet_confirmation_vars.billet_exclusion_answerer | default('') }}"
    billet_confirmation_config: "{{ billet_confirmation_vars.billet_config_path | default('/etc/billet/billet.yaml') }}"
  block:
    - name: Require the candidate's prepared executable
      ansible.builtin.assert:
        that:
          - billet_confirmation_executable is match('^/')
          - billet_confirmation_vars.billet_exclusion_held | default(false) is sameas true
          - billet_confirmation_vars.billet_exclusion_holder | default('') == billet_exclusion_holder
        fail_msg: The candidate has no verified preparation for this holder.

    - name: Observe the candidate's command capability
      ansible.builtin.command:
        argv: [timeout, -k, '10', '60', "{{ billet_confirmation_executable }}", version]
        expand_argument_vars: false
      register: billet_confirmation_version_raw
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true

    - name: Require a capable candidate executable
      vars:
        billet_confirmation_version: "{{ billet_confirmation_version_raw | junioryono.billet.executable_version }}"
      ansible.builtin.assert:
        that:
          - >-
            billet_confirmation_version.type == 'development' or
            (billet_confirmation_version.type == 'release' and
             billet_confirmation_version.value is version(billet_retire_capability_floor, '>='))
        fail_msg: The candidate's installed executable cannot answer the confirmation protocol.

    - name: Inspect the candidate's installed controller
      ansible.builtin.command:
        argv: [timeout, -k, '10', '180', "{{ billet_confirmation_executable }}", release, inspect, --json, --config, "{{ billet_confirmation_config }}"]
        expand_argument_vars: false
      register: billet_confirmation_inspect_raw
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true
      no_log: true

    - name: Require an answered controller inspection
      ansible.builtin.assert:
        that:
          - billet_confirmation_inspect_raw.rc | default(-1) == 0
          - not billet_confirmation_inspect_raw.unreachable | default(false)
        fail_msg: The candidate's installed controller could not be observed.

    - name: Decode the candidate's observed operands
      ansible.builtin.set_fact:
        billet_confirmation_inspect: "{{ billet_confirmation_inspect_raw.stdout | junioryono.billet.from_json_strict }}"
        billet_confirmation_environment: "{{ (billet_confirmation_inspect_raw.stdout | junioryono.billet.from_json_strict).services.server | junioryono.billet.environment_specs }}"
      no_log: true

    - name: Require an installed running candidate before ledger observation
      ansible.builtin.assert:
        that:
          - billet_confirmation_inspect.host.retirement is none
          - billet_confirmation_inspect.installed_config.has_server is sameas true
          - billet_confirmation_inspect.services.server.active_state == 'active'
          - billet_confirmation_environment is not none
        fail_msg: The candidate is absent, inactive, retiring or retired.

    - name: Observe the candidate's preparation state
      ansible.builtin.command:
        argv: [timeout, -k, '10', '60', "{{ billet_confirmation_executable }}", converge-guard, status, --json]
        expand_argument_vars: false
      register: billet_confirmation_guard_raw
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true
      no_log: true

    - name: Require a settled candidate guard for this holder
      vars:
        billet_confirmation_guard: "{{ billet_confirmation_guard_raw.stdout | default('{}') | junioryono.billet.from_json_strict }}"
      ansible.builtin.assert:
        that:
          - billet_confirmation_guard_raw.rc | default(-1) == 0
          - not billet_confirmation_guard_raw.unreachable | default(false)
          - billet_confirmation_guard.active == 'converge-guard'
          - billet_confirmation_guard.guard.holder == billet_exclusion_holder
          - billet_confirmation_guard.guard.id == billet_confirmation_vars.billet_exclusion_id
          - billet_confirmation_guard.guard.preparing is sameas false
          - billet_confirmation_guard.guard.recovery_pointer is sameas false
          - billet_confirmation_guard.guard.release_executable_verified is sameas true
          - billet_confirmation_guard.guard.transition | default(none) is none
        fail_msg: The candidate has no settled guard for this holder.

    - name: Prove the candidate's environment without reading credentials into facts
      junioryono.billet.environment_files:
        specs: "{{ billet_confirmation_environment }}"
      register: billet_confirmation_environment_read
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true
      no_log: true

    - name: Require the candidate's environment read to answer
      ansible.builtin.assert:
        that:
          - not billet_confirmation_environment_read.unreachable | default(false)
          - billet_confirmation_environment_read.presence is defined
        fail_msg: The candidate's environment could not be read.

    - name: Read the candidate's ledger status with its own observed operands
      ansible.builtin.command:
        argv: >-
          {{ ['timeout', '-k', '10', '180', billet_confirmation_executable, 'rollout', 'status', '--json', '--config', billet_confirmation_config]
             + (['--environment-file', billet_confirmation_environment[0].path]
                if billet_confirmation_environment_read.presence == ['present'] else []) }}
        expand_argument_vars: false
      register: billet_confirmation_status_raw
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true
      no_log: true

    - name: Require an answered controller status
      ansible.builtin.assert:
        that:
          - billet_confirmation_status_raw.rc | default(-1) == 0
          - not billet_confirmation_status_raw.unreachable | default(false)
        fail_msg: The candidate's ledger status could not be observed.

    - name: Inspect the controller again after its ledger read
      ansible.builtin.command:
        argv: [timeout, -k, '10', '180', "{{ billet_confirmation_executable }}", release, inspect, --json, --config, "{{ billet_confirmation_config }}"]
        expand_argument_vars: false
      register: billet_confirmation_closing_raw
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      check_mode: false
      delegate_to: "{{ billet_confirmation_host }}"
      become: true
      no_log: true

    - name: Require a stable controller across verification
      ansible.builtin.assert:
        that:
          - billet_confirmation_closing_raw.rc | default(-1) == 0
          - not billet_confirmation_closing_raw.unreachable | default(false)
          - (billet_confirmation_closing_raw.stdout | junioryono.billet.from_json_strict) == billet_confirmation_inspect
        fail_msg: The candidate changed during verification.

    - name: Select the positively verified controller and its operands
      ansible.builtin.set_fact:
        billet_endpoint_confirmation_controller: >-
          {{ billet_confirmation_inspect | junioryono.billet.controller_candidate(
               billet_confirmation_status_raw.stdout | junioryono.billet.from_json_strict,
               billet_confirmation_host, billet_confirmation_executable, billet_confirmation_config,
               billet_confirmation_deployment, billet_exclusion_holder)
             | combine({'environment_present': billet_confirmation_environment_read.presence}) }}
  rescue:
    - name: Keep the failed candidate out of the selection
      ansible.builtin.set_fact:
        billet_confirmation_failures: "{{ billet_confirmation_failures + [billet_confirmation_host ~ ': ' ~ ansible_failed_task.name] }}"
