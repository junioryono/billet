---
# A HOST THAT SHARES ITS SITE'S INTERNET LINE KEEPS ITS OWN TRAFFIC FROM FILLING
# IT (shared-uplink record, 2026-10-08). `billet uplink shape` shapes the default
# route's interface with CAKE, starting at the interface's own speed, and cuts a
# direction only when its own traffic raises the latency to public reflectors,
# so on a line nothing fills it changes nothing. On by default for that reason;
# billet_uplink_shaping: false removes it.
- name: Inspect the uplink shaping unit
  ansible.builtin.stat:
    path: /etc/systemd/system/billet-uplink.service
  register: billet_uplink_unit
  become: true

# ENABLED ONLY WHERE IT CAN WORK: a kernel with CAKE and IFB, an interface with
# no traffic policy of somebody else's, and a billet that has the command. A
# unit that could not start would only restart into the same refusal.
- name: Ask whether this host can be shaped
  ansible.builtin.command:
    argv: [/usr/bin/billet, uplink, check]
  register: billet_uplink_check
  changed_when: false
  failed_when: false
  when:
    - billet_uplink_shaping | bool
    - not ansible_check_mode
  become: true

- name: Say why this host is not shaped
  ansible.builtin.debug:
    msg: >-
      billet_uplink_shaping is on, but this host cannot be shaped, so its traffic
      is not held back from the site's line: {{ (billet_uplink_check.stderr | default('')
      ~ ' ' ~ billet_uplink_check.stdout | default('')) | trim }}
  when:
    - billet_uplink_shaping | bool
    - not ansible_check_mode
    - billet_uplink_check.rc != 0

- name: Shape this host's share of the uplink
  when:
    - billet_uplink_shaping | bool
    - ansible_check_mode or billet_uplink_check.rc == 0
  block:
    - name: Install the uplink shaping unit
      ansible.builtin.template:
        src: billet-uplink.service.j2
        dest: /etc/systemd/system/billet-uplink.service
        owner: root
        group: root
        mode: "0644"
      register: billet_uplink_install
      become: true
      notify: Reload systemd

    - name: Apply the uplink shaping unit change
      ansible.builtin.meta: flush_handlers

    # RESTARTED WHEN THE UNIT OR THE BINARY CHANGED, so the shaper runs the
    # billet this converge installed; its stop clears the old shaping first.
    - name: Run the uplink shaper
      ansible.builtin.systemd_service:
        name: billet-uplink.service
        enabled: true
        state: >-
          {{ 'restarted' if (billet_uplink_install.changed or (billet_binary_upgrade | default(false)))
             else 'started' }}
      when: not ansible_check_mode
      become: true
      notify: billet unit files changed

- name: Remove uplink shaping that is not asked for or cannot run
  when:
    - billet_uplink_unit.stat.exists
    - not ansible_check_mode
    - not (billet_uplink_shaping | bool) or billet_uplink_check.rc != 0
  block:
    - name: Stop the uplink shaper
      ansible.builtin.systemd_service:
        name: billet-uplink.service
        enabled: false
        state: stopped
      become: true
      notify: billet unit files changed

    - name: Remove the uplink shaping unit
      ansible.builtin.file:
        path: /etc/systemd/system/billet-uplink.service
        state: absent
      become: true
      notify: Reload systemd
