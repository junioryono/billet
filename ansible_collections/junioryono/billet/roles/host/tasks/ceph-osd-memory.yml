---
# EACH OSD'S MEMORY IS A NUMBER THE INVENTORY STATES (junioryono/billet#756).
# cephadm's osd_memory_target_autotune sizes every OSD from the host's whole RAM,
# as if nothing else ran there: on the reference host it gave each of two OSDs
# 170 GiB of a 499 GiB host whose node offered guests 480, and on 2026-11-25 the
# kernel killed an OSD holding 70 GB, which stalled every guest disk whose data it
# held.
#
# ONE IMPLEMENTATION, RUN NOW AND EVERY FIVE MINUTES. billet-ceph-osd-memory
# (ceph-osd-memory.py.j2) turns autotune off for the osd section, removes every
# narrower autotune setting, sets the section's target and removes every narrower
# target, pass after pass until a pass finds nothing to change. The converge runs
# it once and fails if it cannot settle; its timer runs it again every five
# minutes. No step here can promise that a cephadm pass already under way when
# autotune went off writes nothing afterwards (a manager failover is no barrier),
# and nothing writes a target once every such pass has ended, so a late write is
# undone by the next run instead of trusted to a barrier.
#
# 0 leaves a shared cluster's own policy alone, and takes the timer out.
- name: Name the OSD memory enforcer's files
  ansible.builtin.set_fact:
    billet_osd_memory_script_path: "{{ (_billet_osd_memory_root | default('')) ~ '/usr/local/libexec/billet-ceph-osd-memory' }}"
    billet_osd_memory_service_path: "{{ (_billet_osd_memory_root | default('')) ~ '/etc/systemd/system/billet-ceph-osd-memory.service' }}"
    billet_osd_memory_timer_path: "{{ (_billet_osd_memory_root | default('')) ~ '/etc/systemd/system/billet-ceph-osd-memory.timer' }}"

- name: Hold each OSD's memory at the inventory's target, now and every five minutes
  when: (billet_ceph_osd_memory_target_gib | int) > 0
  block:
    - name: Install the OSD memory enforcer
      ansible.builtin.template:
        src: ceph-osd-memory.py.j2
        dest: "{{ billet_osd_memory_script_path }}"
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the OSD memory enforcer's systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "{{ (_billet_osd_memory_root | default('')) ~ '/etc/systemd/system/' ~ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - billet-ceph-osd-memory.service
        - billet-ceph-osd-memory.timer
      become: true
      notify: Reload systemd

    - name: Apply the OSD memory enforcer's unit changes
      ansible.builtin.meta: flush_handlers

    - name: Hold each OSD's memory at the target now
      ansible.builtin.command:
        argv: ["{{ billet_osd_memory_script_path }}"]
      register: billet_osd_memory_run
      changed_when: billet_osd_memory_run.stdout is search('(?m)^changed:')
      when: not ansible_check_mode
      become: true

    - name: Start the OSD memory enforcer's timer
      ansible.builtin.systemd_service:
        name: billet-ceph-osd-memory.timer
        enabled: true
        state: started
      when:
        - not ansible_check_mode
        - not (_billet_osd_memory_skip_service_control | default(false))
      become: true

- name: Leave the cluster's own OSD memory policy alone
  when: (billet_ceph_osd_memory_target_gib | int) == 0
  block:
    - name: Ask whether the OSD memory enforcer's timer is installed
      ansible.builtin.stat:
        path: "{{ billet_osd_memory_timer_path }}"
      register: billet_osd_memory_timer_unit

    - name: Stop and disable the OSD memory enforcer's timer
      ansible.builtin.systemd_service:
        name: billet-ceph-osd-memory.timer
        enabled: false
        state: stopped
      when:
        - billet_osd_memory_timer_unit.stat.exists
        - not ansible_check_mode
        - not (_billet_osd_memory_skip_service_control | default(false))
      become: true

    - name: Remove the OSD memory enforcer and its units
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ billet_osd_memory_script_path }}"
        - "{{ billet_osd_memory_service_path }}"
        - "{{ billet_osd_memory_timer_path }}"
      become: true
      notify: Reload systemd
