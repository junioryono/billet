---
# OWNERSHIP BY SHAPE, before the fence opens. Under `guard-pointer` this
# transaction's claim is the symlink `<root>/active/recovery` whose target is
# this run's recovery directory, inside the guard this converge holds; under
# the legacy shapes it is the regular file `<root>/active` whose text is that
# directory. A missing, foreign, wrong-typed or changed claim leaves the fence,
# the pointer and the services untouched.
- name: Inspect the host-upgrade claim before finalization
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
  loop:
    - "{{ billet_exclusion_root }}/active"
    - "{{ billet_exclusion_root }}/active/recovery"
  register: billet_finalization_claim_states
  become: true

- name: Refuse finalization without a real owned host-upgrade claim
  ansible.builtin.assert:
    that:
      - billet_upgrade_claim_shape in ['guard-pointer', 'legacy', 'legacy-file']
      - billet_finalization_claim_states.results[0].stat.exists
      - not (billet_finalization_claim_states.results[0].stat.islnk | default(false))
      - >-
        (billet_upgrade_claim_shape == 'guard-pointer'
         and billet_finalization_claim_states.results[0].stat.isdir
         and billet_finalization_claim_states.results[1].stat.exists
         and billet_finalization_claim_states.results[1].stat.islnk | default(false))
        or
        (billet_upgrade_claim_shape in ['legacy', 'legacy-file']
         and billet_finalization_claim_states.results[0].stat.isreg)
    fail_msg: >-
      The committed host transaction no longer has a real active claim in the
      {{ billet_upgrade_claim_shape }} shape. Leave its fence intact instead of
      guessing whether another run owns the host.

- name: Read the host-upgrade claim before finalization
  ansible.builtin.slurp:
    src: "{{ billet_exclusion_root }}/active"
  register: billet_finalization_claim
  when: billet_upgrade_claim_shape in ['legacy', 'legacy-file']
  become: true

- name: Read the transaction pointer before finalization
  ansible.builtin.command:
    argv:
      - readlink
      - "{{ billet_exclusion_root }}/active/recovery"
  register: billet_finalization_pointer
  changed_when: false
  when: billet_upgrade_claim_shape == 'guard-pointer'
  become: true

- name: Prove this transaction still owns the host before finalization
  ansible.builtin.assert:
    that:
      - >-
        (billet_upgrade_claim_shape == 'guard-pointer'
         and billet_finalization_pointer.stdout | trim == billet_upgrade_recovery_dir)
        or
        (billet_upgrade_claim_shape in ['legacy', 'legacy-file']
         and billet_finalization_claim.content | b64decode | trim == billet_upgrade_recovery_dir)
    fail_msg: >-
      The active host-upgrade claim belongs to another transaction. Leave its
      fence and pointer intact instead of finalizing state this run does not own.

- name: Read the durable host transaction decision
  ansible.builtin.slurp:
    src: "{{ billet_upgrade_recovery_dir }}/commit.complete"
  register: billet_finalization_commit_file
  become: true

- name: Resolve the committed service target
  ansible.builtin.set_fact:
    billet_finalization_commit: "{{ billet_finalization_commit_file.content | b64decode | trim }}"
    billet_finalization_services:
      - name: billet-server.service
        should_run: >-
          {{
            billet_upgrade_manifest.candidate_server_active
            if billet_finalization_commit_file.content | b64decode | trim == 'host upgrade committed'
            else billet_upgrade_manifest.server_was_active
          }}
      - name: billet-node.service
        should_run: >-
          {{
            billet_upgrade_manifest.candidate_node_active
            if billet_finalization_commit_file.content | b64decode | trim == 'host upgrade committed'
            else billet_upgrade_manifest.node_was_active
          }}

- name: Refuse an unknown durable host transaction decision
  ansible.builtin.assert:
    that:
      - billet_finalization_commit in ['host upgrade committed', 'host rollback committed']
    fail_msg: >-
      The host transaction commit record is not a supported upgrade or rollback
      decision. Leave the fence and active claim intact for manual inspection.

- name: Open the committed ledger to operator commands
  ansible.builtin.file:
    path: "{{ billet_candidate_server_state_dir }}/billet.maintenance"
    state: absent
  become: true

- name: Durably open the committed ledger to operator commands
  ansible.builtin.command:
    argv:
      - sync
      - -f
      - "{{ billet_candidate_server_state_dir }}"
  changed_when: false
  become: true

- name: Inspect committed service activity before replacing a probe
  ansible.builtin.command:
    argv:
      - systemctl
      - is-active
      - "{{ item.name }}"
  loop: "{{ billet_finalization_services }}"
  register: billet_finalization_service_activity
  changed_when: false
  failed_when: billet_finalization_service_activity.rc not in [0, 3, 4]
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Inspect committed service unit availability
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --value
      - "{{ item.name }}"
  loop: "{{ billet_finalization_services }}"
  register: billet_finalization_service_load_states
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Inspect committed service process identifiers
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=MainPID
      - --value
      - "{{ item.name }}"
  loop: "{{ billet_finalization_services }}"
  register: billet_finalization_service_pids
  changed_when: false
  failed_when: false
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Detect quiescent probes that must become full services
  ansible.builtin.command:
    argv:
      - grep
      - -azq
      - --
      - --upgrade-probe
      - "/proc/{{ billet_finalization_service_pids.results[billet_finalization_index].stdout | trim }}/cmdline"
  loop: "{{ billet_finalization_services }}"
  loop_control:
    index_var: billet_finalization_index
    label: "{{ item.name }}"
  register: billet_finalization_service_probes
  changed_when: false
  failed_when: billet_finalization_service_probes.rc not in [0, 1]
  when:
    - item.should_run | bool
    - billet_finalization_service_activity.results[billet_finalization_index].rc == 0
    - billet_finalization_service_pids.results[billet_finalization_index].stdout | trim != '0'
  become: true

- name: Start the committed billet server before admitting compute
  ansible.builtin.systemd_service:
    name: billet-server.service
    state: restarted
  when:
    - billet_finalization_services[0].should_run | bool
    - >-
      billet_finalization_service_activity.results[0].rc != 0 or
      billet_finalization_service_probes.results[0].rc | default(1) == 0
  become: true

- name: Start the committed billet node after the control plane
  ansible.builtin.systemd_service:
    name: billet-node.service
    state: restarted
  when:
    - billet_finalization_services[1].should_run | bool
    - >-
      billet_finalization_service_activity.results[1].rc != 0 or
      billet_finalization_service_probes.results[1].rc | default(1) == 0
  become: true

- name: Keep services outside the committed target stopped
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    state: stopped
  loop: "{{ billet_finalization_services }}"
  loop_control:
    index_var: billet_finalization_stop_index
    label: "{{ item.name }}"
  when:
    - not item.should_run | bool
    - billet_finalization_service_load_states.results[billet_finalization_stop_index].stdout | trim != 'not-found'
  become: true

- name: Inspect committed service stability baseline
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=MainPID
      - --property=ControlPID
      - --property=Result
      - --property=NRestarts
      - --property=ActiveEnterTimestampMonotonic
      - --property=ExecMainStartTimestampMonotonic
      - "{{ item.name }}"
  loop: "{{ billet_finalization_services }}"
  register: billet_finalization_service_baseline
  changed_when: false
  failed_when: false
  when: item.should_run | bool
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Observe committed services across the restart interval
  ansible.builtin.pause:
    seconds: 6
  when:
    - billet_finalization_services[0].should_run | bool or billet_finalization_services[1].should_run | bool

- name: Inspect committed service stability after the restart interval
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=LoadState
      - --property=ActiveState
      - --property=SubState
      - --property=MainPID
      - --property=ControlPID
      - --property=Result
      - --property=NRestarts
      - --property=ActiveEnterTimestampMonotonic
      - --property=ExecMainStartTimestampMonotonic
      - "{{ item.name }}"
  loop: "{{ billet_finalization_services }}"
  register: billet_finalization_service_state
  changed_when: false
  failed_when: false
  when: item.should_run | bool
  loop_control:
    label: "{{ item.name }}"
  become: true

- name: Prove committed services are stably active
  ansible.builtin.assert:
    that:
      - item.0.rc == 0
      - item.1.rc == 0
      - item.0.stdout == item.1.stdout
      - "'LoadState=loaded' in item.1.stdout"
      - "'ActiveState=active' in item.1.stdout"
      - "'SubState=running' in item.1.stdout"
      - "'MainPID=0' not in item.1.stdout"
      - "'ControlPID=0' in item.1.stdout"
      - "'Result=success' in item.1.stdout"
    fail_msg: >-
      {{ item.1.item.name }} did not remain unchanged, active and running after
      the durable {{ billet_finalization_commit }} decision. Leave the active
      claim in place so the next converge retries committed finalization without
      rolling back ledger state.
  loop: "{{ billet_finalization_service_baseline.results | zip(billet_finalization_service_state.results) | list }}"
  loop_control:
    label: "{{ item.1.item.name }}"
  when: not (item.1.skipped | default(false))

# THE CLOSE, BY SHAPE. Under the guard the transaction's pointer is removed
# ALONE and the guard stays held (the converge releases nothing; the operator
# releases with the holder they exported), and the shape goes back to `guard`
# so a task later in this invocation reads the shape the host is in. Under the
# legacy shapes the claim file itself is removed. THE INTERRUPTION FLAG IS NOT
# TOUCHED: main.yml requires a fresh converge after a recovered transaction on
# that flag, and clearing it here let the play go on into a second transaction
# over the journal it had just closed.
- name: Close the durable host-upgrade transaction after stable service startup
  ansible.builtin.file:
    path: >-
      {{ billet_exclusion_root ~ '/active/recovery'
         if billet_upgrade_claim_shape == 'guard-pointer'
         else billet_exclusion_root ~ '/active' }}
    state: absent
  become: true

- name: Durably close the host-upgrade transaction
  ansible.builtin.command:
    argv:
      - sync
      - -f
      - "{{ item }}"
  loop: >-
    {{ [billet_exclusion_root ~ '/active', billet_exclusion_root]
       if billet_upgrade_claim_shape == 'guard-pointer'
       else [billet_exclusion_root] }}
  changed_when: false
  become: true

- name: Record that the guard holds no transaction after the close
  ansible.builtin.set_fact:
    billet_upgrade_claim_shape: guard
  when: billet_upgrade_claim_shape == 'guard-pointer'
