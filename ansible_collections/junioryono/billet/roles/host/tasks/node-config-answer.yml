---
# THE ONE PARSER OF A `node config-change` ANSWER: keep only when the call
# exited 0 and printed exactly the answer billet writes for keep, and the
# restart otherwise.
#
# COMPARED WHOLE, NEVER PARSED OR PATTERN-MATCHED: from_json raises on an
# answer that is not JSON, and a raise here would fail the converge where the
# rule is to restart; a pattern admits half-formed answers (an invalid escape
# in the reason) as keep. billet's keep is one fixed line, which
# internal/ops/host's TestTheRolesKeepOnlyOnBilletsExactKeep holds equal to
# the command's own output, so a changed wording reads as restart until this
# line follows it. Half an answer, an empty one, a failed call and any other
# word are all the restart.
#
# Input: billet_node_config_verdict_raw (the registered command result).
- name: Keep the node running only on billet's keep
  vars:
    billet_node_config_keep_answer: '{"schema":1,"verdict":"keep","why":"only [tiers nodes] changed, which no running node reads"}'
    billet_node_config_keeps: >-
      {{ (billet_node_config_verdict_raw.rc | default(1)) == 0
         and (billet_node_config_verdict_raw.stdout | default('') | trim) == billet_node_config_keep_answer }}
  ansible.builtin.set_fact:
    billet_node_config_changed: "{{ not (billet_node_config_keeps | bool) }}"
    billet_node_config_verdict_why: >-
      {{ 'only tiers or nodes: changed, which no running node reads'
         if billet_node_config_keeps | bool else 'billet did not answer keep' }}
