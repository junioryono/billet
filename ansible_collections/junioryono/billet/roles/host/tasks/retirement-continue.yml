---
- name: Require the continuation's journal operands
  ansible.builtin.assert:
    that:
      - billet_retirement_classification.journal is mapping
      - billet_retirement_classification.journal.retiring == inventory_hostname
      - billet_retirement_classification.journal.variant == 'server-only'
    fail_msg: The continuation requires this host's server-only journal; ordinary convergence remains bypassed.

- name: Keep this host's environment operand across the survivor handoff
  ansible.builtin.set_fact:
    billet_retirement_survivor: "{{ billet_retirement_classification.journal.survivor }}"
    billet_retirement_transition_id: "{{ billet_retirement_classification.journal.transition_id }}"
    billet_retirement_local_environment_file: "{{ billet_retirement_environment_file }}"

- name: Read this host's clock for the continuation envelope
  ansible.builtin.command:
    argv: [date, -u, '+%Y-%m-%dT%H:%M:%SZ']
    expand_argument_vars: false
  register: billet_retirement_clock
  changed_when: false
  become: true

- name: Inspect only this host for its continuation envelope
  ansible.builtin.command:
    argv: ["{{ billet_retirement_answerer }}", release, inspect, --json, --config, /etc/billet/billet.yaml]
    expand_argument_vars: false
  register: billet_retirement_inspect_raw
  changed_when: false
  become: true

- name: Carry this host's continuation document
  ansible.builtin.set_fact:
    billet_retirement_document:
      schema: 1
      round:
        id: "{{ billet_exclusion_holder }}-{{ billet_retirement_clock.stdout | trim }}"
        started_at: "{{ billet_retirement_clock.stdout | trim }}"
      self:
        host: "{{ inventory_hostname }}"
        collected_at: "{{ billet_retirement_clock.stdout | trim }}"
        inspect: "{{ billet_retirement_inspect_raw.stdout | junioryono.billet.from_json_strict }}"
        status: null
      survivor: null
      nodes: {}
      desired: null
  no_log: true

- name: Run the local continuation
  ansible.builtin.include_tasks: retirement-continue-call.yml

- name: Carry a pending row to this converge's survivor when prepared
  ansible.builtin.include_tasks: retirement-tail.yml
  when: billet_retirement_result.row | default('') == 'pending'

- name: Report the retirement's settlement or remaining obligation
  ansible.builtin.debug:
    msg: >-
      Retirement is locally done; settled={{ billet_retirement_result.settled }}.
      {{ billet_retirement_result.row_why | default('') }}
      Ordinary host tasks remain bypassed.
