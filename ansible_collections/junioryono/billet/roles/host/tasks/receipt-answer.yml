---
# THE ONE PARSER OF A `node receipt` ANSWER, for the migration's evidence
# write and the refresh alike: `written` or `current` (exit 0) with the receipt
# as the command holds it, `reported` (exit 0, a dry run) with the receipt it
# would write or null with a reason, `refused` (exit 2) or `unknown` (exit 3).
# The receipt's ten members are held to their shapes and, where the call knows
# them, to the node and the run asked for; a member outside the producer's set
# refuses naming it.
#
# Inputs: billet_receipt_raw (the registered command result),
# billet_receipt_call ('evidence' or 'refresh'), billet_receipt_dry (whether
# the call was a dry run), billet_receipt_answered_by, billet_receipt_run (the
# holder recorded, empty for a dry run).

- name: Refuse a receipt call that did not answer
  ansible.builtin.assert:
    that:
      - billet_receipt_raw.rc is defined
      - billet_receipt_raw.rc >= 0
      - billet_receipt_raw.rc not in [124, 137]
      - billet_receipt_raw.stdout | default('') | trim | length > 0
      - (billet_receipt_raw.stdout | default('') | trim) is match('^\{')
    fail_msg: >-
      {{ billet_receipt_answered_by }} did not answer the receipt's
      {{ billet_receipt_call }} (exit {{ billet_receipt_raw.rc | default('none') }},
      {{ 'ended by the bound' if (billet_receipt_raw.rc is not defined or billet_receipt_raw.rc < 0 or billet_receipt_raw.rc in [124, 137]) else 'no JSON answer' }}).
      Whether a receipt was written is not known{{ (': ' ~ (billet_receipt_raw.stderr | default('') | trim)) if (billet_receipt_raw.stderr | default('') | trim | length > 0) else '' }}.
      Converge again: the refresh rewrites or confirms it.

- name: Read the receipt's answer
  ansible.builtin.set_fact:
    billet_receipt_answer: "{{ billet_receipt_raw.stdout | junioryono.billet.from_json_strict }}"
  no_log: true

- name: Judge the receipt's answer
  vars:
    billet_receipt_a: "{{ billet_receipt_answer | default({}) }}"
    billet_receipt_outcome: "{{ billet_receipt_a.outcome | default('') }}"
    billet_receipt_r: "{{ billet_receipt_a.receipt | default(none) }}"
    billet_receipt_hex32: '^[0-9a-f]{32}\Z'
    billet_receipt_sha: '^[0-9a-f]{64}\Z'
    billet_receipt_failed: "{{ billet_receipt_outcome in ['refused', 'unknown'] }}"
    billet_receipt_with_receipt: "{{ billet_receipt_outcome in ['written', 'current'] or (billet_receipt_outcome == 'reported' and billet_receipt_r is not none) }}"
    billet_receipt_members:
      written: [schema, outcome, receipt]
      current: [schema, outcome, receipt]
      reported: [schema, outcome, receipt, why]
      refused: [schema, outcome, reason, why, next, state]
      unknown: [schema, outcome, reason, why, next, state]
    billet_receipt_required:
      written: [schema, outcome, receipt]
      current: [schema, outcome, receipt]
      reported: [schema, outcome, receipt, why]
      refused: [schema, outcome, reason, why]
      unknown: [schema, outcome, reason, why]
    billet_receipt_fields: [schema, run, node, deployment, installed_sha256, installed_endpoint, effective_endpoint, invocation_id, incarnation, written_at]
    billet_receipt_checks:
      # THE OUTCOMES BY CALL: the refresh writes, finds a receipt current, or
      # in a dry run reports; evidence mode writes or fails, since the
      # `current` shortcut is the refresh's alone.
      - name: outcome
        ok: "{{ billet_receipt_outcome in (['reported', 'refused', 'unknown'] if billet_receipt_dry | bool else (['written', 'current', 'refused', 'unknown'] if billet_receipt_call == 'refresh' else ['written', 'refused', 'unknown'])) }}"
      - name: schema
        ok: "{{ billet_receipt_a.schema | default(0) is integer and billet_receipt_a.schema | default(0) == 1 }}"
      - name: exit
        ok: "{{ (billet_receipt_raw.rc | default(1)) == ({'refused': 2, 'unknown': 3}[billet_receipt_outcome] if billet_receipt_failed else 0) }}"
      - name: members
        ok: "{{ billet_receipt_outcome in billet_receipt_members and (billet_receipt_a.keys() | list | difference(billet_receipt_members[billet_receipt_outcome]) | length == 0) and (billet_receipt_required[billet_receipt_outcome] | difference(billet_receipt_a.keys() | list) | length == 0) }}"
      - name: reason
        ok: "{{ not billet_receipt_failed or (billet_receipt_a.reason | default('') is string and billet_receipt_a.reason | default('') | length > 0) }}"
      - name: why
        ok: "{{ billet_receipt_outcome not in ['refused', 'unknown', 'reported'] or (billet_receipt_a.why | default('') is string and billet_receipt_a.why | default('') | length > 0) }}"
      - name: next
        ok: "{{ ('next' not in billet_receipt_a) or (billet_receipt_a.next is string) }}"
      - name: state
        ok: "{{ ('state' not in billet_receipt_a) or (billet_receipt_a.state in ['nothing', 'stopped', 'started', 'started-no-record']) }}"
      # THE RECEIPT: an object of exactly the ten members, each of its shape;
      # null only on a `reported` that names no receipt, with its reason.
      - name: receipt
        ok: "{{ billet_receipt_failed or (billet_receipt_r is none and billet_receipt_outcome == 'reported') or ((billet_receipt_r is mapping) and (billet_receipt_r.keys() | list | sort) == (billet_receipt_fields | sort)) }}"
      - name: receipt_schema
        ok: "{{ not billet_receipt_with_receipt or (billet_receipt_r.schema | default(0) is integer and billet_receipt_r.schema | default(0) == 1) }}"
      # THE RUN: a `written` receipt carries this converge's holder; a `current`
      # one keeps the holder it was written under (the shortcut compares the
      # evidence, never the run), so an unchanged host converges under a new
      # holder, and that holder is still one the guard would accept
      # (`valid_holder`, the one grammar `checkHolder` is, held to its vector
      # table), since the producer's reader refuses a receipt naming none; a
      # dry run reports whatever it would write, an empty run included.
      - name: receipt_run
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.run | default('x')) is string and (billet_receipt_dry | bool or (billet_receipt_outcome == 'current' and (billet_receipt_r.run | default('') | junioryono.billet.valid_holder)) or (billet_receipt_outcome == 'written' and billet_receipt_r.run | default('') == billet_receipt_run))) }}"
      - name: receipt_node
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.node | default('x')) is string and (billet_receipt_r.node | default('')) | length > 0) }}"
      - name: receipt_deployment
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.deployment | default('x')) is string and (billet_receipt_r.deployment | default('')) is match(billet_receipt_hex32)) }}"
      - name: receipt_installed_sha256
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.installed_sha256 | default('x')) is string and (billet_receipt_r.installed_sha256 | default('')) is match(billet_receipt_sha)) }}"
      - name: receipt_endpoints
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.installed_endpoint | default('x')) is string and (billet_receipt_r.installed_endpoint | default('')) | length > 0 and (billet_receipt_r.effective_endpoint | default('x')) is string and billet_receipt_r.effective_endpoint | default('') == billet_receipt_r.installed_endpoint | default('')) }}"
      - name: receipt_invocation_id
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.invocation_id | default('x')) is string and (billet_receipt_r.invocation_id | default('')) is match(billet_receipt_hex32)) }}"
      - name: receipt_incarnation
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.incarnation | default('x')) is string and (billet_receipt_r.incarnation | default('')) is match(billet_receipt_hex32)) }}"
      - name: receipt_written_at
        ok: "{{ not billet_receipt_with_receipt or ((billet_receipt_r.written_at | default('x')) is string and (billet_receipt_r.written_at | default('')) | length > 0) }}"
  ansible.builtin.assert:
    that:
      - item.ok | bool
    fail_msg: >-
      The receipt's {{ billet_receipt_call }} through {{ billet_receipt_answered_by }}
      answered with a member this role cannot read: {{ item.name }}. Whether a
      receipt was written is not known; converge again, the refresh rewrites
      or confirms it.
  loop: "{{ billet_receipt_checks }}"
  loop_control:
    label: "{{ item.name }}"
