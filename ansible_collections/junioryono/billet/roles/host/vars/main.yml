---
# ROLE VARS RATHER THAN DEFAULTS, because this is not an operator's to choose:
# the unit template names this path and the task below writes it, and a playbook
# that moved one without the other would leave a control plane reading a file
# nothing writes.

# The control plane's EnvironmentFile. Written only when
# billet_server_environment has something in it, and named by the server unit
# only then — see defaults/main.yml for what it is for.
billet_server_environment_path: /etc/billet/server.env

# And the marker recording that the role wrote it, so the removal that follows an
# emptied billet_server_environment can never take a file an operator wrote
# themselves. The msmtprc sidecar's shape, for the msmtprc sidecar's reason.
billet_server_environment_marker_path: /etc/billet/server.env-managed

# Where billet_state_ca_bundle_src lands. It matches state-rds-postgres's
# `ssl_root_cert_path` default, which is what the DSN that module emits names as
# `sslrootcert` — one path, written down in the two places that have to agree.
billet_state_ca_bundle_path: /etc/billet/rds-ca-bundle.pem

# THE ENDPOINT COMMANDS' OWN PHASES, mirrored so the role's outer bound
# (`timeout -k 10`) expires after the command's own deadlines and their
# observations, and a slow but permitted sequence never loses its answer
# after the node was stopped or started. `billet node migrate-endpoint`
# judges up to three times when the process moves under its bracket, each
# judgement one opening observation, the record wait (a bracket already
# running when the wait ends finishes under its own two observations), the
# closing check (a fourth observation), and, for a running node that
# published no record within the wait, one probe of the managed binary for
# the pre-R classification under the guard's command bound
# (guardCommandTimeout, 60s); a record read is up to three brackets of two
# observations each; every observation is one `systemctl show` under the
# inspector's bound (lifeops.DefaultTimeout, 30s); the start runs under the
# unit's start bound (deploy.UnitStartTimeout, 120s) plus the lifecycle
# margin (30s). cmd/billet's TestTheRoleMirrorsTheEndpointCommandsPhaseBudgets
# holds each value to the constant it mirrors.
billet_migration_judgement_attempts: 3
billet_migration_bracket_attempts: 3
billet_migration_observation_bound: 30
billet_migration_probe_bound: 60
billet_migration_start_bound: 150

# billet_configured_server_state_dir is the directory THIS RUN'S EFFECTIVE
# configuration points the control plane's identity at.
#
# TWO SPELLINGS OF ONE DIRECTORY, AND A POSTGRESQL DEPLOYMENT HAS ONLY THE
# SECOND. `state_dir` is the shorthand — the ledger and the identity in one place
# — while `identity_dir` is what a config naming its ledger backend writes
# instead, because only the LEDGER moves into the database: the deployment
# identity, the node-wire CA and its rotation state, the process lock and the
# maintenance fence are still files. The two are mutually exclusive at load, and
# upgrade-inspect.yml refuses a config carrying both before it acts on either.
#
# READING `state_dir` ALONE ANSWERED THE DEFAULT FOR EVERY POSTGRESQL
# DEPLOYMENT, whatever it actually named — after which the role fences, chowns,
# sandboxes and mounts a directory the control plane does not use, and billet
# finds its own identity directory outside ReadWritePaths under
# ProtectSystem=strict.
#
# EMPTINESS BELONGS ONLY TO THE RETAINED ORDINARY ROUTE, where
# retirement-binary-refusal.yml refuses the role's binary transaction before
# ordinary work. A never-controller node-only host still runs that transaction:
# its fence writes <server state dir>/billet.maintenance with copy, which cannot
# create parent directories. Keep the default directory for that host, including
# serverless E; a candidate placeholder alone cannot supply the directory.
# Retained hosts have no operative server directory and must not recreate one.
#
# HERE RATHER THAN INLINE so there is ONE definition: upgrade-inspect.yml sets
# the candidate fact from it and the server unit template reads that fact, and a
# test can exercise this expression against a configuration directly. account.yml
# has a near-twin that reads the INSTALLED file rather than this run's request;
# the two cannot share, and both must read both spellings.
billet_configured_server_state_dir: >-
  {{
    '' if billet_retirement_node_ordinary | default(false) | bool else
    (billet_effective_config.get('server', {}).get('identity_dir')
     or billet_effective_config.get('server', {}).get('state_dir')
     or '/var/lib/billet/server')
  }}

# billet_configured_state_backend is where THIS RUN'S EFFECTIVE configuration
# keeps the ledger.
#
# `sqlite` FOR EVERY CONFIG THAT SAYS NOTHING, which is the same answer the
# config layer fills in — a `state_dir` shorthand IS `backend: sqlite`, and a
# node-only host has no server section and no ledger to have an opinion about.
# Naming the default rather than leaving it empty matters because the refusals
# that read this are written as "not sqlite": an empty answer would refuse every
# ordinary host. The preparation decision has its own operand
# (billet_preparation_state_backend), which IS empty for an absent server and
# whose refusals are written to admit that.
billet_configured_state_backend: >-
  {{
    billet_effective_config.get('server', {}).get('state', {}).get('backend')
    or 'sqlite'
  }}

# The first release carrying the complete seven-route classifier. Development
# builds must answer the same strict shape. This is not the installation pin.
billet_retire_capability_floor: v0.11.0
# retireReportLedgerBound (two minutes), plus observation/cleanup margin.
billet_retire_classify_bound: 180

# Ordinary destinations are explicit operands; recovery keeps its manifest.
billet_ordinary_config_path: /etc/billet/billet.yaml
billet_common_directories:
  - { path: /etc/billet, owner: root, group: "{{ billet_service_group }}", mode: "0750" }
  - { path: /etc/billet/network, owner: root, group: root, mode: "0755" }
  - { path: /var/lib/billet, owner: root, group: root, mode: "0755" }
billet_server_directories: >-
  {{ [{'path': billet_configured_server_state_dir, 'owner': billet_service_user,
       'group': billet_service_group, 'mode': '0700'}]
     if billet_configured_server_state_dir | length > 0 else [] }}
billet_node_directories:
  - { path: "{{ billet_candidate_node_state_dir }}", owner: root, group: root, mode: "0700" }
  - { path: /var/lib/billet/health, owner: root, group: root, mode: "0750" }
  - { path: /var/lib/billet/upgrades, owner: root, group: root, mode: "0700" }
  - { path: "{{ billet_firecracker_stage }}", owner: root, group: root, mode: "0700" }
  - { path: /srv/jailer, owner: root, group: root, mode: "0755" }
  - { path: /usr/local/libexec, owner: root, group: root, mode: "0755" }
