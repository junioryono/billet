---
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not (_billet_alert_skip_service_control | default(false))
  become: "{{ _billet_alert_become | default(true) }}"

# EVERY ENABLE, DISABLE OR MASK THAT CHANGED SOMETHING sets systemd's
# manager-wide pending-reload flag, which every unit then reports until a
# daemon-reload clears it. The role reloaded when it started; a flag at its end
# arose in this run, from its own operations, so the converge ends with the
# reload they left pending. It adopts whatever else is pending on the host too
# (a concurrent snap or package operation is not excluded), and says so rather
# than claiming the flag was its own. Two handlers on one listen name, because a
# handler cannot hold a block: the probe, then the reload it justifies.
#
# ON THE RETAINED ROUTE THE PROBE ASKS THE NODE AND ACCEPTS ONLY yes OR no (§3.3).
# The retained host's server unit is retired, absent or masked, so it is not the
# unit whose answer the closing proof relies on; and there an empty or unfamiliar
# answer would otherwise read as "nothing pending" and skip the reload, leaving
# strict closing to judge a manager that still owes one. Every other host keeps
# its existing probe and its existing exit-status check, unchanged.
- name: Inspect whether the manager reports a pending reload after unit-file changes
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - --property=NeedDaemonReload
      - --value
      - "{{ 'billet-node.service' if billet_retirement_node_ordinary | default(false) | bool else 'billet-server.service' }}"
  register: billet_service_policy_reload_after
  changed_when: false
  failed_when: >-
    billet_service_policy_reload_after.rc != 0 or
    (billet_retirement_node_ordinary | default(false) | bool and
     billet_service_policy_reload_after.stdout | trim not in ['yes', 'no'])
  when:
    - not ansible_check_mode
    - not (_billet_alert_skip_service_control | default(false))
  become: "{{ _billet_alert_become | default(true) }}"
  listen: billet unit files changed

- name: Reload systemd after the role's own unit-file changes
  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - not (_billet_alert_skip_service_control | default(false))
    - billet_service_policy_reload_after.stdout | default('') | trim == 'yes'
  become: "{{ _billet_alert_become | default(true) }}"
  listen: billet unit files changed

- name: Reload billet guest networking
  ansible.builtin.command: networkctl reload
  changed_when: true
  become: true

- name: Restart billet dnsmasq
  ansible.builtin.systemd_service:
    name: "billet-dnsmasq@{{ item.name }}.service"
    state: restarted
  loop: "{{ billet_networks }}"
  when: not ansible_check_mode
  become: true

- name: Reload billet firewall
  ansible.builtin.command: /usr/sbin/nft -f /etc/billet/network.nft
  changed_when: true
  become: true
