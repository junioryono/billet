---
# Run cloudflared on the host as the connector for a Cloudflare Tunnel: the host
# half of Routes C and D in docs/deploying/reaching-hosts.md, which the modules
# there provision the Cloudflare half of.
#
# THE TOKEN NEVER REACHES ARGV. `cloudflared service install` takes it only as
# a positional argument and writes /etc/cloudflared/token (0600 root, the bytes
# verbatim) beside a unit that runs `tunnel run --token-file` (measured on
# cloudflared 2026.7.3 and read in its source, cmd/cloudflared/common_service.go);
# this role writes that file and renders that unit itself and never runs the
# installer, so the credential is in a root-only file and, under no_log, nowhere
# in a log.
#
# A RESTART OF A RUNNING CONNECTOR IS THE DANGEROUS ACT, whatever causes it. A
# play reaching the host through this connector loses its session when the
# connector restarts, before the replacement is up; so every write that would
# restart a running connector (a rotated credential, a changed unit, a changed
# owner) is predicted first and refused unless the answer to "does this play
# reach the host through this connector" is a definite false. A first install
# restarts nothing that carries a session, so it is never refused.
#
# WITHOUT A TOKEN THE ROLE DOES NOTHING, so a play can run it on every host and
# an inventory that says nothing converges unchanged.

# A NAME FOR EVERY HOST'S TOKEN, AND NO TWO HOSTS SHARING ONE. Upper-casing and
# replacing punctuation maps node-a, node.a and node_a onto NODE_A, and two such
# hosts would silently read one credential. The names are computed here for
# every host in the play from its inventory, never from a fact each host records
# first, because under `serial` the later batches have recorded nothing when the
# first batch asks; the fallback formula is the default's, repeated on purpose.
# Case-sensitive, because environment variable names are.
- name: Compute the environment variable every host in this play reads its token from
  ansible.builtin.set_fact:
    billet_cloudflared_env_names: >-
      {%- set names = [] -%}
      {%- for h in ansible_play_hosts_all -%}
      {%- set _ = names.append(hostvars[h]['billet_cloudflared_token_env'] | default('BILLET_CLOUDFLARED_TOKEN_' ~ (h | upper | regex_replace('[^A-Z0-9]', '_')))) -%}
      {%- endfor -%}
      {{ names }}

# EVERY HOST ASSERTS BOTH, never one host for all: a run_once task is skipped
# for every host when the first host's inherited `when` is false, and a
# consumer may well invoke the role under a condition. The computation is
# pure, so the cost is nothing.
- name: Refuse two hosts whose connector tokens would share one environment variable
  ansible.builtin.assert:
    that:
      - billet_cloudflared_env_names | unique(case_sensitive=true) | length == billet_cloudflared_env_names | length
    fail_msg: >-
      Two hosts in this play read their cloudflared token from the same
      environment variable: {{ dict(ansible_play_hosts_all | zip(billet_cloudflared_env_names)) }}.
      Set billet_cloudflared_token_env on one of them to a distinct name.

# THE NAME THIS HOST READS IS THE NAME THE PLAY-WIDE LIST HOLDS FOR IT. An
# override at a scope hostvars does not see (the vars of a role invocation)
# would make this host read one name while the list above showed distinct
# fallbacks and passed; a host whose own name is the computed one is safe to
# act whatever its neighbour was refused for.
- name: Refuse a token variable name the play-wide check could not see
  ansible.builtin.assert:
    that:
      - billet_cloudflared_token_env == billet_cloudflared_env_names[ansible_play_hosts_all.index(inventory_hostname)]
    fail_msg: >-
      {{ inventory_hostname }} reads its cloudflared token from a variable the play-wide
      collision check could not see: it reads {{ billet_cloudflared_token_env }} and the check
      computed {{ billet_cloudflared_env_names[ansible_play_hosts_all.index(inventory_hostname)] }}
      from the inventory. billet_cloudflared_token_env is set somewhere the check cannot see (the
      vars of a role invocation, say); set it in the inventory for the host
      that needs it.

- name: Report that no connector token was supplied
  ansible.builtin.debug:
    msg: >-
      {{ billet_cloudflared_token_env }} is not set, so the cloudflared connector
      is not configured on {{ inventory_hostname }}. This is not a failure;
      export the token under that name to install it.
  when: billet_cloudflared_token | length == 0

- name: Configure the cloudflared connector
  when: billet_cloudflared_token | length > 0
  block:
    # BEFORE ANYTHING IS INSTALLED, pure computations on values already held.
    # The shape is checked first with a message that says what a token is,
    # because the decode below runs under no_log and a pasted wrong string would
    # otherwise fail censored; a token that is base64 but not the JSON document
    # still fails there, censored, before anything is written.
    - name: Refuse a connector token that is not a base64 document
      ansible.builtin.assert:
        that:
          - (billet_cloudflared_token | trim) is match('^[A-Za-z0-9+/]+=*$')
        fail_msg: >-
          The value in {{ billet_cloudflared_token_env }} is not a base64 token. A
          cloudflared connector token is the base64 of a JSON document naming the
          account, the secret and the tunnel; `terraform output -raw tunnel_token`
          prints it. Nothing was installed.

    # THE EXPECTED TUNNEL IS REQUIRED, not optional: with it empty the one check
    # that catches a token for the other host's tunnel would be skipped by
    # default, and that token installs cleanly and comes up healthy.
    - name: Refuse a host that names no tunnel to check its token against
      ansible.builtin.assert:
        that:
          - billet_cloudflared_expected_tunnel_id | string | trim | length > 0
        fail_msg: >-
          {{ inventory_hostname }} has a connector token in
          {{ billet_cloudflared_token_env }} and no billet_cloudflared_expected_tunnel_id.
          The id is what proves the token is this host's: a token for another
          tunnel installs cleanly and comes up healthy advertising routes this
          host cannot serve. Set it from `terraform output -raw tunnel_id`; it
          names a tunnel and authorises nothing, so it belongs in the inventory.
          Nothing was installed.

    - name: Read the tunnel id the supplied token names
      ansible.builtin.set_fact:
        billet_cloudflared_token_tunnel_id: >-
          {{ (billet_cloudflared_token | trim | b64decode | from_json).get('t', '') }}
      no_log: true

    - name: Refuse a connector token belonging to a different tunnel
      ansible.builtin.assert:
        that:
          - billet_cloudflared_token_tunnel_id == (billet_cloudflared_expected_tunnel_id | string | trim)
        fail_msg: >-
          The token in {{ billet_cloudflared_token_env }} names tunnel
          {{ billet_cloudflared_token_tunnel_id | default('(unreadable)') }}, and
          {{ inventory_hostname }} expects {{ billet_cloudflared_expected_tunnel_id }}.
          Refusing to install it: a connector on the wrong token comes up healthy
          and advertises routes this host cannot serve, and the failure shows up
          as an unrelated timeout later.
        success_msg: >-
          The connector token belongs to the tunnel {{ inventory_hostname }} expects.

    # AN ANSWER THAT IS NEITHER true NOR false IS REFUSED, not read as empty:
    # "yes" or 1 would otherwise fall through to the derived answer, and a
    # derived false authorises a rotation over this play's own transport.
    - name: Refuse an answer about the transport that is neither true nor false
      ansible.builtin.assert:
        that:
          - (billet_cloudflared_carries_ansible_transport | string | trim | lower) in ['', 'true', 'false']
        fail_msg: >-
          billet_cloudflared_carries_ansible_transport is
          "{{ billet_cloudflared_carries_ansible_transport }}" on {{ inventory_hostname }};
          it must be true, false, or left empty. Any other spelling would fall
          through to the derived answer and could authorise a rotation over this
          play's own transport.

    - name: Inspect the connector binary
      ansible.builtin.stat:
        path: "{{ billet_cloudflared_binary }}"
      register: billet_cloudflared_binary_stat
      check_mode: false
      become: true

    # A DRY RUN ON A HOST THAT HAS NEVER HAD THE CONNECTOR STOPS HERE. Check mode
    # fetches nothing, adds no repository and installs no package, so every task
    # below would act on files the dry run did not create and either fail or
    # report a change it cannot describe; the reference deployment measured a
    # dry run failing at the package install for exactly that. What a dry run
    # can say about such a host is that the real converge installs and verifies
    # the connector, so it says that and ends the role.
    - name: Report what a dry run cannot see on a host with no connector yet
      ansible.builtin.debug:
        msg: >-
          {{ billet_cloudflared_binary }} is not installed on {{ inventory_hostname }}
          and this is a dry run: the real converge stages and verifies Cloudflare's
          signing key against the pinned fingerprint, adds the repository, installs
          the package, writes the token file and the unit, and waits for the tunnel
          to register. Nothing further can be described without those files.
      when:
        - ansible_check_mode
        - not billet_cloudflared_binary_stat.stat.exists

    - name: Install and run the connector
      when: not (ansible_check_mode and not billet_cloudflared_binary_stat.stat.exists)
      block:
        - name: Install the cloudflared package from Cloudflare's repository
          ansible.builtin.import_tasks: apt.yml
          when: billet_cloudflared_manage_apt | bool

        # WHETHER A CONNECTOR IS RUNNING NOW, which is what makes a restart
        # dangerous: a session may be riding on it. Asked of systemd, not
        # inferred from files; an absent unit answers inactive. Only `inactive`
        # and `failed` are evidence that no process serves traffic; `activating`
        # (a long ExecStartPost), `deactivating`, `reloading` and anything
        # unrecognised are read as running.
        - name: Read whether the connector is running
          ansible.builtin.command:
            argv: [systemctl, show, -p, ActiveState, --value, cloudflared]
          register: billet_cloudflared_active
          changed_when: false
          check_mode: false
          become: true

        # THREE ANSWERS, AND ONLY A DEFINITE "NO" PERMITS A RESTART. An explicit
        # answer wins. A declared routed address derives one from the address
        # this play connects to: equal means the play rides the connector; two
        # DIFFERENT IPv4 literals mean it does not; anything else (no
        # ansible_host, a name against an address, an instance id, IPv6) is
        # could-not-tell, because two spellings can name one address (a name,
        # or 2001:db8::1 beside 2001:0db8:0:0:0:0:0:1) and the role resolves
        # and canonicalises nothing.
        - name: Decide whether this play reaches the host through the connector
          vars:
            billet_cloudflared_transport_explicit: "{{ billet_cloudflared_carries_ansible_transport | string | trim | lower }}"
            billet_cloudflared_routed: "{{ billet_cloudflared_routed_address | string | trim }}"
            billet_cloudflared_reached_at: "{{ ansible_host | default('') | string | trim }}"
            billet_cloudflared_ip_literal: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$'
          ansible.builtin.set_fact:
            billet_cloudflared_transport: >-
              {{ billet_cloudflared_transport_explicit
                 if billet_cloudflared_transport_explicit in ['true', 'false']
                 else 'unknown' if (billet_cloudflared_routed | length == 0 or billet_cloudflared_reached_at | length == 0)
                 else 'true' if billet_cloudflared_reached_at == billet_cloudflared_routed
                 else 'false' if (billet_cloudflared_reached_at is match(billet_cloudflared_ip_literal)
                                  and billet_cloudflared_routed is match(billet_cloudflared_ip_literal))
                 else 'unknown' }}

        # WHAT THE WRITES WOULD CHANGE IS READ BEFORE THEY HAPPEN: the files as
        # they are against the bytes, owner and mode the role writes. A rotated
        # token, a drifted unit and a changed owner all count, which is why the
        # guard reads these rather than comparing the token alone. Read as root
        # with the module's own failure on a file that exists and cannot be
        # read, so a read error is a failed task and not a fresh install.
        - name: Inspect the connector credential and unit
          ansible.builtin.stat:
            path: "{{ item }}"
          loop:
            - "{{ billet_cloudflared_config_dir }}/token"
            - "{{ billet_cloudflared_unit_path }}"
          register: billet_cloudflared_files
          check_mode: false
          become: true

        - name: Read the installed connector credential
          ansible.builtin.slurp:
            src: "{{ billet_cloudflared_config_dir }}/token"
          register: billet_cloudflared_installed_token
          when: billet_cloudflared_files.results[0].stat.exists
          no_log: true
          check_mode: false
          become: true

        # UNDER no_log LIKE THE CREDENTIAL: an older `cloudflared service
        # install` wrote the token into ExecStart as `--token <TOKEN>`, so a
        # unit being adopted may carry it, and so may the diff of replacing it.
        - name: Read the installed connector unit
          ansible.builtin.slurp:
            src: "{{ billet_cloudflared_unit_path }}"
          register: billet_cloudflared_installed_unit
          when: billet_cloudflared_files.results[1].stat.exists
          no_log: true
          check_mode: false
          become: true

        - name: Decide what a converge would rewrite
          vars:
            billet_cloudflared_token_stat: "{{ billet_cloudflared_files.results[0].stat }}"
            billet_cloudflared_unit_stat: "{{ billet_cloudflared_files.results[1].stat }}"
          ansible.builtin.set_fact:
            billet_cloudflared_token_would_change: >-
              {{ not (billet_cloudflared_token_stat.exists
                      and billet_cloudflared_token_stat.pw_name == billet_cloudflared_owner
                      and billet_cloudflared_token_stat.gr_name == billet_cloudflared_group
                      and billet_cloudflared_token_stat.mode == '0600'
                      and (billet_cloudflared_installed_token.content | default('') | b64decode) == (billet_cloudflared_token | trim)) }}
            billet_cloudflared_unit_would_change: >-
              {{ not (billet_cloudflared_unit_stat.exists
                      and billet_cloudflared_unit_stat.pw_name == billet_cloudflared_owner
                      and billet_cloudflared_unit_stat.gr_name == billet_cloudflared_group
                      and billet_cloudflared_unit_stat.mode == '0644'
                      and (billet_cloudflared_installed_unit.content | default('') | b64decode) == lookup('ansible.builtin.template', 'cloudflared.service.j2')) }}
          no_log: true

        - name: Refuse a change that would restart the connector this play may be reaching the host through
          vars:
            billet_cloudflared_rewrites: "{{ (['the credential'] if billet_cloudflared_token_would_change | bool else []) + (['the unit'] if billet_cloudflared_unit_would_change | bool else []) }}"
          ansible.builtin.assert:
            that:
              - >-
                (billet_cloudflared_active.stdout | trim) in ['inactive', 'failed']
                or not (billet_cloudflared_token_would_change | bool or billet_cloudflared_unit_would_change | bool)
                or billet_cloudflared_transport == 'false'
            fail_msg: >-
              Converging {{ inventory_hostname }} would rewrite {{ billet_cloudflared_rewrites | join(' and ') }} and restart the running connector, and
              {{ 'this play reaches the host through that connector'
                 if billet_cloudflared_transport == 'true'
                 else 'nothing says whether this play reaches the host through that connector' }}:
              the restart would drop this SSH session before the replacement is
              running. Converge over a path that does not traverse the tunnel
              (for example `-e ansible_host=<another IP address>` with
              billet_cloudflared_routed_address set, which makes the derivation
              false for that run), or declare
              billet_cloudflared_carries_ansible_transport: false for a host you
              reach another way. A converge that changes nothing is never refused.

        - name: Create the connector's configuration directory
          ansible.builtin.file:
            path: "{{ billet_cloudflared_config_dir }}"
            state: directory
            owner: "{{ billet_cloudflared_owner }}"
            group: "{{ billet_cloudflared_group }}"
            mode: "0755"
          become: true

        - name: Write the connector credential
          ansible.builtin.copy:
            content: "{{ billet_cloudflared_token | trim }}"
            dest: "{{ billet_cloudflared_config_dir }}/token"
            owner: "{{ billet_cloudflared_owner }}"
            group: "{{ billet_cloudflared_group }}"
            mode: "0600"
          no_log: true
          register: billet_cloudflared_token_file
          become: true

        - name: Render the connector unit
          ansible.builtin.template:
            src: cloudflared.service.j2
            dest: "{{ billet_cloudflared_unit_path }}"
            owner: "{{ billet_cloudflared_owner }}"
            group: "{{ billet_cloudflared_group }}"
            mode: "0644"
          register: billet_cloudflared_unit_file
          no_log: true
          become: true

        - name: Load the connector unit
          ansible.builtin.systemd_service:
            daemon_reload: true
          when:
            - billet_cloudflared_unit_file is changed
            - not ansible_check_mode
          become: true

        # TWO TASKS, BOTH UNDER no_log. The module returns the unit's whole
        # status, ExecStart included, and an adopted unit may still carry an
        # inline token in a dry run that did not rewrite it. The state and the
        # enablement are separate so that "the state task changed" means a
        # process was started or restarted (from `inactive`, `failed` or
        # `deactivating` alike) and nothing else, which is what the wait keys on.
        - name: Start or restart the connector
          ansible.builtin.systemd_service:
            name: cloudflared
            state: "{{ 'restarted' if (billet_cloudflared_token_file is changed or billet_cloudflared_unit_file is changed) else 'started' }}"
          register: billet_cloudflared_service
          no_log: true
          # In a dry run only where the unit exists: the module predicts a start
          # from `systemctl show`, and a unit the dry run did not write cannot be
          # asked about.
          when: not ansible_check_mode or billet_cloudflared_files.results[1].stat.exists
          become: true

        - name: Enable the connector
          ansible.builtin.systemd_service:
            name: cloudflared
            enabled: true
          no_log: true
          when: not ansible_check_mode or billet_cloudflared_files.results[1].stat.exists
          become: true

        # ONLY WHEN THIS RUN STARTED OR RESTARTED THE PROCESS (the state task
        # reports changed for exactly that), and only this invocation's log. cloudflared logs the registration line at startup
        # and reconnect, never periodically; a fixed window read on every run
        # was empty once the connector had been up for longer than the window,
        # and failed a healthy host (measured on the reference deployment). A
        # window read after a restart could also find the PREVIOUS process's
        # line, so the wait is keyed on the invocation systemd just started.
        # Enabling is its own task above, so it starts no process and awaits
        # nothing here.
        - name: Read the invocation systemd started
          ansible.builtin.command:
            argv: [systemctl, show, -p, InvocationID, --value, cloudflared]
          register: billet_cloudflared_invocation
          changed_when: false
          when:
            - not ansible_check_mode
            - billet_cloudflared_service is changed
          become: true

        # NO INVOCATION ID IS A REFUSAL, not a window read: a window of the
        # unit's journal holds the previous process's registration line, and
        # a wait that can be satisfied by it proves nothing about this start.
        - name: Refuse to judge a start whose invocation systemd did not name
          ansible.builtin.assert:
            that:
              - billet_cloudflared_invocation.stdout | default('') | trim | length > 0
            fail_msg: >-
              systemd reported no InvocationID for cloudflared on
              {{ inventory_hostname }} after it was started, so this role cannot
              tell which process's log to read for the registration. The
              connector was started; check `journalctl -u cloudflared` by hand.
          when: billet_cloudflared_invocation is not skipped

        - name: Wait for the connector to register a connection
          ansible.builtin.command:
            argv: [journalctl, --no-pager, "_SYSTEMD_INVOCATION_ID={{ billet_cloudflared_invocation.stdout | trim }}"]
          register: billet_cloudflared_log
          changed_when: false
          retries: 10
          delay: 3
          until: "'Registered tunnel connection' in (billet_cloudflared_log.stdout | default(''))"
          when: billet_cloudflared_invocation is not skipped
          become: true
