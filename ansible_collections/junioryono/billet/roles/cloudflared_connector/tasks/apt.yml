---
# Cloudflare's package repository, trusted only after its signing key has been
# verified against the pinned fingerprint. Staged root-only and verified BEFORE
# it lands at the trusted path: writing straight to the keyring and checking
# afterwards means a rejected key is already trusted when the play aborts, and
# unattended-upgrades installs from a repository signed by it.

- name: Create a private staging directory for the signing key
  ansible.builtin.file:
    path: "{{ billet_cloudflared_stage_dir }}"
    state: directory
    mode: "0700"
  become: true

- name: Stage the Cloudflare package signing key
  ansible.builtin.get_url:
    url: "{{ billet_cloudflared_signing_key_url }}"
    dest: "{{ billet_cloudflared_stage_dir }}/cloudflare-main.gpg"
    mode: "0600"
    timeout: "{{ billet_fetch_timeout }}"
  register: billet_cloudflared_key_fetch
  until: billet_cloudflared_key_fetch is succeeded
  retries: "{{ billet_fetch_retries }}"
  delay: "{{ billet_fetch_retry_delay }}"
  become: true

- name: Read the staged signing key's fingerprint
  ansible.builtin.command:
    argv: [gpg, --show-keys, --with-colons, "{{ billet_cloudflared_stage_dir }}/cloudflare-main.gpg"]
  register: billet_cloudflared_key
  changed_when: false
  check_mode: false
  become: true

- name: Verify the Cloudflare package signing key
  ansible.builtin.assert:
    that:
      - (billet_cloudflared_key.stdout_lines | default([]) | select('match', '^pub:') | list | length) == 1
      - ((billet_cloudflared_key.stdout_lines | default([]) | select('match', '^fpr:::::::::') | list | first) | default(''))
        == ('fpr:::::::::' ~ billet_cloudflared_signing_fingerprint ~ ':')
    fail_msg: >-
      The Cloudflare package signing key is not exactly one primary key with the
      pinned fingerprint {{ billet_cloudflared_signing_fingerprint }}. Refusing to
      add the repository. Either the download was intercepted or Cloudflare
      rotated the key: confirm against pkg.cloudflare.com from a trusted network
      before updating billet_cloudflared_signing_fingerprint.

# NOT GATED ON `creates:`. That would freeze the keyring forever: a rotated
# upstream key would download, verify and never reach the trusted path.
- name: Install the verified signing key
  ansible.builtin.copy:
    src: "{{ billet_cloudflared_stage_dir }}/cloudflare-main.gpg"
    dest: "{{ billet_cloudflared_keyring_path }}"
    remote_src: true
    mode: "0644"
  become: true

- name: Add the cloudflared apt repository
  ansible.builtin.deb822_repository:
    name: cloudflared
    types: [deb]
    uris: "{{ billet_cloudflared_apt_uri }}"
    suites: ["{{ billet_cloudflared_apt_suite }}"]
    components: [main]
    signed_by: "{{ billet_cloudflared_keyring_path }}"
    state: present
    enabled: true
  register: billet_cloudflared_repo
  become: true

- name: Remove a superseded one-line repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/cloudflared.list
    state: absent
  become: true

- name: Refresh the apt cache for the cloudflared repository
  ansible.builtin.apt:
    update_cache: true
  when: billet_cloudflared_repo is changed
  become: true

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
  become: true
