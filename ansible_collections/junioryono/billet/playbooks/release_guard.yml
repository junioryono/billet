---
# Release the converge guard a converge left on every host it held.
#
# THE OTHER HALF OF fleet.yml. Every play there holds its host under the
# converge's name before anything changes it, and nothing in the role ever
# releases, because the role cannot know when the converge driving it has
# ended. This playbook is how the driver says so: the published action runs it
# however its job finished, and an operator runs it when they are done.
#
# THE SAME INVENTORY AND THE SAME --limit as the converge, or a host this
# converge never held is asked about a guard that is not its to release. The
# task reports that and changes nothing, but a release run over the wrong hosts
# says nothing useful about the right ones.
#
# ONLY THE MINIMAL FACTS. The task picks the guard's binary and escalation by
# platform, and without a gather `ansible_facts['system']` is undefined and falls
# back to Linux: on a Mac that is the wrong binary and root it must not use.
# The `min` subset is what names the platform and nothing more, so a host that
# has just been restarted is not put through a full gather at the end of a job
# that may already have failed.
- name: Release the converge guard
  hosts: all
  gather_facts: true
  gather_subset: ['!all', 'min']
  tasks:
    - name: Release it on this host
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: release-guard
