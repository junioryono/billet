---
# The billet fleet: every host a consumer's inventory declares, converged in
# upgrade order by the roles this collection ships. A consumer's site.yml is
# one line, `- import_playbook: junioryono.billet.fleet`, and whatever plays of
# its own it appends after it.
#
# THE CONTROL PLANE FIRST. The node wire negotiates a protocol range and the
# control plane is upgraded first, so a skew is survivable in this order and
# not the other. A converge from a laptop chooses one host with -l; a converge
# from CI runs the whole inventory in this order, every time.
#
# NO PLAY-LEVEL become. The host, ssh_access and connector roles escalate on
# every task that needs it; development_host reads the login user's identity
# and home from the gathered facts and runs Homebrew as that user on a Mac,
# which a play-level become would turn into root.
#
# EVERY ROLE SKIPS CLEANLY ON ABSENT INPUTS: no keys, no tokens and no
# development switch converge exactly the host role alone, so an inventory that
# says nothing about them changes nothing by moving to this playbook.
#
# THE EXCLUSION FIRST, IN EVERY PLAY. A converge restarts billet's services and
# drains the node, which destroys the jobs on that host, including a deploy job
# running the playbook from a runner billet manages; and a converge that
# changes a host must not race a rollout's `billet host-upgrade` for the same
# binaries. The host role's preparation refuses the first shape as its first
# task and then HOLDS the host under the converge guard; it is repeated here as
# the first task of every play so that ssh_access, which runs before the host
# role, the connectors and the development role are all under it. The hold is
# taken once per host and a later inclusion only re-classifies the claim.
# Tagged `always`, and applied `always` to the included tasks, so a run under
# --tags cannot skip it.
#
# THE INVENTORY DECLARES ALL THREE GROUPS, empty ones allowed (`macos: {hosts:
# {}}`), which is what `billet init hybrid` and the examples write: a group a
# play targets and the inventory never declares is a warning by default and a
# failure under ANSIBLE_HOST_PATTERN_MISMATCH=error, after the earlier plays
# have already converged. A macOS host gets no connector from this playbook.

- name: billet control plane
  hosts: control_plane
  gather_facts: true
  pre_tasks:
    - name: Prepare the exclusion before anything changes this host
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: prepare-exclusion
        apply:
          tags: [always]
      tags: [always]
  roles:
    - role: junioryono.billet.ssh_access
    - role: junioryono.billet.host
    - role: junioryono.billet.cloudflared_connector

- name: billet Linux hosts
  hosts: linux
  gather_facts: true
  pre_tasks:
    - name: Prepare the exclusion before anything changes this host
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: prepare-exclusion
        apply:
          tags: [always]
      tags: [always]
  roles:
    - role: junioryono.billet.ssh_access
    - role: junioryono.billet.host
    - role: junioryono.billet.warp_connector
    - role: junioryono.billet.cloudflared_connector
    - role: junioryono.billet.development_host
      when: billet_development_enabled | default(false) | bool

- name: billet macOS hosts
  hosts: macos
  gather_facts: true
  pre_tasks:
    - name: Prepare the exclusion before anything changes this host
      ansible.builtin.include_role:
        name: junioryono.billet.host
        tasks_from: prepare-exclusion
        apply:
          tags: [always]
      tags: [always]
  roles:
    - role: junioryono.billet.development_host
      when: billet_development_enabled | default(false) | bool
