---
# The collection's fleet playbook converges every host in the `linux` group
# with the host role and, when the inventory configures them, the SSH access
# and connector roles; group_vars/linux.yml carries the block `billet init
# --emit ansible --provider firecracker` printed.
#
# THE CEPH DECISION IS YOURS AND IT IS DESTRUCTIVE. Left false in
# group_vars/linux.yml, the role expects a cluster this host can already reach.
# Set billet_ceph_bootstrap true only to create one, and only with
# billet_ceph_devices naming every disk it may consume: that path wipes them,
# and billet never infers a disk.
- import_playbook: junioryono.billet.fleet
