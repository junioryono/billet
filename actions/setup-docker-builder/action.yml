name: billet setup Docker builder
description: Start an isolated BuildKit daemon whose complete state lives on a billet sticky disk.
inputs:
  cache-key:
    description: Cache identity, normally the Dockerfile path prefixed by github.repository.
    required: false
    default: Dockerfile
  cache-size-gb:
    description: Sticky-disk size on first creation.
    required: false
    default: "100"
  buildkit-image:
    description: Immutable BuildKit image to run inside the microVM.
    required: false
    default: moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
  reset:
    description: Delete this key's existing BuildKit state before starting and publish a fresh baseline.
    required: false
    default: "false"
outputs:
  name:
    description: Name of the selected buildx builder.
    value: ${{ steps.start.outputs.name }}
runs:
  using: composite
  steps:
    - id: policy
      name: Resolve the cache-mount ceiling
      shell: bash
      run: "${{ github.action_path }}/resolve-policy.sh"
    - name: Attach persistent BuildKit state
      uses: junioryono/billet/actions/stickydisk@v0.3.23
      with:
        key: ${{ github.repository }}-buildkit-${{ inputs.cache-key }}-${{ runner.arch }}
        path: ${{ runner.temp }}/billet-buildkit-state
        size-gb: ${{ inputs.cache-size-gb }}
        publication: last-write-wins
        discard-marker: ${{ runner.temp }}/billet-buildkit-discard
    - name: Start isolated BuildKit
      id: start
      shell: bash
      env:
        BILLET_BUILDKIT_IMAGE: ${{ inputs.buildkit-image }}
        BILLET_BUILDKIT_RESET: ${{ inputs.reset }}
      run: "${{ github.action_path }}/start.sh"
    - name: Register BuildKit cleanup
      uses: junioryono/billet/actions/stop-docker-builder@v0.3.23
      with:
        container: ${{ steps.start.outputs.container }}
        builder: ${{ steps.start.outputs.name }}
        state-path: ${{ runner.temp }}/billet-buildkit-state
        mount-limit-bytes: ${{ steps.policy.outputs.mount_limit_bytes }}
        discard-marker: ${{ runner.temp }}/billet-buildkit-discard
