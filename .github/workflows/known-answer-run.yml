name: Known-answer run

# THE REFERENCE HOST'S CALLER for the known-answer kit
# (docs/operating/measurement-validation.md). Dispatched by hand: it runs six
# jobs one after another on billet-8vcpu-ubuntu-2404, a tier only ubuntu-01
# serves, so every loaded job's idle reference ran on the same host. The kit's
# scripts are fetched from this run's own commit.

# THE LOADS RUN 60 SECONDS, written here rather than as a dispatch input: a
# dispatch input reaches a reusable workflow as a string, and the kit's number
# input refuses it (measured 2026-10-09, "Unexpected value '60'").
#
# THE NETWORK LOAD IS THE LINUX TARBALL scripts/kernel/linux.pin names, from
# kernel.org, a file that never changes at a size kernel.org serves exactly
# (135390644 bytes, read 2026-10-22). The Cloudflare speed endpoint answered a
# guest with 403 (measured 2026-10-09), and a part of one of billet's own guest
# releases went with the release when the releases from before #584 were removed.
#
# THE MEMORY LOAD IS 8 GiB, because a microVM's host-side peak is all the guest
# RAM it touched, setup's page cache included: an idle job on this tier peaked
# at 4.8 GiB, and a 2 GiB load could not be told apart from it (2026-10-09).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  known-answer:
    uses: ./.github/workflows/known-answer.yml
    with:
      runner_label: billet-8vcpu-ubuntu-2404
      billet_ref: ${{ github.sha }}
      seconds: 60
      cpu_workers: 4
      memory_bytes: 8589934592
      network_url: https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.155.tar.xz
      network_bytes: 135390644
      disk_bytes: 2147483648
