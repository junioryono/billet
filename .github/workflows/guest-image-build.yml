# One machine's guest image, built and checked (ADR-022). guest-image.yml runs this once
# for x86_64 and once for aarch64, each on a builder of that machine, and alone signs and
# publishes what they hand it.
#
# A SEPARATE FILE, NOT A MATRIX, because a matrix's jobs share one set of outputs and the
# last to finish wins, and the publish job needs each leg's own artifact and its own
# result: x86_64 failing publishes nothing, and aarch64 failing carries its last good
# image forward.
#
# THE TREE IT CHECKS OUT IS THE RELEASE THE STABLE CHANNEL NAMES, resolved by the caller,
# so this file drives scripts from an older tree. The seam between them is frozen by a
# test. A leg on a tree from before the arm64 build fails, at the latest when that tree's
# image build refuses the machine, and the run goes on as it does for any failed arm64
# build.
name: Guest image build

on:
  workflow_call:
    inputs:
      machine:
        description: "The machine this leg builds for, as uname -m spells it"
        required: true
        type: string
      runs_on:
        description: "The builder's label: a tier of that machine with a large root disk"
        required: true
        type: string
      image_name:
        description: "What the build calls the image"
        required: true
        type: string
      suffix:
        description: "What every published name of this machine's carries: empty for x86_64, whose names every deployed reader reads"
        required: false
        default: ""
        type: string
      source_tag:
        description: "The release the tree comes from, or main"
        required: true
        type: string
      source_sha:
        description: "The commit of that tree"
        required: true
        type: string
      runner_version:
        description: "Actions runner version to bake in (blank: whatever github has published)"
        required: false
        default: ""
        type: string
    outputs:
      # THE ARTIFACT THIS ATTEMPT UPLOADED, by id: a rerun leaves an earlier
      # attempt's artifact of the same name on the run.
      artifact_id:
        description: "The checked image's artifact, as this attempt uploaded it"
        value: ${{ jobs.build.outputs.artifact_id }}

permissions: {}

jobs:
  build:
    name: Build and check
    # ON THE FLEET, because the runner-images build (#250) outgrew a hosted runner:
    # GitHub's image is about 59GB used, and the build holds it beside its
    # compressed copy and parts. A 16-vCPU guest with a large root disk holds that;
    # a hosted runner's 14GB free plus what reclaiming buys does not. The tier is
    # its own (320GiB disk) so everyday CI jobs do not grow a root that large. The
    # build boots the image under systemd-nspawn, which needs no KVM, so it runs on a
    # Firecracker guest and on an EC2 instance alike.
    runs-on: ${{ inputs.runs_on }}

    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

    permissions:
      # A MANUALLY SELECTED BRANCH RUNS ITS OWN BUILD SCRIPTS. It gets enough to
      # check itself out and nothing that can change the repository or mint an
      # identity accepted by the first-party signature policy.
      contents: read

    env:
      IMAGE_NAME: ${{ inputs.image_name }}
      SUFFIX: ${{ inputs.suffix }}
      # The raw image and the kernel are built here; PUBLISH=no keeps
      # build-guest-image.sh from wanting a Ceph cluster it cannot have.
      WORK: /var/tmp/billet-guest
      PUBLISH: "no"

    steps:
      # THE BUILD CHOOSES EVERYTHING FROM THE MACHINE IT RUNS ON, so a tier answering
      # with the other machine would publish that machine's image under this one's
      # names, and a node would refuse it only after pulling it.
      - name: Check the builder is this machine
        env:
          MACHINE: ${{ inputs.machine }}
        run: |
          set -euo pipefail

          if [ "$(uname -m)" != "$MACHINE" ]; then
            echo "this leg builds for $MACHINE and its builder is $(uname -m)" >&2
            exit 1
          fi

      - name: Check out the source release
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      # THE BUILD WANTS MOST OF THE BUILDER'S DISK: an 80 GiB image file, a kernel
      # source tree and the compressed outputs. Removing toolchains this build will
      # never use buys back space, and doing it FIRST means a disk-full failure
      # cannot happen halfway through a build that takes hours.
      - name: Reclaim runner disk
        run: |
          set -euo pipefail

          before=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules || true

          # EVERY TOOLCACHE ENTRY BUT PYTHON. A billet guest image from before the
          # passthrough moved to the system interpreter runs it on the toolcache's
          # Python; deleting that refused every later call to the results origin,
          # and this job's artifact upload failed with ECONNREFUSED after a
          # two-hour build (2026-10-04).
          if [ -d "$AGENT_TOOLSDIRECTORY" ]; then
            sudo find "$AGENT_TOOLSDIRECTORY" -mindepth 1 -maxdepth 1 ! -name Python \
              -exec rm -rf {} + || true
          fi

          sudo apt-get clean

          after=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')

          echo "reclaimed $((after - before))GB; ${after}GB free"

          # REFUSED EARLY RATHER THAN AT 90%. A build that runs out of disk while
          # writing the filesystem produces a corrupt image with a successful-
          # looking build behind it, because the write is the only step that would
          # have complained.
          #
          # THE FLOOR IS DERIVED FROM SIZE_MB RATHER THAN WRITTEN HERE. It was a
          # hard-coded 20, chosen when the image was 4GB; parity doubled the image
          # and left the number describing an image that no longer exists. Reading
          # it from the build script means one edit rather than two, and the two
          # cannot drift into a check that passes for an image it cannot hold.
          #
          # THE IMAGE, ITS COMPRESSED FORM AND ITS PARTS can all exist at once, so
          # the floor is the image and half again, plus a few GB for the kernel build
          # tree and the base tarball. There is no boot check's copy here any more:
          # a Firecracker guest has no KVM to boot one in (see below).
          size_mb=$(sed -n 's/^SIZE_MB="\${SIZE_MB:-\([0-9]*\)}"$/\1/p' \
            scripts/build-guest-image.sh)

          if [ -z "$size_mb" ]; then
            echo "could not read SIZE_MB out of scripts/build-guest-image.sh" >&2
            exit 1
          fi

          needed=$(( size_mb * 3 / 2 / 1024 + 6 ))

          if [ "$after" -lt "$needed" ]; then
            echo "only ${after}GB free; a ${size_mb}M image needs about ${needed}GB here" >&2
            echo "" >&2
            echo "This job builds an image, compresses it, and holds a kernel tree beside" >&2
            echo "both. The builder tier's disk is what provides that; see the ADR." >&2
            exit 1
          fi

          echo "${after}GB free, need about ${needed}GB for a ${size_mb}M image"

      - name: Install build dependencies
        run: |
          set -euo pipefail

          # debootstrap STAYS WHILE A BUILDABLE RELEASE STILL USES IT: this job
          # checks out the stable release's tree, whose build script may be the
          # debootstrap one until a release carries the runner-images build.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            systemd-container xz-utils debootstrap e2fsprogs jq zstd unzip \
            build-essential flex bison libelf-dev libssl-dev bc \
            dnsmasq

      # THE KERNEL IS CACHED ON ITS OWN INPUTS AND ITS MACHINE, not rebuilt weekly. It changes
      # when its config or its version changes and at no other time, so keying the
      # cache on exactly those two makes a normal week's build twenty minutes
      # shorter — and makes the kernel a bit-for-bit constant across the
      # generations that share it, rather than a fresh build each time whose
      # differences nobody can account for.
      #
      # THE BUILT CONFIG IS CACHED BESIDE THE KERNEL, and it is not a nicety: the
      # gate below reads it, and on a cache hit the build script never runs to
      # produce one. It is also the only honest thing to check — `make
      # olddefconfig` derives it from the committed base, so the base is where
      # the build starts rather than what it built.
      - name: Kernel cache
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: |
            out/vmlinux-billet
            out/vmlinux-billet.config
          key: guest-kernel-${{ inputs.machine }}-${{ hashFiles('scripts/guest-kernel.config', 'scripts/guest-kernel-aarch64.config', 'scripts/build-guest-kernel.sh', 'scripts/kernel/required-builtins.txt', 'scripts/kernel/required-builtins-aarch64.txt', 'scripts/kernel/linux.pin') }}

      - name: Build the guest kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail

          mkdir -p out

          # OUT IS A DIRECTORY, and the script writes $OUT/vmlinux-billet into
          # it alongside the config it was built from. Passing a FILE path here
          # would create a directory of that name and hide the kernel inside it,
          # which the cache would then happily preserve.
          sudo --preserve-env=OUT scripts/build-guest-kernel.sh
        env:
          OUT: ${{ github.workspace }}/out

      # THE KERNEL GATE, AND IT RUNS ON A CACHE HIT TOO. build-guest-kernel.sh runs
      # it as well, which covers a hand-run build — but that step is SKIPPED when
      # the cache hits, and actions/cache saves in its post step even when a later
      # step failed. So a kernel that failed the gate can be restored on the next
      # run and, without this, publish without ever being checked again.
      #
      # BEFORE THE ROOT FILESYSTEM, which is an hour. A kernel that cannot run
      # docker makes every image built on top of it useless.
      - name: Check the guest kernel config
        run: |
          set -euo pipefail

          scripts/check-guest-kernel-config.sh out/vmlinux-billet.config

      - name: Build the root filesystem
        run: |
          set -euo pipefail

          sudo --preserve-env=IMAGE_NAME,WORK,PUBLISH,RUNNER_VERSION \
            scripts/build-guest-image.sh
        env:
          RUNNER_VERSION: ${{ inputs.runner_version }}

      # COMPRESSED AFTER THE BUILD, NOT DURING. The digest a consumer checks is of
      # the published bytes, so the compressed file is the artifact and its hash is
      # computed once, here, over exactly what will be uploaded.
      - name: Pack and describe
        id: pack
        run: |
          set -euo pipefail

          mkdir -p out

          sudo chown "$(id -u):$(id -g)" "$WORK/$IMAGE_NAME.ext4"

          # THE SOURCE MANIFEST THE IMAGE CARRIES, published beside it (#584).
          cp "$WORK/image-sources.tsv" "out/image-sources$SUFFIX.tsv"

          # THE KERNEL UNDER THE NAME THE MANIFEST WILL GIVE IT: the build and the
          # cache call it vmlinux-billet on every machine.
          if [ -n "$SUFFIX" ]; then
            cp out/vmlinux-billet "out/vmlinux-billet$SUFFIX"
          fi

          # THE DEFAULT WINDOW, DELIBERATELY. `--long=27` compresses a little
          # better and requires every DECOMPRESSOR to allocate a 128 MB window --
          # a constraint on every future reader, including Go libraries that cap
          # the window by default and would fail on an image that packed fine on
          # the machine that made it. The few percent is not worth an asymmetry
          # that only shows up on somebody else's node.
          zstd -19 -T0 --force \
            -o "out/rootfs$SUFFIX.img.zst" "$WORK/$IMAGE_NAME.ext4"

          # SPLIT ONLY IF IT MUST BE. A release asset must be under 2 GiB and a
          # parity-sized image packs past that. An image that fits stays one
          # asset and is described as schema 1, which every already deployed
          # billet can read; only one that had to be split needs a newer reader.
          ROOTFS_PARTS=$(scripts/split-image.sh "out/rootfs$SUFFIX.img.zst")
          export ROOTFS_PARTS

          if [ -n "$ROOTFS_PARTS" ]; then
            echo "split into $(printf '%s\n' "$ROOTFS_PARTS" | wc -l) parts:"
            printf '%s\n' "$ROOTFS_PARTS"
          fi

          # THE MANIFEST IS WRITTEN WHILE THE WHOLE FILE STILL EXISTS. Its
          # load-bearing field is the digest of the reassembled image, which is
          # what a node checks after joining the parts back together -- so it has
          # to be taken from the unsplit artifact and can never be derived from
          # the pieces.
          scripts/write-image-manifest.sh > "out/manifest$SUFFIX.json"

          # ONLY THEN DOES THE WHOLE FILE GO. Keeping it would double the artifact
          # handoff and the publish job's disk for a file nothing uploads: a
          # release carries the parts.
          if [ -n "$ROOTFS_PARTS" ]; then
            rm -f "out/rootfs$SUFFIX.img.zst"
          fi

          cat "out/manifest$SUFFIX.json"

          # THE NOTES ARE BUILT FROM THE MANIFEST, so they cannot describe an
          # image other than the one being published. An earlier version passed
          # --notes-file for a file nothing wrote, which fails the publish step
          # after the whole build has already run.
          {
            echo "Guest image for billet's firecracker backend."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | \`$(jq -r .runner_version "out/manifest$SUFFIX.json")\` |"
            echo "| Kernel | \`$(jq -r .kernel.version "out/manifest$SUFFIX.json")\` |"
            echo "| Guest contract | \`$(jq -r .guest_contract "out/manifest$SUFFIX.json")\` |"
            echo "| Architecture | \`$(jq -r .arch "out/manifest$SUFFIX.json")\` |"
            echo "| Built | $(jq -r .built_at "out/manifest$SUFFIX.json") |"
            echo "| Built from | \`$SOURCE_TAG\` (\`$SOURCE_SHA\`) |"
            echo
            echo "Pulled by \`billet images pull\`, which verifies the manifest"
            echo "signature and each asset's digest before anything reaches the cluster."
            echo
            echo "The corresponding source of what this image carries under a GNU license"
            echo "is published with it: \`image-sources$SUFFIX.tar\` (in the parts"
            echo "\`image-sources$SUFFIX.parts\` lists, joined in order) holds every source package"
            echo "\`image-sources$SUFFIX.tsv\` marks \`gnu\` or \`unclassified\`, at its exact"
            echo "version, and the Linux tarball and configuration the kernel was built"
            echo "from; \`image-sources$SUFFIX-index.tsv\` lists each file with its sha256. The"
            echo "scripts that built the image are this repository at \`$SOURCE_SHA\`."
          } > "out/release-notes$SUFFIX.md"
        env:
          KERNEL: ${{ github.workspace }}/out/vmlinux-billet${{ inputs.suffix }}
          ROOTFS: ${{ github.workspace }}/out/rootfs${{ inputs.suffix }}.img.zst
          SOURCE_TAG: ${{ inputs.source_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}

      # THE CORRESPONDING SOURCE OF WHAT THE IMAGE REDISTRIBUTES, published beside it
      # (#584, ADR-019): every source package the image's source manifest marks gnu or
      # unclassified, at its exact version, and the Linux tarball and configuration
      # the kernel was built from. A source that cannot be fetched and verified fails
      # the build, because a published image without its source is what this
      # prevents. One tar, split as the image is, because a release holds a thousand
      # assets and the sources are more files than that; the parts list carries each
      # part's digest for the publisher to check.
      - name: Fetch the corresponding source
        run: |
          set -euo pipefail

          python3 scripts/fetch-image-sources.py "out/image-sources$SUFFIX.tsv" \
            "$(jq -r .kernel.version "out/manifest$SUFFIX.json")" out/vmlinux-billet.config sources
          cp sources/index.tsv "out/image-sources$SUFFIX-index.tsv"
          tar -C sources -cf "out/image-sources$SUFFIX.tar" .
          rm -rf sources

          # THE WHOLE ARCHIVE FIRST, its sha256 and size, then each part with its
          # sha256: the publisher joins the parts and holds them to the whole.
          printf 'image-sources%s.tar %s %s\n' "$SUFFIX" "$(sha256sum "out/image-sources$SUFFIX.tar" | cut -d ' ' -f 1)" \
            "$(stat -c %s "out/image-sources$SUFFIX.tar")" >"out/image-sources$SUFFIX.parts"
          parts=$(scripts/split-image.sh "out/image-sources$SUFFIX.tar")
          if [ -n "$parts" ]; then
            rm -f "out/image-sources$SUFFIX.tar"
            while IFS= read -r part; do
              printf '%s %s\n' "${part##*/}" "$(sha256sum "$part" | cut -d ' ' -f 1)" >>"out/image-sources$SUFFIX.parts"
            done <<<"$parts"
          fi
          cat "out/image-sources$SUFFIX.parts"

      # THE RELEASE GATE. Nothing below this runs against an image that fails it.
      #
      # AN IMAGE THAT REACHES A RELEASE IS ONE EVERY DEPLOYMENT PULLS, and a bad one
      # is not a local problem: it fans out to everybody on the next refresh, and
      # the thing that would rebuild it is itself a guest booting the image. So the
      # question "is this fit to publish" is asked here, before the upload, rather
      # than discovered afterwards by somebody whose jobs stopped working.
      #
      # IT CHECKS CONTENTS, NOT BOOT. It cannot see an integration failure -- a
      # kernel missing an option the userspace needs, systemd failing to bring up
      # the network. What it catches is the silent class: a build step that failed
      # in a way `set -e` did not notice, a tarball unpacked to the wrong place, an
      # agent never installed, a unit present but not enabled. Those produce an
      # image that boots perfectly and then does nothing, which is the hardest kind
      # to diagnose from outside.
      #
      # The manifest is passed so the two can be cross-checked: an image whose agent
      # speaks a different contract than the manifest advertises would be accepted
      # by a node on the manifest's word and then produce microVMs that boot and
      # never report.
      - name: Check the image is fit to publish
        run: |
          set -euo pipefail

          # SOURCES_EXPORT: the copy of the image's source manifest the release
          # carries, which the gate holds to the image's own byte for byte.
          sudo SOURCES_EXPORT="$GITHUB_WORKSPACE/out/image-sources$SUFFIX.tsv" \
            scripts/check-guest-image.sh \
            "$WORK/$IMAGE_NAME.ext4" \
            "$GITHUB_WORKSPACE/out/manifest$SUFFIX.json"

      # THE BOOT IS PROVED ON THE FLEET, NOT HERE. This job runs in a Firecracker
      # guest, which has no KVM to boot another in, so the Firecracker boot this job
      # used to make on a hosted runner cannot happen here. What proves a generation
      # boots is what always decided whether the fleet uses it: `billet images pull
      # --verify` on a node boots it, on a disk grown the way a launch grows one,
      # and only a generation that passes becomes @verified. One that does not is
      # published and never promoted, and the next reap removes it.
      #
      # The gate above still runs on the image's contents here, before anything is
      # uploaded.

      # THE BUILD JOB CANNOT PUBLISH. Its one handoff is an ordinary workflow
      # artifact; the privileged job in guest-image.yml consumes it only when this exact
      # run is main and publication was requested. Manual inspection uses the same bytes.
      - name: Upload the checked image
        id: upload
        # always() SO A FAILED GATE STILL HANDS OVER THE ARTIFACT. Without it, the
        # one run where somebody most wants to open the image -- the one that just
        # refused to publish it -- is the run that uploads nothing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guest-image${{ inputs.suffix }}
          # A GLOB FOR THE ROOT FILESYSTEM, because it is one file or several
          # depending on whether it had to be split, and naming only
          # rootfs.img.zst silently handed the publish job an artifact with no
          # image in it -- which fails at the upload, after the whole build.
          # publish-guest-release.sh derives what it uploads from the manifest
          # and refuses a named asset that is not there, so a glob that matched
          # nothing is caught rather than published.
          path: |
            out/manifest${{ inputs.suffix }}.json
            out/release-notes${{ inputs.suffix }}.md
            out/image-sources${{ inputs.suffix }}.tsv
            out/image-sources${{ inputs.suffix }}-index.tsv
            out/image-sources${{ inputs.suffix }}.parts
            out/image-sources${{ inputs.suffix }}.tar*
            out/rootfs${{ inputs.suffix }}.img.zst*
            out/vmlinux-billet${{ inputs.suffix }}
          # SHORT, because these are hundreds of megabytes and the default is
          # ninety days. On a private repository that is billed storage against a
          # quota this would exhaust within a month.
          retention-days: 3
          # The root filesystem is already zstd-compressed. Compressing it again
          # spends runner minutes and produces no useful size reduction.
          compression-level: 0
