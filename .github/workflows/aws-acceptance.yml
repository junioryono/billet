name: aws-acceptance
# billet's acceptance matrix on AWS (#554), in two lanes, one after the other on the one
# acceptance host. The ec2 lane stands a deployment built from this commit up beside the
# host's node and runs every cell the matrix declares on per-job EC2. The pool lane (#829)
# stands up a control plane with no node of its own whose pool rents an AWS metal host
# on demand, runs the same cells on the pool's Firecracker tier, and keeps the control
# plane up after them for the pool to release the host itself; its teardown ends any host
# the pool did not release. `billet acceptance matrix judge` judges each lane's cells, and
# the pool's burst and idle shrink, from the ledger. Any failed cell or scenario, or one
# that should have run on a backend and architecture the lane covered and did not, fails
# the lane.
#
# What it needs lives in the `acceptance` environment, which only main and release/* may
# deploy to, and nothing here names the account:
#   secrets ACCEPTANCE_ROLE_ARN     the role this job assumes through GitHub's OIDC provider
#           ACCEPTANCE_ACCOUNT      the account that role is in, asserted by `acceptance up`
#           ACCEPTANCE_APP_KEY      the acceptance App's private key: the App the deployment
#                                   runs with, holding exactly what billet requests
#           ACCEPTANCE_DISPATCH_KEY the dispatch App's private key: a second App, installed on
#                                   ACCEPTANCE_REPO alone with contents: read and actions:
#                                   write, because `billet check` refuses a runner App that
#                                   holds a permission billet never requested (2026-09-04)
#   vars    ACCEPTANCE_DISPATCH_APP_ID the dispatch App's id
#           ACCEPTANCE_REPO         owner/name of the repository the acceptance App serves,
#                                   holding the matrix's workflows; the runner group the base
#                                   config's tiers use must admit it (2026-09-04)
#           ACCEPTANCE_REGION       the region of everything below
#           ACCEPTANCE_HOST         the acceptance host's instance id
#           ACCEPTANCE_HOST_ROLE    the host's role name, which each run's node policy is put on
#           ACCEPTANCE_POOL_HOST_ROLE the pool hosts' role name, which the pool lane's hosts'
#                                   policy is put on
#           ACCEPTANCE_KMS_KEY_ARN  the site store's key
#           ACCEPTANCE_BUCKET       the bucket a run's binary and evidence travel through
# The host is prepared once (docs/reference/records/aws-acceptance.md says how): a base
# config at /srv/billet-accept/base.yaml whose App key path is /srv/billet-accept/app.pem,
# which each run writes and removes, and the pool lane's at /srv/billet-accept/pool.yaml.
on:
  workflow_dispatch:
    inputs:
      archs:
        description: the architectures to cover, comma-separated
        required: false
        default: x64
  schedule:
    - cron: "17 9 * * 1"
permissions:
  contents: read
  id-token: write
concurrency:
  group: aws-acceptance
  cancel-in-progress: false
jobs:
  matrix:
    name: matrix (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    environment: acceptance
    # ONE LANE AT A TIME: both hold the one acceptance host, and each lane's teardown
    # releases it before the next takes it. A lane that failed does not stop the other.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lane: [ec2, pool]
    # THE BUDGET, inside GitHub's six hours for a hosted job: the host's run waits 210
    # minutes for its jobs, 20 more for its compute barrier and 5 for each service's stop
    # (SSM gives it 250), then the judge (15) and the teardown (`stopped` and `down`, at
    # most 30 and 40). Five dispatch phases of at most 45 minutes each (images, cold, warm,
    # and each architecture's two-writer runs) can outlast the host's wait; a run that
    # does fails its phase or its jobs' count, and never passes.
    timeout-minutes: 360
    env:
      LANE: ${{ matrix.lane }}
      # THE POOL ORDERS EACH ARCHITECTURE ITS BASE CONFIG NAMES, one host of each.
      ARCHS: ${{ matrix.lane == 'pool' && 'x64,arm64' || inputs.archs || 'x64' }}
      BACKEND: ${{ matrix.lane == 'pool' && 'firecracker/aws-metal' || 'ec2' }}
      RUN: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      AWS_REGION: ${{ vars.ACCEPTANCE_REGION }}
      HOST: ${{ vars.ACCEPTANCE_HOST }}
      REPO: ${{ vars.ACCEPTANCE_REPO }}
      BUCKET: ${{ vars.ACCEPTANCE_BUCKET }}
      HOST_ROLE: ${{ vars.ACCEPTANCE_HOST_ROLE }}
      POOL_HOST_ROLE: ${{ vars.ACCEPTANCE_POOL_HOST_ROLE }}
      RUN_DIR: /srv/billet-accept/runs/${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      # A POOL HOST HALTS ITSELF THIS LONG AFTER IT BOOTS, whatever the lane does: a
      # halted metal instance bills no compute. Longer than the lane's own six hours.
      POOL_HOST_LIFETIME_MINUTES: "390"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build billet for the host, and the pool hosts' collection and prelude
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/billet ./cmd/billet
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/billet-arm64 ./cmd/billet
          tar -czf dist/collection.tar.gz ansible_collections
          cp ansible_collections/junioryono/billet/examples/pool-host-prelude/prelude.sh dist/prelude-template.sh
      - id: repo
        name: Name the repository the App serves, and the tiers to cover
        run: |
          set -euo pipefail
          case "$REPO" in
          */*) ;;
          *) echo "ACCEPTANCE_REPO is \"$REPO\", not owner/name" >&2; exit 1 ;;
          esac
          jobs=$(dist/billet acceptance matrix jobs --archs "$ARCHS")
          {
            echo "owner=${REPO%%/*}"
            echo "name=${REPO#*/}"
            echo "jobs=$jobs"
          } >>"$GITHUB_OUTPUT"
      - id: check-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: The repository runs the workflows this commit reviewed
        env:
          GH_TOKEN: ${{ steps.check-token.outputs.token }}
        run: scripts/acceptance/matrix-workflows-match.sh "$REPO"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.ACCEPTANCE_REGION }}
          role-session-name: billet-acceptance-${{ github.run_id }}
          # LONGER THAN THE RUN: the host's run may take 250 minutes, and polling SSM
          # after the session ended would leave the host running. The judge and the
          # teardown take a session of their own.
          role-duration-seconds: 18000
      - id: hold
        name: Hold the host for this run
        run: |
          set -uo pipefail
          # THE HOST IS HELD FOR THE LENGTH OF THE RUN, and taken in one step: a put that
          # refuses to overwrite is the one answer to whether another run holds it. Every
          # later step that touches the host runs only when this one succeeded, so a run
          # refused here leaves a held host as it found it. The hold is released only
          # once this run's teardown finished; a run left for a person keeps it, and the
          # person deletes /billet-acceptance/held once the teardown is done.
          if err=$(aws ssm put-parameter --name /billet-acceptance/held --type String --value "$RUN" \
            --no-overwrite 2>&1 >/dev/null); then
            exit 0
          fi
          # AN ANSWER LOST AFTER THE PUT LANDED is this run's hold all the same.
          if held=$(aws ssm get-parameter --name /billet-acceptance/held --query Parameter.Value \
            --output text 2>&1) && [ "$held" = "$RUN" ]; then
            exit 0
          fi
          case "$err" in
          *ParameterAlreadyExists*)
            echo "run $held holds the host $HOST, or was left for a person to finish its teardown;" \
              "delete /billet-acceptance/held once it is done" >&2
            ;;
          *) echo "could not tell whether another run holds the host: $err" >&2 ;;
          esac
          exit 1
      - name: Send this run's binary and scripts
        run: |
          set -euo pipefail
          for f in dist/billet dist/billet-arm64 dist/collection.tar.gz dist/prelude-template.sh scripts/acceptance/matrix-host.sh \
            scripts/acceptance/matrix-supervise.py; do
            aws s3 cp --only-show-errors "$f" "s3://$BUCKET/runs/$RUN/$(basename "$f")"
          done
      - name: Hand the host the App's key through Parameter Store
        env:
          KEY: ${{ secrets.ACCEPTANCE_APP_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" >"$key"
          aws ssm put-parameter --name "/billet-acceptance/runs/$RUN/app-key" --type SecureString \
            --value "file://$key" --no-overwrite >/dev/null
      - name: Start the acceptance host
        run: |
          set -euo pipefail
          aws ec2 start-instances --instance-ids "$HOST" >/dev/null
          aws ec2 wait instance-running --instance-ids "$HOST"
          for _ in $(seq 60); do
            ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$HOST" \
              --query 'InstanceInformationList[0].PingStatus' --output text)
            if [ "$ping" = Online ]; then exit 0; fi
            sleep 10
          done
          echo "the host's SSM agent never came online" >&2
          exit 1
      - id: prepare
        name: Stand the deployment up
        env:
          ACCOUNT: ${{ secrets.ACCEPTANCE_ACCOUNT }}
          KMS_KEY_ARN: ${{ vars.ACCEPTANCE_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          if [ "$LANE" = pool ]; then
            # THE POOL'S WIRE IS THE HOST'S OWN ADDRESS, on the ports the control plane's
            # security group opens to the pool hosts (enrollment) and to the VPC (the wire).
            ip=$(aws ec2 describe-instances --instance-ids "$HOST" \
              --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
            stand="runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' prelude '$RUN_DIR' /srv/billet-accept/pool.yaml '$ip:7717' '$BUCKET' '$AWS_REGION' '$RUN' '$POOL_HOST_LIFETIME_MINUTES'
          runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' prepare-pool '$RUN_DIR' /srv/billet-accept/pool.yaml '$ACCOUNT' '$ip:7717' '$ip:7718' 'arn:aws:iam::$ACCOUNT:role/$POOL_HOST_ROLE'"
            files="tiers deployment iam.json pool-host.json teardown.json"
          else
            stand="runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' prepare '$RUN_DIR' /srv/billet-accept/base.yaml '$ACCOUNT' '$KMS_KEY_ARN'"
            files="tiers deployment iam.json teardown.json"
          fi
          scripts/acceptance/ssm-run.sh run "$HOST" 900 "set -eu
          mkdir -p '$RUN_DIR'
          for f in billet billet-arm64 matrix-host.sh matrix-supervise.py collection.tar.gz prelude-template.sh; do
            aws s3 cp --only-show-errors \"s3://$BUCKET/runs/$RUN/\$f\" \"$RUN_DIR/\$f\"
          done
          chmod 0755 '$RUN_DIR/billet'
          (umask 077; aws ssm get-parameter --name '/billet-acceptance/runs/$RUN/app-key' --with-decryption \
            --query Parameter.Value --output text >/srv/billet-accept/app.pem)
          chown -R ubuntu: '$RUN_DIR' /srv/billet-accept/app.pem
          $stand
          for f in $files; do aws s3 cp --only-show-errors \"$RUN_DIR/\$f\" \"s3://$BUCKET/runs/$RUN/\$f\"; done"
          mkdir -p out
          for f in $files; do
            aws s3 cp --only-show-errors "s3://$BUCKET/runs/$RUN/$f" "out/$f"
          done
      - name: Grant the node its policy, scoped to this run's deployment
        run: |
          set -euo pipefail
          aws iam put-role-policy --role-name "$HOST_ROLE" \
            --policy-name "billet-matrix-$RUN" --policy-document file://out/iam.json
          # AND THE POOL'S HOSTS THEIRS, before the pool orders one, with the read of this
          # run's own artifacts its prelude fetches billet and the collection by: the role
          # carries nothing of its own but the SSM agent's, and its boundary only permits
          # the read, so without the grant every fetch is refused and the prelude ends
          # before the join (run 42840609317, 2026-11-10).
          if [ "$LANE" = pool ]; then
            jq --arg r "arn:aws:s3:::$BUCKET/runs/$RUN/*" \
              '.Statement += [{Sid: "BilletMatrixRunArtifacts", Effect: "Allow", Action: ["s3:GetObject"], Resource: [$r]}]' \
              out/pool-host.json >out/pool-host-run.json
            aws iam put-role-policy --role-name "$POOL_HOST_ROLE" \
              --policy-name "billet-matrix-$RUN" --policy-document file://out/pool-host-run.json
          fi
          # IAM is eventually consistent: a grant can take seconds to reach EC2's checks.
          sleep 20
      - id: host-run
        name: Start the deployment on the host
        run: |
          set -euo pipefail
          # DISPATCHED AT ONCE AFTER THIS, though the deployment's scale sets exist only
          # once its server has started: a job queued on a label before its scale set
          # existed was assigned when the control plane came up (2026-09-04).
          # ITS DEADLINE IS ON THE CLOCK FROM HERE: SSM ends the command 15000 seconds
          # after it is sent, and the wait below waits only for what is left of that
          # (ssm-run.sh adds its own grace to whatever it is given).
          # A POOL'S RUN WAITS AFTER ITS JOBS for the pool to release its host itself, which
          # its idle_after (20 minutes) and a drain's proof (5) bound.
          released=""
          if [ "$LANE" = pool ]; then released=40m; fi
          sent=$(date +%s)
          id=$(scripts/acceptance/ssm-run.sh send "$HOST" 15000 \
            "runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' run '$RUN_DIR' '${{ steps.repo.outputs.jobs }}' $released")
          {
            echo "id=$id"
            echo "deadline=$((sent + 15000))"
          } >>"$GITHUB_OUTPUT"
      - id: labels
        name: Name each covered architecture's tier
        run: |
          set -euo pipefail
          labels=""
          for arch in ${ARCHS//,/ }; do
            label=$(awk -v b="$BACKEND" -v a="$arch" '$1 == b && $2 == a { print $3 }' out/tiers)
            if [ -z "$label" ]; then
              echo "the deployment has no $BACKEND $arch tier of its own for the matrix" >&2
              exit 1
            fi
            labels="$labels $label"
            echo "label_$arch=$label" >>"$GITHUB_OUTPUT"
          done
          echo "labels=$labels" >>"$GITHUB_OUTPUT"
          : >out/runs
      - id: images-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the image store's runs, alone on each tier, and wait for them
        if: ${{ env.LANE == 'ec2' }}
        env:
          GH_TOKEN: ${{ steps.images-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh images "$REPO" "$RUN" out/runs "${labels[@]}"
      # A POOL'S TIER HAS NO HOST UNTIL ITS FIRST JOB ASKS FOR ONE, and a host takes about
      # 45 minutes to boot, join and import the guest image, so the image store's cold run
      # is sent, waited for under a token and a deadline of its own, and then the warm one.
      - name: Send the image store's cold runs to the pool, which orders a host for them
        if: ${{ env.LANE == 'pool' }}
        env:
          GH_TOKEN: ${{ steps.images-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh images-cold "$REPO" "$RUN" out/runs "${labels[@]}"
      - id: host-token
        if: ${{ env.LANE == 'pool' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Wait for the pool's host to boot, join and run them
        if: ${{ env.LANE == 'pool' }}
        env:
          GH_TOKEN: ${{ steps.host-token.outputs.token }}
          MATRIX_TIMEOUT: "3300"
        run: scripts/acceptance/matrix-dispatch.sh await "$REPO" "$RUN" out/runs -
      - id: images-warm-token
        if: ${{ env.LANE == 'pool' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the image store's warm runs to the pool, and wait for them
        if: ${{ env.LANE == 'pool' }}
        env:
          GH_TOKEN: ${{ steps.images-warm-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh images-warm "$REPO" "$RUN" out/runs "${labels[@]}"
      - id: cold-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the cold runs, and wait for them
        env:
          GH_TOKEN: ${{ steps.cold-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh cold "$REPO" "$RUN" out/runs "${labels[@]}"
      - id: warm-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the warm runs, and wait for every run
        env:
          GH_TOKEN: ${{ steps.warm-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh warm "$REPO" "$RUN" out/runs "${labels[@]}"
      # THE TWO-WRITER RUNS LAST, ONE ARCHITECTURE AT A TIME, each with a token and a
      # deadline of its own: each writer a holds a runner while it waits for its writer b,
      # so they run with nothing else on the deployment, and two architectures' at once
      # could hold every slot of the one node.
      #
      # A POOL'S, BOTH AT ONCE: each architecture's tier is placed only on its own
      # architecture's host, so neither holds a slot the other could use, and one waiting
      # for the other would leave its host idle past server.pool.idle_after, to be
      # released and ordered again mid-run.
      - id: writers-pool-token
        if: ${{ env.LANE == 'pool' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch every architecture's two-writer runs to the pool at once, and wait for them
        if: ${{ env.LANE == 'pool' }}
        env:
          GH_TOKEN: ${{ steps.writers-pool-token.outputs.token }}
          LABELS: ${{ steps.labels.outputs.labels }}
        run: |
          set -euo pipefail
          read -r -a labels <<<"$LABELS"
          scripts/acceptance/matrix-dispatch.sh writers-apart "$REPO" "$RUN" out/runs "${labels[@]}"
      - id: writers-x64-token
        if: ${{ env.LANE == 'ec2' && steps.labels.outputs.label_x64 != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the x64 two-writer runs, alone on the deployment, and wait for them
        if: ${{ env.LANE == 'ec2' && steps.labels.outputs.label_x64 != '' }}
        env:
          GH_TOKEN: ${{ steps.writers-x64-token.outputs.token }}
          LABEL: ${{ steps.labels.outputs.label_x64 }}
        run: scripts/acceptance/matrix-dispatch.sh writers "$REPO" "$RUN" out/runs "$LABEL"
      - id: writers-arm64-token
        if: ${{ env.LANE == 'ec2' && steps.labels.outputs.label_arm64 != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.ACCEPTANCE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.ACCEPTANCE_DISPATCH_KEY }}
          owner: ${{ steps.repo.outputs.owner }}
          repositories: ${{ steps.repo.outputs.name }}
      - name: Dispatch the arm64 two-writer runs, alone on the deployment, and wait for them
        if: ${{ env.LANE == 'ec2' && steps.labels.outputs.label_arm64 != '' }}
        env:
          GH_TOKEN: ${{ steps.writers-arm64-token.outputs.token }}
          LABEL: ${{ steps.labels.outputs.label_arm64 }}
        run: scripts/acceptance/matrix-dispatch.sh writers "$REPO" "$RUN" out/runs "$LABEL"
      # A FAILED OR CANCELLED DISPATCH STOPS THE HOST'S RUN rather than leave it waiting
      # out --wait for jobs nobody sent; the wait below then joins it, and the judge
      # refuses a run with no recorded exit. Asked whether or not the run's command id
      # was recorded, because a run SSM accepted before the step that sent it failed is
      # still a run; the teardown's `down` waits for it too.
      - name: Stop the host's run early
        if: ${{ (failure() || cancelled()) && steps.hold.outcome == 'success' }}
        run: |
          scripts/acceptance/ssm-run.sh run "$HOST" 120 "runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' stop '$RUN_DIR'"
      # CANCELLABLE, unlike the steps around it: a cancel while the run is going stops
      # waiting, and the step after asks the run to stop, so the teardown is reached
      # without first waiting out the run. A job GitHub ends before the teardown finishes
      # leaves the host held by this run, for a person.
      - name: Wait for the host's run, which writes the evidence and stops its services
        if: ${{ !cancelled() && steps.host-run.outputs.id != '' }}
        env:
          DEADLINE: ${{ steps.host-run.outputs.deadline }}
        run: |
          set -euo pipefail
          left=$((DEADLINE - $(date +%s)))
          if [ "$left" -lt 1 ]; then left=1; fi
          scripts/acceptance/ssm-run.sh wait "$HOST" "${{ steps.host-run.outputs.id }}" "$left"
      - name: Stop the host's run, the job being cancelled
        if: ${{ cancelled() && steps.hold.outcome == 'success' }}
        run: |
          scripts/acceptance/ssm-run.sh run "$HOST" 120 "runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' stop '$RUN_DIR'"
      # A SESSION OF ITS OWN FOR THE JUDGE AND THE TEARDOWN, as long as the first: the
      # teardown may wait for the run twice (`stopped`, then `down`) before it can say
      # what it left, and the first session may be near its end by now.
      - uses: aws-actions/configure-aws-credentials@v4
        if: ${{ always() && steps.hold.outcome == 'success' }}
        with:
          role-to-assume: ${{ secrets.ACCEPTANCE_ROLE_ARN }}
          aws-region: ${{ vars.ACCEPTANCE_REGION }}
          role-session-name: billet-acceptance-${{ github.run_id }}-down
          role-duration-seconds: 18000
      - name: Judge the cells
        if: ${{ always() && steps.host-run.outputs.id != '' }}
        run: |
          set -euo pipefail
          aws s3 cp --only-show-errors out/runs "s3://$BUCKET/runs/$RUN/runs"
          status=0
          scripts/acceptance/ssm-run.sh run "$HOST" 900 "aws s3 cp --only-show-errors 's3://$BUCKET/runs/$RUN/runs' '$RUN_DIR/runs'
          chown ubuntu: '$RUN_DIR/runs'
          runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' judge '$RUN_DIR' '$ARCHS' '$RUN_DIR/runs' '$REPO' '$BACKEND'
          judged=\$?
          aws s3 cp --only-show-errors --recursive '$RUN_DIR/out' 's3://$BUCKET/runs/$RUN/out' || judged=1
          exit \$judged" || status=$?
          aws s3 cp --only-show-errors --recursive "s3://$BUCKET/runs/$RUN/out" out/ || status=1
          if [ -f out/matrix.txt ]; then
            { echo "## Acceptance matrix: the $LANE lane"; echo; echo '```'; cat out/matrix.txt; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: acceptance-matrix-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            out/matrix.json
            out/matrix.txt
            out/evidence.json
            out/run.log
            out/runs
          if-no-files-found: ignore
      - name: Take everything down
        if: ${{ always() && steps.hold.outcome == 'success' }}
        env:
          PREPARED: ${{ steps.prepare.outcome }}
        run: |
          set -uo pipefail
          status=0
          # ABSENT IS DONE; ANY OTHER FAILURE IS SAID AND FAILS THE RUN, and every step
          # below is still tried.
          gone() {
            local what=$1 absent=$2
            shift 2
            local err
            if err=$("$@" 2>&1 >/dev/null); then return 0; fi
            case "$err" in *"$absent"*) return 0 ;; esac
            echo "could not remove $what: $err" >&2
            status=1
          }
          down=0
          # DECOMMISSION DELETES WHAT THE NODE'S OWN POLICY NEVER MAY: this deployment's
          # cache state objects, which billet's rendered policy keeps from the credential
          # that evicts (site-acceptance.md, 2026-11-06). The teardown alone is granted
          # their delete, as `billet acceptance matrix teardown-policy` renders it for this
          # deployment's own state prefix, and only once no run lives on the host, so no
          # live node ever holds it; `down` is the run's one teardown (`run` is sent
          # --no-teardown).
          # NOTHING WAS DEPLOYED when the step that stands the deployment up never ran:
          # there is no deployment to take down, and nothing it could leave.
          if [ "$PREPARED" = skipped ]; then
            echo "the deployment was never stood up; nothing of it to take down"
          else
            if [ -s out/teardown.json ]; then
              if ! scripts/acceptance/ssm-run.sh run "$HOST" 2400 "runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' stopped '$RUN_DIR'"; then
                echo "the host's run is still live, so the teardown's delete is not granted beside it" >&2
                status=1
              elif aws iam put-role-policy --role-name "$HOST_ROLE" \
                --policy-name "billet-matrix-$RUN-down" --policy-document file://out/teardown.json; then
                # IAM is eventually consistent; a delete refused for it fails `down`, which
                # holds the host for a person rather than leave anything unsaid.
                sleep 20
              else
                echo "could not grant the teardown its delete; this deployment's cache state may be left" >&2
                status=1
              fi
            fi
            # THE KEY GOES ONLY WITH THE DEPLOYMENT: a run still tearing down needs it to
            # delete its scale sets. A pool's teardown also waits for EC2 to say every
            # host it ended is terminated, which can take most of 40 minutes.
            downwait=2400
            if [ "$LANE" = pool ]; then downwait=5400; fi
            if ! scripts/acceptance/ssm-run.sh run "$HOST" "$downwait" "runuser -u ubuntu -- bash '$RUN_DIR/matrix-host.sh' down '$RUN_DIR' || exit \$?
            rm -f /srv/billet-accept/app.pem"; then
              echo "the deployment may not be down: its workspace is $RUN_DIR on $HOST" >&2
              status=1
              down=1
            fi
          fi
          # WHAT A RUN STILL TEARING DOWN NEEDS IS LEFT WITH IT, beside the host: its
          # node policy, which is what lets it destroy its instances, and its App key
          # and that key's parameter, which its GitHub teardown reads. A person ends
          # them with the teardown.
          if [ "$down" -ne 0 ]; then
            echo "left for a person to finish the teardown in $RUN_DIR on $HOST, which is left running:" >&2
            echo "  the policies billet-matrix-$RUN and billet-matrix-$RUN-down on $HOST_ROLE, billet-matrix-$RUN on" >&2
            echo "  $POOL_HOST_ROLE for the pool lane, /srv/billet-accept/app.pem on the host," >&2
            echo "  and the parameter /billet-acceptance/runs/$RUN/app-key" >&2
            # AND THE HOST STAYS HELD, by this run's hold, so no later run starts beside it.
            echo "the host stays held: delete /billet-acceptance/held once the teardown is done" >&2
            exit "$status"
          fi
          gone "the run's node policy" NoSuchEntity \
            aws iam delete-role-policy --role-name "$HOST_ROLE" --policy-name "billet-matrix-$RUN"
          if [ "$LANE" = pool ]; then
            gone "the pool hosts' policy" NoSuchEntity \
              aws iam delete-role-policy --role-name "$POOL_HOST_ROLE" --policy-name "billet-matrix-$RUN"
          fi
          gone "the teardown's delete" NoSuchEntity \
            aws iam delete-role-policy --role-name "$HOST_ROLE" --policy-name "billet-matrix-$RUN-down"
          gone "the App key's parameter" ParameterNotFound \
            aws ssm delete-parameter --name "/billet-acceptance/runs/$RUN/app-key"
          if ! aws ec2 stop-instances --instance-ids "$HOST" >/dev/null ||
            ! aws ec2 wait instance-stopped --instance-ids "$HOST"; then
            echo "could not stop the host $HOST, or could not see it stopped" >&2
            status=1
          fi
          # THE HOLD GOES LAST, AND ONLY AFTER A CLEAN TEARDOWN: every policy, the key's
          # parameter and the host itself gone or proved absent, and the hold still this
          # run's. Anything else keeps it, so no later run starts beside what is left.
          if [ "$status" -ne 0 ]; then
            echo "the host stays held: delete /billet-acceptance/held once what is said above is done" >&2
          elif held=$(aws ssm get-parameter --name /billet-acceptance/held --query Parameter.Value \
            --output text 2>&1) && [ "$held" = "$RUN" ]; then
            gone "the host's hold" ParameterNotFound aws ssm delete-parameter --name /billet-acceptance/held
          else
            echo "the host's hold is not this run's to release: $held" >&2
            status=1
          fi
          exit "$status"
