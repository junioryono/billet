# Build the guest image centrally and publish it, so no deployment has to.
#
# WHY THIS EXISTS AT ALL. Every billet deployment needs the same microVM guest:
# Ubuntu, Docker, the Actions runner, billet's agent. Nothing in it is specific to
# an organisation. Having each operator build it means each of them needs root,
# a large machine and hours, and each of them independently discovers that GitHub
# stops handing jobs to a runner more than thirty days past a release. Building it
# once here makes that expiry one project's problem instead of everyone's.
#
# WHY IT DOES NOT NAME THE REPOSITORY. This project expects to move between
# accounts. `github.repository` is whatever repository this file is in, so the
# workflow publishes to its own home wherever that turns out to be, and the move
# is a `git push` rather than an edit here that somebody has to remember.
#
# WHY IT BUILDS FROM THE STABLE RELEASE AND NOT FROM MAIN. main is gated and is
# still not something a fleet should inherit unreviewed at 04:17 on a Monday: an
# image that reaches the channel fans out to every deployment on its next refresh,
# so the tree it is built from is one a person promoted by cutting a release -- the
# rule the AMI already follows, where the tag is the promotion. The workflow itself
# stays on main, because every deployed binary verifies the channel's signature
# against THIS FILE running on refs/heads/main (imagesource.PublishRef); only the
# tree the build legs check out moves to the release. So the YAML of
# guest-image-build.yml drives scripts from an older tree, and the seam between them
# -- the script names and the environment passed across -- is frozen by a test rather
# than left to drift.
# A build from main is still possible for testing a change to those scripts, and
# it cannot publish.
name: Guest image

on:
  schedule:
    # Weekly, well inside github's thirty days from a runner release, and at an
    # hour nobody is watching. Not Sunday-into-Monday: a build that fails wants a
    # working day in front of it, not a weekend.
    - cron: "17 4 * * 1"

  workflow_dispatch:
    inputs:
      runner_version:
        description: "Actions runner version to bake in (blank: whatever github has published)"
        required: false
        type: string

      publish:
        description: "Publish a release. Off builds and checks without publishing."
        required: false
        default: true
        type: boolean

      source:
        description: "Tree to build from: blank for the release the stable channel names, a vX.Y.Z release tag, or main (which cannot publish)"
        required: false
        type: string

      carry_expired_channel:
        description: "If the aarch64 build fails, carry its image from a channel pointer past its expiry. Off refuses, because an expired pointer may be an old one replayed; turn it on only having read what the pointer names."
        required: false
        default: false
        type: boolean

# LEAST PRIVILEGE, NAMED PER JOB BELOW rather than here, so a step added to a
# future job does not silently inherit the ability to write releases.
permissions: {}

concurrency:
  # ONE BUILD AT A TIME, AND A SCHEDULED RUN DOES NOT CANCEL A MANUAL ONE it
  # overlapped with. cancel-in-progress would let the weekly timer kill a build
  # somebody started deliberately, which is the run most likely to matter.
  group: guest-image
  cancel-in-progress: false

jobs:
  # THE TREE IS ONE ANSWER FOR BOTH LEGS, asked once, so one release's two images are
  # built from one commit whatever the channel does while they run.
  resolve:
    name: Resolve the source release
    runs-on: ubuntu-24.04

    outputs:
      source_tag: ${{ steps.source.outputs.tag }}
      source_sha: ${{ steps.source.outputs.sha }}
      source_is_release: ${{ steps.source.outputs.is_release }}

    permissions:
      contents: read

    steps:
      # THE TREE IS RESOLVED BEFORE ANYTHING IS CHECKED OUT, from the stable channel
      # -- the same pointer deployments follow, so the image is built from the
      # release the fleet actually runs, hotfix-on-an-older-series rules included.
      # A tag named by hand has to be an immutable, published, non-prerelease
      # release; anything else is refused here, before an hour of building.
      #
      # THE ANNOTATED TAG IS PEELED. cut-release makes annotated tags, and the ref
      # of one names the tag object rather than the commit; a checkout of that sha
      # works, but the publish job records the commit, and the two must agree.
      - name: Resolve the source release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail

          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          is_release=false

          case "${SOURCE:-}" in
            main)
              tag=main
              sha=$GITHUB_SHA
              ;;
            '')
              if ! channel=$(gh api "repos/$GITHUB_REPOSITORY/contents/stable.json?ref=release-channel" \
                  --jq .content 2>/dev/null | base64 -d); then
                echo "the stable channel has not been published yet, so there is no release to" >&2
                echo "build from; cut one first, or dispatch with source=main to build without publishing" >&2
                exit 1
              fi
              tag=$(printf '%s' "$channel" | jq -r .tag)
              ;;
            *)
              tag=$SOURCE
              ;;
          esac

          if [ "$tag" != main ]; then
            if ! [[ $tag =~ $semver ]]; then
              echo "source must be a release tag like v0.5.0, or main: $tag" >&2
              exit 1
            fi

            release=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isImmutable,isPrerelease,isDraft)
            if [ "$(jq -r '.isImmutable and (.isPrerelease | not) and (.isDraft | not)' <<<"$release")" != true ]; then
              echo "$tag is not an immutable, published, non-prerelease release: $release" >&2
              exit 1
            fi

            ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")
            sha=$(jq -r .object.sha <<<"$ref")
            if [ "$(jq -r .object.type <<<"$ref")" = tag ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            fi
            is_release=true
          fi

          echo "building the guest image from $tag ($sha)"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"

  # THE x86_64 BUILD GATES THE RELEASE (ADR-022), and it keeps the names every deployed
  # reader reads.
  x64:
    name: Build x86_64
    needs: resolve
    uses: ./.github/workflows/guest-image-build.yml
    permissions:
      contents: read
    with:
      machine: x86_64
      runs_on: billet-image-builder-ubuntu-2404
      image_name: ubuntu-2404-x64
      source_tag: ${{ needs.resolve.outputs.source_tag }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      runner_version: ${{ inputs.runner_version }}

  # THE aarch64 BUILD JOINS THE RELEASE, or the last good image is carried forward. The
  # run is red either way when it fails, because its failing job says so.
  arm64:
    name: Build aarch64
    needs: resolve
    uses: ./.github/workflows/guest-image-build.yml
    permissions:
      contents: read
    with:
      machine: aarch64
      runs_on: billet-image-builder-ubuntu-2404-arm64
      image_name: ubuntu-2404-arm64
      suffix: -aarch64
      source_tag: ${{ needs.resolve.outputs.source_tag }}
      source_sha: ${{ needs.resolve.outputs.source_sha }}
      runner_version: ${{ inputs.runner_version }}

  publish:
    name: Sign and publish
    needs: [resolve, x64, arm64]
    # NOT `inputs.publish != false`. On a SCHEDULED run `inputs` is undefined, so
    # `inputs.publish` is the empty string -- and github casts both '' and false to
    # 0 when comparing across types, making that condition FALSE. MAIN ONLY also
    # makes this job's write token and OIDC identity unreachable to branch scripts.
    #
    # AND ONLY AN IMAGE BUILT FROM A RELEASE. A build from main is for testing the
    # build scripts; what the channel points every deployment at is a tree a
    # person promoted.
    #
    # !cancelled() BECAUSE A NEED THAT FAILED SKIPS A JOB OTHERWISE, and aarch64 failing is
    # the case this job has a rule for; and not always(), which publishes a run a person
    # stopped, and which GitHub will not cancel once it is running. x86_64 failing
    # publishes nothing.
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.x64.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.publish) && needs.resolve.outputs.source_is_release == 'true' }}
    runs-on: ubuntu-24.04

    permissions:
      # actions: read ONLY TO ASK THE ARTIFACT'S SIZE before downloading it.
      actions: read
      contents: write
      id-token: write

    steps:
      # Checked out only after the job-level main guard. The credentials are used
      # to advance the small guest-channel branch after the release is immutable.
      - name: Check out the publication commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      # ROOM FOR THE ARTIFACTS. The runner-images image packs to about 20GB, and each
      # zip and its contents exist at once, so the toolchains this job never uses go
      # first; fetch-guest-artifact.sh proves the room before it writes.
      - name: Make room for the image
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/lib/node_modules \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"

      # FETCHED THROUGH THE API AND HELD TO GITHUB'S DIGEST, not with
      # actions/download-artifact, which twice stopped extracting this artifact part
      # way through and reported success (actions/download-artifact#454).
      - name: Download the checked image
        env:
          GH_TOKEN: ${{ github.token }}
          GUEST_ARTIFACT_ID: ${{ needs.x64.outputs.artifact_id }}
        run: scripts/fetch-guest-artifact.sh out

      # A BUILD THAT SUCCEEDED WHOSE ARTIFACT CANNOT BE FETCHED FAILS THIS JOB. It is not
      # a failed build, so nothing is carried in its place.
      - name: Download the checked aarch64 image
        if: needs.arm64.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GUEST_ARTIFACT_NAME: guest-image-aarch64
          GUEST_ARTIFACT_ID: ${{ needs.arm64.outputs.artifact_id }}
        run: scripts/fetch-guest-artifact.sh out

      # NOT CACHED: this job holds the identity that signs what every node trusts, and
      # a cache a branch's run could have written is not something it should read.
      - name: Install Go for the carried image's check
        if: needs.arm64.result != 'success'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Carry the last good aarch64 image
        if: needs.arm64.result != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          CARRY_EXPIRED_CHANNEL: ${{ inputs.carry_expired_channel }}
        run: scripts/carry-guest-set.sh out

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # THE MANIFEST IS THE ONLY THING SIGNED, and that is sufficient: it carries a
      # digest for every asset, so one signature transitively covers the four
      # hundred megabytes without anybody doing public-key arithmetic over them.
      - name: Sign the manifest
        env:
          ARM64_RESULT: ${{ needs.arm64.result }}
        run: |
          set -euo pipefail

          # --new-bundle-format IS NOT OPTIONAL FOR US. Without it cosign v2 writes
          # its legacy shape, which sigstore-go refuses, and omits the inclusion
          # proof that makes offline verification possible.
          cosign sign-blob --yes \
            --new-bundle-format \
            --bundle out/manifest.sigstore.json \
            out/manifest.json

          # A CARRIED MANIFEST KEEPS THE SIGNATURE IT WAS PUBLISHED WITH: this run did
          # not build what it describes.
          if [ "$ARM64_RESULT" = success ]; then
            cosign sign-blob --yes \
              --new-bundle-format \
              --bundle out/manifest-aarch64.sigstore.json \
              out/manifest-aarch64.json
          fi

      # ONE RELEASE'S NOTES, WHICH SAY WHAT IT CARRIES AND WHERE A CARRIED SET CAME FROM.
      - name: Write the release notes
        run: |
          set -euo pipefail

          for extra in out/release-notes-aarch64.md out/release-notes-carried.md; do
            if [ -e "$extra" ]; then
              printf '\n' >>out/release-notes.md
              cat "$extra" >>out/release-notes.md
            fi
          done

      - name: Name the release
        id: tag
        run: echo "tag=guest-$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      # IMMUTABLE DATED RELEASES, AND NO ROLLING RELEASE. Release immutability
      # locks a published tag and its assets, so a guest-latest release freezes on
      # its first generation rather than moving. Pullers read a tiny pointer from
      # guest-channel and then fetch assets from the immutable dated URL.
      #
      # THE GUEST TAG POINTS AT THE RELEASE COMMIT THE IMAGE WAS BUILT FROM, not at
      # the main commit that happened to publish it. That is the provenance record:
      # the manifest's schema is closed and every deployed reader refuses an
      # unknown field, so it cannot carry one, and a tag's target can.
      - name: Publish the dated release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve.outputs.source_sha }}
        run: scripts/publish-guest-release.sh out

      # A BRANCH, NOT A RELEASE. The release is immutable; this two-file branch is
      # the mutable pointer an unattended fleet needs. The pointer is signed only
      # after the release has been proved immutable and expires before two weekly
      # builds can be replayed as current, and it lists the machines the release
      # carries. The branch pushes fast-forward so its history is retained rather than
      # rewritten.
      - name: Advance the guest channel
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
        run: |
          set -euo pipefail

          channel_dir=$(mktemp -d)
          trap 'git worktree remove --force "$channel_dir"' EXIT

          scripts/write-guest-channel.sh out
          cosign sign-blob --yes \
            --new-bundle-format \
            --bundle out/current.sigstore.json \
            out/current.json

          set +e
          git ls-remote --exit-code --heads origin refs/heads/guest-channel >/dev/null
          channel_status=$?
          set -e

          case "$channel_status" in
            0)
              git fetch origin refs/heads/guest-channel:refs/remotes/origin/guest-channel
              git worktree add -b guest-channel-next "$channel_dir" refs/remotes/origin/guest-channel
              ;;
            2)
              git worktree add --detach "$channel_dir" "$GITHUB_SHA"
              git -C "$channel_dir" checkout --orphan guest-channel-next
              git -C "$channel_dir" rm -rf .
              ;;
            *)
              echo "could not determine whether the guest channel exists" >&2
              exit "$channel_status"
              ;;
          esac

          cp out/current.json out/current.sigstore.json "$channel_dir/"
          git -C "$channel_dir" config user.name github-actions[bot]
          git -C "$channel_dir" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "$channel_dir" add current.json current.sigstore.json
          git -C "$channel_dir" commit -m "Guest channel: $TAG (built from $SOURCE_TAG)"
          git -C "$channel_dir" push origin HEAD:refs/heads/guest-channel
