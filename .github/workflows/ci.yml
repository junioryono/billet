name: CI

# billet's own CI runs on GitHub-hosted runners for now. Dogfooding it on billet
# is a goal, but a runner platform that can only be built by an already-working
# copy of itself is a bootstrap trap — the hosted path stays supported forever.
#
# A RELEASE BRANCH'S TIP GETS A RUN OF ITS OWN. A carry's pull request is tested
# as its merge ref, and the commit the merge leaves on release/vX.Y is a different
# one; Cut Release cuts from that commit and its report shows CI on exactly it
# (#145). The cut's own `Release vX.Y.Z` commit is pushed with GITHUB_TOKEN, which
# starts no workflow, so it adds no run. A push reads the pushed branch's own copy
# of this file, so a release branch cut before this trigger gets it only once it
# is carried there.
on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A PULL REQUEST'S OLDER RUN IS CANCELLED; main's is let finish. Cancelling on
  # main meant a run completed only when nothing merged for as long as CI takes,
  # and on 2026-09-25 no main run completed across nine merges. The group still
  # replaces a PENDING main run with the newer one, so main queues at most one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WHICH JOB FAMILIES A CHANGE NEEDS. test, release-config, docs and dco always run
  # (test reads scripts, actions, workflows, docs, Ansible, Terraform and source
  # text). Every other job belongs to exactly one family in verify-all-checks'
  # FAMILY map, and runs only when scripts/ci-scope.sh selects that family: a
  # pull request whose paths cannot reach a family skips its jobs. A push, and
  # anything the script cannot establish, selects every family.
  changes:
    runs-on: billet-2vcpu-ubuntu-2404
    outputs:
      schema: ${{ steps.scope.outputs.schema }}
      host_lifecycle: ${{ steps.scope.outputs.host_lifecycle }}
      postgres: ${{ steps.scope.outputs.postgres }}
      postgres_command: ${{ steps.scope.outputs.postgres_command }}
      postgres_retirement: ${{ steps.scope.outputs.postgres_retirement }}
      package_lifecycle: ${{ steps.scope.outputs.package_lifecycle }}
      terraform: ${{ steps.scope.outputs.terraform }}
      terraform_consumer_floor: ${{ steps.scope.outputs.terraform_consumer_floor }}
      terraform_lint: ${{ steps.scope.outputs.terraform_lint }}
      replay: ${{ steps.scope.outputs.replay }}
      lint: ${{ steps.scope.outputs.lint }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge commit and its first parent: HEAD^1..HEAD is the change.
          fetch-depth: 2
      - id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
        run: scripts/ci-scope.sh >>"$GITHUB_OUTPUT"
  test:
    runs-on: billet-16vcpu-ubuntu-2404
    # THIS JOB RUNS THE SUITE TWICE AND TALKS TO TWO REAL SERVICES, so it is the
    # one job whose runtime is not mostly Go. `-race -covermode=atomic` over the
    # whole tree, against a real Docker daemon for internal/e2e and a real
    # PostgreSQL for the backend tests, then the capacity suite again against
    # PostgreSQL.
    #
    # SIZED FROM WHAT THE SUITE MEASURABLY COSTS, NOT FROM A ROUND NUMBER. The
    # race suite takes about eleven minutes and the PostgreSQL capacity suite two
    # more, so a 15-minute job was cancelling itself AFTER every step had passed,
    # in the coverage upload -- a gate failing a correct change on wall clock it
    # never controlled. Two branches raised it to 25 for that reason the same
    # day. By 2026-09-09 the race suite alone took 21 minutes (internal/alloc
    # 848s, cmd/billet 640s, internal/replay 596s) and the job passed at 24m28s
    # three times in a row before one runner spent three minutes more and the
    # PostgreSQL step was cancelled after every test had passed; it is 40 now.
    # Raise it again when the suite grows; do not trim tests to fit it.
    timeout-minutes: 40

    # NO DATABASE SERVICE HERE. The suites gated on BILLET_TEST_POSTGRES_DSN
    # (internal/state's backend tests, the capacity suite's ledger conformance,
    # one backup test) run in test-postgres below against a real PostgreSQL;
    # this job runs every package on SQLite, so neither job waits on the
    # other's slowest package. The split follows the consumer repository's
    # workflow, which runs its database-backed suites as their own job.
    #
    # THOSE SUITES REFUSE TO SKIP UNDER CI unless the run names the job that
    # runs them, which is what this variable does: a run that has lost the
    # test-postgres job still fails in it rather than reporting success for a
    # backend nothing exercised, and a run that also lost this variable fails
    # here.
    env:
      BILLET_TEST_POSTGRES_ELSEWHERE: test-postgres

    steps:
      # THE WHOLE HISTORY AND ITS TAGS, because the actions suite asks
      # scripts/release-ref.sh which release this tree is, and on a release
      # branch the answer is a tag a one-commit clone does not have. The resolver
      # refuses a shallow clone rather than reading it as main. 25 MiB packed.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # setup-go's cache is one entry shared by every Go job in the run,
          # written on a MISS only, so whichever job populated it decides what
          # is warm and the `-race -covermode=atomic` object files this job
          # compiles are never the ones it restores. The flavoured cache below
          # replaces it; on the consumer repository's workflow the same change
          # saved about two minutes of cold race+cover compilation per run.
          cache: false

      # ROLLING KEY: restore-keys falls back to the newest entry for this go.sum
      # and the sha-suffixed key writes a fresh one each run, so a run inherits
      # the previous run's warm race+cover objects and recompiles only what
      # changed. The `race-cover` prefix keeps it apart from the plain build
      # cache the other jobs share; mixing flavours is what made a shared entry
      # useless. The fleet's guests start empty, so this download is what stands
      # between a run and a cold compile of every package under -race.
      - name: Cache the race+cover Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-cover-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            go-race-cover-${{ hashFiles('go.sum') }}-

      # AN INTERRUPTED MUTATION RUN CANNOT BE COMMITTED: a `.bak` beside a
      # tracked file means the run left the ORIGINAL holding a mutant, which
      # compiles and mostly passes, so every other gate would be happy to say so.
      - name: Refuse a mutant an interrupted mutation run left behind
        run: python3 scripts/check-no-mutants.py

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # moby's check-config.sh, which the kernel gate runs for real on Linux,
      # grades the HOST as well as the config: with AppArmor enabled in the
      # kernel it refuses a host without apparmor_parser. The hosted image has
      # it; the fleet's guest image does not yet.
      # APT OVER HTTPS, FROM TWO SOURCES: every archive.ubuntu.com address
      # refused port 80 from the fleet's site and from AWS for hours
      # (2026-09-11), two of them answered nothing on 443 either, and a job's
      # apt sat 30 s per attempt on one of those; every gate that ran apt failed
      # on it. Two URIs in one deb822 stanza are two repositories to apt: both
      # index sets are fetched and a package comes from whichever lists it
      # (measured on a guest the same day with the first URI black-holed: the
      # install came from the second in 4 s; a lenient update passes). The
      # rewrite matches the archive line's exact spelling (and ports.ubuntu.com's,
      # for an arm64 runner), so any other source is left alone.
      - name: Install the AppArmor tools the vendored kernel checker grades
        # A guest image that already carries the package never reaches the archive:
        # the fleet's uplink is shared with everything else at its site, and every
        # apt call from a job is one more dependency on a mirror and one more
        # session on that uplink. The query asks for the package's STATUS, because
        # `dpkg -s` exits 0 for a removed package whose configuration remains.
        run: |
          [ "$(dpkg-query -W -f '${db:Status-Status}' apparmor 2>/dev/null)" = installed ] && { echo "apparmor already installed"; exit 0; }
          sudo sed -i -e 's,^URIs: http://archive[.]ubuntu[.]com/ubuntu/$,URIs: https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/,' -e 's,^URIs: http://ports[.]ubuntu[.]com/ubuntu-ports/$,URIs: https://ports.ubuntu.com/ubuntu-ports/,' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apparmor

      # -race matters more than usual here: the control plane is a capacity
      # allocator with concurrent scale-set listeners, and a data race in that
      # code double-admits jobs onto a machine that cannot hold them.
      - name: Test
        # -timeout 35m IS PER PACKAGE, and internal/alloc needs it: under -race
        # and atomic coverage that package alone took 530s on main before
        # migration 49 added fourteen statements to every test ledger's open,
        # against go test's default of 600s. It was 20m until cmd/billet crossed
        # that on a loaded fleet runner twice on 2026-09-26 with no test hung
        # (the ones running had run for seconds). The job's own timeout-minutes
        # still bounds the whole run and stays above this, so a real hang is
        # reported by go test with its goroutine dump rather than by a cancel.
        #
        # -json through jq so the log reads as it always did and the events
        # are kept for the ranking below: the run's floor is one package's
        # wall clock, and a per-test ranking is how it is shortened rather
        # than guessed at. `fromjson?` lets a build error's plain line through.
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 35m -vet=off -coverprofile=coverage.out -covermode=atomic -json ./... \
            | tee test-output.json \
            | jq -R -j 'fromjson? | select(.Output != null) | .Output'

      - name: Report the slowest tests
        if: always()
        run: |
          if [ ! -s test-output.json ]; then
            echo "no test-output.json: the test step did not get far enough to produce one"
            exit 0
          fi
          {
            echo "### 25 slowest tests"
            echo
            echo '```'
            jq -r 'select(.Action == "pass" or .Action == "fail")
                   | select(.Test != null and .Elapsed != null)
                   | [.Elapsed, .Package, .Test] | @tsv' test-output.json \
              | sort -rn \
              | head -25 \
              | awk -F'\t' '{ sub("github.com/junioryono/billet/", "", $2); printf "%8.2fs  %s  %s\n", $1, $2, $3 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # THE DATABASE-BACKED SUITES, AS THEIR OWN JOB. THE POSTGRESQL BACKEND IS
  # TESTED AGAINST A REAL SERVER OR NOT AT ALL: every fact internal/state pins
  # about it is a fact about the server rather than about billet's code -- what
  # an advisory lock excludes, what a read-only transaction refuses, what the
  # catalogue reports -- so a fake would assert billet's own assumptions back at
  # itself. Here: internal/state's backend tests (gated on the DSN), the whole
  # command suite (whose PostgreSQL-only tests -- the backup's end-to-end gate
  # and every test of a controller's retirement -- skip in the SQLite job), and
  # the capacity suite run once with the ledger switched
  # (BILLET_TEST_LEDGER=postgres), which is the conformance run the single job
  # made. internal/state's SQLite suite is NOT re-run here.
  test-postgres:
    needs: changes
    if: needs.changes.outputs.postgres == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    # 30: the command suite moved to test-postgres-command, so this job is the
    # ledger backend (283.4s on main at d4d4e2e) and the capacity suite (204.2s)
    # with their own 20m bounds; the sibling job's note applies here too -- raise
    # it when the suite grows, do not trim tests to fit it.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: billet
          POSTGRES_PASSWORD: billet
          POSTGRES_DB: billet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BILLET_TEST_POSTGRES_DSN: postgres://billet:billet@127.0.0.1:5432/billet?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache the race+cover Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-cover-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.job }}
          restore-keys: |
            go-race-cover-${{ hashFiles('go.sum') }}-
      - name: Test the ledger backend against PostgreSQL
        run: go test -race -count=1 -timeout 20m -vet=off ./internal/state/
      - name: Test the capacity suite against PostgreSQL
        run: go test -count=1 -timeout 20m ./internal/alloc/
        env:
          BILLET_TEST_LEDGER: postgres

  # THE WHOLE COMMAND SUITE, NOT A LIST OF NAMES. Everything in cmd/billet and its
  # command families (internal/ops) that needs a real PostgreSQL -- the backup's
  # end-to-end gate, and every test of a controller's retirement, which is defined
  # for a PostgreSQL pair and has no SQLite form -- SKIPS in the SQLite job. A
  # named list runs whatever somebody remembered to add to it, and leaves
  # everything else unrun in both jobs while the run reports success.
  #
  # UNDER -race, because the SQLite job cannot buy it for the tests it skips:
  # these are the only run those tests get, and a data race in one of them would
  # otherwise be detected nowhere.
  #
  # IN THREE SHARDS, FROM MEASURED COST rather than a guess: on 35044219801
  # (2026-09-16) the suite took 1817s over 1208 tests, of which TestT* was 587s,
  # TestA* 546s and the rest 684s. The patterns partition the top-level names;
  # ^TestRetirement belongs to test-postgres-retirement and is skipped here.
  test-postgres-command:
    needs: changes
    if: needs.changes.outputs.postgres_command == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            run: '^TestA'
          - shard: t
            run: '^TestT'
          - shard: rest
            run: '^Test[^AT]'
    name: test-postgres-command (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: billet
          POSTGRES_PASSWORD: billet
          POSTGRES_DB: billet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BILLET_TEST_POSTGRES_DSN: postgres://billet:billet@127.0.0.1:5432/billet?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache the race+cover Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-cover-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.job }}-${{ matrix.shard }}
          restore-keys: |
            go-race-cover-${{ hashFiles('go.sum') }}-
      - name: Test the command suite against PostgreSQL
        run: |
          set -o pipefail
          go test -race -count=1 -timeout 40m -vet=off -run '${{ matrix.run }}' -skip '^TestRetirement' -json ./cmd/billet/ ./internal/ops/... \
            | tee command-output.json \
            | jq -R -j 'fromjson? | select(.Output != null) | .Output'

      - name: Report the slowest command tests
        if: always()
        run: |
          if [ ! -s command-output.json ]; then
            echo "no command-output.json: the command step did not get far enough to produce one"
            exit 0
          fi
          {
            echo "### 25 slowest ${{ matrix.shard }} command tests"
            echo
            echo '```'
            jq -r 'select(.Action == "pass" or .Action == "fail")
                   | select(.Test != null and .Elapsed != null)
                   | [.Elapsed, .Test] | @tsv' command-output.json \
              | sort -rn \
              | head -25 \
              | awk -F'\t' '{ printf "%8.2fs  %s\n", $1, $2 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # A retirement admits its service operations before every step, so its
  # command tests drive whole retirements to each boundary against PostgreSQL
  # under -race: on e8af8be (2026-09-15) TestRetirementReprovesEachStoppedBoundary
  # had finished 17 of its 39 cases in 11m58s when test-postgres's 30m command
  # bound fired, about half an hour for that test alone by extrapolation. They
  # run here in seven disjoint source-owned shards. The partition check refuses
  # missing or duplicate selection; test-postgres skips all TestRetirement names.
  test-postgres-retirement:
    needs: changes
    if: needs.changes.outputs.postgres_retirement == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: boundaries
          - shard: settled
          - shard: node-config
          - shard: registration
          - shard: inert
          - shard: effects
          - shard: operations
    name: test-postgres-retirement (${{ matrix.shard }})
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: billet
          POSTGRES_PASSWORD: billet
          POSTGRES_DB: billet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BILLET_TEST_POSTGRES_DSN: postgres://billet:billet@127.0.0.1:5432/billet?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache the race+cover Go build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-race-cover-${{ hashFiles('go.sum') }}-${{ github.sha }}-${{ github.job }}-${{ matrix.shard }}
          restore-keys: |
            go-race-cover-${{ hashFiles('go.sum') }}-
      - name: Test the retirement admission suite against PostgreSQL
        run: |
          set -o pipefail
          python3 scripts/check-retirement-shards.py --run '${{ matrix.shard }}' \
            | tee retirement-output.json \
            | jq -R -j 'fromjson? | select(.Output != null) | .Output'

      - name: Report the slowest retirement tests
        if: always()
        run: |
          if [ ! -s retirement-output.json ]; then
            echo "no retirement-output.json: the step did not get far enough to produce one"
            exit 0
          fi
          {
            echo "### 25 slowest ${{ matrix.shard }} tests"
            echo
            echo '```'
            jq -r 'select(.Action == "pass" or .Action == "fail")
                   | select(.Test != null and .Elapsed != null)
                   | [.Elapsed, .Test] | @tsv' retirement-output.json \
              | sort -rn \
              | head -25 \
              | awk -F'\t' '{ printf "%8.2fs  %s\n", $1, $2 }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    # golangci-lint alone may take fifteen minutes on a cold, loaded guest (see
    # run.timeout in .golangci.yml), and this job also runs the analyzers, every
    # cross build and sqlc diff.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # THE PINNED TOOL VERSIONS, from the one file every gate reads.
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z_]+=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: gofmt
        run: scripts/gates/fmt-check.sh

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a linter that changes under you turns an
          # unrelated PR red and trains people to ignore the signal.
          version: ${{ env.GOLANGCI_VERSION }}
          # NO RESTORED ANALYSIS CACHE. On 2026-10-21 every lint run whose key
          # matched one restored cache entry exactly reported staticcheck SA5011
          # (a nil dereference after `if x == nil { t.Fatal(...) }`) in 16 to 60
          # untouched places, as if testing.T.Fatal could return, while every run
          # that restored the same entry by prefix found 0 issues; the same tree
          # linted clean on a test host with an empty cache. A gate whose verdict
          # depends on which cache entry it restored is no gate, so the analysis
          # runs whole every time (about five minutes rather than two).
          skip-cache: true

      # billet's own analyzers, plus the tests that prove they still detect
      # anything. The second half is not optional: tools/lint is a nested module,
      # so `go test ./...` in the Test job does NOT reach the analyzers' own
      # suites — and an analyzer that silently stopped detecting would still
      # report zero violations, which reads exactly like a clean tree.
      - name: Run billet's own analyzers
        run: scripts/gates/lint-custom.sh

      # Every platform a node runs on, in one job rather than three: nodes are
      # deployed by copying one static file, and a build-tag mistake shows up
      # here before it does on a Mac mini. scripts/gates/cross.sh is the loop a
      # developer runs, so the two cannot disagree about the target list.
      - name: Build every platform a node can run on
        run: scripts/gates/cross.sh

      # The committed query code must be what sqlc produces from the query files
      # AND the migrations, because sqlc reads the migration history rather than
      # a flattened schema, so adding a migration can change generated code. The
      # generated code is committed precisely so an ordinary build never
      # downloads sqlc, which is why this is a CI step and not part of
      # scripts/gates/check.sh. The version is pinned exactly in
      # .github/tool-versions.env, the way golangci-lint and goreleaser are:
      # `@latest` would mean a new sqlc release fails an unrelated PR that
      # touched no SQL. `sqlc diff` writes nothing and exits 1 on drift
      # (measured). It cannot see a generated file ORPHANED by a deleted query,
      # because sqlc never removes output; TestEveryGeneratedQueryIsNamedInASourceFile
      # covers that direction.
      - name: Prove the committed queries are what sqlc generates
        run: |
          go install "github.com/sqlc-dev/sqlc/cmd/sqlc@$SQLC_VERSION"
          sqlc diff

      # A control plane that holds a GitHub App key and terminates TLS should
      # not ship with known-vulnerable dependencies.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # A broken release config should fail on the PR that broke it, not at the
  # moment somebody presses the release button. `check` is cheap — it parses and
  # validates, it does not build.
  #
  # ITS OWN JOB, AND INSTALLED FROM THE MODULE PROXY. Both halves of that are a
  # reaction to the same outage: goreleaser-action downloads a tarball from
  # GitHub's release CDN, that CDN served 503 to all three of the action's
  # attempts twice in one day, and because the step lived in `lint` it took
  # golangci-lint down with it — a red "lint" on runs where nothing had been
  # linted at all. Separating the job means a CDN blip can only fail the thing
  # it is actually about, and `go install` fetches through proxy.golang.org,
  # which is a cache rather than a redirect to the same CDN.
  release-config:
    runs-on: billet-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      # The whole history, for scripts/check-module-sources.sh: see the test job.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # THE PINNED TOOL VERSIONS, from the one file every gate reads.
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z_]+=' .github/tool-versions.env >> "$GITHUB_ENV"

      # Version pinned exactly, the way golangci-lint is, in the file
      # scripts/gates/tools.sh installs from, so the two cannot drift to two
      # goreleasers.
      - name: Validate the release config
        run: |
          go install "github.com/goreleaser/goreleaser/v2@$GORELEASER_VERSION"
          goreleaser check

      # `terraform/` was in no release for months and nothing said so: it simply
      # postdated every tag, so a consumer pinning the module got "subdir not
      # found" and only `main` or a bare SHA resolved. This proves every
      # documented source names a version and that git carries the path it
      # names; `cut-release.yml` runs the same script with the tag.
      #
      # HERE RATHER THAN ONLY IN scripts/gates/check.sh: CI runs
      # build/vet/test/lint individually rather than the composite gate, so a
      # gate added to check.sh alone runs on nobody's machine but the author's.
      - name: Prove every documented Terraform module source is pinnable
        run: scripts/check-module-sources.sh

  # One Python script over the shards' reports: nothing here compiles.
  retirement-selection:
    needs: [changes, host-lifecycle]
    if: needs.changes.outputs.host_lifecycle == 'true'
    runs-on: billet-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: retirement-selection-*
          path: retirement-selection
      - name: Prove all retirement role cases ran exactly once
        run: python3 scripts/check-retirement-shards.py --completed-roles retirement-selection

  # BILLET BUILT ONCE FOR EVERY host-lifecycle GROUP. Seventeen groups each built
  # the guard gate's four stamped binaries and three built the ordinary CLI
  # several times (74 builds a run); this builds them once and the groups verify
  # and use these files (gate-binaries.sh, and the gates' BILLET_*_BINARY
  # overrides). The artifact lives for this run only.
  gate-binaries:
    needs: changes
    if: needs.changes.outputs.host_lifecycle == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Sample what this job uses of its runner
        continue-on-error: true
        run: scripts/ci-usage.sh start "$RUNNER_TEMP/ci-usage"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the gate's binaries and the CLI
        run: |
          ansible_collections/junioryono/billet/tests/gate-binaries.sh build "$RUNNER_TEMP/gate-binaries"
          ansible_collections/junioryono/billet/tests/gate-binaries.sh verify "$RUNNER_TEMP/gate-binaries"
          go build -o "$RUNNER_TEMP/gate-binaries/billet" ./cmd/billet
      - uses: actions/upload-artifact@v7
        with:
          name: gate-binaries
          path: ${{ runner.temp }}/gate-binaries
          if-no-files-found: error
          retention-days: 1
      - name: Report what this job used of its runner
        if: always()
        continue-on-error: true
        run: scripts/ci-usage.sh report "$RUNNER_TEMP/ci-usage" gate-binaries
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: ci-usage-gate-binaries
          path: ${{ runner.temp }}/ci-usage/usage.json
          if-no-files-found: ignore

  host-lifecycle:
    needs: [changes, gate-binaries]
    if: needs.changes.outputs.host_lifecycle == 'true'
    # EVERY GROUP ON THE 2 vCPU RUNNER, FROM WHAT EACH MEASURABLY USES (#155).
    # The groups run Ansible one case at a time on binaries gate-binaries built,
    # so on the 8 vCPU runner (31 GiB) each used about one core: 0.76 to 1.29
    # cores on average, a peak of 1.3 (3.4 in retirement-resume) and at most
    # 1.4 GiB held, guard and retirement-parity-network included (run
    # 39539367492, 2026-10-21, ci-usage-<group>). policy alone peaks at 7.7
    # cores, compiling two test binaries for its real-systemd step, a few
    # minutes of its eighteen. A 2 vCPU runner reserves a quarter of the vCPU
    # and memory, and the fleet runs out of memory first. On it (run
    # 39566892000, 2026-10-21) every group passed, none peaked above 2.0 cores
    # or 1.9 GiB, policy took 22.6 minutes against 17.9, and the longest group,
    # retirement-parity-network, took 32.0 against 31.9. ci-usage reports each
    # group's use on every run, so a group that outgrows its runner shows there.
    runs-on: billet-2vcpu-ubuntu-2404
    # The former retirement group reached 36 minutes before request coverage
    # on 46fcafa (2026-09-14). Partition its parser, routes, compatibility,
    # retained continuation, recovery and 3c settled callers. The 64 request
    # cases now have five sections (planning input: 28/45 minutes unsharded,
    # before the retained ones). The 3c operand and drift plays also leave
    # shape. MEASURED ON 86a018e (2026-09-18), the run that first executed the
    # five request sections: evidence 7, collection 8, cancellation 8, windows 9
    # and retained 9 minutes, against 28 for the one group they replaced. The
    # margin is set elsewhere — guard at 32 and parity-network at 31 are this
    # job's long poles, and no request section is near them.
    strategy:
      fail-fast: false
      matrix:
        group: [policy, roles, guard, shape, retirement-node-shape, retirement, retirement-routes, retirement-compatibility, retirement-node, retirement-recovery, retirement-node-settled, retirement-parity-basic, retirement-parity-network, retirement-parity-negative, retirement-resume, retirement-request-evidence, retirement-request-collection, retirement-request-windows, retirement-request-cancellation, retirement-request-retained, endpoint]
    name: host-lifecycle (${{ matrix.group }})
    # Sized from what the gates measurably take: the run was cancelled at 15
    # minutes after the two connector gates and the fleet gate joined it
    # (measured 2026-09-06, 15m03s with every gate green until the cap), and
    # at 30 minutes once the preparation's gate grew to two hundred cases on a
    # runner that ran every step 1.5 to 2 times slower than the run before it
    # (measured 2026-09-10: the guard gate 16m47s against 8m46s, the key-policy
    # gate 4m46s against 2m52s, the job cancelled at 30m05s inside the
    # cloudflared gate with every earlier gate green). The gate launches its
    # playbooks one case at a time, so the follow-up that buys the time back
    # is batching compatible cases into one launch, not a larger budget.
    timeout-minutes: 45
    # THE COLLECTION'S GATES RUN WITH NO RUNNER_NAME, which every gate but the
    # guard's own assumes (converge-guard-check.sh says so, and sets the name
    # it tests itself): their plays converge the throwaway machine the job runs
    # on, and the converge guard refuses a play driven from a runner named
    # billet-*, which on the reference deployment's fleet every runner is.
    # RUNNER_* variables cannot be overridden by env:, so the shell drops it.
    defaults:
      run:
        shell: env -u RUNNER_NAME bash -e {0}
    steps:
      - uses: actions/checkout@v6

      # WHAT EACH GROUP USES OF ITS RUNNER, which is what its size is chosen
      # from (#155): busy cores and held memory, sampled every five seconds and
      # reported in the job's summary and the ci-usage-<group> artifact. A
      # measurement, never a gate: the script exits 0 whatever it finds, and
      # each of its steps continues on error, the upload included.
      - name: Sample what this group uses of its runner
        continue-on-error: true
        run: scripts/ci-usage.sh start "$RUNNER_TEMP/ci-usage"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # ONE PIN, read from the two files actions/converge-fleet reads, so the
      # runtime these gates prove the roles on is the runtime the action
      # installs on a consumer's runner; actions/convergefleet_test.go refuses
      # a drift between this step and those files.
      - name: Install the pinned Ansible runtime
        run: |
          python -m pip install "ansible-core==$(cat ansible_collections/junioryono/billet/tests/ansible-core-version)"
          # The host role's guest-network tasks use ansible.posix.sysctl, and
          # the fresh-check parses the WHOLE role (static imports resolve
          # modules even for tasks a controller-only run skips), so bare
          # ansible-core is not enough.
          # --no-cache because the version is pinned exactly and the runner is
          # fresh, so the galaxy response cache answers nothing this install
          # needs and can only fail it: a partial entry ("Missing expected
          # 'results' in ansible-galaxy cache") took out host-lifecycle (guard)
          # before it ran a single gate, and galaxy's own diagnostic names this
          # flag as the way out.
          #
          # BOUNDED RETRIES because galaxy.ansible.com is a third party this gate
          # cannot do without and does not control: it answered 502 Bad Gateway on
          # the very next run and took out host-lifecycle (policy) the same way,
          # before any gate ran. Same treatment every apt call in these gates
          # already gets. `until` consumes the status, so a failed attempt is a
          # loop condition rather than something `set -e` ends the step on, and
          # `timeout` bounds an attempt that hangs instead of answering.
          posix="$(cat ansible_collections/junioryono/billet/tests/ansible-posix-version)"
          attempt=1
          until timeout -k 10 120 ansible-galaxy collection install --no-cache "ansible.posix:$posix"; do
            if [ "$attempt" -ge 5 ]; then
              echo "galaxy did not serve ansible.posix:$posix after $attempt attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
            attempt=$((attempt + 1))
          done

      # THE ROLE'S apt TASKS NEED PACKAGE LISTS, AND THE FLEET'S RUNNER SHIPS NONE:
      # the guest image build empties /var/lib/apt/lists. This update used to run
      # only inside the python3-apt install below, which is skipped now that the
      # image carries python3-apt, so the lists stayed empty and every group whose
      # converge installs a package failed with `No package matching 'ceph-common'`
      # (measured on a fleet guest 2026-09-22: 0 lists before, 57 after one
      # update). The InRelease check fails when the update left no lists at all;
      # on a runner that starts with none, present means fetched.
      - name: Refresh apt's package lists
        run: |
          sudo sed -i -e 's,^URIs: http://archive[.]ubuntu[.]com/ubuntu/$,URIs: https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/,' -e 's,^URIs: http://ports[.]ubuntu[.]com/ubuntu-ports/$,URIs: https://ports.ubuntu.com/ubuntu-ports/,' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          ls /var/lib/apt/lists/*InRelease >/dev/null

      # The check-mode scenario pins /usr/bin/python3, and the apt module in
      # check mode needs python3-apt there (a real run installs it itself). The
      # hosted image and the fleet's guest image both carry it.
      - name: Install python3-apt for the apt module's check mode
        run: |
          [ "$(dpkg-query -W -f '${db:Status-Status}' python3-apt 2>/dev/null)" = installed ] && { echo "python3-apt already installed"; exit 0; }
          sudo apt-get install -y --no-install-recommends python3-apt

      # The emitted-block and hybrid-emission gates build billet to render what
      # they check; the hosted image had a Go on PATH, the guest has none.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: gate-binaries
          path: ${{ runner.temp }}/gate-binaries

      # An artifact does not keep the executable bit. The guard gate verifies its
      # four binaries before it uses them; the CLI is the same build every
      # other gate would have made.
      - name: Use the binaries built once for this run
        run: |
          chmod 0755 "$RUNNER_TEMP"/gate-binaries/*
          {
            echo "BILLET_GATE_PREBUILT=$RUNNER_TEMP/gate-binaries"
            echo "BILLET_EMITTED_BLOCK_BINARY=$RUNNER_TEMP/gate-binaries/billet"
            echo "BILLET_HYBRID_CHECK_BINARY=$RUNNER_TEMP/gate-binaries/billet"
          } >>"$GITHUB_ENV"

      - name: Exercise alert ownership migration and teardown
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh alert-lifecycle

      - name: Exercise development-host check mode
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh development-check-mode

      - name: Guard transactional host-upgrade ordering
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh host-upgrade-order

      # The node drains before it restarts and the drain has no bound, so the
      # role hands the restart to systemd and polls for a new main process.
      # This drives that task file against a scripted systemctl.
      - name: Prove the node restart is polled rather than awaited
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh node-restart-check

      - name: Pin the fail-closed ledger mount units
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh ledger-mount-render

      # billet ships its units twice — the package installs deploy/*.service,
      # the role renders its own templates — and nothing compared them until
      # this. Hardening one and forgetting the other is the failure it catches.
      - name: Prove the packaged units and the role's templates agree
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh unit-parity

      # An unattended library upgrade restarted billet-node through needrestart,
      # and a node's stop is a drain with no time limit. Escalated, as the role is.
      - name: Prove the host role keeps needrestart from restarting billet's services
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh needrestart-check

      # The PostgreSQL ledger shipped and the role read
      # server.state_dir, which such a config does not have — so every one of
      # them converged green against the DEFAULT directory, sandboxed and
      # mounted somewhere the control plane does not use.
      - name: Prove the host role converges a PostgreSQL deployment
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh postgres-profile

      # The runner itself is the fresh host: no billet account, binary or
      # units. The packaged postinstall pre-creates the account everywhere
      # else, so this is the one place CI sees an operator's first dry run.
      - name: Dry-run the host role against a fresh machine
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh host-fresh-check

      # The seam between the two suites: the Go tests prove the emission is a
      # correct CONFIG and the Ansible tests feed the role a config written by
      # hand, so neither noticed that the default emission was one the role
      # REFUSES. This puts a generated block through the real role.
      - name: Converge the host role with a generated block
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh emitted-block-check

      # And the EXAMPLE a stranger copies, with a block generated the way its
      # README instructs. emitted-block-check converges the role with both
      # services disabled; this one enables them, so it covers the input path
      # that requires the App key.
      - name: Converge the shipped example with a generated block
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh example-check

      # The other example, as far as a runner without /dev/kvm or a Ceph cluster
      # can take it: that the role ACCEPTS a firecracker emission. That is the
      # seam the docker emission broke — a block the role refused before
      # rendering anything, which neither test suite could see.
      - name: Accept a firecracker emission through the role
        if: matrix.group == 'shape'
        run: scripts/gates/scenario.sh firecracker-example-check

      # Both gates above carry the key path the role owns, so neither reaches
      # the half of the policy that governs a key the role does NOT manage —
      # delete that branch and they stay green. This runs the policy's five
      # cases directly.
      - name: Prove the GitHub App key policy on both paths
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh key-policy-check

      # No other suite names a version, so none of them reaches binary.yml —
      # delete it and they all stay green. This also asks the release origin
      # whether the URL the role builds is one it publishes, which check mode
      # cannot see: get_url does not fetch there, so every dry run passes
      # against a 404.
      # No other suite sets RUNNER_NAME or a holder, so none of them reaches the
      # guard or the exclusion's preparation -- delete either and they all stay
      # green. The refusals they make are the difference between a converge that
      # fails and one that destroys the job running it, or races a rollout for
      # the binaries. The preparation's cases run under sudo, and here that
      # launch is required rather than skipped.
      - name: Prove a converge cannot be driven from a billet runner and prepares its exclusion
        if: matrix.group == 'guard'
        env:
          BILLET_GATE_REQUIRE_ROOT: "1"
          BILLET_GATE_SKIP: endpoint,retirement
        run: scripts/gates/scenario.sh converge-guard-check

      - name: Prove the endpoint decision, migration and receipt entries
        if: matrix.group == 'endpoint'
        env:
          BILLET_GATE_REQUIRE_ROOT: "1"
          BILLET_GATE_ONLY: endpoint
        run: scripts/gates/scenario.sh converge-guard-check

      - name: Prove the selected retirement route or request section
        if: contains(fromJSON('["retirement", "retirement-routes", "retirement-compatibility", "retirement-node", "retirement-recovery", "retirement-node-settled", "retirement-parity-basic", "retirement-parity-network", "retirement-parity-negative", "retirement-resume", "retirement-request-evidence", "retirement-request-collection", "retirement-request-windows", "retirement-request-cancellation", "retirement-request-retained"]'), matrix.group)
        env:
          BILLET_GATE_REQUIRE_ROOT: "1"
          BILLET_GATE_ONLY: ${{ startsWith(matrix.group, 'retirement-request-') && 'retirement-request' || 'retirement' }}
          BILLET_GATE_SKIP: ${{ !startsWith(matrix.group, 'retirement-request-') && 'retirement-request' || '' }}
          BILLET_RETIREMENT_SHARD: ${{ fromJSON('{"retirement":"parser","retirement-routes":"routes","retirement-compatibility":"compatibility","retirement-node":"retained","retirement-recovery":"recovery","retirement-node-settled":"settled","retirement-parity-basic":"parity-basic","retirement-parity-network":"parity-network","retirement-parity-negative":"parity-negative","retirement-resume":"resume","retirement-request-evidence":"request-evidence","retirement-request-collection":"request-collection","retirement-request-windows":"request-windows","retirement-request-cancellation":"request-cancellation","retirement-request-retained":"request-retained"}')[matrix.group] }}
          BILLET_RETIREMENT_REPORT: ${{ runner.temp }}/retirement-selection.json
        run: scripts/gates/scenario.sh converge-guard-check

      - name: Record the completed retirement case inventory
        if: contains(fromJSON('["retirement", "retirement-routes", "retirement-compatibility", "retirement-node", "retirement-recovery", "retirement-node-settled", "retirement-parity-basic", "retirement-parity-network", "retirement-parity-negative", "retirement-resume", "retirement-request-evidence", "retirement-request-collection", "retirement-request-windows", "retirement-request-cancellation", "retirement-request-retained"]'), matrix.group)
        uses: actions/upload-artifact@v7
        with:
          name: retirement-selection-${{ matrix.group }}
          path: ${{ runner.temp }}/retirement-selection.json
          if-no-files-found: error

      - name: Prove retirement shard coverage
        if: matrix.group == 'retirement-node-shape'
        run: python3 scripts/check-retirement-shards.py

      - name: Prove retained ordinary operands and drift
        if: matrix.group == 'retirement-node-shape'
        run: scripts/gates/scenario.sh retirement-node-shape

      # The ssh_access role's whole value is one refusal, and no other suite
      # configures a key, so every other gate takes its "nothing configured"
      # branch. This runs the refusals and the install against a fake sshd.
      - name: Prove the ssh_access role refuses to lock a host out
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh ssh-access-check

      # The two connector roles are the host half of the documented reaching
      # routes, and no other suite sets a token, so every refusal in them could
      # be deleted with everything green. These drive them against fakes that
      # record every call, including that a token reaches no argv.
      - name: Prove the cloudflared connector role
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh cloudflared-connector-check

      - name: Prove the WARP connector role
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh warp-connector-check

      # No other suite gives a Mac a billet_config, so the macos_node role's
      # order (check, drain, replace, up) and its refusals are proved here only.
      - name: Prove the macos_node role
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh macos-node-check

      # The fleet playbook runs ssh_access before the host role, so the role's
      # own converge guard would fire after a key was installed; the playbook
      # repeats the guard first in every play, and only this proves it.
      - name: Prove the fleet playbook's shape and its guard
        if: matrix.group == 'roles'
        run: scripts/gates/scenario.sh fleet-playbook-check

      - name: Prove the pinned-release fetch path
        if: matrix.group == 'policy'
        run: scripts/gates/scenario.sh release-fetch-check

      # The record a rollout reads the host by (#91): the real billet and a
      # real manifest from a local origin, through the role's own task files,
      # in a private mount namespace (so it needs the runner's sudo).
      - name: Prove the role records which release manifest produced the binary
        if: matrix.group == 'policy'
        run: scripts/gates/scenario.sh provenance-check

      # Every fetch site was bounded and retried once, after one stalled
      # connection failed a converge behind an approval gate. This is what
      # keeps the next get_url or uri from shipping with the module defaults.
      - name: Prove every fetch is bounded and retried
        if: matrix.group == 'policy'
        run: scripts/gates/scenario.sh fetch-retry-check

      # On systemd 255 the pending-reload flag is set for every unit by any
      # enable on the host, and the old dry run refused the whole fleet on it.
      # The gate compares the loaded facts with the fragment instead, resolves
      # aliases by unit name through a module of this collection, and the role
      # ends with the reload its own enables left pending.
      - name: Prove the dry run compares across a pending daemon-reload
        if: matrix.group == 'policy'
        run: scripts/gates/scenario.sh dryrun-policy-check

      # The hybrid generator writes an inventory and a playbook that the Go
      # tests parse with a YAML library. Ansible is what has to read them, and
      # the anchor carrying one tier catalogue to both hosts is the seam a
      # library and Ansible could disagree on.
      - name: Prove the generated hybrid shape is one Ansible reads
        if: matrix.group == 'policy'
        run: scripts/gates/scenario.sh hybrid-emission-check

      # Measure unit effects and command readers against disposable systemd 255.
      # Compile as the runner; run as root from each package's directory.
      # The command handoff uses a temporary PostgreSQL ledger.
      - name: Measure retirement operation effects on real systemd
        if: matrix.group == 'policy'
        run: |
          if [ "$(dpkg-query -W -f '${db:Status-Status}' python3-jinja2 2>/dev/null)" != installed ]; then
            sudo sed -i -e 's,^URIs: http://archive[.]ubuntu[.]com/ubuntu/$,URIs: https://archive.ubuntu.com/ubuntu/ https://mirrors.edge.kernel.org/ubuntu/,' -e 's,^URIs: http://ports[.]ubuntu[.]com/ubuntu-ports/$,URIs: https://ports.ubuntu.com/ubuntu-ports/,' /etc/apt/sources.list.d/ubuntu.sources
            sudo timeout -v -k 10 300 apt-get -o APT::Update::Error-Mode=any -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
            sudo timeout -v -k 10 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends python3-jinja2
          fi
          sudo /usr/bin/python3 -c 'import jinja2'
          go test -c -o "$RUNNER_TEMP/lifeops.test" ./internal/lifeops
          go test -c -o "$RUNNER_TEMP/billet-command.test" ./internal/ops/host
          go test -c -o "$RUNNER_TEMP/regularfile.test" ./internal/regularfile
          go test -c -o "$RUNNER_TEMP/retirement.test" ./internal/retirement
          retirement_postgres=$(docker run -d --rm -p 127.0.0.1::5432 -e POSTGRES_USER=billet -e POSTGRES_PASSWORD=billet -e POSTGRES_DB=billet postgres:18-alpine)
          trap 'docker stop "$retirement_postgres" >/dev/null' EXIT
          retirement_postgres_ready=false
          for attempt in {1..60}; do
            if docker exec "$retirement_postgres" pg_isready -h 127.0.0.1 -U billet -d billet; then
              retirement_postgres_ready=true
              break
            fi
            sleep 1
          done
          if [ "$retirement_postgres_ready" != true ]; then
            docker logs "$retirement_postgres"
            exit 1
          fi
          retirement_postgres_address=$(docker port "$retirement_postgres" 5432/tcp)
          # The mount rule on the layouts it is for (#123): an overlay of two
          # filesystems without xino, and single files bind-mounted onto a name.
          (cd internal/regularfile && sudo env "PATH=/usr/bin:/bin:$PATH" BILLET_TEST_REAL_MOUNTS=1 "$RUNNER_TEMP/regularfile.test" -test.count=1 -test.v -test.run '^TestRealMounts')
          (cd internal/retirement && sudo env "PATH=/usr/bin:/bin:$PATH" BILLET_TEST_REAL_MOUNTS=1 "$RUNNER_TEMP/retirement.test" -test.count=1 -test.v -test.run '^TestRealMounts')
          cd internal/lifeops
          sudo env "PATH=/usr/bin:/bin:$PATH" BILLET_TEST_REAL_MOUNTS=1 "$RUNNER_TEMP/lifeops.test" -test.count=1 -test.v -test.run '^TestRealMounts'
          sudo env "PATH=/usr/bin:/bin:$PATH" BILLET_TEST_SYSTEMD_OPERATION_EFFECTS=1 "$RUNNER_TEMP/lifeops.test" -test.count=1 -test.v -test.run '^(TestRealSystemdRetirementOperationEffects|TestRealSystemdHostLockDirectoryOutlivesTheNodeStop)$'
          cd ../ops/host
          sudo env "PATH=/usr/bin:/bin:$PATH" BILLET_TEST_SYSTEMD_OPERATION_EFFECTS=1 "BILLET_TEST_POSTGRES_DSN=postgres://billet:billet@$retirement_postgres_address/billet?sslmode=disable" "$RUNNER_TEMP/billet-command.test" -test.count=1 -test.v -test.run '^TestRealSystemd'

      - name: Report what this group used of its runner
        if: always()
        continue-on-error: true
        run: scripts/ci-usage.sh report "$RUNNER_TEMP/ci-usage" "host-lifecycle (${{ matrix.group }})"

      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: ci-usage-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-usage/usage.json
          if-no-files-found: ignore

  # Every leg here needs the real Debian package, so they share a job and the
  # packages are built once, before the first.
  package-lifecycle:
    needs: changes
    if: needs.changes.outputs.package_lifecycle == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    # The unit sandbox leg added about a minute to a job measured at 6m41s
    # with it (2026-10-21), well inside the thirty the package legs had.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # THE PINNED TOOL VERSIONS, from the one file every gate reads.
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z_]+=' .github/tool-versions.env >> "$GITHUB_ENV"

      - name: Install the pinned release builder
        run: go install "github.com/goreleaser/goreleaser/v2@$GORELEASER_VERSION"

      # The real packages, built once for all three legs, exactly as a tag
      # would build them and publishing nothing.
      - name: Build the release artifacts
        run: scripts/gates/dist.sh

      - name: Exercise package installation and removal
        run: scripts/test-package-lifecycle.sh

      # THE UNITS STARTED, NOT READ (#174). Every packaged unit under
      # ProtectSystem=strict runs under real systemd with its real sandbox and
      # `billet local unit-paths --exercise` in place of its command, and the
      # writes are judged from outside the sandbox. It needs no App, so it runs
      # here rather than with the rehearsals that do.
      - name: Prove the packaged units' sandboxes permit what their commands do
        run: scripts/test-unit-sandboxes.sh

      # AN UNTESTED BACKUP IS NOT A BACKUP, which ADR-001 has said since before
      # backup existed. This is the packaged-Linux half of the rehearsal: a real
      # .deb, the real service account, a real `billet local backup` and a
      # restore onto a state directory that has never seen the deployment, run
      # as root exactly as an operator would. It found a defect on its first run
      # — every file a root restore published stayed root-owned inside a
      # service-owned directory, so the restored control plane could not open
      # one of them — which nothing in the Go suite could see.
      - name: Rehearse a restore on a packaged Linux host
        run: scripts/test-restore-rehearsal.sh

      # AND THE PROFILE WHERE THE ARCHIVE IS THE ONLY COPY THERE IS. A
      # PostgreSQL deployment archives HALF of itself on purpose — the ledger is
      # pg_dump's to copy — so this exercises a different archive schema, an
      # entry set one short, and two refusals that exist nowhere else. The step
      # above cannot reach any of it, and control-plane-postgres has no ledger
      # volume by design, which makes that archive the only copy of the
      # deployment identity a replacement controller can be built from.
      - name: Rehearse a restore of a PostgreSQL deployment
        run: scripts/test-postgres-restore-rehearsal.sh

  # The Terraform module has no compiler, so fmt/validate/test in CI is the only
  # thing standing between a typo and an operator's plan. The tests run against
  # a mocked provider: no credentials, nothing created, real provider schemas.
  terraform:
    needs: changes
    if: needs.changes.outputs.terraform == 'true'
    # Named by the leg's ROLE, not its version: a required-status-check
    # configured against a name that embeds the pin would silently stop being
    # satisfied on the next version bump.
    name: terraform (${{ matrix.label }})
    runs-on: billet-2vcpu-ubuntu-2404
    # THE JOB IS BOUND BY THE NETWORK, not the CPU. On 2026-10-17, with the
    # pool's internet share shaped to 150 Mbit/s and every concurrent job pulling
    # through it, three attempts in a row were cancelled at 15 minutes with
    # nothing failed: each leg downloaded a 194 MB AWS provider for every module
    # and every hybrid root. The provider cache below shares what the modules
    # download, and the first hybrid root's lock serves the other three; when a
    # cache main saved for these same lock files is restored, only the first
    # hybrid root's providers come from the internet, which it authenticates
    # (the Go cache is restored from the node). A leg with nothing cached still
    # took 14 minutes on a saturated line, so the limit keeps that room.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # The REPO floor, measured twice: the suite's override_during needs
          # 1.11 (1.10.5 fails init), and its apply-mode upgrade test needs
          # 1.14 — earlier versions run every assertion green and then fail the
          # file, because tearing that state down means destroying the ledger
          # volume and prevent_destroy refuses it (1.13.3 fails, 1.14.0 passes).
          # The module's consumer floor stays 1.9 in versions.tf — a consumer's
          # init never parses a child's tests/, which the leg below proves.
          - { label: "floor", terraform: "1.14.0", probe: false }
          - { label: "stable", terraform: "1.15.9", probe: false }
          # Early warning for the next terraform release, never a blocker: a
          # red probe is information, not a broken PR. Today latest resolves
          # to the same stable as the pinned leg above — the probe's value
          # arrives the day the next minor releases, with no pin bump.
          - { label: "latest-probe", terraform: "latest", probe: true }
    continue-on-error: ${{ matrix.probe }}
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          # The wrapper shims terraform for plan-output capture, which breaks a
          # script that reads terraform's own output; these jobs only need the
          # real binary.
          terraform_wrapper: false

      # Before the classification gate below, which is a Go program: on the
      # hosted image a Go happened to be on PATH already, and on the fleet's
      # guest nothing is until this step runs.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # PROVIDERS ARE SHARED, NOT DOWNLOADED AT EVERY INIT. Every module is
      # initialised here and every hybrid root below, and with no plugin cache
      # each init fetched its providers afresh: the aws provider is 194 MB,
      # fetched about seven times a leg and three legs a run, over the one line
      # the whole site's CI shares. On 2026-10-17 every leg of two pull requests
      # passed each step it reached and was cancelled at the limit, the module's
      # validate taking up to five minutes against 55 s on a quiet line. The
      # cache is shared by the job's inits and carried between runs by the
      # Actions cache, which a billet runner serves from its own node: main
      # saves it, a release branch whose locks differ from main's saves its own,
      # and a pull request restores its base's or main's. Terraform takes a
      # cached provider only when the lock file holds this platform's h1
      # checksum, and checks it against that (measured with 1.14.0, 1.14.1 and
      # 1.15.9), which is why each lock records all four platforms and a test in
      # scripts/ says so; the hybrid roots have no lock, so the first of them
      # downloads and authenticates the newest aws provider in every leg, and
      # scripts/hybrid-root-check.sh hands its lock to the other three.
      - name: Share one provider cache across the job's inits
        run: |
          mkdir -p "$RUNNER_TEMP/terraform-plugins"
          echo "TF_PLUGIN_CACHE_DIR=$RUNNER_TEMP/terraform-plugins" >> "$GITHUB_ENV"

      - name: Restore the provider cache
        id: providers
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: terraform-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('terraform/modules/*/.terraform.lock.hcl') }}

      - name: Format, validate, and plan-test the module
        run: scripts/gates/terraform.sh fmt validate test

      # WHAT A CHANGE COSTS A RUNNING DEPLOYMENT is committed beside the module,
      # because a plan cannot say it: ADR-004 keeps live billet nodes outside
      # Terraform, so "1 to change, 1 to destroy" reads the same for a tag and for
      # the instance holding the ledger. This refuses a module resource with no
      # entry — and an entry for a resource no module declares, which is how a
      # stale table goes on looking like coverage.
      #
      # It needs no terraform at all, so it also runs in the Go job's suite; it
      # is here because this is the job somebody adding a resource to the
      # module will be watching.
      - name: Prove every module resource is classified
        run: scripts/gates/terraform.sh classify

      - name: Unit-test the spot-router Lambda
        # Lives here, not in the Go jobs: this is the terraform module's code,
        # and its drop-vs-re-raise classification decides whether a real
        # two-minute Spot warning is lost. Before this job existed it ran in no
        # CI job at all.
        run: scripts/gates/lambda-test.sh

      # The root `billet init hybrid` writes is HCL rendered as text, and only
      # terraform can read it: a module input renamed on one side and not the
      # other passes every Go test and fails an operator's first init.
      - name: Prove the generated hybrid root validates against the module
        run: scripts/hybrid-root-check.sh

      # ONLY A PUSH TO MAIN OR A RELEASE BRANCH SAVES, and only a job that passed:
      # a pull request restores what its base branch saved, so it never writes an
      # entry of its own for every push. The legs share the key, so the first to
      # finish saves and the others are told it exists, which the action reports
      # as a warning, not a failure.
      - name: Save the provider cache
        if: >-
          github.event_name == 'push' && steps.providers.outputs.cache-hit != 'true' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/terraform-plugins
          key: ${{ steps.providers.outputs.cache-primary-key }}

  # The module declares required_version >= 1.9 for CONSUMERS, whose init
  # never parses the child's tests/ — but this repo's module directory cannot
  # init on 1.9 (the test suite needs 1.14), so without this leg the declared
  # consumer floor would be an untested claim that rots. It validates exactly
  # what a consumer resolves: the module sources without tests.
  terraform-consumer-floor:
    needs: changes
    if: needs.changes.outputs.terraform_consumer_floor == 'true'
    runs-on: billet-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Validate the module as a 1.9 consumer resolves it
        # As a CHILD module under a minimal root, not as a root itself: root
        # validation misses child-module-only behavior and points path.root at
        # the module. The root passes only the one required variable, so it
        # also proves every other input genuinely defaults.
        run: |
          workdir=$(mktemp -d)
          mkdir "$workdir/module" "$workdir/consumer"
          cp -R terraform/modules/billet/. "$workdir/module/"
          rm -rf "$workdir/module/tests" "$workdir/module/.terraform" "$workdir/module/.terraform.lock.hcl"
          cat > "$workdir/consumer/main.tf" <<'HCL'
          module "billet" {
            source = "../module"
            name   = "billet-floor"
          }
          HCL
          terraform -chdir="$workdir/consumer" init -backend=false -input=false > /dev/null
          terraform -chdir="$workdir/consumer" validate

  # Lint and config-scan are terraform-version-independent, so they run once.
  # Versions are read from .github/tool-versions.env, the way goreleaser's is,
  # so the workflow and scripts/gates/tools.sh cannot drift apart.
  terraform-lint:
    needs: changes
    if: needs.changes.outputs.terraform_lint == 'true'
    runs-on: billet-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # THE PINNED TOOL VERSIONS, from the one file every gate reads.
      - name: Load the pinned tool versions
        run: grep -E '^[A-Z_]+=' .github/tool-versions.env >> "$GITHUB_ENV"

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: tflint (aws ruleset pinned in .tflint.hcl)
        # The token keeps the ruleset download from tripping GitHub's
        # unauthenticated rate limit on busy days.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/gates/terraform.sh lint

      # Aqua's own setup action rather than curl-piping contrib/install.sh:
      # the pin above selects which trivy BINARY to fetch, but a piped script
      # from the main branch is unpinned code executing first.
      - uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}

      - name: trivy config scan (ignores are justified in .trivyignore)
        run: scripts/gates/terraform.sh scan

  # THE ACCEPTANCE-SIZE REPLAY, IN A JOB OF ITS OWN. internal/replay drives a
  # trace of job arrivals through the real listener, allocator, placer and node
  # wire over the simulated backend; the suite in the test job replays three
  # hundred jobs so every gate carries the determinism and overcommit proofs,
  # and this job replays the two thousand the issue asks for. Without -race,
  # because the race-instrumented run of two thousand did not finish inside the
  # test job's cap on a runner (measured 2026-09-05), and the race detector's
  # value is already spent on the same code by the three-hundred-job run there.
  replay:
    needs: changes
    if: needs.changes.outputs.replay == 'true'
    runs-on: billet-8vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -timeout 15m -run TestAFewThousandJobsReplayInMinutes -v ./internal/replay
        env:
          BILLET_REPLAY_JOBS: "2000"

  # The Sphinx build that Read the Docs runs, with warnings as errors, so a
  # broken cross-reference or a page missing from the toctree fails here rather
  # than publishing.
  docs:
    runs-on: billet-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: python -m pip install --requirement docs/requirements.txt
      - env:
          SPHINXBUILD: sphinx-build
        run: scripts/gates/docs.sh

  # A CONTRIBUTOR'S COMMITS ARE SIGNED OFF under the Developer Certificate of
  # Origin (scripts/dco.sh). KEPT rather than a family: whether a commit is signed
  # off has nothing to do with the paths it touches. A push, and a pull request the
  # owner or a bot opened, pass at once, so the job costs only a clone there.
  dco:
    runs-on: billet-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
        with:
          # The merge ref and both its parents' full histories, so the range
          # HEAD^1..HEAD^2 is every commit the pull request adds. A literal, never
          # an expression: a bare 0 is falsy, so `&& 0 || 1` always gives 1.
          fetch-depth: 0
      - env:
          DCO_EVENT: ${{ github.event_name }}
          DCO_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          DCO_OWNER: ${{ github.repository_owner }}
          # Named in the repair a refusal prints: billet's own repository and
          # this pull request's base, never the contributor's origin.
          DCO_UPSTREAM: ${{ github.server_url }}/${{ github.repository }}
          DCO_BASE_REF: ${{ github.base_ref }}
          DCO_HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          DCO_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/dco.sh

  # THE ONE CONTEXT BRANCH PROTECTION REQUIRES. Protection names a status check
  # by its job name, and naming every job above would have to be re-done each
  # time one is added or renamed, with a forgotten one leaving a gate that no
  # longer gates. So main requires this job alone, and it fails unless EVERY job
  # it needs reported success. `if: always()` is what makes it run when one of
  # them failed or was cancelled; without it the job is skipped, and a skipped
  # required check blocks the merge with nothing saying why.
  verify-all-checks:
    name: Verify All Checks Passed
    runs-on: billet-2vcpu-ubuntu-2404
    needs:
      [
        changes,
        test,
        test-postgres,
        test-postgres-command,
        test-postgres-retirement,
        lint,
        release-config,
        gate-binaries,
        host-lifecycle, # Includes every route and request matrix group.
        retirement-selection,
        package-lifecycle,
        terraform,
        terraform-consumer-floor,
        terraform-lint,
        replay,
        docs,
        dco,
      ]
    if: always()
    steps:
      - name: Verify all checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          # The jobs every run runs, whatever the change.
          KEPT: '["changes", "test", "release-config", "docs", "dco"]'
          # Every other job, and the one family whose selection is the only
          # permission to skip it.
          FAMILY: >-
            {"test-postgres": "postgres", "test-postgres-command": "postgres_command",
             "test-postgres-retirement": "postgres_retirement", "lint": "lint",
             "gate-binaries": "host_lifecycle", "host-lifecycle": "host_lifecycle",
             "retirement-selection": "host_lifecycle", "package-lifecycle": "package_lifecycle",
             "terraform": "terraform", "terraform-consumer-floor": "terraform_consumer_floor",
             "terraform-lint": "terraform_lint", "replay": "replay"}
        run: |
          # Every needed job must have SUCCEEDED: a skipped or cancelled job is
          # not a passed one, and reading it as one is a green check over an
          # unverified tree. The one exception is a job whose own family changes
          # did not select, and only when changes itself succeeded with a
          # readable decision. Each job is judged by its own family, so a job
          # that was selected and then skipped (because what it needs failed) is
          # a failure, never a permitted skip. A push selects every family.
          if ! jq -e --argjson kept "$KEPT" --argjson family "$FAMILY" --arg event "$EVENT" '
              . as $needs |
              .changes as $c |
              ($c.outputs // {}) as $o |
              ($family | [.[]] | unique) as $families |
              $c.result == "success" and
              $o.schema == "2" and
              ($families | all(. as $f | $o[$f] == "true" or $o[$f] == "false")) and
              ($event != "push" or ($families | all(. as $f | $o[$f] == "true"))) and
              ($family | keys | all(. as $j | $kept | index($j) | not)) and
              (keys | all(. as $j | ($kept | index($j)) or ($family | has($j)))) and
              ($kept + ($family | keys) | all(. as $j | $needs | has($j))) and
              (to_entries | all(
                .key as $j |
                .value.result == "success" or
                (.value.result == "skipped" and ($family | has($j)) and $o[$family[$j]] == "false")
              ))' <<<"$NEEDS" >/dev/null; then
            echo "not every check passed:"
            jq -r '"  selected: \(.changes.outputs // {} | to_entries | map(select(.value == "true") | .key) | join(", "))"' <<<"$NEEDS"
            jq -r 'to_entries[] | "  \(.key): \(.value.result)"' <<<"$NEEDS"
            exit 1
          fi
          echo "every check passed"
