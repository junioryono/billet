name: CI

# billet's own CI runs on GitHub-hosted runners for now. Dogfooding it on billet
# is a goal, but a runner platform that can only be built by an already-working
# copy of itself is a bootstrap trap — the hosted path stays supported forever.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # -race matters more than usual here: the control plane is a capacity
      # allocator with concurrent scale-set listeners, and a data race in that
      # code double-admits jobs onto a machine that cannot hold them.
      - name: Test
        run: go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: make fmt-check

      # A broken release config should fail on the PR that broke it, not at the
      # moment somebody presses the release button. `check` is cheap — it parses
      # and validates, it does not build.
      - name: Validate the release config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, not `latest`: a linter that changes under you turns an
          # unrelated PR red and trains people to ignore the signal.
          version: v2.12.2

  # The binary must build for every platform a node can run on, since nodes are
  # deployed by copying one static file. Cross-compilation is the cheapest way to
  # catch a build-tag mistake before someone hits it on a Mac mini.
  # A control plane that holds a GitHub App key and terminates TLS should not
  # ship with known-vulnerable dependencies.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -o /dev/null ./cmd/billet
