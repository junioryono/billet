  poisoned-clients:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    steps:
      - name: Recover the supervised forwarder from a process crash
        run: |
          set -euo pipefail
          origin=results-receiver.actions.githubusercontent.com
          before=$(systemctl show --property=MainPID --value billet-actions-proxy.service)
          test "$before" -gt 0
          sudo systemctl kill --kill-whom=main --signal=KILL billet-actions-proxy.service
          # Active plus a NEW MainPID is systemd's fork, not the bind: the restarted
          # python takes ~200ms to adopt the socket and reach its accept loop, and the
          # next step's connect once lost that race. Readiness is the PORT answering --
          # the same successful-connect wait the guest agent runs at first start.
          ready=0
          for _ in $(seq 1 100); do
            after=$(systemctl show --property=MainPID --value billet-actions-proxy.service)
            if systemctl is-active --quiet billet-actions-proxy.service &&
               [ "$after" -gt 0 ] && [ "$after" != "$before" ] &&
               (: </dev/tcp/"$origin"/443) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [ "$ready" != 1 ]; then
            systemctl status --no-pager billet-actions-proxy.socket billet-actions-proxy.service || true
            sudo journalctl --no-pager -u billet-actions-proxy.service -n 50 || true
            echo "the passthrough did not become ready after a crash" >&2
            exit 1
          fi
      - name: Isolate a malformed TLS client and a silent client from the passthrough
        run: |
          set -euo pipefail
          # The results origin is DNS-remapped to the guest passthrough (see the
          # guest agent), reached by name through /etc/hosts. A client that sends
          # garbage or nothing must not wedge the passthrough for the legitimate
          # cache traffic that follows, and a silent one must be dropped rather than
          # leaked. The cache step below proves recovery.
          origin=results-receiver.actions.githubusercontent.com
          # The origin must resolve to the guest passthrough, not GitHub: a bare TCP
          # connect would succeed either way, so assert the remap is active locally.
          addr=$(getent ahostsv4 "$origin" | awk 'NR == 1 { print $1 }')
          case "$addr" in
            172.1[6-9].*|172.2[0-9].*|172.3[01].*) ;;
            *) echo "results origin is not remapped to the local passthrough: $addr" >&2; exit 1 ;;
          esac
          # Wait for the passthrough to answer before probing. With socket activation
          # the listener is always up (systemd owns it), but this keeps the probe
          # honest against any residual restart race rather than assuming a single
          # open cannot lose it, the way the previous version did.
          for _ in $(seq 1 50); do (: </dev/tcp/"$origin"/443) 2>/dev/null && break; sleep 0.1; done
          # A malformed TLS client: the node rejects it and the passthrough tears the
          # connection down; it must not wedge the listener for what follows.
          exec 3<>"/dev/tcp/$origin/443"
          printf 'not-a-tls-client' >&3
          exec 3>&-
          # A silent client: it sends nothing, so the passthrough must drop it after
          # its connect timeout without ever spending a node tunnel. Wait past that
          # timeout, then prove it was CLOSED cleanly: the read reaches EOF and exits
          # 0 (a leaked-open connection blocks and the timeout exits 124 instead), it
          # received no bytes, and the passthrough is the SAME process throughout (a
          # crash-and-restart would also close the socket, and must not read as pass).
          before=$(systemctl show --property=MainPID --value billet-actions-proxy.service)
          exec 4<>"/dev/tcp/$origin/443"
          sleep 15
          silent_out=$(mktemp)
          if timeout 5 head -c 64 <&4 >"$silent_out" 2>/dev/null; then
            silent_closed=1
          else
            silent_closed=0
          fi
          exec 4>&-
          after=$(systemctl show --property=MainPID --value billet-actions-proxy.service)
          test "$silent_closed" = 1 || { echo "the silent client was left open past the connect timeout" >&2; exit 1; }
          test ! -s "$silent_out" || { echo "the silent client received unexpected bytes" >&2; exit 1; }
          # A running MainPID that did not change proves the drop was not a crash-restart.
          # Both-zero would pass a bare equality, so require the process to be present.
          systemctl is-active --quiet billet-actions-proxy.service || { echo "the passthrough is not running after the silent-client probe" >&2; exit 1; }
          test "$before" -gt 0 && test "$after" -gt 0 && test "$before" = "$after" || { echo "the passthrough restarted during the silent-client probe" >&2; exit 1; }
          rm -f "$silent_out"
      - name: Prove cache traffic remains usable after the transport faults
        id: recovered-cache
        uses: actions/cache@v5
        with:
          path: conformance/recovered-cache
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-fault-recovery
      - name: Establish the post-fault cache payload
        run: |
          test '${{ steps.recovered-cache.outputs.cache-hit }}' != true
          mkdir -p conformance/recovered-cache
          printf '%s\n' 'recovered' > conformance/recovered-cache/payload
      - name: Create a clean artifact payload
        run: |
          mkdir -p conformance/artifact conformance/poison-actions conformance/poison-tls conformance/poison-proxy conformance/poison-process
          printf '%s\n' 'billet-${{ github.run_id }}-${{ github.run_attempt }}-poison' > conformance/artifact/payload
          for path in conformance/poison-actions conformance/poison-tls conformance/poison-proxy conformance/poison-process; do
            printf '%s\n' "$path" > "$path/payload"
          done
      - name: Poison Actions service variables
        id: poison-actions
        continue-on-error: true
        uses: actions/cache@v5
        env:
          ACTIONS_CACHE_URL: https://127.0.0.1:1/
          ACTIONS_RESULTS_URL: https://127.0.0.1:1/
          ACTIONS_RUNTIME_TOKEN: poisoned
        with:
          path: conformance/poison-actions
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-actions
      # There is deliberately no NODE_OPTIONS poison here. A step that set
      # NODE_OPTIONS=--require=/nonexistent to crash the cache client's runtime was
      # removed once the runner (2.336.0) proved to strip step-env NODE_OPTIONS from
      # JS actions: the runner's own bundled node exits non-zero with that value, yet
      # actions/cache ran to a clean SUCCESS, so the poison never reached the action
      # and the client cached normally. That stripping is a runner security control,
      # not something billet can restore or should want to -- so the scenario is not
      # expressible here, and the reachability, trust, proxy and tooling poisons above
      # and below cover a compromised client's every fail-open path that billet owns.
      - name: Poison CA and TLS overrides
        id: poison-tls
        continue-on-error: true
        uses: actions/cache@v5
        env:
          NODE_EXTRA_CA_CERTS: /billet-conformance-does-not-exist
          SSL_CERT_FILE: /billet-conformance-does-not-exist
          GIT_SSL_NO_VERIFY: "true"
        with:
          path: conformance/poison-tls
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-tls
      - name: Poison proxy variables
        id: poison-proxy
        continue-on-error: true
        uses: actions/cache@v5
        env:
          http_proxy: http://127.0.0.1:1
          https_proxy: http://127.0.0.1:1
          no_proxy: ""
        with:
          path: conformance/poison-proxy
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-proxy
      - name: Poison loader, tar and path variables
        id: poison-process
        continue-on-error: true
        uses: actions/cache@v5
        env:
          LD_PRELOAD: /billet-conformance-does-not-exist
          TAR_OPTIONS: --help
          PATH: /usr/bin:/bin
        with:
          path: conformance/poison-process
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-process
      - name: Prove clean artifact metadata still passes through
        uses: actions/upload-artifact@v7
        with:
          name: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison
          path: conformance/artifact/payload
          if-no-files-found: error

  restore-poison-artifact:
    needs: poisoned-clients
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    steps:
      - name: Observe the runner lifecycle after poisoned Actions variables
        id: poison-actions
        uses: actions/cache@v5
        with:
          path: conformance/poison-actions
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-actions
          lookup-only: true
      - name: Prove poisoned CA and TLS variables published no cache
        id: poison-tls
        uses: actions/cache@v5
        with:
          path: conformance/poison-tls
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-tls
          lookup-only: true
      - name: Prove poisoned proxy variables published no cache
        id: poison-proxy
        uses: actions/cache@v5
        with:
          path: conformance/poison-proxy
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-proxy
          lookup-only: true
      - name: Observe the runner lifecycle after poisoned process variables
        id: poison-process
        uses: actions/cache@v5
        with:
          path: conformance/poison-process
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison-process
          lookup-only: true
      - name: Require interceptor-owned poison operations to remain a miss
        run: |
          test '${{ steps.poison-tls.outputs.cache-hit }}' != true
          test '${{ steps.poison-proxy.outputs.cache-hit }}' != true
      - name: Record runner-owned poison outcomes
        run: |
          actions_hit='${{ steps.poison-actions.outputs.cache-hit }}'
          process_hit='${{ steps.poison-process.outputs.cache-hit }}'
          {
            echo '### Runner-owned poison observations'
            echo
            echo '| Probe | Cache hit on a fresh runner |'
            echo '|---|---|'
            echo "| Actions service variables | ${actions_hit:-false} |"
            echo "| Loader, tar and path variables | ${process_hit:-false} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$actions_hit" = true ]; then
            echo '::notice title=Actions-variable probe::the runner restored a usable Actions service environment for the post action; this lifecycle is outside the interceptor boundary'
          fi
          if [ "$process_hit" = true ]; then
            echo '::notice title=Process-variable probe::the runner and cache client completed publication despite the hostile process environment; this lifecycle is outside the interceptor boundary'
          fi
      - name: Restore the cache saved after the proxy faults
        id: recovered-cache
        uses: actions/cache@v5
        with:
          path: conformance/recovered-cache
          key: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-fault-recovery
          fail-on-cache-miss: true
      - name: Verify the post-fault cache payload
        run: |
          test '${{ steps.recovered-cache.outputs.cache-hit }}' = true
          printf '%s\n' 'recovered' > expected-cache
          cmp expected-cache conformance/recovered-cache/payload
      - uses: actions/download-artifact@v8
        with:
          name: billet-conformance-${{ github.run_id }}-${{ github.run_attempt }}-poison
          path: conformance/download
      - run: |
          printf '%s\n' 'billet-${{ github.run_id }}-${{ github.run_attempt }}-poison' > expected
          cmp expected conformance/download/payload

  # A SERVICE CONTAINER IS THE ORDINARY SHAPE OF A TEST JOB, and nothing in billet
  # is written for it: the runner creates it through the guest's Docker. What is
  # proved here is that it works the way GitHub's runners do -- reached from host
  # steps through the mapped port, health-checked before the first step -- and
  # that a real query ran, not that a container existed.
  services-host:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: billet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Query the service through the mapped port from a host step
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=billet postgres:16-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -v ON_ERROR_STOP=1 \
            -c 'create table conformance (run text)' \
            -c "insert into conformance values ('billet-${{ github.run_id }}-${{ github.run_attempt }}')" \
            -tA -c 'select run from conformance' | tee answer
          test "$(cat answer)" = 'billet-${{ github.run_id }}-${{ github.run_attempt }}'

  # THE SAME SERVICE, A SECOND TIME, so the run can measure what the site's Docker
  # image store did for the second job's `Initialize containers`: the first job
  # pulled postgres into the deployment-scoped store, and the second boots a fresh
  # guest that finds it there. Runs after the first, on the same tier.
  services-host-again:
    needs: services-host
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: billet
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Query the service again
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=billet postgres:16-alpine \
            psql -h 127.0.0.1 -p 5432 -U postgres -tA -c 'select 1' | tee answer
          test "$(cat answer)" = 1

  # A JOB CONTAINER REACHES A SERVICE BY ITS LABEL, on the network the runner
  # creates for the job, with no port mapping. The job image has psql; the steps
  # need nothing from the host.
  services-container:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    container: postgres:16
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: billet
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Query the service by hostname from inside the job container
        env:
          PGPASSWORD: billet
        run: |
          set -euo pipefail
          psql -h postgres -U postgres -v ON_ERROR_STOP=1 \
            -c 'create table conformance (run text)' \
            -c "insert into conformance values ('billet-${{ github.run_id }}-${{ github.run_attempt }}-container')" \
            -tA -c 'select run from conformance' | tee answer
          test "$(cat answer)" = 'billet-${{ github.run_id }}-${{ github.run_attempt }}-container'

  # DOCKER COMPOSE FROM A HOST STEP, the other ordinary way a job gets a database.
  compose-database:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Bring up a database with compose and query it
        run: |
          set -euo pipefail
          mkdir -p conformance/compose
          cat >conformance/compose/compose.yml <<'EOF'
          services:
            db:
              image: postgres:16-alpine
              environment:
                POSTGRES_PASSWORD: billet
              healthcheck:
                test: ["CMD", "pg_isready", "-U", "postgres"]
                interval: 5s
                timeout: 5s
                retries: 10
          EOF
          cd conformance/compose
          docker compose up -d --wait
          docker compose exec -T -e PGPASSWORD=billet db psql -U postgres -tA -c 'select 1' | tee answer
          test "$(cat answer)" = 1
          docker compose down -v

  # WHAT THE IMAGE STORE DID, MEASURED RATHER THAN INFERRED. The runner's own
  # `Initialize containers` step is where a service image is pulled and started;
  # the first services job pulled postgres into the site's store and the second
  # ran on a fresh guest. Both durations go in the summary. A cold store makes the
  # two similar, which the summary shows; a warm one makes the second seconds.
  container-init-timings:
    needs: [services-host, services-host-again]
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 15
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Report the Initialize containers durations
        uses: actions/github-script@v8
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId, per_page: 100,
            });
            const rows = [["Job", "Initialize containers"]];
            for (const name of ["services-host", "services-host-again"]) {
              const job = jobs.find((j) => j.name === name || j.name.endsWith(" / " + name));
              if (!job || job.conclusion !== "success") {
                core.setFailed(`no successful ${name} job to measure`);
                return;
              }
              const step = (job.steps || []).find((s) => s.name === "Initialize containers");
              if (!step || !step.started_at || !step.completed_at) {
                core.setFailed(`${name} has no timed Initialize containers step`);
                return;
              }
              const seconds = (Date.parse(step.completed_at) - Date.parse(step.started_at)) / 1000;
              rows.push([name, `${seconds.toFixed(1)} s`]);
            }
            await core.summary.addHeading("Service container initialisation").addRaw(
              "The first job pulled postgres:16-alpine into the site's Docker image store; the second booted a fresh guest. The difference is what the store saved.", true
            ).addTable(rows).write();

  # EVERY CLIENT THAT REACHES THE RESULTS ORIGIN MUST TRUST THE NODE'S CA, not
  # only the toolkit's Node client. billet marks every response it writes with
  # X-Billet-Actions-Cache, so a client that reached the node through the remap
  # sees that header, and one that could not verify the leaf fails before any
  # header exists. Each step is one client written in a different language.
  client-trust:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    steps:
      - name: Refuse a non-billet runner
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: curl, through the guest trust store and SSL_CERT_FILE
        run: |
          set -euo pipefail
          headers=$(mktemp)
          curl --silent --show-error --connect-timeout 15 --max-time 30 --head \
            --dump-header "$headers" --output /dev/null \
            https://results-receiver.actions.githubusercontent.com/ || true
          tr -d '\r' < "$headers" | grep -Eiq '^X-Billet-Actions-Cache:' || { cat "$headers" >&2; exit 1; }
      - name: Python, the standard library through SSL_CERT_FILE
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import urllib.request
          req = urllib.request.Request("https://results-receiver.actions.githubusercontent.com/", method="HEAD")
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  headers = r.headers
          except urllib.error.HTTPError as e:
              headers = e.headers
          assert "X-Billet-Actions-Cache" in headers, dict(headers)
          EOF
      - name: Python, requests through REQUESTS_CA_BUNDLE
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user requests
          python3 - <<'EOF'
          import requests
          r = requests.head("https://results-receiver.actions.githubusercontent.com/", timeout=30)
          assert "X-Billet-Actions-Cache" in r.headers, dict(r.headers)
          EOF
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - name: Go, net/http through SSL_CERT_FILE
        run: |
          set -euo pipefail
          mkdir -p conformance/goclient && cd conformance/goclient
          cat >main.go <<'EOF'
          package main

          import (
          	"fmt"
          	"net/http"
          	"os"
          )

          func main() {
          	resp, err := http.Head("https://results-receiver.actions.githubusercontent.com/")
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          	if resp.Header.Get("X-Billet-Actions-Cache") == "" {
          		fmt.Fprintln(os.Stderr, "no X-Billet-Actions-Cache header:", resp.Header)
          		os.Exit(1)
          	}
          }
          EOF
          printf 'module goclient\n\ngo 1.22\n' > go.mod
          go run .
      # sccache is Rust and rustls; it reads the runtime token and results URL the
      # runner sets and speaks the cache protocol itself. What is proved: it
      # reaches the origin without a certificate error and caches. Whether billet
      # served it or spliced it to GitHub is reported, not asserted -- a client
      # billet does not admit by user agent is passed upstream by design.
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: sccache with the GitHub Actions cache backend
        env:
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -euo pipefail
          mkdir -p conformance/sccache && cd conformance/sccache
          printf 'int main(void) { return 0; }\n' > hello.c
          sccache gcc -c hello.c -o hello.o
          rm -f hello.o
          sccache gcc -c hello.c -o hello.o
          sccache --show-stats | tee stats
          grep -Eq 'Cache location\s+ghac' stats
          if grep -Eq 'Cache errors\s+[1-9]' stats; then
            echo 'sccache reported cache errors against the results origin' >&2
            exit 1
          fi

  # A DOCKER CLIENT INSIDE A JOB CONTAINER, exporting type=gha with nothing
  # billet-specific named. The container hook bind-mounts the guest's docker shim
  # into the job container and the job hook puts its directory first on PATH, so
  # the image's own client is fronted exactly as the host's is. The proof is the
  # build succeeding: without the shim the builder meets the remapped origin's
  # certificate and the export fails with x509.
  container-docker-buildkit:
    needs: candidate-identity
    runs-on: ${{ inputs.runner_label }}
    timeout-minutes: 30
    container: docker:27-cli
    steps:
      - name: Refuse a non-billet runner
        shell: sh
        run: test "${RUNNER_NAME#billet-}" != "$RUNNER_NAME"
      - name: Prove the shim fronts the image's own client
        shell: sh
        run: |
          set -eu
          case "$(command -v docker)" in
            /opt/billet/bin/docker) ;;
            *) echo "docker resolves to $(command -v docker), not the shim" >&2; exit 1 ;;
          esac
          docker version --format '{{.Client.Version}}'
      - name: Establish a build context whose layer is unique to this run
        shell: sh
        run: |
          set -eu
          mkdir -p conformance/gha-in-container
          cat >conformance/gha-in-container/Dockerfile <<EOF
          FROM alpine:3.20
          RUN echo billet-${{ github.run_id }}-${{ github.run_attempt }}-in-container >/probe
          EOF
      - name: Set up a container-driver builder from inside the job container
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
      - name: type=gha from inside the job container, nothing billet-specific named
        uses: docker/build-push-action@v6
        with:
          context: conformance/gha-in-container
          cache-to: type=gha,mode=max,scope=billet-in-container-${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=billet-in-container-${{ github.run_id }}-${{ github.run_attempt }}
          outputs: type=cacheonly
