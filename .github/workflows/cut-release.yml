name: Cut Release

# The manual "ship main" button. Press it and billet cuts a release branch, tags
# it, and builds it.
#
# THE BRANCH OUTLIVES THE RELEASE, which is the point of the shape. One branch
# per MINOR version carries every patch on it: cut release/v0.4 and tag v0.4.0,
# then a hotfix later is a commit on that same branch tagged v0.4.1 — without
# dragging in whatever main has done since. A branch per release would need a new
# one for every hotfix and could not do that.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to cut, e.g. v0.4.0. Leave blank for the next minor.'
        required: false
        type: string

permissions:
  contents: read

# ONE CUT AT A TIME. Two dispatches could otherwise both read the same newest tag,
# compute different next versions, check out the same branch tip, and publish two
# releases containing identical code — or race on the same tag and fail one push
# after its branch had already been created.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  cut:
    name: Cut the release branch and tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Work out what to cut
        id: plan
        env:
          # Through the environment, not interpolated into the script. A
          # workflow_dispatch input is attacker-influenced in the sense that
          # matters here: an expression substituted into a shell script is an
          # injection, and this job holds contents: write.
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # NEWLINES FIRST, BEFORE ANY OTHER CHECK. grep is line-based, so
          # "v0.4.0\nbranch=release/v9.9" passes a `grep -q` validation on its
          # first line and then injects a second line into $GITHUB_OUTPUT, which
          # is also line-based — overwriting a value that was computed rather than
          # supplied. The shell expansions below are all quoted; this is the hole
          # quoting does not close.
          case "${REQUESTED}" in
            *[$'\n\r']*)
              echo "::error::the version must be a single line" >&2
              exit 1
              ;;
          esac

          # SEMVER, STRICTLY, AND NO PRE-RELEASES.
          #
          # Leading zeros are not semantic versions — v01.2.3 is invalid — and Go
          # will not resolve one, so accepting it here only moves the failure to
          # after the branch and tag have been pushed and cannot be taken back.
          #
          # Pre-releases are refused outright rather than half-supported. `sort -V`
          # orders v0.4.0-rc1 AFTER v0.4.0, which is backwards for semver, so the
          # "is it newer" check below would reject promoting an rc to its final
          # release and accept an rc afterwards. billet has no rc process to serve;
          # a wrong ordering that silently mis-sequences public tags is a poor
          # price for one it does not need.
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          # Only well-formed tags are considered. A malformed one left behind by
          # hand would otherwise become the basis for the next version.
          newest="$(git tag --list 'v*' | grep -E "${semver}" | sort -V | tail -n1 || true)"

          if [ -n "${REQUESTED}" ]; then
            tag="${REQUESTED}"
          elif [ -z "${newest}" ]; then
            # The first release. v0.1.0 rather than v1.0.0: billet is pre-alpha,
            # and staying on v0 also means the module path never needs a /vN
            # suffix, which Go requires from major version 2 onwards.
            tag="v0.1.0"
          else
            tag="$(echo "${newest}" | awk -F. '{ sub(/^v/, "", $1); printf "v%d.%d.0\n", $1, $2 + 1 }')"
          fi

          if ! echo "${tag}" | grep -Eq "${semver}"; then
            echo "::error::${tag} is not a release version like v0.4.0 (no pre-releases, no leading zeros)" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists" >&2
            exit 1
          fi

          series="$(echo "${tag}" | awk -F. '{ print $1 "." $2 }')"
          series_newest="$(git tag --list "${series}.*" | grep -E "${semver}" | sort -V | tail -n1 || true)"

          # A maintained release branch advances within its own minor series.
          # Comparing an explicit patch with the newest tag globally would make
          # v0.4.1 impossible after v0.5.0, defeating the branch shape above.
          if [ -n "${series_newest}" ] && [ "$(printf '%s\n%s\n' "${series_newest}" "${tag}" | sort -V | tail -n1)" != "${tag}" ]; then
            echo "::error::${tag} is not newer than ${series_newest} in ${series}" >&2
            exit 1
          fi

          branch="release/${series}"

          # Both values are now validated single lines, computed here rather than
          # supplied.
          {
            echo "tag=${tag}"
            echo "branch=${branch}"
          } >> "$GITHUB_OUTPUT"

      - name: Cut it
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ steps.plan.outputs.branch }}
        run: |
          set -euo pipefail

          # The branch may already exist: that is what a second patch on the same
          # minor series looks like, and it is the case this shape exists for.
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "${BRANCH} already exists; tagging its tip rather than main"
            git fetch origin "${BRANCH}:${BRANCH}"
            git checkout "${BRANCH}"
          else
            git checkout -b "${BRANCH}"
          fi

          # Main composes current sibling actions at @main. A RELEASE MUST NOT:
          # pinning the outer action would otherwise still execute mutable code.
          # Rewrite only Billet's three internal references, commit that generated
          # release surface on the minor branch, and tag the resulting commit.
          sed -E -i "s#junioryono/billet/actions/setup-docker-builder@(main|v[0-9]+\\.[0-9]+\\.[0-9]+)#junioryono/billet/actions/setup-docker-builder@${TAG}#" actions/build-push-action/action.yml
          sed -E -i "s#junioryono/billet/actions/(stickydisk|stop-docker-builder)@(main|v[0-9]+\\.[0-9]+\\.[0-9]+)#junioryono/billet/actions/\\1@${TAG}#" actions/setup-docker-builder/action.yml
          mapfile -t internal_refs < <(grep -RhE --include='action.yml' '^[[:space:]]+uses: junioryono/billet/actions/[^[:space:]@]+@' actions)
          refs_are_exact=true
          for ref in "${internal_refs[@]}"; do
            [[ "${ref}" == *"@${TAG}" ]] || refs_are_exact=false
          done
          if [[ ${#internal_refs[@]} -ne 3 || "${refs_are_exact}" != true ]]; then
            printf 'release action references did not all resolve exactly to %s:\n%s\n' "${TAG}" "${internal_refs[*]}" >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add actions/build-push-action/action.yml actions/setup-docker-builder/action.yml
          if ! git diff --cached --quiet; then
            git commit -m "Release ${TAG}"
          fi
          git push origin "HEAD:${BRANCH}"

          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

          {
            echo "## Cut \`${TAG}\`"
            echo ""
            echo "From \`${BRANCH}\` at \`$(git rev-parse --short HEAD)\`. The release build is running."
          } >> "$GITHUB_STEP_SUMMARY"

  # Called rather than triggered: a tag pushed with GITHUB_TOKEN above does not
  # start a workflow of its own.
  release:
    needs: cut
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.cut.outputs.tag }}
    permissions:
      contents: write
